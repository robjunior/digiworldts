<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigiWorld — Roster</title>
<style>
/* =========================================================================
   DIGIWORLD ROSTER — desktop app. Brand system (registered palette only):
     Canvas #ffffff · Panel #f7f8fa · Ink #111111 · Muted #6b7280
     Hairline #d9dee7 · Signal Blue #1677ff (accent) · Battle Red #e0384a
   Radius 0 everywhere — angular cyberpunk notch (clip-path) on all surfaces.
   Inter stack, tabular-nums on all numerics. Light-only.
   Data shape mirrors src/roster/routes.ts: hp/en/atk/def/int/spd + statBonus,
   attribute->element (Data=water, Vaccine=plant, Virus=fire, Free=electricity,
   Variable=wind), stage, mood, nickname, level, xp/xpFloor/xpNext, party slot.
   Element wheel from src/digimon/element.ts. Uses image.png as portrait art
   (right = normal, left = mirrored) per user brief.
   ========================================================================= */
:root{
  /* Persona 5 theme — acid red on ink. */
  --bg:#0a0a0c; --panel:#141418; --ink:#f4f1ea; --muted:#8a877f;
  --hair:#2a2a30; --signal:#e6001f; --battle:#e6001f;
  --font:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --notch:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --notch-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

/* element accent map — Persona theme. fire/water use the acid-red signal;
   the other three are tints mixed toward the light --ink foreground so they
   stay visible as thin rails/dots on the ink canvas. */
[data-el="fire"]{--el:var(--battle)}
[data-el="water"]{--el:var(--signal)}
[data-el="plant"]{--el:color-mix(in oklab,var(--signal) 45%,var(--ink))}
[data-el="electricity"]{--el:color-mix(in oklab,var(--signal) 65%,var(--ink))}
[data-el="wind"]{--el:color-mix(in oklab,var(--signal) 30%,var(--ink))}

.win{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.titlebar{
  height:44px;flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:var(--bg);border-bottom:1px solid var(--hair);user-select:none;
}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;display:block;background:var(--hair);clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.app-mark{font:800 13px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.app-mark .bit{color:var(--signal)}
.win-meta{margin-left:auto;font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.body{flex:1 1 auto;display:grid;grid-template-columns:220px 360px 1fr;min-height:0}

/* ---- sidebar nav ------------------------------------------------------- */
.side{background:var(--panel);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:18px 14px;gap:4px;min-height:0}
.side .grp{font:700 9px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:8px 10px 10px}
.navbtn{
  display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;
  padding:12px 12px;color:var(--muted);clip-path:var(--notch-sm);
  font:700 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid transparent;transition:background .12s,color .12s,border-color .12s;
}
.navbtn svg{width:18px;height:18px}
.navbtn:hover{color:var(--ink);background:var(--bg)}
.navbtn[aria-current="page"]{background:var(--signal);color:#fff;border-color:var(--signal)}
.side .spring{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
.hud{display:flex;flex-direction:column;gap:8px;padding:4px 10px}
.hud .pill{display:flex;justify-content:space-between;font:600 11px/1 var(--font);letter-spacing:.04em;color:var(--muted)}
.hud .pill b{color:var(--ink);font-weight:800}

/* ---- master list ------------------------------------------------------- */
.master{background:var(--bg);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.mhead{padding:18px 18px 12px;border-bottom:1px solid var(--hair)}
.mhead .kick{font:800 10px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--signal);margin-bottom:7px}
.mhead h1{font:800 24px/1 var(--font);letter-spacing:-.01em}
.mhead .sub{margin-top:6px;font-size:12px;color:var(--muted)}

.tools{padding:12px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--hair)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search input{width:100%;height:36px;padding:0 12px 0 34px;background:var(--panel);color:var(--ink);border:1px solid var(--hair);clip-path:var(--notch-sm);font:500 13px/1 var(--font);outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--signal)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{padding:5px 9px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);font:700 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:.12s}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#fff}
.chip .n{opacity:.6;margin-left:4px}
.clearf{margin-left:auto;padding:5px 9px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);font:700 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.clearf:hover{color:var(--ink);border-color:var(--muted)}
.clearf[hidden]{display:none}

.list{flex:1 1 auto;overflow-y:auto;padding:8px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--hair)}

.row{
  width:100%;text-align:left;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;
  padding:11px;margin-bottom:6px;background:var(--panel);border:1px solid var(--hair);
  clip-path:var(--notch);position:relative;transition:transform .12s,background .12s,border-color .12s;
}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--el,var(--signal));transform:scaleY(0);transform-origin:top;transition:transform .15s}
.row:hover{transform:translateX(3px);background:var(--bg)}
.row:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.row[aria-selected="true"]{background:var(--bg);border-color:var(--el,var(--signal))}
.row[aria-selected="true"]::before{transform:scaleY(1)}
.row .mug{width:48px;height:48px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);overflow:hidden;display:grid;place-items:center}
.row .mug img{width:40px;height:40px;object-fit:contain;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.row .who{min-width:0}
.row .nm{font:800 14px/1.1 var(--font);letter-spacing:.01em}
.row .rn{display:block;font:600 12px/1.2 var(--font);color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tpl{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lv{font:800 12px/1 var(--font);color:var(--muted);text-align:right}
.row .lv b{display:block;color:var(--ink);font-size:16px}

.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty p{font-size:13px;margin-bottom:14px;line-height:1.6}
.empty button{padding:9px 16px;background:var(--signal);color:#fff;clip-path:var(--notch);font:800 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase}

/* ---- detail — locked to viewport, no scroll; Stats/Skills tabs swap in place */
.detail{position:relative;min-height:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.dwrap{padding:0 0 20px;max-width:none;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* hero: full-bleed cinematic splash — art fills the panel, info overlaid bottom.
   Modeled on the reference (1920×1080 dark navy/teal splash). */
.hero{position:relative;height:min(40vh,340px);flex:0 0 auto;margin-bottom:0;overflow:hidden;display:block;background:var(--bg)}
/* Stats/Skills tab nav */
.dtabs{flex:0 0 auto;display:flex;gap:0;padding:0 40px;border-bottom:1px solid var(--hair);background:var(--bg)}
.dtab{padding:14px 22px;font:800 11px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.dtab:hover{color:var(--ink)}
.dtab.is-on{color:var(--signal);border-bottom-color:var(--signal)}
.dtab:focus-visible{outline:2px solid var(--signal);outline-offset:-4px}
.tabwrap{flex:1 1 auto;min-height:0;overflow-y:auto;padding:22px 40px 24px}
.tabwrap::-webkit-scrollbar{width:10px}.tabwrap::-webkit-scrollbar-thumb{background:var(--hair)}
.tabpanel{display:none}
.tabpanel.is-on{display:block}
/* art moved to the RIGHT ~48% and feathered so its own light background dissolves
   into the dark canvas instead of sitting in a hard rectangle */
.hero .splash{position:absolute;top:0;right:0;bottom:0;left:auto;width:52%}
.hero .splash img{width:100%;height:100%;object-fit:cover;display:block;object-position:center 20%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 100%),linear-gradient(180deg,#000 0,#000 58%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 34%,#000 100%),linear-gradient(180deg,#000 0,#000 58%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* navy→teal cinematic wash so any art reads as a dramatic scene + text stays legible */
.hero .wash{position:absolute;inset:0;background:
   linear-gradient(90deg,var(--bg) 0,color-mix(in oklab,var(--bg) 70%,transparent) 40%,transparent 62%),
   linear-gradient(180deg,transparent 55%,color-mix(in oklab,var(--bg) 92%,transparent) 100%);
   pointer-events:none}
/* diagonal acid-red slash keeps the Persona identity over the splash */
.hero::after{content:"";position:absolute;top:-10%;right:-6%;width:46%;height:130%;background:var(--signal);clip-path:polygon(42% 0,100% 0,100% 100%,70% 100%);opacity:.14;transform:skewX(-8deg);pointer-events:none}
.hero .hinfo{position:absolute;left:0;right:auto;bottom:0;width:min(60%,600px);padding:28px 40px 22px;z-index:2}
.hero .cap{position:absolute;left:40px;top:26px;background:var(--el,var(--signal));color:#fff;font:800 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;clip-path:polygon(4px 0,100% 0,100% 100%,0 100%);z-index:2}

.hinfo .kick{font:800 10px/1 var(--font);letter-spacing:.24em;text-transform:uppercase;color:var(--signal);margin-bottom:10px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hinfo h2{font:900 clamp(40px,5vw,68px)/.9 var(--font);letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.hinfo .tpl{margin-top:8px;font:500 15px/1.3 var(--font);color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hinfo .tpl b{color:var(--signal);font-weight:800}
.meta{display:flex;flex-wrap:wrap;margin-top:16px;border:1px solid var(--hair);clip-path:var(--notch);background:color-mix(in oklab,var(--bg) 78%,transparent);backdrop-filter:blur(4px)}
.meta .cell{padding:10px 16px;border-right:1px solid var(--hair);min-width:96px}
.meta .cell:last-child{border-right:0}
.meta .lbl{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.meta .val{font:800 15px/1 var(--font)}
.meta .val.el{color:var(--el,var(--signal))}

.stitle{font:800 11px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:12px}
.stitle::after{content:"";flex:1;height:1px;background:var(--hair)}

.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;margin-bottom:0}

/* stat bars — HP hero (battle red), EN thin (signal), rest neutral ink */
.stats{display:flex;flex-direction:column;gap:11px}
/* full-width Stats: two columns of bars so it doesn't look sparse */
.statcols{display:grid;grid-template-columns:1fr 1fr;gap:11px 40px}
.stat{display:grid;grid-template-columns:52px 1fr 44px;gap:12px;align-items:center}
.stat .sl{font:700 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .track{height:10px;background:var(--panel);border:1px solid var(--hair);clip-path:polygon(3px 0,100% 0,100% 100%,0 100%);overflow:hidden}
.stat .fill{height:100%;width:0;transition:width .5s cubic-bezier(.2,.7,.2,1);background:var(--ink)}
.stat.hp .fill{background:var(--battle)}
.stat.en .fill{background:var(--signal)}
.stat .sv{font:800 13px/1 var(--font);text-align:right}
.stat .sv .bo{color:var(--signal);font-size:10px;margin-left:2px}

/* affinity + attribute triangle */
.aff{display:flex;flex-direction:column;gap:12px}
.affrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair)}
.affrow:last-child{border-bottom:0}
.affrow .al{font:700 10px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.affrow .av{font:700 13px/1.2 var(--font);display:flex;align-items:center;gap:8px}
.tagx{padding:3px 8px;clip-path:polygon(3px 0,100% 0,100% 100%,0 100%);font:700 9px/1 var(--font);letter-spacing:.08em;text-transform:uppercase}
.tagx.weak{background:var(--battle);color:#fff}
.tagx.strong{background:var(--signal);color:#fff}
.tagx.el{background:color-mix(in oklab,var(--el,var(--signal)) 14%,var(--bg));color:var(--el,var(--signal));border:1px solid var(--el,var(--signal))}

/* resistance matrix — attribute + elemental damage multipliers per column */
/* resistance matrix — compact framed tiles: icon + signed multiplier badge (ref image-6) */
.resmx{margin-top:24px;border-top:1px solid var(--hair);padding-top:18px}
.resmx .rmh{display:flex;align-items:baseline;gap:10px;font:800 10px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.resmx .rmh:not(:first-of-type){margin-top:18px}
.resmx .rmh .hk{font:600 9px/1 var(--font);letter-spacing:.02em;text-transform:none;color:color-mix(in oklab,var(--muted) 70%,var(--bg))}
.rmgrid{display:flex;flex-wrap:wrap;gap:6px;padding-top:11px}
.rmtile{width:50px;position:relative;display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm)}
.rmtile .ic{width:100%;height:28px;display:grid;place-items:center;color:var(--muted)}
.rmtile .ic svg{width:19px;height:19px}
.rmtile .rl{width:100%;text-align:center;font:800 7px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:color-mix(in oklab,var(--muted) 78%,var(--bg));padding-bottom:3px}
.rmtile .bd{width:100%;text-align:center;font:800 12px/1 var(--font);padding:4px 0 5px;border-top:1px solid var(--hair);color:var(--muted);letter-spacing:.01em}
/* signed badge: weak (incoming heavy) = red +, resist = signal −, neutral = muted dash */
.rmtile.weak .bd{color:var(--battle)}
.rmtile.weak .ic{color:color-mix(in oklab,var(--battle) 70%,var(--muted))}
.rmtile.weak{border-color:color-mix(in oklab,var(--battle) 40%,var(--hair))}
.rmtile.weak .rl{color:color-mix(in oklab,var(--battle) 55%,var(--muted))}
.rmtile.res .bd{color:var(--signal)}
.rmtile.res .rl{color:color-mix(in oklab,var(--signal) 45%,var(--muted))}
.rmtile.neu .bd{color:color-mix(in oklab,var(--muted) 80%,var(--bg))}
.rmtile.self{border-color:var(--el,var(--signal));box-shadow:inset 0 0 0 1px var(--el,var(--signal))}
.rmtile.self .ic{color:var(--el,var(--signal))}
.rmtile.self .rl{color:var(--el,var(--signal))}
.rmtile .you{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font:800 7px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--el,var(--signal));clip-path:var(--notch-sm);padding:2px 5px;z-index:2}
/* unified affinity panel: header + summary chips + two labelled tile rows + one legend */
.affpanel .rmh{margin-bottom:14px}
.affsum{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
.affsum .as{font:800 8px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;clip-path:polygon(3px 0,100% 0,100% 100%,0 100%)}
.affsum .as.self{background:color-mix(in oklab,var(--el,var(--signal)) 16%,var(--bg));color:var(--el,var(--signal));border:1px solid var(--el,var(--signal))}
.affsum .as.weak{background:var(--battle);color:#fff}
.affsum .as.strong{background:color-mix(in oklab,var(--signal) 16%,var(--bg));color:var(--signal);border:1px solid var(--signal)}
.affline{display:grid;grid-template-columns:74px 1fr;align-items:start;gap:14px;margin-bottom:12px}
.affline .alab{font:800 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:16px}
.affline .rmgrid{padding-top:8px}
.afflegend{margin-top:4px;padding-top:12px;border-top:1px solid var(--hair);font:600 9.5px/1 var(--font);letter-spacing:.02em;color:color-mix(in oklab,var(--muted) 70%,var(--bg))}

/* skills */
.skills{display:flex;flex-wrap:wrap;gap:10px}
.skill{padding:11px 14px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1 1 200px;max-width:280px}
/* ---- skill equip / pool ---- */
.skillhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.skillhead .lbl{font:800 11px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.skillhead .slots{font:800 12px/1 var(--font);color:var(--signal)}
.skillhead .slots.full{color:var(--muted)}
/* skill filter chips */
.skfilter{display:flex;gap:8px;margin-bottom:12px}
.skchip{padding:6px 12px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);font:700 10px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.skchip:hover{color:var(--ink);border-color:var(--muted)}
.skchip.is-on{background:var(--signal);border-color:var(--signal);color:#fff}
.skchip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
/* vertical skill list — element icon · name+description · costs */
.skrow{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.skempty{color:var(--muted);font-size:12px;padding:16px 0}
[data-el="fire"]{--skel:var(--signal)}
[data-el="water"]{--skel:color-mix(in oklab,var(--signal) 70%,var(--bg))}
[data-el="plant"]{--skel:color-mix(in oklab,var(--signal) 45%,var(--ink))}
[data-el="electricity"]{--skel:color-mix(in oklab,var(--signal) 60%,var(--ink))}
[data-el="wind"]{--skel:color-mix(in oklab,var(--signal) 30%,var(--ink))}
.sk{position:relative;text-align:left;width:100%;padding:11px 14px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.sk:hover{border-color:var(--muted)}
.sk:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sk.equipped{border-color:var(--signal);background:color-mix(in oklab,var(--signal) 8%,var(--panel))}
.sk.equipped::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal)}
.sk .ic{width:36px;height:36px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);color:var(--skel,var(--signal))}
.sk .ic svg{width:20px;height:20px}
.sk .body{min-width:0}
.sk .nm{font:800 14px/1.1 var(--font);display:flex;align-items:center;gap:8px}
.sk .eqtag{font:800 8px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--signal);border:1px solid var(--signal);padding:3px 5px;clip-path:polygon(3px 0,100% 0,100% 100%,0 100%)}
.sk .ds{display:block;font:500 12px/1.4 var(--font);color:var(--muted);margin-top:4px}
.sk .cost{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}
.sk .cost .en{font:800 12px/1 var(--font);color:var(--signal)}
.sk .cost .pw{font:700 11px/1 var(--font);color:var(--ink)}
.sk[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.sk[aria-disabled="true"]:hover{border-color:var(--hair)}
.skhint{font-size:11px;color:var(--muted);min-height:14px;margin-top:2px}
.skill .sn{font:800 13px/1 var(--font);letter-spacing:.01em}
.skill .sd{font-size:11px;color:var(--muted)}
.skill .sc{font:700 10px/1 var(--font);color:var(--signal);letter-spacing:.06em;margin-top:2px}

/* status / mood */

<script>
/* ---- element wheel from src/digimon/element.ts ------------------------- */
const WEAK   = { fire:'plant', water:'fire', plant:'water', electricity:'water', wind:'earth' };
const RESIST = { fire:'water', water:'electricity', plant:'fire', electricity:'earth', wind:'ice' };
const ATTR_TO_EL = { Virus:'fire', Data:'water', Vaccine:'plant', Free:'electricity', Variable:'wind' };
const ATTR_STRONG = { Vaccine:'Virus', Virus:'Data', Data:'Vaccine' };

/* ---- roster: shape mirrors RosterView (routes.ts) --------------------- */
const ART = 'image.png';          // portrait (left in detail hero)
const ART_R = 'image-1.png';      // second art (right open space in detail hero)
// skullbot pixel-art "dot" sprite, keyed by species name
const sprite = sp => `https://api.skullbot.fr/img/digimon/dot/${encodeURIComponent(sp)}.png`;
const ROSTER = [
  { id:'r1', nickname:'Agumon', species:'Agumon', stage:'Rookie', attribute:'Virus',
    level:24, xp:640, xpFloor:520, xpNext:900, mood:82, status:'party', slot:0,
    stats:{hp:820,en:34,atk:168,def:110,int:96,spd:132}, bonus:{hp:40,en:0,atk:12,def:0,int:0,spd:6},
    skills:[['Pepper Breath','Fire · single foe','EN 8'],['Spirit Strike','Phys · high crit','EN 12'],['Guard Up','Raise DEF · self','EN 6']] },
  { id:'r2', nickname:'Gabumon', species:'Gabumon', stage:'Rookie', attribute:'Data',
    level:22, xp:410, xpFloor:400, xpNext:760, mood:74, status:'party', slot:1,
    stats:{hp:780,en:36,atk:142,def:128,int:104,spd:118}, bonus:{hp:0,en:4,atk:0,def:10,int:0,spd:0},
    skills:[['Blue Blaster','Water · single foe','EN 8'],['Horn Attack','Phys · single','EN 6'],['Aqua Veil','Cut incoming · party','EN 12']] },
  { id:'r3', nickname:'Palmon', species:'Palmon', stage:'Rookie', attribute:'Vaccine',
    level:20, xp:280, xpFloor:280, xpNext:640, mood:90, status:'party', slot:2,
    stats:{hp:760,en:38,atk:128,def:112,int:130,spd:110}, bonus:{hp:0,en:0,atk:0,def:0,int:14,spd:0},
    skills:[['Poison Ivy','Plant · single foe','EN 8'],['Root Bind','Slow · single','EN 10'],['Photosynthesis','Heal small · self','EN 8']] },
  { id:'r4', nickname:'Biyomon', species:'Biyomon', stage:'Rookie', attribute:'Free',
    level:19, xp:120, xpFloor:120, xpNext:560, mood:68, status:'resting',
    stats:{hp:700,en:40,atk:134,def:96,int:118,spd:146}, bonus:{hp:0,en:0,atk:0,def:0,int:0,spd:12},
    skills:[['Spiral Twister','Electric · single','EN 8'],['Wing Cutter','Phys · all foes','EN 14'],['Tailwind','Raise SPD · party','EN 12']] },
  { id:'r5', nickname:'Tentomon', species:'Tentomon', stage:'Rookie', attribute:'Free',
    level:18, xp:60, xpFloor:60, xpNext:480, mood:71, status:'resting',
    stats:{hp:740,en:37,atk:126,def:120,int:112,spd:104}, bonus:{hp:0,en:0,atk:8,def:0,int:0,spd:0},
    skills:[['Super Shocker','Electric · single','EN 8'],['Talon Attack','Phys · single','EN 6'],['Analyze','Reveal weakness','EN 8']] },
  { id:'r6', nickname:'Greymon', species:'Greymon', stage:'Champion', attribute:'Virus',
    level:31, xp:1240, xpFloor:1100, xpNext:1600, mood:88, status:'resting',
    stats:{hp:1260,en:39,atk:238,def:176,int:120,spd:126}, bonus:{hp:60,en:0,atk:20,def:0,int:0,spd:0},
    skills:[['Nova Blast','Heavy Fire · single','EN 14'],['Great Horn','Phys · single','EN 12'],['Battle Roar','Raise ATK · party','EN 12']] },
  { id:'r7', nickname:'Gomamon', species:'Gomamon', stage:'Rookie', attribute:'Data',
    level:17, xp:40, xpFloor:0, xpNext:440, mood:79, status:'resting',
    stats:{hp:720,en:41,atk:118,def:108,int:126,spd:122}, bonus:{hp:0,en:0,atk:0,def:0,int:0,spd:0},
    skills:[['Marching Fishes','Water · all foes','EN 14'],['Claw Swipe','Phys · single','EN 6'],['Tide Heal','Heal medium · ally','EN 12']] },
  { id:'r8', nickname:'Patamon', species:'Patamon', stage:'Rookie', attribute:'Vaccine',
    level:16, xp:20, xpFloor:0, xpNext:400, mood:95, status:'resting',
    stats:{hp:700,en:38,atk:120,def:104,int:138,spd:116}, bonus:{hp:0,en:0,atk:0,def:0,int:0,spd:0},
    skills:[['Boom Bubble','Plant · single','EN 8'],['Air Shot','Phys · single','EN 6'],['Cheer','Random buff · party','EN 10']] },
];

const ELEMENTS = [...new Set(ROSTER.map(r=>ATTR_TO_EL[r.attribute]))];
const state = { q:'', el:'all', selected:ROSTER[0].id };
const el = r => ATTR_TO_EL[r.attribute];
const cap = s => s[0].toUpperCase()+s.slice(1);

/* ---- skill pool + equip (mirrors src/skills/pool.ts + roster equip route) ----
   Backend: each Digimon has a learned pool (current form + evolution history);
   you equip up to EQUIPPED_SLOTS_PER_STAGE[stage] of them. Skill fields:
   {id,name,element,energyCost,power,effect?}. Slot cap by stage below. */
const EQUIP_CAP = { Baby:2, 'In-Training':3, Rookie:4, Champion:6, Ultimate:8, Mega:10 };
// shared learned pool keyed by element (id,name,en,power,effect) — the mon's
// signature skills come first, then broader element skills learned by history.
const POOL = {
  fire:[['pepper-breath','Pepper Breath',8,42,''],['spirit-strike','Spirit Strike',12,58,'High crit'],['guard-up','Guard Up',6,0,'Raise DEF · self'],
        ['nova-blast','Nova Blast',14,74,'Heavy · single'],['flame-toss','Flame Toss',6,30,''],['ember-veil','Ember Veil',10,0,'Burn ward · party'],['battle-roar','Battle Roar',12,0,'Raise ATK · party']],
  water:[['blue-blaster','Blue Blaster',8,44,''],['horn-attack','Horn Attack',6,34,''],['aqua-veil','Aqua Veil',12,0,'Cut incoming · party'],
        ['marching-fishes','Marching Fishes',14,52,'All foes'],['tide-heal','Tide Heal',12,0,'Heal medium · ally'],['ice-needle','Ice Needle',8,40,'Slow chance'],['claw-swipe','Claw Swipe',6,32,'']],
  plant:[['poison-ivy','Poison Ivy',8,40,'Poison chance'],['root-bind','Root Bind',10,0,'Slow · single'],['photosynthesis','Photosynthesis',8,0,'Heal small · self'],
        ['boom-bubble','Boom Bubble',8,38,''],['air-shot','Air Shot',6,30,''],['spore-cloud','Spore Cloud',12,0,'Sleep · all foes'],['cheer','Cheer',10,0,'Random buff · party']],
  electricity:[['spiral-twister','Spiral Twister',8,44,''],['wing-cutter','Wing Cutter',14,48,'All foes'],['tailwind','Tailwind',12,0,'Raise SPD · party'],
        ['super-shocker','Super Shocker',8,46,'Paralyze chance'],['talon-attack','Talon Attack',6,32,''],['analyze','Analyze',8,0,'Reveal weakness'],['static-field','Static Field',12,36,'All foes']],
  wind:[['gale-slash','Gale Slash',8,42,''],['cyclone','Cyclone',14,50,'All foes'],['updraft','Updraft',10,0,'Raise EVA · party'],
        ['feather-shot','Feather Shot',6,30,''],['tempest','Tempest',16,66,'Heavy · all'],['calm-winds','Calm Winds',10,0,'Cleanse · ally'],['guard-up','Guard Up',6,0,'Raise DEF · self']],
};
const SKILL_BY_ID = {};
Object.entries(POOL).forEach(([elm,list])=>list.forEach(([id,name,en,pow,eff])=>{SKILL_BY_ID[id]={id,name,en,pow,eff,elm};}));
// monoline element icons (1.7px stroke, currentColor) for the skill list rows
const EL_ICON = {
  fire:'<path d="M12 3c3 4 5 6 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 .5 2 1.5 2.5 2 2 .3-2-1-4 1-7z"/>',
  water:'<path d="M12 3c3.5 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 2.5-6.5 6-11z"/>',
  plant:'<path d="M12 21V9"/><path d="M12 12c-1-3-4-4-7-4 0 3 2 6 7 6"/><path d="M12 10c1-3 4-5 7-5 0 3-2 7-7 7z"/>',
  electricity:'<path d="M13 3l-7 10h5l-2 8 8-11h-5l1-7z"/>',
  wind:'<path d="M4 9h9a2.5 2.5 0 1 0-2.5-2.5"/><path d="M4 14h13a2.5 2.5 0 1 1-2.5 2.5"/>',
};
// learned pool for a mon = element pool (signature-first). equip = first N by cap.
const equip = {}; // { monId: [skillId,...] }
function poolFor(r){ return (POOL[el(r)]||[]).map(([id])=>id); }
function capFor(r){ return EQUIP_CAP[r.stage] ?? 4; }
function equippedFor(r){
  if(!equip[r.id]) equip[r.id] = poolFor(r).slice(0, capFor(r));
  return equip[r.id];
}

/* HUD (party avg level + party count) */
const party = ROSTER.filter(r=>r.status==='party');
document.getElementById('hud-lv').textContent = Math.round(party.reduce((a,r)=>a+r.level,0)/Math.max(1,party.length));
document.getElementById('hud-party').textContent = `${party.length}/3`;

/* filter chips w/ live counts + clear affordance */
const filtersEl = document.getElementById('filters');
function buildChips(){
  const counts={}; ROSTER.forEach(r=>{const e=el(r);counts[e]=(counts[e]||0)+1;});
  const chips=[['all','ALL',ROSTER.length],...ELEMENTS.map(e=>[e,e.toUpperCase(),counts[e]])];
  filtersEl.innerHTML = chips.map(([v,l,n])=>`<button class="chip" data-el="${v}" aria-pressed="${state.el===v}">${l}<span class="n">${n}</span></button>`).join('')
    + `<button class="clearf" id="clearf" ${state.el==='all'&&!state.q?'hidden':''}>Clear</button>`;
  const cf=document.getElementById('clearf');
  if(cf) cf.onclick=()=>{state.q='';state.el='all';document.getElementById('search').value='';buildChips();renderList();renderDetail();};
}

function filtered(){
  const q=state.q.trim().toLowerCase();
  return ROSTER.filter(r=>{
    if(state.el!=='all' && el(r)!==state.el) return false;
    if(q && !(r.nickname.toLowerCase().includes(q)||r.species.toLowerCase().includes(q))) return false;
    return true;
  });
}

const listEl=document.getElementById('list'), subEl=document.getElementById('sub');
function renderList(){
  const rows=filtered();
  subEl.textContent = (state.el==='all'&&!state.q) ? `${ROSTER.length} registered · filter by element` : `${rows.length} of ${ROSTER.length} shown`;
  if(!rows.length){
    listEl.innerHTML=`<div class="empty"><p>No Digimon match these filters.<br>The Digivice registry found nothing.</p><button id="reset">Clear filters</button></div>`;
    document.getElementById('reset').onclick=()=>{state.q='';state.el='all';document.getElementById('search').value='';buildChips();renderList();renderDetail();};
    return;
  }
  if(!rows.some(r=>r.id===state.selected)) state.selected=rows[0].id;
  listEl.innerHTML=rows.map(r=>`
    <button class="row" role="option" data-id="${r.id}" data-el="${el(r)}" tabindex="0"
      aria-selected="${state.selected===r.id}"
      aria-label="${r.nickname}, ${r.species}, Level ${r.level} ${r.stage}, ${cap(el(r))} element, HP ${r.stats.hp}">
      <span class="mug"><img src="${sprite(r.species)}" alt="" onerror="this.style.visibility='hidden'" /></span>
      <span class="who"><span class="nm">${r.nickname}</span><span class="rn">${r.species}</span><span class="tpl">${r.stage} · ${cap(el(r))}</span></span>
      <span class="lv">LV<b>${r.level}</b></span>
    </button>`).join('');
  const rowsEls=listEl.querySelectorAll('.row');
  rowsEls.forEach((eln,i)=>{
    eln.addEventListener('click',()=>select(eln.dataset.id));
    eln.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();select(eln.dataset.id);}
      else if(e.key==='ArrowDown'){e.preventDefault();(eln.nextElementSibling||listEl.firstElementChild)?.focus();}
      else if(e.key==='ArrowUp'){e.preventDefault();(eln.previousElementSibling||listEl.lastElementChild)?.focus();}
    });
  });
}

const detailEl=document.getElementById('detail');
const STAT_MAX={hp:1400,en:41,atk:260,def:200,int:160,spd:160};

/* render learned pool as equip cards — equipped first, then unequipped pool.
   Filtered by skill type: all / attack (power>0) / support (power 0). */
let skillFilter = 'all';
function skillType(s){ return s.pw>0 ? 'attack' : 'support'; }
function renderSkillCards(r){
  const eq = equippedFor(r);
  const full = eq.length >= capFor(r);
  let ids = poolFor(r).slice();
  if(skillFilter!=='all') ids = ids.filter(id=>SKILL_BY_ID[id] && skillType(SKILL_BY_ID[id])===skillFilter);
  // equipped ones first (in equip order), then the rest of the learned pool
  ids.sort((a,b)=>{
    const ea=eq.indexOf(a), eb=eq.indexOf(b);
    if(ea>=0 && eb>=0) return ea-eb;
    if(ea>=0) return -1; if(eb>=0) return 1; return 0;
  });
  if(!ids.length) return `<div class="skempty">No ${skillFilter} skills in this pool.</div>`;
  return ids.map(id=>{
    const s=SKILL_BY_ID[id]; if(!s) return '';
    const on=eq.includes(id);
    const disabled = !on && full;
    const desc = s.eff || (s.pw>0 ? 'Deals damage to the target.' : 'Support skill.');
    return `<button class="sk ${on?'equipped':''}" data-skill="${id}" data-el="${s.elm}" ${disabled?'aria-disabled="true"':''}
        aria-pressed="${on}" aria-label="${s.name}, ${cap(s.elm)}, ${s.pw>0?s.pw+' power':'support'}, ${s.en} energy${on?', equipped':''}">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${EL_ICON[s.elm]||''}</svg></span>
      <span class="body">
        <span class="nm">${s.name}${on?'<span class="eqtag">Equipped</span>':''}</span>
        <span class="ds">${desc}</span>
      </span>
      <span class="cost">
        <span class="en">EN ${s.en}</span>
        <span class="pw">${s.pw>0?`${s.pw} PWR`:'—'}</span>
      </span>
    </button>`;
  }).join('');
}
function repaintSkills(r){
  const grid=detailEl.querySelector('#skgrid'); if(!grid) return;
  grid.innerHTML = renderSkillCards(r);
  const eq=equippedFor(r), full=eq.length>=capFor(r);
  const sc=detailEl.querySelector('#slotcount');
  if(sc){ sc.textContent=`${eq.length} / ${capFor(r)} slots`; sc.classList.toggle('full',full); }
}

/* ---- resistance matrix: per-attribute & per-element incoming-damage multipliers ----
   Grounded in the real dex wheel: an attacker element that this mon is WEAK to deals
   1.5x; one it RESISTs deals 0.5x; else 1x. Attribute triangle (ATTR_STRONG): an
   attacker attribute we're weak to = 1.5x, one we beat = 0.5x, else 1x. 2x/0x are
   reserved markers from the reference legend (no source mon hits them yet -> shown as
   legend keys only). Markers mirror image-5: 2x/1.5x heavy, 1x neutral, 0.5x/0x resist. */
const RM_ATTRS = [
  ['Data','DAT'],['Vaccine','VAC'],['Virus','VIR'],['Free','FRE'],['Variable','VAR'],['Unknown','UNK'],['NoData','NOD']
];
const RM_ELS = [
  ['fire','FIR'],['water','WAT'],['plant','PLA'],['ice','ICE'],['electricity','ELE'],
  ['earth','EAR'],['steel','STE'],['wind','WIN'],['light','LIG'],['dark','DAR'],['null','NUL']
];
const RM_ELICON = {
  fire:'<path d="M12 3c3 4 5 6 5 9a5 5 0 0 1-10 0c0-1.5.8-3 2-4 .2 1.4 1 2 2 2 .8 0 1-1 .5-2C11 5.5 12 4 12 3z"/>',
  water:'<path d="M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/>',
  plant:'<path d="M12 21V9M12 9c0-3 2-5 5-5-.2 3-2 5-5 5zM12 12C12 9.5 10 8 7 8c.2 2.5 2 4 5 4z"/>',
  ice:'<path d="M12 2v20M4 7l16 10M20 7L4 17M12 2l-2 2m2-2l2 2M4 7l.5 2.7M4 7l2.7-.5"/>',
  electricity:'<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  earth:'<path d="M12 3l9 6-9 6-9-6z"/><path d="M3 15l9 6 9-6"/>',
  steel:'<path d="M4 9h16M4 15h16M9 4l-2 16M17 4l-2 16"/>',
  wind:'<path d="M2 8h13a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M2 16h9a3 3 0 1 1-3 3"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  dark:'<path d="M15 3a9 9 0 1 0 6 15A7 7 0 0 1 15 3z"/>',
  null:'<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>'
};
const RM_ATTRICON = {
  Data:'<path d="M12 3l8 5v8l-8 5-8-5V8z"/>',                                   // hexagon
  Vaccine:'<path d="M12 3l7 3v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V6z"/>',            // shield
  Virus:'<circle cx="12" cy="12" r="7"/><path d="M9 9l6 6M15 9l-6 6"/>',       // circle-x
  Free:'<circle cx="12" cy="12" r="7"/>',                                      // ring
  Variable:'<path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/>',                 // asterisk
  Unknown:'<path d="M9 9a3 3 0 1 1 4 2.8c-.9.5-1 1-1 2M12 17h.01"/>',          // question
  NoData:'<path d="M6 6l12 12"/>'                                              // slash
};
function elMultVs(myEl, attackerEl){
  // incoming: attacker deals 1.5x if my element is WEAK to it, 0.5x if I RESIST it
  if(WEAK[myEl]===attackerEl) return 1.5;
  if(RESIST[myEl]===attackerEl) return 0.5;
  return 1;
}
function attrMultVs(myAttr, attackerAttr){
  if(ATTR_STRONG[attackerAttr]===myAttr) return 1.5;  // attacker beats my attribute
  if(ATTR_STRONG[myAttr]===attackerAttr) return 0.5;  // I beat theirs
  return 1;
}
const RM_SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${p}</svg>`;
// multiplier -> {badge, class}: weak(heavy incoming)=red +, resist=signal −, neutral=—
const rmMark = m => m>=2?{b:'++',c:'weak'} : m>1?{b:'+',c:'weak'} : m>0.5?{b:'—',c:'neu'} : m>0?{b:'−',c:'res'} : {b:'✕',c:'res'};
function rmTile(iconSvg,label,m,self){ const k=rmMark(m);
  return `<div class="rmtile ${k.c} ${self?'self':''}" title="${label} · ${m}× damage">
    ${self?'<span class="you">You</span>':''}
    <span class="ic">${iconSvg}</span><span class="rl">${label}</span><span class="bd">${k.b}</span></div>`; }

// Attribute affinity block — lives in the Affinity column (replaces the word list)
// Painel de afinidade unificado — Attribute + Element como duas linhas rotuladas de um mesmo painel
function affinityPanel(r){
  const myEl = el(r);
  const attrTiles = RM_ATTRS.map(([a,lbl])=>rmTile(RM_SVG(RM_ATTRICON[a]||RM_ATTRICON.Unknown), lbl, attrMultVs(r.attribute,a), a===r.attribute)).join('');
  const elTiles = RM_ELS.map(([elk,lbl])=>rmTile(RM_SVG(RM_ELICON[elk]||RM_ELICON.null), lbl, elMultVs(myEl,elk), elk===myEl)).join('');
  const beats = ATTR_STRONG[r.attribute];                                   // atributo que este mon vence (+)
  const weakToAttr = Object.entries(ATTR_STRONG).find(([,d])=>d===r.attribute)?.[0]; // atributo que vence este mon
  const affSum = `<span class="as self">${r.attribute}</span>`
    + (weakToAttr?` <span class="as weak">weak ${weakToAttr}</span>`:'')
    + (beats?` <span class="as strong">strong ${beats}</span>`:'');
  return `<div class="resmx affpanel" data-od-id="affinity-panel">
    <div class="rmh">Affinity<span class="affsum" style="--el:var(--el)">${affSum}</span></div>
    <div class="affline">
      <span class="alab">Attribute</span>
      <div class="rmgrid">${attrTiles}</div>
    </div>
    <div class="affline">
      <span class="alab">Element</span>
      <div class="rmgrid">${elTiles}</div>
    </div>
    <div class="afflegend"><b style="color:var(--battle)">+</b> weak &nbsp;·&nbsp; <b style="color:var(--signal)">−</b> resist &nbsp;·&nbsp; <span style="color:var(--muted)">—</span> even</div>
  </div>`;
}

function renderDetail(){
  skillFilter='all'; // reset filter to match the freshly-rendered "All" chip
  const r=ROSTER.find(x=>x.id===state.selected); if(!r) return;
  const e=el(r);
  const order=[['hp','HP'],['en','EN'],['atk','ATK'],['def','DEF'],['int','INT'],['spd','SPD']];
  const statRows=order.map(([k,l])=>{
    const v=r.stats[k], bo=r.bonus[k], pct=Math.min(100,Math.round(v/STAT_MAX[k]*100));
    return `<div class="stat ${k}"><span class="sl">${l}</span>
      <span class="track"><span class="fill" data-w="${pct}"></span></span>
      <span class="sv">${v}${bo?`<span class="bo">+${bo}</span>`:''}</span></div>`;
  }).join('');

  detailEl.innerHTML=`
    <div class="dwrap" data-el="${e}">
      <div class="hero">
        <div class="splash"><img src="${ART}" alt="${r.nickname}" /></div>
        <div class="wash"></div>
        <span class="cap">${r.species}</span>
        <div class="hinfo">
          <div class="kick">${r.stage} · ${cap(e)}</div>
          <h2>${r.nickname}</h2>
          <p class="tpl">${r.species} &nbsp;/&nbsp; Attribute <b>${r.attribute}</b></p>
          <div class="meta">
            <div class="cell"><div class="lbl">Level</div><div class="val">${r.level}</div></div>
            <div class="cell"><div class="lbl">Element</div><div class="val el">${cap(e)}</div></div>
            <div class="cell"><div class="lbl">Stage</div><div class="val">${r.stage}</div></div>
            <div class="cell"><div class="lbl">Mood</div><div class="val">${r.mood}%</div></div>
          </div>
          <div class="status-row">
            <span class="statchip ${r.status}"><span class="dot"></span>${r.status==='party'?`In party · slot ${r.slot+1}`:'Resting'}</span>
            <span class="statchip"><span class="dot"></span>XP ${r.xp} / ${r.xpNext}</span>
          </div>
        </div>
      </div>

      <div class="dtabs" role="tablist" aria-label="Digimon detail sections">
        <button class="dtab is-on" role="tab" data-tab="stats" aria-selected="true">Stats</button>
        <button class="dtab" role="tab" data-tab="skills" aria-selected="false">Skills</button>
      </div>

      <div class="tabwrap">
        <div class="tabpanel is-on" data-panel="stats" role="tabpanel">
          <h3 class="stitle">Stats</h3>
          <div class="stats statcols">${statRows}</div>
          ${affinityPanel(r)}
        </div>

        <div class="tabpanel" data-panel="skills" role="tabpanel" hidden>
          <div class="skillhead">
            <span class="lbl">Skills — Equipped</span>
            <span class="slots ${equippedFor(r).length>=capFor(r)?'full':''}" id="slotcount">${equippedFor(r).length} / ${capFor(r)} slots</span>
          </div>
          <div class="skfilter" id="skfilter" role="group" aria-label="Filter skills by type">
            <button class="skchip is-on" data-sf="all" aria-pressed="true">All</button>
            <button class="skchip" data-sf="attack" aria-pressed="false">Attack</button>
            <button class="skchip" data-sf="support" aria-pressed="false">Support</button>
          </div>
          <div class="skrow" id="skgrid">${renderSkillCards(r)}</div>
          <div class="skhint" id="skhint" aria-live="polite"></div>
        </div>
      </div>
    </div>`;

  detailEl.querySelectorAll('.fill').forEach(f=>{f.style.width=f.dataset.w+'%';});
}

function select(id){
  state.selected=id;
  listEl.querySelectorAll('.row').forEach(eln=>eln.setAttribute('aria-selected',eln.dataset.id===id));
  renderDetail();
}

filtersEl.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;state.el=c.dataset.el;buildChips();renderList();renderDetail();});
document.getElementById('search').addEventListener('input',e=>{state.q=e.target.value;buildChips();renderList();renderDetail();});

/* equip / unequip a skill (gated by stage slot cap) */
detailEl.addEventListener('click',e=>{
  const b=e.target.closest('.sk'); if(!b) return;
  const r=ROSTER.find(x=>x.id===state.selected); if(!r) return;
  const id=b.dataset.skill; const eq=equippedFor(r); const hint=detailEl.querySelector('#skhint');
  const i=eq.indexOf(id);
  if(i>=0){ eq.splice(i,1); if(hint) hint.textContent=`Removed ${SKILL_BY_ID[id].name}.`; }
  else if(eq.length>=capFor(r)){ if(hint) hint.textContent=`All ${capFor(r)} slots full — remove one to equip ${SKILL_BY_ID[id].name}.`; return; }
  else { eq.push(id); if(hint) hint.textContent=`Equipped ${SKILL_BY_ID[id].name}.`; }
  repaintSkills(r);
});

/* Stats/Skills tab swap — content changes in place, page never scrolls */
detailEl.addEventListener('click',e=>{
  const t=e.target.closest('.dtab'); if(!t) return;
  const name=t.dataset.tab;
  detailEl.querySelectorAll('.dtab').forEach(x=>{const on=x===t;x.classList.toggle('is-on',on);x.setAttribute('aria-selected',on);});
  detailEl.querySelectorAll('.tabpanel').forEach(p=>{const on=p.dataset.panel===name;p.classList.toggle('is-on',on);p.hidden=!on;});
});

/* skill type filter (all / attack / support) — repaints the horizontal row */
detailEl.addEventListener('click',e=>{
  const c=e.target.closest('.skchip'); if(!c) return;
  const r=ROSTER.find(x=>x.id===state.selected); if(!r) return;
  skillFilter=c.dataset.sf;
  detailEl.querySelectorAll('.skchip').forEach(x=>{const on=x===c;x.classList.toggle('is-on',on);x.setAttribute('aria-pressed',on);});
  repaintSkills(r);
});
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.removeAttribute('aria-current'));
  b.setAttribute('aria-current','page');
}));

buildChips(); renderList(); renderDetail();
</script>
</body>
</html>
