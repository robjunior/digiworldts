<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigiWorld — Lobby</title>
<style>
/* =========================================================================
   DIGIWORLD LOBBY — Persona 5 acid-red theme (matches index.html roster).
   Grounded in the real lobby WS contract (src/lobby/ws.ts + matchmaking/queue.ts):
     - presence: online users {userId, displayName}
     - matchmaking queue: join/leave, level bracket + trainedness bracket
       (widen over wait; NO ETA shown — bracket label only, per project default)
     - chat:global: send + message list
     - match/battle handoff → last-match card
   List sprites use skullbot pixel-art dot sprites keyed by species.
   ========================================================================= */
:root{
  /* Persona 5 theme — acid red on ink. */
  --bg:#0a0a0c; --panel:#141418; --ink:#f4f1ea; --muted:#8a877f;
  --hair:#2a2a30; --signal:#e6001f; --battle:#e6001f;
  --font:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --notch:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --notch-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  --ease:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

.win{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.titlebar{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--hair);user-select:none}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;display:block;background:var(--hair);clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.app-mark{font:800 13px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.app-mark .bit{color:var(--signal)}
.win-meta{margin-left:auto;font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.body{flex:1 1 auto;display:grid;grid-template-columns:220px 1fr;min-height:0}

/* ---- sidebar (matches roster) ------------------------------------------ */
.side{background:var(--panel);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:18px 14px;gap:4px;min-height:0}
.side .grp{font:700 9px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:8px 10px 10px}
.navbtn{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;padding:12px 12px;color:var(--muted);clip-path:var(--notch-sm);font:700 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s}
.navbtn svg{width:18px;height:18px}
.navbtn:hover{color:var(--ink);background:var(--bg)}
.navbtn[aria-current="page"]{background:var(--signal);color:#fff;border-color:var(--signal)}
.side .spring{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
.hud{display:flex;flex-direction:column;gap:8px;padding:4px 10px}
.hud .pill{display:flex;justify-content:space-between;font:600 11px/1 var(--font);letter-spacing:.04em;color:var(--muted)}
.hud .pill b{color:var(--ink);font-weight:800}

/* ---- main ---- */
.main{display:flex;flex-direction:column;min-height:0;background:var(--bg);overflow:hidden}

/* matchmaking strip — the hero action, one accent */
.mmstrip{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:20px 28px;border-bottom:1px solid var(--hair);position:relative;overflow:hidden}
.mmstrip::before{content:"";position:absolute;top:-20%;right:-4%;width:52%;height:150%;background:var(--signal);clip-path:polygon(40% 0,100% 0,100% 100%,66% 100%);opacity:.07;pointer-events:none;transform:skewX(-8deg)}
.mm-left .kick{font:800 10px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--signal);margin-bottom:8px}
.mm-left h1{font:800 26px/1 var(--font);letter-spacing:-.01em}
.mm-left .bracket{margin-top:8px;font-size:12px;color:var(--muted)}
.mm-left .bracket b{color:var(--ink)}
.mm-hint{min-height:15px;margin-top:6px;font-size:11px;color:var(--muted)}
.mm-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;position:relative;z-index:1}
.findbtn{padding:14px 26px;background:var(--signal);color:#fff;clip-path:var(--notch);font:800 13px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;transition:transform .1s,background .12s}
.findbtn:hover{background:color-mix(in oklab,var(--signal) 86%,#000)}
.findbtn:active{transform:translateY(1px)}
.findbtn:disabled{background:var(--panel);color:var(--muted);border:1px solid var(--hair);cursor:not-allowed}
.findbtn.searching{background:var(--panel);color:var(--ink);border:1px solid var(--signal)}
.mm-right .q{font:700 10px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mm-right .q .dot{display:inline-block;width:7px;height:7px;background:var(--signal);margin-right:6px;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* content grid */
.grid{flex:1 1 auto;display:grid;grid-template-columns:1fr 340px;gap:0;min-height:0}
.colL{display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:18px 24px 22px;gap:18px}
.colR{border-left:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.colL::-webkit-scrollbar,.chatlog::-webkit-scrollbar{width:8px}
.colL::-webkit-scrollbar-thumb,.chatlog::-webkit-scrollbar-thumb{background:var(--hair)}

.stitle{font:800 11px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:12px}
.stitle::after{content:"";flex:1;height:1px;background:var(--hair)}
.stitle .n{color:var(--ink);background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:3px 8px;font-size:10px;letter-spacing:.08em}

/* party row */
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pcard{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);position:relative;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal)}
.pcard.empty{grid-template-columns:1fr;text-align:center;color:var(--muted);border-style:dashed}
.pcard.empty::before{background:var(--hair)}
.pcard .sp{width:56px;height:56px;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);display:grid;place-items:center;overflow:hidden}
.pcard .sp img{width:46px;height:46px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.pcard .pn{font:800 14px/1.1 var(--font)}
.pcard .pl{font-size:11px;color:var(--muted);margin-top:3px}
.pcard .hp{margin-top:8px}
.pcard .hp .bar{height:6px;background:var(--bg);border:1px solid var(--hair);clip-path:polygon(2px 0,100% 0,100% 100%,0 100%);overflow:hidden}
.pcard .hp .fill{height:100%;background:var(--signal);width:0;transition:width .5s var(--ease)}
.pcard .hp .num{font:700 10px/1 var(--font);color:var(--muted);margin-top:4px;text-align:right}
.emptyslot{font-size:12px;padding:18px 6px}
.emptyslot .plus{width:26px;height:26px;margin:0 auto 8px;border:1px dashed var(--hair);clip-path:var(--notch-sm);display:grid;place-items:center;color:var(--muted)}

/* presence */
.presence{display:flex;flex-direction:column;gap:7px}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm)}
.pr .dot{width:8px;height:8px;background:var(--signal);clip-path:polygon(2px 0,100% 0,100% 100%,0 100%)}
.pr .nm{font:600 13px/1 var(--font)}
.pr .tag{font:700 9px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pr.me .nm{color:var(--signal)}
/* live matches */
.matches{display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:1fr auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm)}
.match .side{display:flex;flex-direction:column;gap:6px;min-width:0}
.match .side:nth-of-type(2){align-items:flex-end;text-align:right}
.match .who{font:700 12px/1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match .pips{display:flex;gap:4px}
.match .side:nth-of-type(2) .pips{justify-content:flex-end}
.match .mp{width:22px;height:22px;background:var(--bg);border:1px solid var(--hair);clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);display:grid;place-items:center;overflow:hidden}
.match .mp img{width:18px;height:18px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.match .vsdot{font:700 9px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.match .watch{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;background:var(--signal);color:#fff;clip-path:var(--notch-sm);font:800 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase}
.match .watch:hover{background:color-mix(in oklab,var(--signal) 86%,#000)}
.match .watch svg{flex:0 0 auto}
.empty-line{font-size:12px;color:var(--muted);padding:14px 12px;line-height:1.6;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm)}

/* last match */
.lastmatch{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);padding:9px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;position:relative}
.lastmatch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal)}
.lastmatch .res{font:800 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase}
.lastmatch .vs{font-size:11px;color:var(--muted);line-height:1.3}
.lastmatch .vs b{color:var(--ink)}
.lastmatch .rw{text-align:right;font:700 10px/1.3 var(--font);color:var(--muted)}
.lastmatch .rw b{color:var(--ink);display:block;font-size:12px}
.lastmatch.win .res{color:var(--signal)}
/* compact Last Match section — tight header + slim single-line card */
.lm-sec{margin-bottom:-6px}
.lm-sec .stitle{margin:0 0 5px;font-size:11px;letter-spacing:.04em}
.lm-sec .lastmatch{padding:6px 10px;grid-template-columns:auto 1fr auto;gap:10px}
.lm-sec .lastmatch .res,.lm-sec .lastmatch .vs,.lm-sec .lastmatch .rw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm-sec .lastmatch .res{font-size:11px}
.lm-sec .lastmatch .vs{font-size:11px}
.lm-sec .lastmatch .rw{font-size:11px}
.lm-sec .lastmatch .rw b{font-size:11px}

/* chat drawer (right col) */
.chathead{flex:0 0 auto;padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.chathead .k{font:800 10px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--signal)}
.chathead .s{font-size:11px;color:var(--muted);margin-top:6px}
.chatlog{flex:1 1 auto;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:3px}
.msg .who{font:700 11px/1 var(--font);letter-spacing:.02em;color:var(--muted)}
.msg .who.me{color:var(--signal)}
.msg .tx{font-size:13px;line-height:1.45;color:var(--ink)}
.chatform{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 18px;border-top:1px solid var(--hair)}
.chatform input{height:38px;padding:0 12px;background:var(--bg);color:var(--ink);border:1px solid var(--hair);clip-path:var(--notch-sm);font:500 13px/1 var(--font);outline:none}
.chatform input::placeholder{color:var(--muted)}
.chatform input:focus{border-color:var(--signal)}
.chatform button{padding:0 16px;background:var(--signal);color:#fff;clip-path:var(--notch-sm);font:800 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase}
.chatform button:hover{background:color-mix(in oklab,var(--signal) 86%,#000)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;clip-path:var(--notch-sm);font:700 12px/1 var(--font);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="win" data-od-id="app-window">
  <div class="titlebar" data-od-id="title-bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="app-mark">Digi<span class="bit">World</span></div>
    <div class="win-meta">Tamer Terminal · Lobby</div>
  </div>

  <div class="body">
    <nav class="side" aria-label="Primary" data-od-id="sidebar-nav">
      <div class="grp">The Town</div>
      <button class="navbtn" data-nav="factory" aria-label="Factory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 20V10l5 3V10l5 3V6l6 4v10z"/><path d="M7 20v-4M12 20v-4M17 20v-4"/></svg>Factory
      </button>
      <button class="navbtn" data-nav="adventure" aria-label="Adventure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>Adventure
      </button>
      <button class="navbtn" data-nav="nursery" aria-label="Nursery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21c-4-2.5-7-5.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 12c0 3.5-3 6.5-7 9z"/></svg>Nursery
      </button>

      <div class="grp" style="margin-top:6px">Beyond</div>
      <button class="navbtn" data-nav="roster" aria-label="Roster">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.5a3 3 0 0 1 0 5.4M18 19c0-2.4-1.4-4.3-3.4-5"/></svg>Roster
      </button>
      <button class="navbtn" data-nav="world" aria-label="The World">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.8 5.4 3.8 8.5S14.5 18.1 12 20.5C9.5 18.1 8.2 15.1 8.2 12S9.5 5.9 12 3.5z"/></svg>The World
      </button>
      <button class="navbtn" aria-current="page" data-nav="arena" aria-label="The Arena">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3l-2 5h4l-4 8 2-5h-4l4-8z"/><circle cx="12" cy="12" r="9"/></svg>The Arena
      </button>

      <div class="spring">
        <div class="hud">
          <div class="pill">Tamer Lv <b id="hud-lv">—</b></div>
          <div class="pill">Bits <b>4,820</b></div>
          <div class="pill">Party <b id="hud-party">—</b></div>
        </div>
      </div>
    </nav>

    <main class="main" data-od-id="lobby-main" tabindex="-1">
      <!-- matchmaking strip -->
      <section class="mmstrip" data-od-id="matchmaking-strip">
        <div class="mm-left">
          <div class="kick">Arena Queue</div>
          <h1>Find a Match</h1>
          <div class="bracket" id="bracket">Bracket · <b>±5 Lv</b> · <b>±100 trained</b> — widens the longer you wait</div>
          <div class="mm-hint" id="mm-hint"></div>
        </div>
        <div class="mm-right">
          <button class="findbtn" id="findbtn">Find match</button>
          <span class="q" id="qstate"></span>
        </div>
      </section>

      <div class="grid">
        <div class="colL">
          <!-- party -->
          <div>
            <h3 class="stitle">Your Party <span class="n" id="party-sum">—</span></h3>
            <div class="party" id="party" data-od-id="party-row"></div>
          </div>

          <!-- last match -->
          <div class="lm-sec">
            <h3 class="stitle">Last Match</h3>
            <div id="lastmatch-wrap"></div>
          </div>

          <!-- live matches -->
          <div>
            <h3 class="stitle">Live Matches <span class="n" id="matches-count">—</span></h3>
            <div class="matches" id="matches" data-od-id="live-matches"></div>
          </div>

          <!-- presence -->
          <div>
            <h3 class="stitle">Online Now <span class="n" id="presence-count">—</span></h3>
            <div class="presence" id="presence" data-od-id="presence-list"></div>
          </div>
        </div>

        <!-- chat -->
        <aside class="colR" data-od-id="chat-drawer">
          <div class="chathead">
            <div class="k">Global Chat</div>
            <div class="s" id="chat-sub">—</div>
          </div>
          <div class="chatlog" id="chatlog" role="log" aria-live="polite" aria-label="Global chat"></div>
          <form class="chatform" id="chatform">
            <input id="chatinput" type="text" placeholder="Say something to the plaza…" autocomplete="off" maxlength="240" aria-label="Chat message" />
            <button type="submit">Send</button>
          </form>
        </aside>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= mock state — shapes mirror src/lobby/ws.ts ============= */
const sprite = sp => `https://api.skullbot.fr/img/digimon/dot/${encodeURIComponent(sp)}.png`;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=(s,r=document)=>r.querySelector(s);

const ME = 'Ren';
const state = {
  // your 3-slot party (nickname/species/level/hp/hpMax)
  party: [
    { nickname:'Agumon', species:'Agumon', level:24, hp:820, hpMax:820 },
    { nickname:'Gabumon', species:'Gabumon', level:22, hp:780, hpMax:780 },
    { nickname:'Palmon', species:'Palmon', level:20, hp:760, hpMax:760 },
  ],
  // presence: {userId, displayName} — plus a self marker
  presence: [
    { displayName:'Ren', me:true },
    { displayName:'Yusuke' },
    { displayName:'Makoto' },
    { displayName:'Futaba' },
  ],
  // chat:global
  chat: [
    { who:'Makoto', text:'gg on that last run — your Greymon carried.' },
    { who:'Futaba', text:'queue up, I wanna spectate 👀' },
  ],
  // last match (null → empty state)
  lastMatch: { result:'win', opponent:'Akechi', rewardBits:180, rewardXp:640 },
  // live matches in progress — spectatable (WS: {type:'spectate', matchId, join})
  matches: [
    { id:'m1', a:{ name:'Yusuke', party:['Greymon','Gabumon','Tentomon'] }, b:{ name:'Makoto', party:['Palmon','Biyomon','Gomamon'] }, round:4 },
    { id:'m2', a:{ name:'Futaba', party:['Patamon','Agumon','Tentomon'] }, b:{ name:'Haru', party:['Gabumon','Palmon','Biyomon'] }, round:2 },
    { id:'m3', a:{ name:'Ryuji', party:['Agumon','Greymon','Gomamon'] }, b:{ name:'Ann', party:['Biyomon','Patamon','Palmon'] }, round:7 },
  ],
  queued: false,
};

const fmt=n=>n.toLocaleString('en-US');

/* HUD + party summary */
function partyReady(){ return state.party.filter(Boolean).length; }
function refreshHud(){
  const avg = Math.round(state.party.reduce((a,p)=>a+(p?p.level:0),0)/Math.max(1,partyReady()));
  $('#hud-lv').textContent = avg;
  $('#hud-party').textContent = `${partyReady()}/3`;
}

/* ---- party ---- */
function paintParty(){
  const slots=[0,1,2].map(i=>state.party[i]||null);
  $('#party').innerHTML = slots.map((p,i)=>{
    if(!p) return `<div class="pcard empty"><div class="emptyslot"><div class="plus">+</div>Slot ${i+1} empty</div></div>`;
    const pct=Math.round(p.hp/p.hpMax*100);
    return `<div class="pcard" aria-label="${p.nickname}, Level ${p.level}, HP ${p.hp} of ${p.hpMax}">
      <span class="sp"><img src="${sprite(p.species)}" alt="" onerror="this.style.visibility='hidden'" /></span>
      <div>
        <div class="pn">${p.nickname}</div>
        <div class="pl">Lv ${p.level} · ${p.species}</div>
        <div class="hp"><div class="bar"><span class="fill" data-w="${pct}"></span></div><div class="num">${fmt(p.hp)} / ${fmt(p.hpMax)}</div></div>
      </div>
    </div>`;
  }).join('');
  $('#party-sum').textContent = `${partyReady()}/3 ready`;
  requestAnimationFrame(()=>$('#party').querySelectorAll('.fill').forEach(f=>{f.style.width=f.dataset.w+'%';}));
}

/* ---- presence ---- */
function paintPresence(){
  const list=state.presence;
  $('#presence-count').textContent = `${list.length} online`;
  if(!list.length){ $('#presence').innerHTML=`<div class="empty-line">You're alone in the plaza — invite a friend or start a match.</div>`; return; }
  $('#presence').innerHTML = list.map(p=>`
    <div class="pr ${p.me?'me':''}">
      <span class="dot"></span>
      <span class="nm">${p.displayName}${p.me?' (you)':''}</span>
      <span class="tag">${p.me?'Ready':'Online'}</span>
    </div>`).join('');
}

/* ---- live matches (spectate) ---- */
function partyPips(list){
  return list.map(sp=>`<span class="mp"><img src="${sprite(sp)}" alt="" title="${sp}" onerror="this.style.visibility='hidden'" /></span>`).join('');
}
function paintMatches(){
  const list=state.matches;
  $('#matches-count').textContent = `${list.length} live`;
  const wrap=$('#matches');
  if(!list.length){ wrap.innerHTML=`<div class="empty-line">No matches in progress — queue up to be the first.</div>`; return; }
  wrap.innerHTML = list.map(m=>`
    <div class="match" data-match="${m.id}">
      <div class="side">
        <span class="who">${m.a.name}</span>
        <span class="pips">${partyPips(m.a.party)}</span>
      </div>
      <span class="vsdot">vs</span>
      <div class="side">
        <span class="who">${m.b.name}</span>
        <span class="pips">${partyPips(m.b.party)}</span>
      </div>
      <button class="watch" data-watch="${m.id}" aria-label="Watch ${m.a.name} vs ${m.b.name}, round ${m.round}">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        Watch
      </button>
    </div>`).join('');
}

/* ---- last match ---- */
function paintLastMatch(){
  const m=state.lastMatch;
  const w=$('#lastmatch-wrap');
  if(!m){ w.innerHTML=`<div class="empty-line">Play your first match to see rewards here.</div>`; return; }
  w.innerHTML=`<div class="lastmatch ${m.result==='win'?'win':''}">
    <div class="res">${m.result==='win'?'Victory':'Defeat'}</div>
    <div class="vs">vs <b>${m.opponent}</b> · 3v3</div>
    <div class="rw">+${fmt(m.rewardBits)} Bits · +${fmt(m.rewardXp)} XP</div>
  </div>`;
}

/* ---- chat ---- */
function paintChat(){
  const log=$('#chatlog');
  $('#chat-sub').textContent = `${state.presence.length} in the plaza`;
  if(!state.chat.length){ log.innerHTML=`<div class="empty-line">No messages yet — say hi to start.</div>`; return; }
  log.innerHTML = state.chat.map(m=>`
    <div class="msg">
      <span class="who ${m.who===ME?'me':''}">${m.who}${m.who===ME?' (you)':''}</span>
      <span class="tx">${escapeHtml(m.text)}</span>
    </div>`).join('');
  log.scrollTop = log.scrollHeight;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

$('#chatform').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=$('#chatinput'); const t=inp.value.trim(); if(!t) return;
  state.chat.push({ who:ME, text:t }); inp.value=''; paintChat();
});

/* ---- matchmaking (gate on party 3/3, no ETA — bracket only) ---- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

function paintMM(){
  const btn=$('#findbtn'); const ready=partyReady()===3; const hint=$('#mm-hint'); const q=$('#qstate');
  if(state.queued){
    btn.textContent='Leave queue'; btn.classList.add('searching'); btn.disabled=false;
    q.innerHTML='<span class="dot"></span>Searching — matching by bracket';
    hint.textContent='';
  } else if(!ready){
    btn.textContent='Find match'; btn.classList.remove('searching'); btn.disabled=true;
    q.textContent='';
    hint.textContent=`Assign ${3-partyReady()} more Digimon to your party to queue.`;
  } else {
    btn.textContent='Find match'; btn.classList.remove('searching'); btn.disabled=false;
    q.textContent='';
    hint.textContent='';
  }
}
$('#findbtn').addEventListener('click',()=>{
  if(partyReady()!==3){ toast('Party must be 3/3 to queue'); return; }
  state.queued=!state.queued; paintMM();
  toast(state.queued?'Joined the queue — matching by bracket':'Left the queue');
});

/* nav (decorative — real product nav) */
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
}));

/* watch a live match (WS: {type:'spectate', matchId, join:true}) */
$('#matches').addEventListener('click',e=>{
  const b=e.target.closest('.watch'); if(!b) return;
  const m=state.matches.find(x=>x.id===b.dataset.watch); if(!m) return;
  toast(`Spectating ${m.a.name} vs ${m.b.name} — round ${m.round}`);
});

refreshHud(); paintParty(); paintPresence(); paintMatches(); paintLastMatch(); paintChat(); paintMM();
</script>
</body>
</html>
