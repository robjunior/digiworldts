<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiWorld · Farm</title>
<style>
/* ===================================================================
   DigiWorld — Farm / City: resource-generating buildings that accrue
   Meat / Bits / Data over time. Grounded in src/farm/engine.ts:
     BuildingView { id, kind, resource, level, ratePerHour, capacity,
                    produced, upgradeCost, full }
     accrual  = min(capacity, produced + elapsed_hrs * ratePerHour)
     collect  = banks floor(produced) into balances, resets checkpoint
     collectAll = farm-wide bank in one action
     upgrade  = costs upgradeCost in BITS (error: insufficient-bits),
                bumps level -> rate + capacity + next cost
   Persona 5 acid-red shell + shared nav (Farm current under The Town).
   Resource tints derive from theme palette via color-mix — no new hex.
   100vh, no page scroll; inner grid scrolls. Radius 0 / cyberpunk notch.
   =================================================================== */
:root{
  --bg:#0a0a0c; --panel:#141418; --ink:#f4f1ea; --muted:#8a877f;
  --hair:#2a2a30; --signal:#e6001f; --battle:#e6001f;
  --font:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --notch:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --notch-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  /* resource tints — color-mix off theme tokens only (no off-palette hex) */
  --meat:color-mix(in oklab,var(--battle) 60%,var(--ink));
  --bits:color-mix(in oklab,var(--signal) 46%,var(--ink));
  --data:color-mix(in oklab,var(--ink) 40%,var(--muted));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
.win{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.titlebar{flex:0 0 auto;height:38px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--hair);z-index:30}
.lights{display:flex;gap:7px}
.lights i{width:11px;height:11px;background:var(--hair);clip-path:var(--notch-sm)}
.lights i:first-child{background:var(--signal)}
.app-mark{font:800 14px/1 var(--font);letter-spacing:.02em}
.app-mark .bit{color:var(--signal)}
.win-meta{margin-left:auto;font:600 11px/1 var(--font);color:var(--muted);letter-spacing:.04em}
.body{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}

/* ---- shared sidebar nav ---- */
.side{flex:0 0 210px;background:var(--panel);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:16px 12px;overflow:hidden}
.side .grp{font:800 9px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--muted);font:700 12px/1 var(--font);letter-spacing:.02em;padding:11px 10px;clip-path:var(--notch-sm);cursor:pointer;text-align:left;transition:.12s;text-decoration:none}
.navbtn svg{width:17px;height:17px;flex:0 0 17px}
.navbtn:hover{color:var(--ink);background:var(--bg)}
.navbtn[aria-current="page"]{color:#fff;background:var(--signal)}
.navbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.side .spring{margin-top:auto}
.hud{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--hair);padding-top:12px}
.hud .pill{font:700 10px/1.3 var(--font);color:var(--muted);letter-spacing:.04em}
.hud .pill b{color:var(--ink);font-weight:800}

/* ---- main ---- */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* resource balance bar */
.balance{flex:0 0 auto;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--hair);background:var(--panel)}
.bal{display:flex;align-items:center;gap:11px;padding:14px 20px;border-right:1px solid var(--hair)}
.bal .bdot{width:10px;height:10px;background:var(--r,var(--muted));clip-path:var(--notch-sm)}
.bal .bk{font:800 8px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bal .bv{font:800 17px/1 var(--font);color:var(--ink);letter-spacing:-.01em}
.bal .brate{font:700 10px/1 var(--font);color:var(--muted);margin-top:3px}
.bal .bcol{display:flex;flex-direction:column;gap:4px}
.balance .spring{margin-left:auto;display:flex;align-items:center;padding:0 16px;gap:12px}
.collect-all{display:inline-flex;align-items:center;gap:9px;background:var(--signal);color:#fff;border:1px solid var(--signal);clip-path:var(--notch-sm);padding:12px 18px;font:800 10px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.12s}
.collect-all:hover:not(:disabled){background:color-mix(in oklab,var(--signal) 86%,var(--ink))}
.collect-all:disabled{background:var(--panel);color:var(--muted);border-color:var(--hair);cursor:default}
.collect-all:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.collect-all .cc{font-variant-numeric:tabular-nums}

/* section head */
.mhead{flex:0 0 auto;display:flex;align-items:baseline;gap:12px;padding:16px 22px 12px}
.mhead h1{font:800 11px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.mhead .sub{font:600 11px/1 var(--font);color:var(--muted)}
.mhead .sub b{color:var(--ink)}

/* building grid */
.grid{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 22px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start;scrollbar-width:thin}
.grid::-webkit-scrollbar{width:9px}.grid::-webkit-scrollbar-thumb{background:var(--hair)}

.tile{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--r,var(--hair))}
.tile .thead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:15px 16px 13px 18px}
.ticon{width:40px;height:40px;display:grid;place-items:center;background:color-mix(in oklab,var(--r,var(--signal)) 14%,var(--bg));clip-path:var(--notch-sm);color:var(--r,var(--ink))}
.ticon svg{width:22px;height:22px}
.tnm{min-width:0}
.tnm .tn{font:800 14px/1.1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnm .tr{font:700 8px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.tnm .tr b{color:var(--r,var(--ink));font-weight:800}
.tlvl{font:800 9px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:6px 9px;white-space:nowrap}

/* production meter */
.tmeter{padding:2px 16px 14px 18px}
.tmeter .ml{display:flex;justify-content:space-between;align-items:baseline;font:700 8px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.tmeter .ml .mv{color:var(--ink);font:800 12px/1 var(--font);letter-spacing:0}
.tmeter .ml .mv .mcap{color:var(--muted);font-weight:700}
.tmeter .mbar{height:8px;background:var(--bg);border:1px solid var(--hair);clip-path:polygon(3px 0,100% 0,100% 100%,0 100%);overflow:hidden}
.tmeter .mbar i{display:block;height:100%;width:0;background:var(--r,var(--signal));transition:width .5s linear}
.tmeter.is-full .mbar i{background:color-mix(in oklab,var(--r,var(--signal)) 70%,#fff)}
.tmeter .mfull{font:800 8px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--r,var(--signal));margin-top:7px;height:8px;opacity:0}
.tmeter.is-full .mfull{opacity:1}

/* actions */
.tfoot{margin-top:auto;display:flex;gap:8px;padding:0 16px 16px 18px}
.tbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--hair);clip-path:var(--notch-sm);padding:11px 10px;font:800 9px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:var(--bg);color:var(--ink);transition:.12s}
.tbtn .bn{font-variant-numeric:tabular-nums}
.tbtn:hover:not(:disabled){border-color:var(--r,var(--signal))}
.tbtn:focus-visible{outline:2px solid var(--r,var(--signal));outline-offset:2px}
.tbtn.collect{background:color-mix(in oklab,var(--r,var(--signal)) 16%,var(--bg));border-color:color-mix(in oklab,var(--r,var(--signal)) 40%,var(--hair));color:var(--r,var(--ink))}
.tbtn.collect:hover:not(:disabled){background:color-mix(in oklab,var(--r,var(--signal)) 26%,var(--bg))}
.tbtn:disabled{color:var(--muted);cursor:default;background:var(--panel);border-color:var(--hair)}
.tbtn .bicon{width:13px;height:13px}

/* fixed-height hint slot so every tile aligns regardless of upgrade affordability */
.thint{flex:0 0 auto;height:14px;padding:0 16px 12px 18px;font:700 9px/1 var(--font);letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:6px}
.thint.warn{color:color-mix(in oklab,var(--battle) 70%,var(--ink))}
.thint .hdot{width:5px;height:5px;background:currentColor;clip-path:var(--notch-sm);flex:0 0 5px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;clip-path:var(--notch-sm);font:700 12px/1 var(--font);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar" data-od-id="title-bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="app-mark">Digi<span class="bit">World</span></div>
    <div class="win-meta">Tamer Terminal · Farm</div>
  </div>

  <div class="body">
    <nav class="side" aria-label="Primary" data-od-id="sidebar-nav">
      <div class="grp">The Town</div>
      <a class="navbtn" href="factory.html" aria-label="Factory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 20V10l5 3V10l5 3V6l6 4v10z"/><path d="M7 20v-4M12 20v-4M17 20v-4"/></svg>Factory
      </a>
      <a class="navbtn" aria-current="page" href="farm.html" aria-label="Farm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20v-6a8 8 0 0 1 16 0v6"/><path d="M4 20h16M9 20v-4a3 3 0 0 1 6 0v4M12 6V3"/></svg>Farm
      </a>
      <a class="navbtn" href="adventure.html" aria-label="Adventure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>Adventure
      </a>
      <a class="navbtn" href="nursery.html" aria-label="Nursery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21c-4-2.5-7-5.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 12c0 3.5-3 6.5-7 9z"/></svg>Nursery
      </a>

      <div class="grp" style="margin-top:6px">Beyond</div>
      <a class="navbtn" href="index.html" aria-label="Roster">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.5a3 3 0 0 1 0 5.4M18 19c0-2.4-1.4-4.3-3.4-5"/></svg>Roster
      </a>
      <a class="navbtn" href="world.html" aria-label="The World">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.8 5.4 3.8 8.5S14.5 18.1 12 20.5C9.5 18.1 8.2 15.1 8.2 12S9.5 5.9 12 3.5z"/></svg>The World
      </a>
      <a class="navbtn" href="combat.html" aria-label="The Arena">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3l-2 5h4l-4 8 2-5h-4l4-8z"/><circle cx="12" cy="12" r="9"/></svg>The Arena
      </a>

      <div class="spring">
        <div class="hud">
          <div class="pill">Tamer Lv <b>22</b></div>
          <div class="pill">Buildings <b id="hud-blds">—</b></div>
          <div class="pill">Ready <b id="hud-ready">—</b></div>
        </div>
      </div>
    </nav>

    <div class="main">
      <div class="balance" data-od-id="resource-balance">
        <div class="bal" style="--r:var(--meat)">
          <span class="bdot"></span>
          <div class="bcol"><span class="bk">Meat</span><span class="bv" id="bal-meat">0</span></div>
          <div class="brate" id="rate-meat">—/hr</div>
        </div>
        <div class="bal" style="--r:var(--bits)">
          <span class="bdot"></span>
          <div class="bcol"><span class="bk">Bits</span><span class="bv" id="bal-bits">0</span></div>
          <div class="brate" id="rate-bits">—/hr</div>
        </div>
        <div class="bal" style="--r:var(--data)">
          <span class="bdot"></span>
          <div class="bcol"><span class="bk">Data</span><span class="bv" id="bal-data">0</span></div>
          <div class="brate" id="rate-data">—/hr</div>
        </div>
        <div class="spring">
          <button class="collect-all" id="collect-all" aria-label="Collect from all buildings">
            Collect all<span class="cc" id="collect-all-amt"></span>
          </button>
        </div>
      </div>

      <div class="mhead">
        <h1>Production Buildings</h1>
        <span class="sub"><b id="mh-ready">0</b> ready to collect · upgrade with <b>Bits</b></span>
      </div>

      <div class="grid" id="grid" data-od-id="building-grid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= data mirrors src/farm/engine.ts =====================
   BuildingView shape + accrual + collect + upgrade math. Buildings below
   are seeded to match the real starter blueprints (Meat / Bits / Data
   resource generators). produced accrues live from lastTouch. */
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const $ = (s,r=document)=>r.querySelector(s);
const fmt = n => Math.floor(n).toLocaleString('en-US');
const RES_VAR = {Meat:'var(--meat)',Bits:'var(--bits)',Data:'var(--data)'};
const RES_ICON = {
  // Meat = drumstick, Bits = chip, Data = database — monoline, currentColor
  Meat:'<path d="M14 3c3 0 5 2 5 5 0 2-1 3-2 4l-6 6c-1 1-2 2-4 2a3 3 0 0 1-3-3c0-2 1-3 2-4l6-6c1-1 2-2 4-2z"/><path d="M6 15l-2 2M9 18l-2 2"/>',
  Bits:'<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
  Data:'<ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>'
};

let balances = { Meat: 480, Bits: 120, Data: 60 };
const now0 = Date.now();
/* seeded buildings — kind (display), resource, level, ratePerHour, capacity,
   produced-at-checkpoint, lastTouch, upgradeCost (Bits). Values chosen to sit
   at realistic mid-accrual so the screen reads alive on load. */
let buildings = [
  {id:'bld-meat',  kind:'Meat Ranch',   resource:'Meat', level:3, ratePerHour:240, capacity:1440, produced:610, lastTouch:now0-38*60000, upgradeCost:180},
  {id:'bld-bits',  kind:'Bit Foundry',  resource:'Bits', level:2, ratePerHour:120, capacity:840,  produced:840, lastTouch:now0-9*3600000, upgradeCost:260},
  {id:'bld-data',  kind:'Data Spire',   resource:'Data', level:1, ratePerHour:60,  capacity:360,  produced:44,  lastTouch:now0-52*60000, upgradeCost:140},
  {id:'bld-meat2', kind:'Grazing Field', resource:'Meat', level:2, ratePerHour:160, capacity:960,  produced:120, lastTouch:now0-20*60000, upgradeCost:150},
];

/* live accrual: produced = min(capacity, produced + elapsed_hrs * ratePerHour) */
function computeProduced(b){
  const elapsed = (Date.now() - b.lastTouch) / 3600000;
  return Math.min(b.capacity, b.produced + elapsed * b.ratePerHour);
}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2000);}

/* ---- render once, then update meters in place (so bars interpolate) ---- */
function buildTiles(){
  const grid=$('#grid');
  grid.innerHTML=buildings.map(b=>`
    <article class="tile" data-id="${b.id}" style="--r:${RES_VAR[b.resource]}" data-od-id="building-${b.id}"
        aria-label="${b.kind}, level ${b.level}, produces ${b.ratePerHour} ${b.resource} per hour">
      <div class="thead">
        <span class="ticon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${RES_ICON[b.resource]}</svg></span>
        <span class="tnm">
          <span class="tn">${b.kind}</span>
          <span class="tr">${b.resource} · <b>+${b.ratePerHour}</b>/hr</span>
        </span>
        <span class="tlvl">Lv ${b.level}</span>
      </div>
      <div class="tmeter" data-role="meter">
        <div class="ml"><span>Stored</span><span class="mv"><span data-role="prod">0</span> <span class="mcap">/ ${fmt(b.capacity)}</span></span></div>
        <div class="mbar"><i data-role="fill"></i></div>
        <div class="mfull">Storage full — collect to resume</div>
      </div>
      <div class="thint" data-role="hint" aria-live="polite"></div>
      <div class="tfoot">
        <button class="tbtn collect" data-act="collect" data-role="collect">Collect <span class="bn" data-role="cnum"></span></button>
        <button class="tbtn" data-act="upgrade" data-role="upgrade">
          <svg class="bicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          Upgrade · <span class="bn" data-role="ucost">${b.upgradeCost}</span>
        </button>
      </div>
    </article>`).join('');
}

/* per-tick meter + button state updates (no innerHTML rerender) */
function updateTiles(){
  let ready=0;
  buildings.forEach(b=>{
    const el=$(`.tile[data-id="${b.id}"]`); if(!el)return;
    const prod=computeProduced(b);
    const pct=b.capacity>0 ? prod/b.capacity*100 : 0;
    const full=prod>=b.capacity-0.5;
    const collectable=Math.floor(prod);
    if(collectable>0) ready++;

    $('[data-role="prod"]',el).textContent=fmt(prod);
    $('[data-role="fill"]',el).style.width=pct.toFixed(1)+'%';
    $('[data-role="meter"]',el).classList.toggle('is-full',full);

    const cbtn=$('[data-role="collect"]',el);
    $('[data-role="cnum"]',el).textContent=collectable>0?fmt(collectable):'';
    cbtn.disabled=collectable<=0;

    const ubtn=$('[data-role="upgrade"]',el);
    const canAfford=balances.Bits>=b.upgradeCost;
    ubtn.disabled=!canAfford;

    // fixed-height hint slot: full > unaffordable > empty
    const hint=$('[data-role="hint"]',el);
    if(full){ hint.className='thint warn'; hint.innerHTML='<span class="hdot"></span>Storage full — collect to resume production'; }
    else if(!canAfford){ hint.className='thint warn'; hint.innerHTML=`<span class="hdot"></span>Need ${fmt(b.upgradeCost-balances.Bits)} more Bits to upgrade`; }
    else { hint.className='thint'; hint.innerHTML=''; }
  });
  paintBalance(ready);
}

function paintBalance(ready){
  $('#bal-meat').textContent=fmt(balances.Meat);
  $('#bal-bits').textContent=fmt(balances.Bits);
  $('#bal-data').textContent=fmt(balances.Data);
  // per-resource total rate/hr from buildings feeding each resource
  const rate={Meat:0,Bits:0,Data:0};
  buildings.forEach(b=>rate[b.resource]+=b.ratePerHour);
  $('#rate-meat').textContent=`+${rate.Meat}/hr`;
  $('#rate-bits').textContent=`+${rate.Bits}/hr`;
  $('#rate-data').textContent=`+${rate.Data}/hr`;
  // ready count + collect-all total
  let total=0; buildings.forEach(b=>total+=Math.floor(computeProduced(b)));
  $('#hud-blds').textContent=buildings.length;
  $('#hud-ready').textContent=`${ready}/${buildings.length}`;
  $('#mh-ready').textContent=ready;
  const caBtn=$('#collect-all'), caAmt=$('#collect-all-amt');
  caBtn.disabled=ready<=0;
  caAmt.textContent=total>0?` · ${fmt(total)}`:'';
}

/* ---- collect: bank floor(produced), reset checkpoint (mirrors engine) ---- */
function collect(b){
  const gained=Math.floor(computeProduced(b));
  if(gained<=0) return 0;
  balances[b.resource]+=gained;
  b.produced=0; b.lastTouch=Date.now();
  return gained;
}
function collectOne(id){
  const b=buildings.find(x=>x.id===id); if(!b)return;
  const g=collect(b);
  if(g<=0){ toast('Nothing to collect yet.'); return; }
  toast(`Collected ${fmt(g)} ${b.resource}.`);
  updateTiles();
}
function collectAll(){
  const gained={Meat:0,Bits:0,Data:0}; let any=0;
  buildings.forEach(b=>{ const g=collect(b); gained[b.resource]+=g; any+=g; });
  if(any<=0){ toast('Nothing to collect yet.'); return; }
  const parts=Object.entries(gained).filter(([,v])=>v>0).map(([r,v])=>`${fmt(v)} ${r}`);
  toast(`Collected ${parts.join(' · ')}.`);
  updateTiles();
}

/* ---- upgrade: costs upgradeCost in Bits; bumps level -> rate+cap+cost ---- */
function upgrade(id){
  const b=buildings.find(x=>x.id===id); if(!b)return;
  if(balances.Bits < b.upgradeCost){ toast(`Need ${fmt(b.upgradeCost-balances.Bits)} more Bits.`); return; }
  // checkpoint current production before mutating rate/cap
  b.produced=computeProduced(b); b.lastTouch=Date.now();
  balances.Bits-=b.upgradeCost;
  b.level+=1;
  b.ratePerHour=Math.round(b.ratePerHour*1.5);
  b.capacity=Math.round(b.capacity*1.4);
  b.upgradeCost=Math.round(b.upgradeCost*1.8);
  // reflect new static values in the tile chrome
  const el=$(`.tile[data-id="${b.id}"]`);
  $('.tlvl',el).textContent=`Lv ${b.level}`;
  $('.tr',el).innerHTML=`${b.resource} · <b>+${b.ratePerHour}</b>/hr`;
  $('.mcap',el).textContent=`/ ${fmt(b.capacity)}`;
  $('[data-role="ucost"]',el).textContent=b.upgradeCost;
  el.setAttribute('aria-label',`${b.kind}, level ${b.level}, produces ${b.ratePerHour} ${b.resource} per hour`);
  toast(`${b.kind} upgraded to Lv ${b.level}. +${b.ratePerHour}/hr.`);
  updateTiles();
}

/* ---- events (delegated) ---- */
$('#grid').addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]'); if(!btn)return;
  const id=btn.closest('.tile').dataset.id;
  if(btn.dataset.act==='collect') collectOne(id);
  else if(btn.dataset.act==='upgrade') upgrade(id);
});
$('#collect-all').addEventListener('click',collectAll);
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
}));

/* ---- boot + live tick ---- */
buildTiles();
updateTiles();
setInterval(updateTiles,1000);   // accrual ticks every second
</script>
</body>
</html>
