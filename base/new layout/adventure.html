<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigiWorld — Adventure</title>
<style>
/* =========================================================================
   DIGIWORLD ADVENTURE — desktop app. Persona 5 theme (shared with lobby/roster/factory):
     Canvas #0a0a0c · Panel #141418 · Ink #f4f1ea · Muted #8a877f
     Hairline #2a2a30 · Signal/Battle acid-red #e6001f
   Radius 0 — angular cyberpunk notch on all surfaces. Inter, tabular-nums.
   Single desktop view: no vertical page scroll; two-column layout
   (expedition state on the left, last report on the right).
   Data shape mirrors src/adventure/engine.ts: AdventurePageView
   (active/lastCollected AdventureView, provisionsOwned, config), where an
   AdventureView carries a 3-mon party, distanceMs/finishesAt/remainingMs/ready,
   provisionsSpent, and (when collected) an AdventureReport (encounters,
   wins/losses, totals{meat,bits,data,credits}, xpDeltas, koedMonIds).
   Config: minHours 1, maxHours 8, provisionsPerHour 10, encountersPerHour 3,
   partySize 3. Provisions are the itm-provision the Pantry factory crafts.
   ========================================================================= */
:root{
  /* Persona 5 theme — acid red on ink (shared with lobby/roster/factory). */
  --bg:#0a0a0c; --panel:#141418; --ink:#f4f1ea; --muted:#8a877f;
  --hair:#2a2a30; --signal:#e6001f; --battle:#e6001f;
  --font:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --notch:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --notch-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  /* resource tints derived from theme palette only (no new hex) */
  --meat:color-mix(in oklab,var(--battle) 62%,var(--ink));
  --bits:var(--signal);
  --data:color-mix(in oklab,var(--signal) 52%,var(--ink));
  --credits:color-mix(in oklab,var(--battle) 46%,var(--ink));
  --win:color-mix(in oklab,var(--signal) 40%,#fff);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input[type=range]{cursor:pointer}

.win{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.titlebar{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--hair);user-select:none}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;display:block;background:var(--hair);clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.app-mark{font:800 13px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.app-mark .bit{color:var(--signal)}
.win-meta{margin-left:auto;font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.body{flex:1 1 auto;display:grid;grid-template-columns:220px 1fr;min-height:0}

/* ---- sidebar (matches roster/factory) --------------------------------- */
.side{background:var(--panel);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:18px 14px;gap:4px;min-height:0}
.side .grp{font:700 9px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:8px 10px 10px}
.navbtn{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;padding:12px 12px;color:var(--muted);clip-path:var(--notch-sm);font:700 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s}
.navbtn svg{width:18px;height:18px}
.navbtn:hover{color:var(--ink);background:var(--bg)}
.navbtn[aria-current="page"]{background:var(--signal);color:#fff;border-color:var(--signal)}
.side .spring{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
.hud{display:flex;flex-direction:column;gap:8px;padding:4px 10px}
.hud .pill{display:flex;justify-content:space-between;font:600 11px/1 var(--font);letter-spacing:.04em;color:var(--muted)}
.hud .pill b{color:var(--ink);font-weight:800}

/* ---- main -------------------------------------------------------------- */
.main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}

/* resource balance bar */
.balbar{flex:0 0 auto;display:flex;align-items:center;gap:0;padding:14px 28px;border-bottom:1px solid var(--hair);background:var(--panel)}
.bal{display:grid;grid-template-columns:28px auto;gap:10px;align-items:center;padding:0 22px;border-right:1px solid var(--hair)}
.bal:first-child{padding-left:0}
.bal .ic{width:28px;height:28px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);color:var(--res)}
.bal .ic svg{width:16px;height:16px}
.bal .col .k{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bal .col .v{font:800 18px/1.1 var(--font);margin-top:3px}
.bal[data-res="meat"]{--res:var(--meat)}
.bal[data-res="bits"]{--res:var(--bits)}
.bal[data-res="data"]{--res:var(--data)}
.bal[data-res="credits"]{--res:var(--credits)}
.bal[data-res="provisions"]{--res:var(--signal)}
.balbar .strip-title{margin-left:auto;text-align:right}
.balbar .strip-title .k{font:800 10px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--signal)}
.balbar .strip-title .s{font:600 12px/1 var(--font);color:var(--muted);margin-top:5px}

/* ---- content: two columns, single view, no page scroll ---------------- */
.scroll{flex:1 1 auto;min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr 380px;gap:22px;padding:22px 28px 22px}
@media (max-width:1100px){.scroll{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.stitle{font:800 11px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.stitle::after{content:"";flex:1;height:1px;background:var(--hair)}
.stitle .cnt{color:var(--ink);background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:3px 8px;font-size:10px;letter-spacing:.08em}

.panelbox{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);position:relative;display:flex;flex-direction:column;min-height:0}
.panelbox::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--signal)}
/* left column = two stacked halves: Send (top) + Active list (bottom) */
.col.left{display:grid;grid-template-rows:1fr 1fr;gap:22px}
.col.left .lstack{display:flex;flex-direction:column;min-height:0}
.col.left .panelbox{flex:1 1 auto}
.pinner{padding:20px 22px;display:flex;flex-direction:column;min-height:0;overflow-y:auto;flex:1 1 auto;scrollbar-width:thin}
.pinner::-webkit-scrollbar{width:8px}.pinner::-webkit-scrollbar-thumb{background:var(--hair)}

/* ---- party sprites ---------------------------------------------------- */
.party{display:flex;gap:12px;flex-wrap:wrap}
.mon{background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:12px;width:132px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.mon.picked{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.mon.downed{opacity:.5}
.mon .spr{width:56px;height:56px;display:grid;place-items:center}
.mon .spr img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.mon .nick{font:800 12px/1.1 var(--font);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mon .sub{font:700 9px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.mon .sub .st{color:var(--signal)}
.mon .ko{position:absolute;top:8px;right:8px;font:800 8px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--battle);clip-path:var(--notch-sm);padding:3px 5px}
.mon .pick-ic{position:absolute;top:8px;left:8px;width:16px;height:16px;border:1px solid var(--hair);clip-path:var(--notch-sm);display:grid;place-items:center;color:transparent}
.mon.picked .pick-ic{background:var(--signal);border-color:var(--signal);color:#fff}
.mon.picker{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.mon.picker:hover{border-color:var(--muted)}

/* ---- big countdown / progress ----------------------------------------- */
.expline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 6px}
.expline .lk{font:700 9px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.clock{font:800 40px/1 var(--font);letter-spacing:.01em}
.clock.ready{color:var(--signal)}
.pbar{height:8px;background:var(--bg);border:1px solid var(--hair);clip-path:polygon(3px 0,100% 0,100% 100%,0 100%);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--signal);width:0;transition:width .9s linear}
.exmeta{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.exmeta .m{display:flex;flex-direction:column;gap:4px}
.exmeta .m .k{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.exmeta .m .v{font:800 15px/1 var(--font)}

/* ---- active-expeditions list (bottom-left) ---------------------------- */
.explist{display:flex;flex-direction:column;gap:12px}
.exp-empty{color:var(--muted);font-size:12.5px;padding:6px 2px;line-height:1.6}
.exp-card{background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:13px 15px;position:relative}
.exp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--hair)}
.exp-card.ready::before{background:var(--signal)}
.exp-card .ehead{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.exp-card .emini{display:flex;gap:-4px}
.exp-card .emini img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:2px;margin-left:-6px}
.exp-card .emini img:first-child{margin-left:0}
.exp-card .enames{flex:1;min-width:0;font:800 12px/1.2 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-card .enames .esub{display:block;font:700 9px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.exp-card .eclock{font:800 20px/1 var(--font);letter-spacing:.01em;white-space:nowrap}
.exp-card .eclock.ready{color:var(--signal)}
.exp-card .epbar{height:6px;background:var(--panel);border:1px solid var(--hair);clip-path:polygon(3px 0,100% 0,100% 100%,0 100%);overflow:hidden;margin:2px 0 11px}
.exp-card .epbar i{display:block;height:100%;background:var(--signal);width:0;transition:width .9s linear}
.exp-card .efoot{display:flex;align-items:center;gap:10px}
.exp-card .efoot .eh{flex:1;font-size:10.5px;color:var(--muted)}
.exp-card .efoot .eh b{color:var(--ink)}
.exp-card .btn.sm{padding:8px 14px;font-size:10px}

/* ---- start / duration picker ------------------------------------------ */
.field{margin-top:18px}
.field .flabel{display:flex;justify-content:space-between;align-items:baseline;font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.field .flabel b{color:var(--ink);font-size:14px;letter-spacing:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--bg);border:1px solid var(--hair);clip-path:polygon(3px 0,100% 0,100% 100%,0 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:22px;background:var(--signal);clip-path:var(--notch-sm);border:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:22px;background:var(--signal);clip-path:var(--notch-sm);border:0;cursor:pointer}
.previewgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pv{background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:11px 13px}
.pv .k{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pv .v{font:800 17px/1 var(--font);margin-top:6px}
.pv.short .v{color:var(--battle)}

/* ---- action foot ------------------------------------------------------- */
.afoot{flex:0 0 auto;border-top:1px solid var(--hair);padding:14px 22px;display:flex;align-items:center;gap:14px}
.afoot .ahint{font-size:11px;color:var(--muted);flex:1}
.afoot .ahint b{color:var(--ink)}
.afoot .ahint.warn{color:var(--battle)}
.btn{padding:12px 20px;clip-path:var(--notch-sm);font:800 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;transition:.12s}
.btn.primary{background:var(--signal);color:#fff}
.btn.primary:hover{background:color-mix(in oklab,var(--signal) 86%,var(--ink))}
.btn.ghost{background:var(--bg);border-color:var(--hair);color:var(--ink)}
.btn.ghost:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- report (right column) -------------------------------------------- */
.col.right .panelbox{flex:1 1 auto}
.rep-empty{color:var(--muted);font-size:12.5px;padding:6px 2px;line-height:1.6}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.wl .b{background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:12px 14px;text-align:center}
.wl .b .k{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wl .b .v{font:800 26px/1 var(--font);margin-top:6px}
.wl .b.wins .v{color:var(--win)}
.wl .b.loss .v{color:var(--battle)}
.rlabel{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.loot{display:flex;flex-wrap:wrap;gap:8px}
.lchip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);font:800 12px/1 var(--font)}
.lchip .cd{width:8px;height:8px;background:var(--cc,var(--muted))}
.lchip[data-res="meat"]{--cc:var(--meat)}.lchip[data-res="bits"]{--cc:var(--bits)}
.lchip[data-res="data"]{--cc:var(--data)}.lchip[data-res="credits"]{--cc:var(--credits)}
.lchip .u{color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.06em}
.xprow{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);margin-bottom:8px}
.xprow .xspr{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center}
.xprow .xspr img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.xprow .xn{flex:1;min-width:0;font:800 12px/1.1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xprow .xg{font:800 11px/1 var(--font);color:var(--win);white-space:nowrap}
.xprow .lvup{font:800 8px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--signal);clip-path:var(--notch-sm);padding:3px 5px;margin-left:6px}
.koline{margin-top:12px;font-size:11px;color:var(--battle);display:flex;align-items:center;gap:7px}
.koline svg{width:14px;height:14px}

/* ---- toast ------------------------------------------------------------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;clip-path:var(--notch-sm);font:700 12px/1 var(--font);letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="win" data-od-id="app-window">
  <div class="titlebar" data-od-id="title-bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="app-mark">Digi<span class="bit">World</span></div>
    <div class="win-meta">Tamer Terminal · Adventure</div>
  </div>

  <div class="body">
    <nav class="side" aria-label="Primary" data-od-id="sidebar-nav">
      <div class="grp">The Town</div>
      <button class="navbtn" data-nav="factory" aria-label="Factory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 20V10l5 3V10l5 3V6l6 4v10z"/><path d="M7 20v-4M12 20v-4M17 20v-4"/></svg>Factory
      </button>
      <button class="navbtn" aria-current="page" data-nav="adventure" aria-label="Adventure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>Adventure
      </button>
      <button class="navbtn" data-nav="nursery" aria-label="Nursery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21c-4-2.5-7-5.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 12c0 3.5-3 6.5-7 9z"/></svg>Nursery
      </button>

      <div class="grp" style="margin-top:6px">Beyond</div>
      <button class="navbtn" data-nav="roster" aria-label="Roster">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.5a3 3 0 0 1 0 5.4M18 19c0-2.4-1.4-4.3-3.4-5"/></svg>Roster
      </button>
      <button class="navbtn" data-nav="world" aria-label="The World">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.8 5.4 3.8 8.5S14.5 18.1 12 20.5C9.5 18.1 8.2 15.1 8.2 12S9.5 5.9 12 3.5z"/></svg>The World
      </button>
      <button class="navbtn" data-nav="arena" aria-label="The Arena">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3l-2 5h4l-4 8 2-5h-4l4-8z"/><circle cx="12" cy="12" r="9"/></svg>The Arena
      </button>

      <div class="spring">
        <div class="hud">
          <div class="pill">Tamer Lv <b>22</b></div>
          <div class="pill">Provisions <b id="hud-prov">—</b></div>
          <div class="pill">Status <b id="hud-status">—</b></div>
        </div>
      </div>
    </nav>

    <main class="main" data-od-id="adventure-main" tabindex="-1">
      <div class="balbar" data-od-id="resource-balance" id="balbar"></div>

      <div class="scroll">
        <div class="col left">
          <div class="lstack">
            <h3 class="stitle" id="left-title">Send an expedition</h3>
            <div class="panelbox">
              <div class="pinner" id="exp-body"></div>
              <div class="afoot" id="exp-foot"></div>
            </div>
          </div>
          <div class="lstack">
            <h3 class="stitle">Active Expeditions <span class="cnt" id="active-cnt">0</span></h3>
            <div class="panelbox">
              <div class="pinner"><div class="explist" id="active-list"></div></div>
            </div>
          </div>
        </div>

        <div class="col right">
          <h3 class="stitle">Last Report</h3>
          <div class="panelbox">
            <div class="pinner" id="report-body"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= data shape mirrors src/adventure/engine.ts ============ */
const CFG = { minHours:1, maxHours:8, provisionsPerHour:10, provisionItemId:'itm-provision', encountersPerHour:3, partySize:3 };
const MS_PER_HOUR = 3_600_000;

const RES_ICONS = {
  Meat:'<path d="M12 3c4 0 7 3 7 7 0 5-4 9-7 11-3-2-7-6-7-11 0-4 3-7 7-7z"/><path d="M9 9c1-1 4-1 5 0"/>',
  Bits:'<path d="M4 8h4V4M20 8h-4V4M4 16h4v4M20 16h-4v4"/><rect x="8" y="8" width="8" height="8"/>',
  Data:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.6 3.1 3 7 3s7-1.4 7-3V6"/><path d="M5 12c0 1.6 3.1 3 7 3s7-1.4 7-3"/>',
};
const CREDITS_ICON='<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h3.5a1.5 1.5 0 0 1 0 3H9.5"/>';
const PROV_ICON='<path d="M5 8h14v11H5z"/><path d="M5 8l2-4h10l2 4"/><path d="M9 12h6"/>';

// skullbot pixel-art "dot" sprite, keyed by species name
const sprite = sp => `https://api.skullbot.fr/img/digimon/dot/${encodeURIComponent(sp)}.png`;

/* ---- mock roster (resting mons available to send) --------------------- */
const roster = [
  { monId:'m1', nickname:'Sparky',  species:'Agumon',    level:24, stage:'Rookie',   reviveAt:null },
  { monId:'m2', nickname:'Bubbles', species:'Gabumon',   level:22, stage:'Rookie',   reviveAt:null },
  { monId:'m3', nickname:'Volt',    species:'Elecmon',   level:19, stage:'Rookie',   reviveAt:null },
  { monId:'m4', nickname:'Thorn',   species:'Palmon',    level:20, stage:'Rookie',   reviveAt:null },
  { monId:'m5', nickname:'Ember',   species:'Biyomon',   level:18, stage:'Rookie',   reviveAt:Date.now()+18*60*1000 },
  { monId:'m6', nickname:'Tusk',    species:'Gomamon',   level:21, stage:'Rookie',   reviveAt:null },
];
const monById = id => roster.find(m=>m.monId===id);

/* ---- server-authoritative-ish state (AdventurePageView) --------------- */
const state = {
  balances: { Meat: 148, Bits: 92, Data: 37 },
  credits: 4820,
  provisionsOwned: 120,
  expeditions: [],    // AdventureView[]  — many can run at once (UI extension)
  lastCollected: {     // seeded example report so the panel isn't empty
    id:'adv-prev', startedAt:Date.now()-3*MS_PER_HOUR-9e5, distanceMs:3*MS_PER_HOUR,
    finishesAt:Date.now()-9e5, remainingMs:0, ready:false, provisionsSpent:30,
    party:[ mv('m1'), mv('m2'), mv('m6') ],
    collectedAt:Date.now()-6e5,
    report:{
      encounters:[], wins:7, losses:2,
      totals:{ meat:18, bits:15, data:2, credits:64 },
      xpDeltas:[
        { monId:'m1', xpGained:96, levelBefore:23, levelAfter:24, gainedLevels:1 },
        { monId:'m2', xpGained:96, levelBefore:22, levelAfter:22, gainedLevels:0 },
        { monId:'m6', xpGained:96, levelBefore:20, levelAfter:21, gainedLevels:1 },
      ],
      koedMonIds:['m2'],
    },
  },
};
function mv(id){ const m=monById(id); return { monId:id, nickname:m.nickname, catalogId:m.species, level:m.level, stage:m.stage, reviveAt:m.reviveAt }; }

/* draft (start form) */
const draft = { picks:[], hours:2 };

const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('en-US');
function fmtClock(ms){
  const s=Math.max(0,Math.round(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), r=s%60;
  const pad=x=>String(x).padStart(2,'0');
  return `${pad(h)}:${pad(m)}:${pad(r)}`;
}
function isDowned(m){ return m.reviveAt!==null && m.reviveAt>Date.now(); }

/* ---- toast ---- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2000);}

/* ---- balance bar ---- */
function paintBalances(){
  const b=state.balances;
  const cells=[
    ['meat','Meat',b.Meat,RES_ICONS.Meat],
    ['bits','Bits',b.Bits,RES_ICONS.Bits],
    ['data','Data',b.Data,RES_ICONS.Data],
    ['credits','Credits',state.credits,CREDITS_ICON],
    ['provisions','Provisions',state.provisionsOwned,PROV_ICON],
  ];
  $('#balbar').innerHTML = cells.map(([res,k,v,ic])=>`
    <div class="bal" data-res="${res}">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${ic}</svg></span>
      <span class="col"><span class="k">${k}</span><span class="v" data-bal="${res}">${fmt(v)}</span></span>
    </div>`).join('')
    + `<div class="strip-title"><div class="k">Expeditions</div><div class="s" id="statusline">—</div></div>`;
}
function updateBalanceNums(){
  ['meat','bits','data'].forEach(k=>{const el=$(`[data-bal="${k}"]`);if(el)el.textContent=fmt(state.balances[k[0].toUpperCase()+k.slice(1)]);});
  const cr=$('[data-bal="credits"]'); if(cr) cr.textContent=fmt(state.credits);
  const pr=$('[data-bal="provisions"]'); if(pr) pr.textContent=fmt(state.provisionsOwned);
}

/* ---- party sprite tile ---- */
function monTile(m,opts={}){
  const downed=opts.downed;
  const picked=opts.picked;
  const picker=opts.picker;
  return `<div class="mon ${picked?'picked':''} ${downed?'downed':''} ${picker?'picker':''}" ${picker?`data-pick="${m.monId}"`:''}>
    ${picker?`<span class="pick-ic"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg></span>`:''}
    ${downed?`<span class="ko">Downed</span>`:''}
    <span class="spr"><img src="${sprite(m.species||m.catalogId)}" alt="" onerror="this.style.visibility='hidden'"></span>
    <span class="nick">${m.nickname}</span>
    <span class="sub">Lv ${m.level} · <span class="st">${m.stage}</span></span>
  </div>`;
}

/* ---- send form (top-left) — always the START form -------------------- */
function paintExpedition(){
  const body=$('#exp-body');
  const avail=roster.slice();
  const need=CFG.provisionsPerHour*draft.hours;
  body.innerHTML = `
    <div class="rlabel">Pick your party — ${CFG.partySize} resting Digimon</div>
    <div class="party" id="pickgrid">
      ${avail.map(m=>monTile(m,{picker:!isDowned(m),downed:isDowned(m),picked:draft.picks.includes(m.monId)})).join('')}
    </div>

    <div class="field">
      <div class="flabel"><span>Expedition length</span><b><span id="hours-val">${draft.hours}</span>h</b></div>
      <input type="range" id="hours" min="${CFG.minHours}" max="${CFG.maxHours}" step="1" value="${draft.hours}" aria-label="Expedition length in hours">
    </div>

    <div class="previewgrid" id="preview">
      <div class="pv ${need>state.provisionsOwned?'short':''}"><div class="k">Provisions</div><div class="v" id="pv-prov">${need}</div></div>
      <div class="pv"><div class="k">Encounters</div><div class="v" id="pv-enc">~${Math.round(draft.hours*CFG.encountersPerHour)}</div></div>
      <div class="pv"><div class="k">Returns in</div><div class="v" id="pv-ret">${draft.hours}h</div></div>
    </div>`;
  paintStartFoot();
}
function paintStartFoot(){
  const foot=$('#exp-foot');
  const need=CFG.provisionsPerHour*draft.hours;
  const enoughParty=draft.picks.length===CFG.partySize;
  const enoughProv=state.provisionsOwned>=need;
  const ok=enoughParty&&enoughProv;
  let hint, warn=false;
  if(!enoughParty){ hint=`Pick <b>${CFG.partySize-draft.picks.length}</b> more Digimon to embark.`; }
  else if(!enoughProv){ hint=`Need <b>${need}</b> provisions — you have <b>${state.provisionsOwned}</b>. Craft more in the Pantry.`; warn=true; }
  else { hint=`Ready — <b>${need}</b> provisions for a <b>${draft.hours}h</b> run.`; }
  foot.innerHTML = `
    <span class="ahint ${warn?'warn':''}">${hint}</span>
    <button class="btn primary" id="embark-btn" ${ok?'':'disabled'}>Embark</button>`;
}

/* ---- active expeditions list (bottom-left) — one card per run --------- */
function paintActiveList(){
  const list=$('#active-list');
  const cnt=$('#active-cnt'); if(cnt) cnt.textContent=state.expeditions.length;
  if(!state.expeditions.length){
    list.innerHTML=`<div class="exp-empty">No expeditions in the field. Pick a party above and Embark — every run you send appears here with its own countdown, and you can send as many as you like.</div>`;
    return;
  }
  list.innerHTML=state.expeditions.map(expCard).join('');
}
function expCard(a){
  const total=a.distanceMs, done=total-a.remainingMs;
  const pct=total>0?Math.min(100,(done/total)*100):100;
  const hours=Math.max(1,Math.round(a.distanceMs/MS_PER_HOUR));
  const names=a.party.map(p=>p.nickname).join(' · ');
  const minis=a.party.map(p=>`<img src="${sprite(p.catalogId)}" alt="" onerror="this.style.visibility='hidden'">`).join('');
  return `<div class="exp-card ${a.ready?'ready':''}" data-exp="${a.id}">
    <div class="ehead">
      <span class="emini">${minis}</span>
      <span class="enames">${names}<span class="esub">${hours}h run · ${a.provisionsSpent} prov · ~${Math.round(hours*CFG.encountersPerHour)} enc</span></span>
      <span class="eclock ${a.ready?'ready':''}" data-clock="${a.id}">${a.ready?'READY':fmtClock(a.remainingMs)}</span>
    </div>
    <div class="epbar"><i data-fill="${a.id}" style="width:${pct}%"></i></div>
    <div class="efoot">
      ${a.ready
        ? `<span class="eh">Back at the gate — <b>collect</b> to bank loot &amp; XP.</span><button class="btn primary sm" data-collect="${a.id}">Collect</button>`
        : `<span class="eh">Out in the field — rewards roll in on return.</span><button class="btn ghost sm" disabled>Away…</button>`}
    </div>
  </div>`;
}

/* ---- report (right column) -------------------------------------------- */
function paintReport(){
  const body=$('#report-body');
  const a=state.lastCollected;
  if(!a||!a.report){
    body.innerHTML=`<div class="rep-empty">No expeditions yet. Send a party into the field, and their battle report — loot, XP, and any KOs — lands here when they return.</div>`;
    return;
  }
  const r=a.report;
  const hours=Math.max(1,Math.round(a.distanceMs/MS_PER_HOUR));
  const lootChips=[
    ['meat','Meat',r.totals.meat],['bits','Bits',r.totals.bits],
    ['data','Data',r.totals.data],['credits','Credits',r.totals.credits],
  ].filter(([,,v])=>v>0).map(([res,k,v])=>`<span class="lchip" data-res="${res}"><span class="cd"></span>${fmt(v)} <span class="u">${k}</span></span>`).join('');
  const xpRows=r.xpDeltas.map(x=>{
    const m=monById(x.monId)||{nickname:x.monId,species:''};
    return `<div class="xprow">
      <span class="xspr"><img src="${sprite(m.species)}" alt="" onerror="this.style.visibility='hidden'"></span>
      <span class="xn">${m.nickname}</span>
      <span class="xg">+${fmt(x.xpGained)} XP${x.gainedLevels>0?`<span class="lvup">Lv ${x.levelAfter}</span>`:''}</span>
    </div>`;
  }).join('');
  const koNames=r.koedMonIds.map(id=>(monById(id)||{nickname:id}).nickname);
  body.innerHTML=`
    <div class="wl">
      <div class="b wins"><div class="k">Wins</div><div class="v">${r.wins}</div></div>
      <div class="b loss"><div class="k">Losses</div><div class="v">${r.losses}</div></div>
    </div>
    <div class="rlabel">${hours}h run · ${r.wins+r.losses} encounters</div>
    <div class="rlabel">Loot banked</div>
    <div class="loot">${lootChips||'<span class="rep-empty">No loot this run.</span>'}</div>
    <div class="rlabel">Experience</div>
    ${xpRows}
    ${koNames.length?`<div class="koline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>${koNames.join(', ')} knocked out — reviving (30m)</div>`:''}`;
}

/* ---- HUD ---- */
function paintHud(){
  $('#hud-prov').textContent=fmt(state.provisionsOwned);
  const exps=state.expeditions;
  const readyN=exps.filter(a=>a.ready).length;
  const outN=exps.length-readyN;
  $('#hud-status').textContent = exps.length ? (readyN?`${readyN} returned`:'On expedition') : 'At the gate';
  const sl=$('#statusline');
  if(sl){
    if(!exps.length) sl.textContent='idle · ready to send';
    else{ const parts=[]; if(outN) parts.push(`${outN} in the field`); if(readyN) parts.push(`${readyN} ready to collect`); sl.textContent=parts.join(' · '); }
  }
}

/* ---- actions ---- */
function togglePick(monId){
  const m=monById(monId); if(!m||isDowned(m)) return;
  const i=draft.picks.indexOf(monId);
  if(i>=0){ draft.picks.splice(i,1); }
  else {
    if(draft.picks.length>=CFG.partySize){ toast(`Party is full (${CFG.partySize}). Deselect one first.`); return; }
    draft.picks.push(monId);
  }
  paintExpedition();
}
function embark(){
  if(draft.picks.length!==CFG.partySize){ toast(`Pick ${CFG.partySize} Digimon`); return; }
  const need=CFG.provisionsPerHour*draft.hours;
  if(state.provisionsOwned<need){ toast('Not enough provisions'); return; }
  state.provisionsOwned-=need;
  const now=Date.now(), dist=draft.hours*MS_PER_HOUR;
  state.expeditions.push({
    id:'adv-'+now+'-'+Math.random().toString(36).slice(2,6), startedAt:now, distanceMs:dist, finishesAt:now+dist,
    remainingMs:dist, ready:false, provisionsSpent:need,
    party:draft.picks.map(mv), collectedAt:null, report:null,
  });
  const runHours=draft.hours;
  draft.picks=[];
  updateBalanceNums(); paintExpedition(); paintActiveList(); paintHud();
  toast(`Expedition embarked — back in ${runHours}h`);
}
function collect(id){
  const a=state.expeditions.find(e=>e.id===id); if(!a||!a.ready) return;
  // roll a mock report consistent with engine semantics (win-leaning, provisions-scaled)
  const hours=Math.max(1,Math.round(a.distanceMs/MS_PER_HOUR));
  const enc=Math.max(1,Math.round(hours*CFG.encountersPerHour));
  let wins=0,losses=0,meat=0,bits=0,data=0,credits=0;
  const koed=[];
  for(let i=0;i<enc;i++){
    const win=Math.random()<0.75;
    const wl=Math.max(1,Math.round(2+hours*2+Math.random()*hours*2));
    if(win){ wins++; meat+=Math.floor(1+hours+Math.random()*4); bits+=Math.floor(1+hours+Math.random()*4); data+=wl>=4?Math.floor(Math.random()*3):0; credits+=Math.floor(3+wl*1.5+hours); }
    else { losses++; credits+=Math.floor(1+hours*0.5); if(Math.random()<0.3){ const cand=a.party.filter(p=>!koed.includes(p.monId)); if(cand.length){ koed.push(cand[Math.floor(Math.random()*cand.length)].monId); } } }
  }
  const xpPer=enc*(6+hours);
  const xpDeltas=a.party.map(p=>{ const before=p.level; const up=Math.random()<0.5?1:0; return { monId:p.monId, xpGained:xpPer, levelBefore:before, levelAfter:before+up, gainedLevels:up }; });
  // award
  state.balances.Meat+=meat; state.balances.Bits+=bits; state.balances.Data+=data; state.credits+=credits;
  koed.forEach(id=>{ const m=monById(id); if(m) m.reviveAt=Date.now()+30*60*1000; });
  xpDeltas.forEach(x=>{ const m=monById(x.monId); if(m) m.level=x.levelAfter; });
  state.lastCollected={ ...a, collectedAt:Date.now(), remainingMs:0, ready:false,
    report:{ encounters:[], wins, losses, totals:{meat,bits,data,credits}, xpDeltas, koedMonIds:koed } };
  state.expeditions=state.expeditions.filter(e=>e.id!==id);
  updateBalanceNums(); paintBalances(); paintExpedition(); paintActiveList(); paintReport(); paintHud();
  toast(`Collected — +${fmt(meat)} Meat · +${fmt(bits)} Bits · +${fmt(credits)} Credits`);
}

/* ---- event wiring (delegated) ---- */
document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-pick]'); if(pk){ togglePick(pk.dataset.pick); return; }
  if(e.target.closest('#embark-btn')){ embark(); return; }
  const cl=e.target.closest('[data-collect]'); if(cl){ collect(cl.dataset.collect); return; }
});
document.addEventListener('input',e=>{
  if(e.target.id==='hours'){
    draft.hours=parseInt(e.target.value,10)||CFG.minHours;
    const need=CFG.provisionsPerHour*draft.hours;
    const hv=$('#hours-val'); if(hv) hv.textContent=draft.hours;
    const pvP=$('#pv-prov'); if(pvP){ pvP.textContent=need; pvP.parentElement.classList.toggle('short',need>state.provisionsOwned); }
    const pvE=$('#pv-enc'); if(pvE) pvE.textContent='~'+Math.round(draft.hours*CFG.encountersPerHour);
    const pvR=$('#pv-ret'); if(pvR) pvR.textContent=draft.hours+'h';
    paintStartFoot();
  }
});
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
}));

/* ---- live countdown tick (all active expeditions) ---- */
function tick(){
  let flipped=false;
  for(const a of state.expeditions){
    if(a.ready) continue;
    a.remainingMs=Math.max(0,a.finishesAt-Date.now());
    if(a.remainingMs<=0){ a.ready=true; a.remainingMs=0; flipped=true; continue; }
    const clk=$(`[data-clock="${a.id}"]`); if(clk) clk.textContent=fmtClock(a.remainingMs);
    const pf=$(`[data-fill="${a.id}"]`); if(pf){ const pct=Math.min(100,((a.distanceMs-a.remainingMs)/a.distanceMs)*100); pf.style.width=pct+'%'; }
  }
  if(flipped){ paintActiveList(); paintHud(); toast('A team has returned!'); }
}

paintBalances(); paintExpedition(); paintActiveList(); paintReport(); paintHud();
if(!reduce) setInterval(tick,1000);
</script>
</body>
</html>
