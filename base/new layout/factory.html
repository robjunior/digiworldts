<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DigiWorld — Factory</title>
<style>
/* =========================================================================
   DIGIWORLD FACTORY — desktop app. Persona 5 theme (shared with lobby/roster):
     Canvas #0a0a0c · Panel #141418 · Ink #f4f1ea · Muted #8a877f
     Hairline #2a2a30 · Signal/Battle acid-red #e6001f
   Radius 0 — angular cyberpunk notch on all surfaces. Inter, tabular-nums.
   Single desktop view: no vertical page scroll; factory + available cards
   scroll HORIZONTALLY in rails; each card's queue scrolls internally.
   Data shape mirrors src/farm/engine.ts: FactoryTypeInfo (med/chip/rare/pantry),
   PlayerFactoryView (level/maxLevel/craftSpeedPct/upgradeCost/queue), RecipeView
   (meat/bits/data cost, craftTimeMs, category, canCraft), CraftingJobView
   (progressPct/readyToCollect/isActive). Resources: Meat/Bits/Data + DigiCredits.
   The farm BUILDINGS generate raw Meat/Bits/Data over time; the FACTORY consumes
   them to craft items on a timed queue — this screen is the factory.
   ========================================================================= */
:root{
  /* Persona 5 theme — acid red on ink (shared with lobby/roster). */
  --bg:#0a0a0c; --panel:#141418; --ink:#f4f1ea; --muted:#8a877f;
  --hair:#2a2a30; --signal:#e6001f; --battle:#e6001f;
  --font:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --notch:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --notch-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  /* resource tints derived from theme palette only (no new hex) */
  --meat:color-mix(in oklab,var(--battle) 62%,var(--ink));
  --bits:var(--signal);
  --data:color-mix(in oklab,var(--signal) 52%,var(--ink));
  --credits:color-mix(in oklab,var(--battle) 46%,var(--ink));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

/* factory-type accent scope */
[data-fac="med"]{--fac:var(--signal)}
[data-fac="chip"]{--fac:color-mix(in oklab,var(--signal) 66%,var(--ink))}
[data-fac="rare"]{--fac:color-mix(in oklab,var(--signal) 80%,#fff)}
[data-fac="pantry"]{--fac:color-mix(in oklab,var(--signal) 45%,var(--muted))}

.win{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.titlebar{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--hair);user-select:none}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;display:block;background:var(--hair);clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.app-mark{font:800 13px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.app-mark .bit{color:var(--signal)}
.win-meta{margin-left:auto;font:600 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.body{flex:1 1 auto;display:grid;grid-template-columns:220px 1fr;min-height:0}

/* ---- sidebar (matches roster) ------------------------------------------ */
.side{background:var(--panel);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:18px 14px;gap:4px;min-height:0}
.side .grp{font:700 9px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:8px 10px 10px}
.navbtn{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;padding:12px 12px;color:var(--muted);clip-path:var(--notch-sm);font:700 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s}
.navbtn svg{width:18px;height:18px}
.navbtn:hover{color:var(--ink);background:var(--bg)}
.navbtn[aria-current="page"]{background:var(--signal);color:#fff;border-color:var(--signal)}
.side .spring{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
.hud{display:flex;flex-direction:column;gap:8px;padding:4px 10px}
.hud .pill{display:flex;justify-content:space-between;font:600 11px/1 var(--font);letter-spacing:.04em;color:var(--muted)}
.hud .pill b{color:var(--ink);font-weight:800}

/* ---- main -------------------------------------------------------------- */
.main{display:flex;flex-direction:column;min-height:0;background:var(--bg)}

/* resource balance bar */
.balbar{flex:0 0 auto;display:flex;align-items:center;gap:0;padding:14px 28px;border-bottom:1px solid var(--hair);background:var(--panel)}
.bal{display:grid;grid-template-columns:28px auto;gap:10px;align-items:center;padding:0 22px;border-right:1px solid var(--hair)}
.bal:first-child{padding-left:0}
.bal .ic{width:28px;height:28px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);color:var(--res)}
.bal .ic svg{width:16px;height:16px}
.bal .col .k{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bal .col .v{font:800 18px/1.1 var(--font);margin-top:3px}
.bal[data-res="meat"]{--res:var(--meat)}
.bal[data-res="bits"]{--res:var(--bits)}
.bal[data-res="data"]{--res:var(--data)}
.bal[data-res="credits"]{--res:var(--credits)}
.balbar .strip-title{margin-left:auto;text-align:right}
.balbar .strip-title .k{font:800 10px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--signal)}
.balbar .strip-title .s{font:600 12px/1 var(--font);color:var(--muted);margin-top:5px}

/* scroll region */
.scroll{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:22px 28px 20px}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:var(--hair)}

.stitle{font:800 11px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.stitle::after{content:"";flex:1;height:1px;background:var(--hair)}
.stitle .cnt{color:var(--ink);background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:3px 8px;font-size:10px;letter-spacing:.08em}

/* ---- overview summary strip ------------------------------------------- */
.ovw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;flex:0 0 auto}
.ovw .stat{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);padding:10px 14px;position:relative}
.ovw .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc,var(--signal))}
.ovw .stat .k{font:700 9px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ovw .stat .v{font:800 20px/1 var(--font);margin-top:6px}
.ovw .stat .v small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0}
.ovw .stat.hot{--sc:var(--battle)}
.ovw .stat.hot .v{color:var(--battle)}

/* ---- horizontal card rails (single desktop view, no vertical page scroll) */
.fac-sec{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-bottom:14px}
.buy-sec{flex:0 0 auto;display:flex;flex-direction:column}
.rail{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;flex:1 1 auto;min-height:0;padding-bottom:10px;scrollbar-width:thin}
.rail::-webkit-scrollbar{height:10px}.rail::-webkit-scrollbar-thumb{background:var(--hair)}.rail::-webkit-scrollbar-track{background:transparent}
.fgrid.rail>.fcard{flex:0 0 clamp(380px,42vw,520px)}
.buygrid.rail>.buycard{flex:0 0 300px}
.fcard{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fac)}
.fhead{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 18px 12px}
.fhead .badge{width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);color:var(--fac)}
.fhead .badge svg{width:22px;height:22px}
.fhead .nm{font:800 17px/1.05 var(--font);letter-spacing:.01em}
.fhead .desc{font-size:11.5px;color:var(--muted);margin-top:4px;max-width:34ch}
.lvbadge{text-align:right}
.lvbadge .lk{font:700 8px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lvbadge .lv{font:800 20px/1 var(--font);margin-top:3px}
.lvbadge .lv small{font-size:11px;color:var(--muted);font-weight:700}

/* speed line */
.fspeed{display:flex;justify-content:space-between;align-items:center;padding:0 18px 12px;font-size:11px;color:var(--muted)}
.fspeed b{color:var(--ink);font-weight:800}
.fspeed .spd{color:var(--fac);font-weight:800}

/* queue */
.queue{border-top:1px solid var(--hair);padding:14px 18px;display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:96px}
.queue .qjobs{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;flex:1 1 auto;scrollbar-width:thin}
.queue .qjobs::-webkit-scrollbar{width:8px}.queue .qjobs::-webkit-scrollbar-thumb{background:var(--hair)}
.qhead{display:flex;justify-content:space-between;align-items:center;font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.qhead .qcap{display:flex;align-items:center;gap:7px;letter-spacing:.06em}
.qhead .qcap b{color:var(--ink);font-weight:800}
.qhead .qcap.full b{color:var(--battle)}
.qmeter{height:4px;background:var(--bg);border:1px solid var(--hair);clip-path:polygon(2px 0,100% 0,100% 100%,0 100%);overflow:hidden;margin-bottom:6px}
.qmeter i{display:block;height:100%;background:var(--fac);width:0;transition:width .4s ease}
.qmeter.full i{background:var(--battle)}
.qempty{font-size:12px;color:var(--muted);padding:12px 0;text-align:center}
.job{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 10px;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm)}
.job .jn{min-width:0}
.job .jt{font:700 12px/1.1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .jt .xn{display:inline-block;margin-left:6px;padding:1px 6px;background:var(--fac);color:#0a0a0c;clip-path:var(--notch-sm);font:800 10px/1.4 var(--font);letter-spacing:.04em;vertical-align:middle}
.job.qgroup .jbar.queued{opacity:.5}
.job .jbar{height:5px;background:var(--panel);border:1px solid var(--hair);clip-path:polygon(2px 0,100% 0,100% 100%,0 100%);overflow:hidden;margin-top:6px}
.job .jfill{height:100%;background:var(--fac);width:0;transition:width .9s linear}
.job .jmeta{font:700 10px/1 var(--font);color:var(--muted);text-align:right;white-space:nowrap;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.job.ready .jmeta .rc{color:var(--signal)}
.job .collectbtn{padding:5px 9px;background:var(--signal);color:#fff;clip-path:var(--notch-sm);font:800 9px/1 var(--font);letter-spacing:.08em;text-transform:uppercase}
.job .collectbtn:hover{background:color-mix(in oklab,var(--signal) 88%,var(--ink))}
.job .cancelbtn{padding:5px 9px;background:var(--bg);border:1px solid var(--hair);color:var(--muted);clip-path:var(--notch-sm);font:800 9px/1 var(--font);letter-spacing:.08em;text-transform:uppercase}
.job .cancelbtn:hover{border-color:var(--battle);color:var(--battle)}

/* factory foot actions */
.ffoot{border-top:1px solid var(--hair);padding:12px 18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.btn{padding:10px 14px;clip-path:var(--notch-sm);font:800 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent;transition:.12s}
.btn.primary{background:var(--signal);color:#fff}
.btn.primary:hover{background:color-mix(in oklab,var(--signal) 88%,var(--ink))}
.btn.ghost{background:var(--bg);border-color:var(--hair);color:var(--ink)}
.btn.ghost:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ffoot .uhint{font-size:11px;color:var(--muted);min-height:14px}
.ffoot .uhint b{color:var(--ink)}
.ffoot.maxed{grid-template-columns:1fr}
.maxtag{font:800 10px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}

/* ---- recipe drawer ----------------------------------------------------- */
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:color-mix(in oklab,var(--ink) 42%,transparent)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:440px;max-width:92vw;background:var(--bg);border-left:1px solid var(--hair);display:flex;flex-direction:column;box-shadow:-20px 0 40px color-mix(in oklab,var(--ink) 12%,transparent)}
.dhead{padding:20px 22px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:flex-start;gap:12px}
.dhead .dk{font:800 10px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--fac,var(--signal));margin-bottom:8px}
.dhead h2{font:800 24px/1 var(--font);letter-spacing:-.01em}
.dhead .dclose{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--hair);clip-path:var(--notch-sm);color:var(--muted)}
.dhead .dclose:hover{color:var(--ink);border-color:var(--muted)}
.dlist{flex:1 1 auto;overflow-y:auto;padding:16px 22px 26px;display:flex;flex-direction:column;gap:12px}
.dlist::-webkit-scrollbar{width:8px}.dlist::-webkit-scrollbar-thumb{background:var(--hair)}
.recipe{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.recipe .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.recipe .rn{font:800 15px/1.1 var(--font)}
.recipe .rd{font-size:11.5px;color:var(--muted);margin-top:4px;max-width:40ch}
.recipe .rtime{font:800 11px/1 var(--font);color:var(--muted);white-space:nowrap}
.recipe .costs{display:flex;gap:8px;flex-wrap:wrap}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);font:700 11px/1 var(--font)}
.cchip .cd{width:8px;height:8px;background:var(--cc,var(--muted))}
.cchip[data-res="meat"]{--cc:var(--meat)}.cchip[data-res="bits"]{--cc:var(--bits)}.cchip[data-res="data"]{--cc:var(--data)}
.cchip.short{border-color:var(--battle);color:var(--battle)}
.recipe .ract{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.recipe .rhint{font-size:11px;color:var(--battle);min-height:13px}
.recipe .rhint[hidden]{display:none}
.qty{display:inline-flex;align-items:center;border:1px solid var(--hair);clip-path:var(--notch-sm);background:var(--bg)}
.qty[hidden]{display:none}
.qty .qbtn{width:26px;height:30px;display:grid;place-items:center;color:var(--muted);font:800 14px/1 var(--font)}
.qty .qbtn:hover{color:var(--ink)}
.qty .qin{width:40px;height:30px;text-align:center;background:none;border:0;border-left:1px solid var(--hair);border-right:1px solid var(--hair);color:var(--ink);font:800 12px/1 var(--font);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty .qin::-webkit-outer-spin-button,.qty .qin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty .qin:focus{outline:none;background:color-mix(in oklab,var(--signal) 14%,transparent)}
.craftbtn{padding:9px 16px;background:var(--signal);color:#fff;clip-path:var(--notch-sm);font:800 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase}
.craftbtn:hover{background:color-mix(in oklab,var(--signal) 88%,var(--ink))}
.craftbtn:disabled{opacity:.4;cursor:not-allowed;background:var(--muted)}

/* ---- available / buy cards -------------------------------------------- */
.buygrid{display:flex;gap:16px}
.buycard{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);padding:16px 18px;display:flex;flex-direction:column;gap:12px;position:relative}
.buycard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fac)}
.buycard .bh{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.buycard .bbadge{width:40px;height:40px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);color:var(--fac)}
.buycard .bbadge svg{width:20px;height:20px}
.buycard .bn{font:800 15px/1.05 var(--font)}
.buycard .bd{font-size:11.5px;color:var(--muted);flex:1}
.buycard .brow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;clip-path:var(--notch-sm);font:700 12px/1 var(--font);letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="win" data-od-id="app-window">
  <div class="titlebar" data-od-id="title-bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="app-mark">Digi<span class="bit">World</span></div>
    <div class="win-meta">Tamer Terminal · Factory</div>
  </div>

  <div class="body">
    <nav class="side" aria-label="Primary" data-od-id="sidebar-nav">
      <div class="grp">The Town</div>
      <button class="navbtn" aria-current="page" data-nav="factory" aria-label="Factory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 20V10l5 3V10l5 3V6l6 4v10z"/><path d="M7 20v-4M12 20v-4M17 20v-4"/></svg>Factory
      </button>
      <button class="navbtn" data-nav="adventure" aria-label="Adventure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 4v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V7z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>Adventure
      </button>
      <button class="navbtn" data-nav="nursery" aria-label="Nursery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21c-4-2.5-7-5.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 12c0 3.5-3 6.5-7 9z"/></svg>Nursery
      </button>

      <div class="grp" style="margin-top:6px">Beyond</div>
      <button class="navbtn" data-nav="roster" aria-label="Roster">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.5a3 3 0 0 1 0 5.4M18 19c0-2.4-1.4-4.3-3.4-5"/></svg>Roster
      </button>
      <button class="navbtn" data-nav="world" aria-label="The World">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.8 5.4 3.8 8.5S14.5 18.1 12 20.5C9.5 18.1 8.2 15.1 8.2 12S9.5 5.9 12 3.5z"/></svg>The World
      </button>
      <button class="navbtn" data-nav="arena" aria-label="The Arena">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3l-2 5h4l-4 8 2-5h-4l4-8z"/><circle cx="12" cy="12" r="9"/></svg>The Arena
      </button>

      <div class="spring">
        <div class="hud">
          <div class="pill">Tamer Lv <b>22</b></div>
          <div class="pill">Credits <b>4,820</b></div>
          <div class="pill">Active jobs <b id="hud-jobs">—</b></div>
        </div>
      </div>
    </nav>

    <main class="main" data-od-id="factory-main" tabindex="-1">
      <div class="balbar" data-od-id="resource-balance" id="balbar"></div>

      <div class="scroll">
        <div class="ovw" id="ovw" data-od-id="factory-overview"></div>
        <div class="fac-sec">
          <h3 class="stitle">Your Factories <span class="cnt" id="fac-count">—</span></h3>
          <div class="fgrid rail" id="fgrid" data-od-id="factory-grid"></div>
        </div>
        <div class="buy-sec">
          <h3 class="stitle">Available Factories</h3>
          <div class="buygrid rail" id="buygrid" data-od-id="factory-buy-grid"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- recipe drawer -->
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="drawer-panel">
    <div class="dhead">
      <div>
        <div class="dk" id="drawer-kick">Recipes</div>
        <h2 id="drawer-title">Factory</h2>
      </div>
      <button class="dclose" id="drawer-close" aria-label="Close recipes">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dlist" id="drawer-list"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= data shape mirrors src/farm/engine.ts ================= */
const RES_ICONS = {
  Meat:'<path d="M12 3c4 0 7 3 7 7 0 5-4 9-7 11-3-2-7-6-7-11 0-4 3-7 7-7z"/><path d="M9 9c1-1 4-1 5 0"/>',
  Bits:'<path d="M4 8h4V4M20 8h-4V4M4 16h4v4M20 16h-4v4"/><rect x="8" y="8" width="8" height="8"/>',
  Data:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.6 3.1 3 7 3s7-1.4 7-3V6"/><path d="M5 12c0 1.6 3.1 3 7 3s7-1.4 7-3"/>',
};
const CREDITS_ICON='<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h3.5a1.5 1.5 0 0 1 0 3H9.5"/>';

const FAC_ICONS = {
  med:'<path d="M12 4v16M4 12h16" stroke-width="2.4"/><rect x="4" y="4" width="16" height="16" rx="0"/>',
  chip:'<rect x="6" y="6" width="12" height="12"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
  rare:'<path d="M12 3l3 5 6 1-4.5 4 1 6-5.5-3-5.5 3 1-6L3 9l6-1 3-5z"/>',
  pantry:'<path d="M5 8h14v11H5z"/><path d="M5 8l2-4h10l2 4"/><path d="M9 12h6"/>',
};

/* server-authoritative-ish mock state */
const state = {
  balances: { Meat: 148, Bits: 92, Data: 37 },
  credits: 4820,
  factories: [
    { id:'fac-med', type:'med', name:'Med Factory', description:'Assembles healing kits, status cures, and energy drinks.',
      level:3, maxLevel:10, craftSpeedPct:19, upgradeCost:768, queueMaxMs:1800000,
      queue:[
        { id:'j1', itemName:'Small Heal', durationMs:48600, progressPct:64, isActive:true, readyToCollect:false },
        { id:'j2', itemName:'Status Cure', durationMs:145800, progressPct:0, isActive:false, readyToCollect:false },
      ] },
    { id:'fac-pantry', type:'pantry', name:'Pantry', description:'Packs Provisions — expedition rations that keep your team fed.',
      level:2, maxLevel:10, craftSpeedPct:10, upgradeCost:480, queueMaxMs:1800000,
      queue:[
        { id:'j3', itemName:'Provision', durationMs:540000, progressPct:100, isActive:true, readyToCollect:true },
      ] },
  ],
  // buyable (not yet owned)
  available: [
    { type:'chip', name:'Chip Factory', description:'Etches combat mods — Power Chips and Guard Chips.', cost:{ Meat:100, Bits:100, Data:50 } },
    { type:'rare', name:'Rare Factory', description:'Manufactures rare consumables like Digi-Revives.', cost:{ Meat:200, Bits:200, Data:200 } },
  ],
  recipes: [
    { id:'rcp-heal-small', name:'Small Heal', desc:'Restores a chunk of HP to one ally.', Meat:5, Bits:10, Data:0, craftTimeMs:60000, category:'med' },
    { id:'rcp-energy-drink', name:'Energy Drink', desc:'Restores EN mid-battle.', Meat:0, Bits:15, Data:5, craftTimeMs:120000, category:'med' },
    { id:'rcp-status-cure', name:'Status Cure', desc:'Clears one ailment.', Meat:10, Bits:10, Data:5, craftTimeMs:180000, category:'med' },
    { id:'rcp-heal-large', name:'Large Heal', desc:'Big single-target HP restore.', Meat:20, Bits:40, Data:10, craftTimeMs:300000, category:'med' },
    { id:'rcp-atk-buff', name:'Power Chip', desc:'Permanent +ATK combat mod.', Meat:20, Bits:20, Data:0, craftTimeMs:240000, category:'chip' },
    { id:'rcp-def-buff', name:'Guard Chip', desc:'Permanent +DEF combat mod.', Meat:20, Bits:20, Data:0, craftTimeMs:240000, category:'chip' },
    { id:'rcp-digi-revive', name:'Digi-Revive', desc:'Revives a KO’d Digimon to full.', Meat:30, Bits:30, Data:30, craftTimeMs:600000, category:'rare' },
    { id:'rcp-provision', name:'Provision', desc:'Expedition ration for adventures.', Meat:2, Bits:1, Data:0, craftTimeMs:600000, category:'pantry' },
  ],
};

const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');
function fmtDur(ms){const s=Math.max(0,Math.round(ms/1000));if(s<60)return s+'s';const m=Math.floor(s/60),r=s%60;if(m<60)return r?`${m}m ${r}s`:`${m}m`;const h=Math.floor(m/60);return `${h}h ${m%60}m`;}

/* ---- toast ---- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

/* ---- balance bar ---- */
function paintBalances(){
  const b=state.balances;
  const cells=[
    ['meat','Meat',b.Meat,RES_ICONS.Meat],
    ['bits','Bits',b.Bits,RES_ICONS.Bits],
    ['data','Data',b.Data,RES_ICONS.Data],
    ['credits','Credits',state.credits,CREDITS_ICON],
  ];
  $('#balbar').innerHTML = cells.map(([res,k,v,ic])=>`
    <div class="bal" data-res="${res}">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${ic}</svg></span>
      <span class="col"><span class="k">${k}</span><span class="v" data-bal="${res}">${fmt(v)}</span></span>
    </div>`).join('')
    + `<div class="strip-title"><div class="k">Factory Row</div><div class="s" id="jobsline">—</div></div>`;
}
function updateBalanceNums(){
  $('[data-bal="meat"]').textContent=fmt(state.balances.Meat);
  $('[data-bal="bits"]').textContent=fmt(state.balances.Bits);
  $('[data-bal="data"]').textContent=fmt(state.balances.Data);
  $('[data-bal="credits"]').textContent=fmt(state.credits);
}

/* ---- factory cards ---- */
function queueUsedMs(f){
  // remaining time across the queue: active job counts its leftover, queued jobs count full duration
  return f.queue.reduce((a,j)=>{
    if(j.readyToCollect) return a;
    const rem = j.isActive ? j.durationMs*(1-j.progressPct/100) : j.durationMs;
    return a + rem;
  },0);
}
function jobHTML(f,j){
  const ready=j.readyToCollect;
  return `<div class="job ${ready?'ready':''}" data-job="${j.id}">
    <div class="jn">
      <div class="jt">${j.itemName}</div>
      <div class="jbar"><span class="jfill" style="width:${ready?100:j.progressPct}%"></span></div>
    </div>
    <div class="jmeta">
      ${ready
        ? `<span class="rc">READY</span><button class="collectbtn" data-collect="${j.id}" data-fac="${f.id}">Collect</button>`
        : `<span>${Math.round(j.progressPct)}%</span><button class="cancelbtn" data-cancel="${j.id}" data-fac="${f.id}">Cancel</button>`}
    </div>
  </div>`;
}
/* grouped row for identical pending (queued, not-yet-started) items → one row with xN */
function queuedGroupHTML(f,name,count){
  return `<div class="job qgroup" data-qgroup="${encodeURIComponent(name)}" data-fac="${f.id}">
    <div class="jn">
      <div class="jt">${name} ${count>1?`<span class="xn">x${count}</span>`:''}</div>
      <div class="jbar queued"><span class="jfill" style="width:0%"></span></div>
    </div>
    <div class="jmeta">
      <span>Queued</span><button class="cancelbtn" data-cancelgroup="${encodeURIComponent(name)}" data-fac="${f.id}">Cancel</button>
    </div>
  </div>`;
}
function queueBodyHTML(f){
  if(!f.queue.length) return `<div class="qempty">Idle — pick a recipe to start crafting.</div>`;
  // active + ready jobs render individually (live state); pending queued jobs collapse by item name
  const rows=[];
  const pending={}; // name -> count, preserving first-seen order
  const pendingOrder=[];
  f.queue.forEach(j=>{
    if(j.isActive||j.readyToCollect){ rows.push(jobHTML(f,j)); }
    else { if(!(j.itemName in pending)){pending[j.itemName]=0;pendingOrder.push(j.itemName);} pending[j.itemName]++; }
  });
  pendingOrder.forEach(name=>rows.push(queuedGroupHTML(f,name,pending[name])));
  return rows.join('');
}
function factoryHTML(f){
  const maxed=f.level>=f.maxLevel;
  const canAfford=state.credits>=f.upgradeCost;
  const active=f.queue.filter(j=>j.isActive||j.readyToCollect).length;
  const usedMs=queueUsedMs(f);
  const capPct=f.queueMaxMs>0?(usedMs/f.queueMaxMs)*100:0;
  const qbody = queueBodyHTML(f);
  const foot = maxed
    ? `<div class="ffoot maxed" data-fac="${f.type}"><span class="maxtag">Max level · fastest craft</span></div>`
    : `<div class="ffoot" data-fac="${f.type}">
        <span class="uhint">Upgrade to Lv ${f.level+1} — faster crafts · <b>${fmt(f.upgradeCost)}</b> Credits</span>
        <button class="btn ghost" data-upgrade="${f.id}" ${canAfford?'':'disabled'}>Upgrade</button>
      </div>`;
  return `<article class="fcard" data-fac="${f.type}" aria-label="${f.name}, level ${f.level} of ${f.maxLevel}, ${active} active jobs">
    <div class="fhead">
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${FAC_ICONS[f.type]}</svg></span>
      <div><div class="nm">${f.name}</div><div class="desc">${f.description}</div></div>
      <div class="lvbadge"><div class="lk">Level</div><div class="lv">${f.level}<small>/${f.maxLevel}</small></div></div>
    </div>
    <div class="fspeed"><span>Craft speed bonus <b class="spd">+${f.craftSpeedPct}%</b></span><span>${active}/${f.queue.length||0} jobs running</span></div>
    <div class="queue">
      <div class="qhead">
        <span>Crafting queue</span>
        <span class="qcap ${capPct>=100?'full':''}"><b>${fmtDur(usedMs)}</b> / ${fmtDur(f.queueMaxMs)} queued</span>
      </div>
      <div class="qmeter ${capPct>=100?'full':''}" role="progressbar" aria-valuenow="${Math.round(capPct)}" aria-valuemin="0" aria-valuemax="100" aria-label="Queue time used"><i style="width:${Math.min(100,capPct)}%"></i></div>
      <div class="qjobs">${qbody}</div>
    </div>
    <div class="ffoot-wrap">
      <div class="ffoot" data-fac="${f.type}" style="border-top:1px solid var(--hair);grid-template-columns:1fr auto">
        <button class="btn primary" data-recipes="${f.id}">Craft item</button>
        ${maxed?'<span class="maxtag">Max level</span>':`<button class="btn ghost" data-upgrade="${f.id}" ${canAfford?'':'disabled'} title="${canAfford?'':'Not enough Credits'}">Upgrade · ${fmt(f.upgradeCost)}</button>`}
      </div>
    </div>
  </article>`;
}
function paintOverview(){
  const facs=state.factories;
  const crafting=facs.reduce((a,f)=>a+f.queue.filter(j=>j.isActive&&!j.readyToCollect).length,0);
  const ready=facs.reduce((a,f)=>a+f.queue.filter(j=>j.readyToCollect).length,0);
  // soonest next-ready: min remaining ms across active, not-yet-ready jobs
  let nextMs=Infinity;
  facs.forEach(f=>f.queue.forEach(j=>{
    if(j.isActive&&!j.readyToCollect){const rem=j.durationMs*(1-j.progressPct/100);if(rem<nextMs)nextMs=rem;}
  }));
  const nextTxt = ready>0 ? 'now' : (nextMs===Infinity ? '—' : fmtDur(nextMs));
  const cells=[
    {k:'Factories',v:`${facs.length}<small>/4</small>`},
    {k:'Crafting',v:crafting},
    {k:'Ready to collect',v:ready,hot:ready>0},
    {k:'Next ready',v:nextTxt},
  ];
  $('#ovw').innerHTML = cells.map(c=>`
    <div class="stat ${c.hot?'hot':''}"><div class="k">${c.k}</div><div class="v">${c.v}</div></div>`).join('');
}
function paintFactories(){
  $('#fgrid').innerHTML = state.factories.map(factoryHTML).join('');
  $('#fac-count').textContent = `${state.factories.length}/4 built`;
  const active = state.factories.reduce((a,f)=>a+f.queue.filter(j=>j.isActive||j.readyToCollect).length,0);
  const ready = state.factories.reduce((a,f)=>a+f.queue.filter(j=>j.readyToCollect).length,0);
  $('#hud-jobs').textContent = active;
  const jl=$('#jobsline'); if(jl) jl.textContent = ready>0 ? `${ready} ready to collect` : `${active} crafting`;
  paintOverview();
}

/* ---- buy cards ---- */
function affordFactory(cost){return state.balances.Meat>=cost.Meat&&state.balances.Bits>=cost.Bits&&state.balances.Data>=cost.Data;}
function buyHTML(a){
  const afford=affordFactory(a.cost);
  const costChips=['Meat','Bits','Data'].filter(r=>a.cost[r]>0).map(r=>{
    const short=state.balances[r]<a.cost[r];
    return `<span class="cchip ${short?'short':''}" data-res="${r.toLowerCase()}"><span class="cd"></span>${a.cost[r]} ${r}</span>`;
  }).join('');
  return `<article class="buycard" data-fac="${a.type}">
    <div class="bh">
      <span class="bbadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${FAC_ICONS[a.type]}</svg></span>
      <div class="bn">${a.name}</div>
    </div>
    <div class="bd">${a.description}</div>
    <div class="costs">${costChips}</div>
    <div class="brow">
      <span style="font-size:11px;color:var(--muted)">${afford?'Ready to build':'Not enough resources'}</span>
      <button class="btn primary" data-buy="${a.type}" ${afford?'':'disabled'}>Build factory</button>
    </div>
  </article>`;
}
function paintBuy(){
  const g=$('#buygrid');
  if(!state.available.length){ g.innerHTML=`<div style="color:var(--muted);font-size:13px;padding:8px">All factory types built. Your industrial base is complete.</div>`; return; }
  g.innerHTML = state.available.map(buyHTML).join('');
}

/* ---- recipe drawer ---- */
let drawerFac=null;
function openDrawer(facId){
  const f=state.factories.find(x=>x.id===facId); if(!f) return;
  drawerFac=f;
  const dr=$('#drawer'); const panel=$('#drawer-panel');
  panel.setAttribute('data-fac',f.type);
  $('#drawer-kick').textContent = `${f.name} · Recipes`;
  $('#drawer-title').textContent = 'Craft an item';
  const recipes=state.recipes.filter(r=>r.category===f.type);
  const usedMs=queueUsedMs(f);
  $('#drawer-list').innerHTML = recipes.map(r=>{
    const missing=['Meat','Bits','Data'].filter(k=>state.balances[k]<r[k]);
    const overflows=usedMs+r.craftTimeMs>f.queueMaxMs;
    const canCraft=missing.length===0&&!overflows;
    const chips=['Meat','Bits','Data'].filter(k=>r[k]>0).map(k=>{
      const short=state.balances[k]<r[k];
      return `<span class="cchip ${short?'short':''}" data-res="${k.toLowerCase()}"><span class="cd"></span>${r[k]} ${k}</span>`;
    }).join('');
    const hint = missing.length ? `Need more ${missing.join(', ')}` : (overflows ? `Queue full — ${fmtDur(f.queueMaxMs)} cap` : '');
    // max craftable this queue: min of time-cap headroom and per-resource affordability
    const timeMax=Math.max(0,Math.floor((f.queueMaxMs-usedMs)/r.craftTimeMs));
    const resMax=['Meat','Bits','Data'].reduce((m,k)=>r[k]>0?Math.min(m,Math.floor(state.balances[k]/r[k])):m,Infinity);
    const maxN=Math.max(1,Math.min(timeMax,resMax===Infinity?99:resMax,99));
    return `<div class="recipe" data-recipe="${r.id}">
      <div class="rtop"><div><div class="rn">${r.name}</div><div class="rd">${r.desc}</div></div><div class="rtime">${fmtDur(r.craftTimeMs)}</div></div>
      <div class="costs">${chips||'<span class="cchip"><span class="cd"></span>Free</span>'}</div>
      <div class="ract">
        <span class="rhint" ${canCraft?'hidden':''}>${hint}</span>
        <div class="qty" ${canCraft?'':'hidden'}>
          <button class="qbtn" data-qstep="-1" data-recipe="${r.id}" aria-label="Decrease amount">−</button>
          <input class="qin" type="number" inputmode="numeric" min="1" max="${maxN}" value="1" data-qty="${r.id}" aria-label="Amount to fabricate">
          <button class="qbtn" data-qstep="1" data-recipe="${r.id}" aria-label="Increase amount">+</button>
        </div>
        <button class="craftbtn" data-craft="${r.id}" data-max="${maxN}" ${canCraft?'':'disabled'}>Queue craft</button>
      </div>
    </div>`;
  }).join('');
  dr.classList.add('open');
  $('#drawer-close').focus();
}
function closeDrawer(){$('#drawer').classList.remove('open');drawerFac=null;}

function queueCraft(recipeId,qty){
  if(!drawerFac) return;
  const r=state.recipes.find(x=>x.id===recipeId); if(!r) return;
  let n=Math.max(1,Math.floor(qty||1));
  let queued=0;
  for(let i=0;i<n;i++){
    if(queueUsedMs(drawerFac)+r.craftTimeMs>drawerFac.queueMaxMs){ break; }
    if(state.balances.Meat<r.Meat||state.balances.Bits<r.Bits||state.balances.Data<r.Data){ break; }
    state.balances.Meat-=r.Meat; state.balances.Bits-=r.Bits; state.balances.Data-=r.Data;
    const anyActive=drawerFac.queue.some(j=>j.isActive);
    drawerFac.queue.push({ id:'j'+Date.now()+'-'+i, itemName:r.name, durationMs:r.craftTimeMs, progressPct:0, isActive:!anyActive, readyToCollect:false });
    queued++;
  }
  updateBalanceNums(); paintFactories(); paintBuy();
  if(queued===0){ toast(`Can't queue ${r.name} — queue full or not enough resources`); }
  else if(queued<n){ toast(`Queued ${queued}× ${r.name} (capped) at ${drawerFac.name}`); }
  else { toast(`Queued ${queued}× ${r.name} at ${drawerFac.name}`); }
  openDrawer(drawerFac.id); // refresh affordability + quantity caps in drawer
}

/* ---- collect / cancel / upgrade / buy ---- */
function collectJob(facId,jobId){
  const f=state.factories.find(x=>x.id===facId); if(!f) return;
  const idx=f.queue.findIndex(j=>j.id===jobId); if(idx<0) return;
  const name=f.queue[idx].itemName;
  f.queue.splice(idx,1);
  const next=f.queue.find(j=>!j.isActive&&!j.readyToCollect);
  if(next) next.isActive=true;
  paintFactories(); toast(`Collected ${name} → inventory`);
}
function cancelJob(facId,jobId){
  const f=state.factories.find(x=>x.id===facId); if(!f) return;
  const idx=f.queue.findIndex(j=>j.id===jobId); if(idx<0) return;
  const wasActive=f.queue[idx].isActive;
  const r=state.recipes.find(x=>x.name===f.queue[idx].itemName);
  if(r){ state.balances.Meat+=r.Meat; state.balances.Bits+=r.Bits; state.balances.Data+=r.Data; } // refund
  f.queue.splice(idx,1);
  if(wasActive){const next=f.queue.find(j=>!j.readyToCollect);if(next)next.isActive=true;}
  updateBalanceNums(); paintFactories(); paintBuy(); toast('Job cancelled · resources refunded');
}
function cancelGroup(facId,itemName){
  const f=state.factories.find(x=>x.id===facId); if(!f) return;
  // remove the LAST pending (not active, not ready) instance of this item
  for(let i=f.queue.length-1;i>=0;i--){
    const j=f.queue[i];
    if(j.itemName===itemName&&!j.isActive&&!j.readyToCollect){
      const r=state.recipes.find(x=>x.name===itemName);
      if(r){ state.balances.Meat+=r.Meat; state.balances.Bits+=r.Bits; state.balances.Data+=r.Data; }
      f.queue.splice(i,1);
      updateBalanceNums(); paintFactories(); paintBuy(); toast(`${itemName} removed from queue · refunded`);
      return;
    }
  }
}
function upgradeFactory(facId){
  const f=state.factories.find(x=>x.id===facId); if(!f||f.level>=f.maxLevel) return;
  if(state.credits<f.upgradeCost){toast('Not enough Credits');return;}
  state.credits-=f.upgradeCost; f.level++; f.craftSpeedPct=Math.round((1-Math.pow(0.9,f.level-1))*100); f.upgradeCost=Math.round(f.upgradeCost*1.6);
  updateBalanceNums(); paintFactories(); toast(`${f.name} upgraded to Lv ${f.level}`);
}
function buyFactory(type){
  const a=state.available.find(x=>x.type===type); if(!a||!affordFactory(a.cost)) return;
  state.balances.Meat-=a.cost.Meat; state.balances.Bits-=a.cost.Bits; state.balances.Data-=a.cost.Data;
  state.factories.push({ id:'fac-'+type, type, name:a.name, description:a.description, level:1, maxLevel:10, craftSpeedPct:0, upgradeCost:300, queueMaxMs:1800000, queue:[] });
  state.available=state.available.filter(x=>x.type!==type);
  updateBalanceNums(); paintFactories(); paintBuy(); toast(`${a.name} built!`);
}

/* ---- event wiring (delegated) ---- */
document.addEventListener('click',e=>{
  const rc=e.target.closest('[data-recipes]'); if(rc){openDrawer(rc.dataset.recipes);return;}
  const up=e.target.closest('[data-upgrade]'); if(up){upgradeFactory(up.dataset.upgrade);return;}
  const cl=e.target.closest('[data-collect]'); if(cl){collectJob(cl.dataset.fac,cl.dataset.collect);return;}
  const cx=e.target.closest('[data-cancel]'); if(cx){cancelJob(cx.dataset.fac,cx.dataset.cancel);return;}
  const cg=e.target.closest('[data-cancelgroup]'); if(cg){cancelGroup(cg.dataset.fac,decodeURIComponent(cg.dataset.cancelgroup));return;}
  const by=e.target.closest('[data-buy]'); if(by){buyFactory(by.dataset.buy);return;}
  const qs=e.target.closest('[data-qstep]'); if(qs){
    const inp=document.querySelector(`.qin[data-qty="${qs.dataset.recipe}"]`);
    if(inp){const max=parseInt(inp.max,10)||99;let v=(parseInt(inp.value,10)||1)+parseInt(qs.dataset.qstep,10);v=Math.max(1,Math.min(max,v));inp.value=v;}
    return;
  }
  const cf=e.target.closest('[data-craft]'); if(cf){
    const inp=document.querySelector(`.qin[data-qty="${cf.dataset.craft}"]`);
    const max=parseInt(cf.dataset.max,10)||99;
    let qty=inp?Math.max(1,Math.min(max,parseInt(inp.value,10)||1)):1;
    queueCraft(cf.dataset.craft,qty);return;
  }
  if(e.target.closest('#drawer-close')||e.target.id==='scrim'){closeDrawer();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('open'))closeDrawer();});
document.addEventListener('input',e=>{
  const qin=e.target.closest('.qin'); if(!qin) return;
  const max=parseInt(qin.max,10)||99;
  let v=parseInt(qin.value,10); if(isNaN(v)) return; // allow transient empty while typing
  if(v>max)qin.value=max; if(v<1)qin.value=1;
});
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.navbtn').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');
}));

/* ---- progress tick: advance active jobs so the queue feels alive ---- */
function tick(){
  let changed=false;
  state.factories.forEach(f=>{
    f.queue.forEach(j=>{
      if(j.isActive&&!j.readyToCollect){
        const step=(1000/j.durationMs)*100*4; // ~4x for demo visibility
        j.progressPct=Math.min(100,j.progressPct+step);
        if(j.progressPct>=100){j.readyToCollect=true;j.isActive=false;
          const next=f.queue.find(q=>!q.isActive&&!q.readyToCollect);if(next)next.isActive=true;}
        changed=true;
      }
    });
  });
  if(changed) paintFactories();
}

paintBalances(); paintFactories(); paintBuy();
if(!reduce) setInterval(tick,1000);
