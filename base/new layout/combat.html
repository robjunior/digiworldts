<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiWorld · Battle</title>
<!-- Three.js as a UMD GLOBAL (window.THREE), NOT an importmap/ES module:
     importmap + `import * as THREE` does not resolve in the OD iframe sandbox
     and yields a blank canvas. r150+ deprecates this build but it still loads
     and populates window.THREE. All Three init is guarded behind if(renderer)
     so the HTML combat loop survives when THREE is absent / WebGL is off. -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
/* ===================================================================
   DigiWorld — Combat screen: real 3D Octopath-style arena (Three.js)
   + Persona 5 acid-red overlay HUD (matches index/adventure/roster…).
   Ref: image-4.png (domed checkered arena, party LEFT / enemies RIGHT,
   ground rings, top turn-queue, party HP cards bottom-left, enemy rail
   right, command menu bottom-right, battle feed top-left, AUTO toggle).
   Grounded in /mnt/sdc/digiworld/backend/src/battle/* :
     initiative = spd + level*2 + jitter ; WEAK 1.5 / RESIST 0.5 wheel ;
     attr advantage 1.35 / disadvantage 0.75 ; EN-gated skills ;
     GUARD 0.5 ; CRIT 1.5 ; MISS ; EN regen per round ; Analyse.
   HP green / EN gold bar hues are color-mix off Ink — no new surface hex.
   =================================================================== */
:root{
  --bg:#0a0a0c; --panel:#141418; --ink:#f4f1ea; --muted:#8a877f;
  --hair:#2a2a30; --signal:#e6001f; --battle:#e6001f;
  --font:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --notch:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --notch-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  --hp:color-mix(in oklab,var(--ink) 34%,#39d353);
  --en:color-mix(in oklab,var(--ink) 30%,#e8b53a);
  --el-fire:var(--battle);
  --el-water:color-mix(in oklab,var(--signal) 42%,#4aa3ff);
  --el-plant:color-mix(in oklab,var(--ink) 40%,#3fbf6f);
  --el-electricity:color-mix(in oklab,var(--ink) 46%,#e8c33a);
  --el-wind:color-mix(in oklab,var(--ink) 50%,#63d6c0);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
.win{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.titlebar{flex:0 0 auto;height:38px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--hair);z-index:30}
.lights{display:flex;gap:7px}
.lights i{width:11px;height:11px;background:var(--hair);clip-path:var(--notch-sm)}
.lights i:first-child{background:var(--signal)}
.app-mark{font:800 14px/1 var(--font);letter-spacing:.02em}
.app-mark .bit{color:var(--signal)}
.win-meta{margin-left:auto;font:600 11px/1 var(--font);color:var(--muted);letter-spacing:.04em}

/* ---- arena: 3D canvas fills the stage, overlays float above ------------ */
.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:radial-gradient(120% 100% at 50% 120%,color-mix(in oklab,var(--signal) 8%,var(--bg)),var(--bg) 70%)}
#arena{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.arena-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:1;color:var(--muted);font:600 12px/1.5 var(--font);text-align:center;padding:24px}
.arena-fallback.show{display:flex}
.arena-fallback .box{max-width:340px;border:1px solid var(--hair);clip-path:var(--notch);padding:20px 22px;background:color-mix(in oklab,var(--panel) 80%,transparent)}
.arena-fallback b{color:var(--ink)}
.overlay{position:absolute;inset:0;z-index:2;pointer-events:none}
.overlay>*{pointer-events:auto}
/* ---- top-center: ROUND / YOUR TURN strip + NEXT turn-order queue ------- */
.topbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:11px;z-index:3;max-width:38vw}
.tstrip{display:flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);overflow:hidden}
.tstrip .rd{font:800 10px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:11px 15px}
.tstrip .tt{font:800 10px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;padding:11px 15px}
.tstrip .tt.you{background:var(--signal);color:#fff}
.tstrip .tt.foe{background:color-mix(in oklab,var(--battle) 22%,var(--panel));color:var(--ink)}
.tstrip .actor{font:800 15px/1 var(--font);color:var(--ink);padding:11px 16px}
.nextq{display:flex;align-items:center;gap:11px;background:color-mix(in oklab,var(--panel) 86%,transparent);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:8px 14px 8px 13px;backdrop-filter:blur(3px)}
.nextq .nl{font:800 9px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.nextq .qi{width:36px;height:36px;position:relative;display:grid;place-items:center;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);font-size:36px}
.nextq .qi.you{border-color:color-mix(in oklab,var(--signal) 50%,var(--hair))}
.nextq .qi.foe{border-color:color-mix(in oklab,var(--battle) 30%,var(--hair))}
.nextq .qi.now{box-shadow:inset 0 0 0 1px var(--signal)}
.nextq .qi img{width:31px;height:31px;object-fit:contain;image-rendering:pixelated}
.nextq .qi .en{position:absolute;bottom:-2px;right:-2px;width:7px;height:7px;background:var(--el,var(--muted));clip-path:var(--notch-sm)}

/* ---- top-left: side summaries + battle feed ---------------------------- */
.side-badge{position:absolute;top:16px;left:16px;z-index:3;display:flex;flex-direction:column;gap:10px;width:clamp(188px,15vw,224px);max-width:24vw}
.sb{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:10px 13px;display:flex;align-items:center;justify-content:space-between}
.sb .k{font:800 10px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sb .pips{display:flex;gap:4px}
.sb .pip{width:11px;height:11px;clip-path:var(--notch-sm);background:color-mix(in oklab,var(--el,var(--muted)) 26%,var(--panel));border:1px solid var(--el,var(--hair))}
.sb .pip.ko{opacity:.4}
.sb .n{font:800 10px/1 var(--font);color:var(--ink)}
.feed{background:color-mix(in oklab,var(--panel) 84%,transparent);border:1px solid var(--hair);clip-path:var(--notch);backdrop-filter:blur(3px);display:flex;flex-direction:column;max-height:250px}
.feed h4{font:800 9px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:11px 14px 9px;border-bottom:1px solid var(--hair)}
.feedbody{overflow-y:auto;padding:6px 0;scrollbar-width:thin;display:flex;flex-direction:column;gap:1px}
.feedbody::-webkit-scrollbar{width:6px}.feedbody::-webkit-scrollbar-thumb{background:var(--hair)}
.lg{display:grid;grid-template-columns:3px 14px 1fr;gap:8px;align-items:start;padding:5px 13px 5px 0;font:600 12px/1.35 var(--font);animation:lgin .3s ease}
.lg .stripe{align-self:stretch;background:var(--cue,var(--hair))}
.lg svg{width:12px;height:12px;margin-top:1px;color:var(--cue,var(--muted))}
.lg .ltx b{color:var(--ink)}
.lg .ltx .tag{margin-left:4px;font:800 7px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--cue,var(--muted))}
.lg.crit,.lg.weak{--cue:var(--el-electricity)} .lg.resist,.lg.miss{--cue:var(--muted)}
.lg.ko{--cue:var(--battle)} .lg.round{--cue:var(--signal)} .lg.guard{--cue:var(--el-water)}
@keyframes lgin{0%{opacity:0;transform:translateX(-4px)}100%{opacity:1}}

/* ---- top-right: your team badge --------------------------------------- */
.team-badge{position:absolute;top:16px;right:16px;z-index:3;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:10px 14px;text-align:right}
.team-badge .k{font:800 10px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.team-badge .pips{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.team-badge .pip{width:11px;height:11px;clip-path:var(--notch-sm);background:color-mix(in oklab,var(--el,var(--muted)) 26%,var(--panel));border:1px solid var(--el,var(--hair))}
.team-badge .pip.ko{opacity:.4}

/* ---- right: enemy list rail ------------------------------------------- */
.enemy-rail{position:absolute;right:16px;top:96px;z-index:3;display:flex;flex-direction:column;gap:8px;width:clamp(198px,16vw,240px);max-width:26vw}
.erow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);border-left:0;padding:11px 14px 11px 0;position:relative;cursor:default;color:inherit;font:inherit;text-align:left;width:100%}
.erow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--el,var(--hair))}
.erow .edot{width:11px;height:11px;margin-left:13px;background:var(--el,var(--muted));clip-path:var(--notch-sm)}
.erow .enm{min-width:0;font:800 14px/1.1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .enm .esub{display:block;font:700 9px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.erow .ehp{font:800 12px/1 var(--font);color:var(--muted);white-space:nowrap}
.erow .ehpbar{grid-column:1/-1;height:5px;margin:4px 13px 0 16px;background:var(--bg);border:1px solid var(--hair);clip-path:polygon(2px 0,100% 0,100% 100%,0 100%);overflow:hidden}
.erow .ehpbar i{display:block;height:100%;background:var(--battle);width:100%;transition:width .4s ease}
.erow.dead{opacity:.4;filter:grayscale(.7)}
.erow.pick{cursor:pointer}
.erow.pick:hover,.erow.pick.aim{border-color:var(--signal)}
.erow.pick.aim::before{background:var(--signal)}
.erow:focus-visible{outline:none;border-color:var(--signal)}
/* ---- bottom-left: party HP cards --------------------------------------- */
.party-cards{position:absolute;left:16px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:8px;width:clamp(222px,17vw,262px);max-width:27vw}
.pcard{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);position:relative;padding:12px 15px 13px;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--el,var(--hair))}
.pcard.active{border-color:var(--signal)}
.pcard.active::before{background:var(--signal)}
.pcard.dead{opacity:.42;filter:grayscale(.7)}
.pcard .ph{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.pcard .pspr{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);font-size:38px}
.pcard .pspr img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
/* always-visible monogram fallback when a sprite fails to load (CDN 404 etc.) */
.spr-slot{position:relative;display:grid;place-items:center;overflow:hidden;width:100%;height:100%}
.spr-slot img{position:relative;z-index:2}
.spr-slot .mono{position:absolute;inset:0;display:grid;place-items:center;font:800 0.62em/1 var(--font);color:var(--el,var(--muted));text-transform:uppercase;background:color-mix(in oklab,var(--el,var(--muted)) 16%,var(--bg));z-index:1}
.spr-slot img[data-failed]{display:none}
.pcard .pn{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pcard .pn .nm{font:800 14px/1.1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pn .lv{font:700 10px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pcard .guard-ic{font:800 8px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--signal);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:2px 5px}
.pcard .stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:5px}
.pcard .stat .sk{font:800 9px/1 var(--font);letter-spacing:.08em;color:var(--muted);width:18px}
.pcard .bar{background:var(--bg);border:1px solid var(--hair);clip-path:polygon(2px 0,100% 0,100% 100%,0 100%);overflow:hidden}
.pcard .bar.hp{height:9px}.pcard .bar.en{height:4px}
.pcard .bar i{display:block;height:100%;transition:width .4s ease}
.pcard .bar.hp i{background:var(--hp)}
.pcard .bar.en i{background:var(--en)}
.pcard .sn{font:800 12px/1 var(--font);color:var(--ink);min-width:84px;text-align:right}
.pcard .sn.en-n{font-size:10px;color:var(--muted);min-width:54px}

/* ---- bottom-center: AUTO toggle --------------------------------------- */
.auto-toggle{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:11px 18px;font:800 10px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:.12s}
.auto-toggle:hover{border-color:var(--muted);color:var(--ink)}
.auto-toggle .dot{width:8px;height:8px;background:var(--hair);clip-path:var(--notch-sm)}
.auto-toggle.on{color:var(--ink);border-color:color-mix(in oklab,var(--signal) 50%,var(--hair))}
.auto-toggle.on .dot{background:var(--signal)}

/* ---- bottom-right: command menu --------------------------------------- */
.cmd{position:absolute;right:16px;bottom:16px;z-index:4;width:clamp(258px,19vw,300px);max-width:30vw}
.cmd .chelp{background:color-mix(in oklab,var(--panel) 88%,transparent);border:1px solid var(--hair);border-bottom:0;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);padding:11px 15px;font:600 12.5px/1.45 var(--font);color:var(--ink);min-height:44px;backdrop-filter:blur(3px)}
.cmd .chelp .htag{font:800 8px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--en);margin-right:8px}
.cmd .chelp.muted{color:var(--muted)}
.cmd .chead{display:flex;align-items:baseline;justify-content:space-between;padding:9px 13px 5px;background:var(--panel);border:1px solid var(--hair);border-bottom:0}
.cmd .chead .sect{font:800 11px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cmd .chead .cnt{font:800 11px/1 var(--font);color:var(--muted);letter-spacing:.08em}
.cmd .rows{background:var(--panel);border:1px solid var(--hair);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);padding:9px;display:flex;flex-direction:column;gap:7px;max-height:264px;overflow-y:auto;scrollbar-width:thin}
.cmd .rows::-webkit-scrollbar{width:7px}.cmd .rows::-webkit-scrollbar-thumb{background:var(--hair)}
.mrow{display:grid;grid-template-columns:22px 1fr auto auto;align-items:center;gap:11px;background:var(--bg);border:1px solid var(--hair);clip-path:var(--notch-sm);padding:11px 14px;cursor:pointer;color:inherit;font:inherit;text-align:left;transition:.1s;width:100%}
.mrow .cur{width:18px;height:18px;display:grid;place-items:center;opacity:0}
.mrow .cur svg{width:17px;height:17px;color:var(--signal)}
.mrow .mnm{font:800 15px/1.1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mtag{font:800 8px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--el,var(--muted));border:1px solid color-mix(in oklab,var(--el,var(--hair)) 45%,var(--hair));clip-path:var(--notch-sm);padding:3px 5px}
.mrow .men{font:800 11px/1 var(--font);color:var(--en);white-space:nowrap}
.mrow .men.short{color:var(--muted);text-decoration:line-through}
.mrow.sel{background:var(--ink);border-color:var(--ink)}
.mrow.sel .mnm{color:var(--bg)}
.mrow.sel .cur{opacity:1}
.mrow.sel .mtag{color:var(--bg);border-color:color-mix(in oklab,var(--bg) 40%,var(--el,var(--hair)))}
.mrow.sel .men{color:color-mix(in oklab,var(--en) 60%,var(--bg))}
.mrow.disabled{cursor:not-allowed;opacity:.5}
.mrow.back{grid-template-columns:20px 1fr;color:var(--muted)}

/* ---- damage floaters projected over arena sprites --------------------- */
.floater{position:absolute;transform:translate(-50%,-50%);font:800 24px/1 var(--font);letter-spacing:-.02em;pointer-events:none;z-index:5;text-shadow:0 2px 7px rgba(0,0,0,.75);animation:floatUp 1s ease-out forwards;white-space:nowrap}
.floater.crit{font-size:32px;color:#fff}
.floater.weak{color:var(--el-electricity)}
.floater.resist{color:var(--muted);font-size:18px}
.floater.miss{color:var(--muted);font-style:italic}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-40%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%)}}

/* ---- end card --------------------------------------------------------- */
.scrim{position:absolute;inset:0;background:color-mix(in oklab,var(--bg) 78%,transparent);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
.scrim.show{display:flex}
.endcard{background:var(--panel);border:1px solid var(--hair);clip-path:var(--notch);width:min(440px,92vw);padding:30px 30px 26px;position:relative}
.endcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--signal)}
.endcard.loss::before{background:color-mix(in oklab,var(--battle) 55%,var(--muted))}
.endcard .eyebrow{font:800 10px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.endcard h2{font:800 40px/1 var(--font);letter-spacing:-.02em;margin:10px 0 4px}
.endcard.win h2{color:var(--signal)}
.endcard .esub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px}
.endcard .estats{display:flex;gap:22px;margin-bottom:24px}
.endcard .estats .m .k{font:700 9px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.endcard .estats .m .v{font:800 22px/1 var(--font);margin-top:6px}
.endcard .eact{display:flex;gap:10px}
.cbtn{background:var(--bg);border:1px solid var(--hair);color:var(--ink);clip-path:var(--notch-sm);padding:11px 18px;font:800 10px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.12s}
.cbtn:hover{border-color:var(--signal)}
.cbtn.primary{background:var(--signal);color:#fff;border-color:var(--signal)}
.cbtn.primary:hover{background:color-mix(in oklab,var(--signal) 86%,var(--ink))}
.cbtn.back{color:var(--muted)}
/* ---- accessibility: SR-only live region + universal focus rings ------- */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:where(.mrow,.erow,.pcard-btn,.auto-toggle,.cbtn,.qi):focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.erow.pick:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

/* ---- clarity: single inline weakness marker (revealed by Analyse) ----- */
.erow .wkm{margin-left:8px;color:var(--el-electricity);font-weight:800;letter-spacing:.04em}

/* ---- clarity: whose-turn emphasis on the status strip ----------------- */
.tstrip{position:relative;transition:box-shadow .2s}
.tstrip.is-you{box-shadow:inset 3px 0 0 var(--signal)}
.tstrip.is-foe{box-shadow:inset 3px 0 0 color-mix(in oklab,var(--battle) 60%,var(--ink))}
.tstrip.pulse{animation:turnpulse .5s ease}
@keyframes turnpulse{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.tstrip .actor{position:relative}
.tstrip .actor .arrow{color:var(--signal);margin-right:7px;font-size:11px}

/* ---- clarity: turn-order queue position numbers + labels -------------- */
.nextq .qi{position:relative}
.nextq .qi.dim{opacity:.5}

/* ---- polish: active party card + acting-enemy emphasis ---------------- */
.pcard.active{box-shadow:0 0 0 1px var(--signal),0 6px 22px color-mix(in oklab,var(--signal) 14%,transparent)}
.erow.acting{border-color:color-mix(in oklab,var(--battle) 55%,var(--hair))}
.erow.acting::before{background:var(--battle)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.floater{display:none}}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar" data-od-id="title-bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="app-mark">Digi<span class="bit">World</span></div>
    <div class="win-meta">Tamer Terminal · Battle</div>
  </div>

  <div class="stage" data-od-id="battle-stage">
    <canvas id="arena" aria-label="3D battle arena"></canvas>
    <div class="arena-fallback" id="arena-fallback" role="img" aria-label="3D arena unavailable — combat still playable">
      <div class="box"><b>3D arena unavailable</b><br>Your device blocked WebGL. Combat is still fully playable — use the command menu.</div>
    </div>

    <div class="overlay">
      <!-- top-left: enemy side summary + battle feed -->
      <div class="side-badge">
        <div class="sb"><span class="k">Wild Pack</span><span class="pips" id="pips-foe"></span></div>
        <aside class="feed" aria-label="Battle feed">

</div>
<script>
/* ================= data shape mirrors src/battle/engine.ts ==============
   initiative = spd + level*2 + spd*rand(0..0.2)  (higher acts first)
   damage ≈ atk * pow/50 * elementMult * attrMult * critMult * guardMult
   elementMult: WEAK 1.5 / RESIST 0.5 (element.ts) · attrMult adv 1.35 / dis 0.75
   GUARD 0.5 · CRIT 1.5 @ ~10% · MISS ~6% · EN regen +8/round
   ===================================================================== */
const CFG={critChance:0.10,critMult:1.5,missChance:0.06,guardMult:0.5,enRegen:8,weak:1.5,resist:0.5,advantage:1.35,disadvantage:0.75};
const sprite=sp=>`https://api.skullbot.fr/img/digimon/dot/${encodeURIComponent(sp)}.png`;
/* sprite slot with an always-visible element-tinted monogram fallback: if the
   CDN sprite 404s, onerror flags the img (hidden via CSS) and the monogram
   letter stays — so a slot is never a blank hole. */
function spriteImg(name,element,cls){
  const mono=(name||'?').trim().charAt(0).toUpperCase();
  return `<span class="spr-slot ${cls||''}" style="--el:var(--el-${element})">
    <span class="mono" aria-hidden="true">${mono}</span>
    <img src="${sprite(name)}" alt="" onerror="this.setAttribute('data-failed','')">
  </span>`;
}
const WEAK={fire:'plant',water:'fire',plant:'water',electricity:'water',wind:'earth'};
const RESIST={fire:'water',water:'electricity',plant:'fire',electricity:'earth',wind:'ice'};
function elementMult(a,d){if(WEAK[a]===d)return{m:CFG.weak,kind:'weak'};if(RESIST[a]===d)return{m:CFG.resist,kind:'resist'};return{m:1,kind:'neutral'};}
const ATTR_STRONG={Vaccine:'Virus',Virus:'Data',Data:'Vaccine'};
function attrMult(a,d){if(ATTR_STRONG[a]===d)return CFG.advantage;if(ATTR_STRONG[d]===a)return CFG.disadvantage;return 1;}
const IC={cursor:'<path d="M5 4l14 8-14 8z"/>',fight:'<path d="M14 3l-2 5h4l-4 8 2-5h-4l4-8z"/>',skill:'<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',guard:'<path d="M12 3l7 3v6c0 4-3 6.5-7 8-4-1.5-7-4-7-8V6z"/>',analyse:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',item:'<path d="M5 8h14v11H5z"/><path d="M5 8l2-4h10l2 4"/><path d="M9 12h6"/>',flee:'<path d="M13 5l7 7-7 7M20 12H4"/>',ko:'<path d="M18 6 6 18M6 6l12 12"/>',round:'<path d="M21 12a9 9 0 1 1-3-6.7M21 4v4h-4"/>',dot:'<circle cx="12" cy="12" r="3"/>'};

function makeInitial(){
  return {
    round:1, actions:3,
    party:[
      { id:'p0',name:'WereGarurumon',species:'WereGarurumon',element:'wind',       attribute:'Vaccine',level:50,hp:5994,hpMax:5994,en:120,enMax:120,atk:420,spd:96,
        skills:[
          {name:'Garuru Kick',element:'wind',pow:60,en:16,desc:'A blinding roundhouse — fast and accurate.'},
          {name:'Wolf Claw',element:'wind',pow:46,en:9,desc:'A raking slash for low EN.'},
          {name:'Kaiser Nail',element:'wind',pow:38,en:6,desc:'A reliable claw strike.'},
        ]},
      { id:'p1',name:'LadyDevimon',species:'LadyDevimon',element:'fire',           attribute:'Virus',  level:51,hp:5034,hpMax:5034,en:150,enMax:150,atk:398,spd:88,
        skills:[
          {name:'Darkness Wave',element:'fire',pow:62,en:18,desc:'A swarm of bats — burns Plant foes.'},
          {name:'Poison Talon',element:'fire',pow:48,en:10,desc:'A venom-laced rake.'},
          {name:'Slap',element:'fire',pow:32,en:5,desc:'A quick, cheap strike.'},
        ]},
      { id:'p2',name:'Tankdramon',species:'Tankdramon',element:'electricity',      attribute:'Free',   level:51,hp:5040,hpMax:5040,en:110,enMax:110,atk:452,spd:70,
        skills:[
          {name:'Striver Cannon',element:'electricity',pow:66,en:20,desc:'A charged artillery blast — shocks Water.'},
          {name:'Chrome Barrage',element:'electricity',pow:50,en:12,desc:'Rapid-fire volley.'},
          {name:'Ram',element:'electricity',pow:36,en:6,desc:'A heavy body charge.'},
        ]},
    ],
    foes:[
      {id:'e0',name:'Frigimon',  species:'Frigimon',  element:'water',attribute:'Data', level:49,hp:5142,hpMax:5142,atk:360,spd:60,analyzed:false},
      {id:'e1',name:'Sunflowmon',species:'Sunflowmon',element:'plant',attribute:'Vaccine',level:49,hp:5142,hpMax:5142,atk:372,spd:78,analyzed:false},
      {id:'e2',name:'Vegiemon',  species:'Vegiemon',  element:'plant',attribute:'Virus',level:49,hp:5142,hpMax:5142,atk:388,spd:66,analyzed:false},
    ],
  };
}

let S,queue,qIdx,over,autoOn=false;
let menu={mode:'root',items:[],hi:0,pendingKind:null,chosenSkill:null};
const $=(s,r=document)=>r.querySelector(s);
const alive=arr=>arr.filter(u=>u.hp>0);
const elVar=el=>`var(--el-${el})`;
const clampHi=()=>{menu.hi=Math.max(0,Math.min(menu.items.length-1,menu.hi));};

function deepInit(){S=JSON.parse(JSON.stringify(makeInitial()));over=false;S.actions=3;buildQueue(true);}
function initiative(u){return u.spd+u.level*2+u.spd*Math.random()*0.2;}
function buildQueue(fresh){
  const units=[...S.party.map(u=>({ref:u,side:'you'})),...S.foes.map(u=>({ref:u,side:'foe'}))]
    .filter(x=>x.ref.hp>0).map(x=>({...x,ini:initiative(x.ref)}));
  units.sort((a,b)=>b.ini-a.ini);
  queue=units;qIdx=0;
  if(fresh)log('round','Round 1 — battle start','round');
}

/* =================== Three.js Octopath-style 3D arena ==================
   Party on the RIGHT facing left, enemies on the LEFT facing right (as in
   image-4.png the labels sit mid-field; we split along X). Each sprite is a
   billboard PlaneGeometry with an elliptical ground ring. ALL Three access
   is guarded behind `if(renderer)` so the HTML combat loop keeps working
   when THREE is undefined or WebGL is blocked. */
let renderer=null,scene=null,camera=null,clock=null;
const sprites={};          // unitId -> {mesh, ring, base:THREE.Vector3, side}
const spriteMeta={};        // unitId -> {phase}
let arenaReady=false;

function initArena(){
  const canvas=$('#arena');
  try{
    if(typeof THREE==='undefined') throw new Error('THREE global missing');
    renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true});
  }catch(e){ renderer=null; $('#arena-fallback').classList.add('show'); return; }
  const w=canvas.clientWidth||canvas.offsetWidth||800, h=canvas.clientHeight||canvas.offsetHeight||600;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42,w/h,0.1,100);
  camera.position.set(0,5.4,10.5); camera.lookAt(0,1.1,0);
  clock=new THREE.Clock();
  // lighting: ambient + key
  scene.add(new THREE.AmbientLight(0xffffff,0.85));
  const key=new THREE.DirectionalLight(0xffffff,0.7); key.position.set(-4,8,6); scene.add(key);
  const rim=new THREE.DirectionalLight(0xe6001f,0.18); rim.position.set(5,3,-4); scene.add(rim);
  buildFloor();
  buildSprites();
  arenaReady=true;
  window.addEventListener('resize',resizeArena);
  animate();
}
function buildFloor(){
  if(!renderer) return;
  // domed checkered floor: a large slightly-curved disc via cone-ish geometry
  const seg=24, rad=13;
  const geo=new THREE.CircleGeometry(rad,seg);
  // gentle dome: push vertices down by radial distance^2
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);const d=Math.sqrt(x*x+y*y);pos.setZ(i,-d*d*0.05);}
  geo.computeVertexNormals();
  // checker texture drawn to a canvas (no external asset)
  const cs=256,cv=document.createElement('canvas');cv.width=cv.height=cs;const cx=cv.getContext('2d');
  const n=8,cell=cs/n;
  for(let a=0;a<n;a++)for(let b=0;b<n;b++){cx.fillStyle=((a+b)%2)?'#141418':'#0a0a0c';cx.fillRect(a*cell,b*cell,cell,cell);}
  const tex=new THREE.CanvasTexture(cv);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(4,4);tex.magFilter=THREE.NearestFilter;
  const mat=new THREE.MeshLambertMaterial({map:tex});
  const floor=new THREE.Mesh(geo,mat);
  floor.rotation.x=-Math.PI/2; floor.position.y=0;
  scene.add(floor);
}
function makeRing(color){
  const g=new THREE.RingGeometry(0.62,0.78,24);
  const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.85,side:THREE.DoubleSide});
  const ring=new THREE.Mesh(g,m); ring.rotation.x=-Math.PI/2; ring.position.y=0.02;
  return ring;
}
function monoTexture(name,colorHex){
  // draw an element-tinted monogram chip as a canvas texture for arena billboards
  const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const cx=cv.getContext('2d');
  const hex='#'+('000000'+colorHex.toString(16)).slice(-6);
  cx.fillStyle='rgba(20,20,24,0.92)';
  // notch chip
  cx.beginPath();const n=18;cx.moveTo(n,4);cx.lineTo(s-4,4);cx.lineTo(s-4,s-n);cx.lineTo(s-n,s-4);cx.lineTo(4,s-4);cx.lineTo(4,n);cx.closePath();cx.fill();
  cx.lineWidth=5;cx.strokeStyle=hex;cx.stroke();
  cx.fillStyle=hex;cx.font='800 68px Inter, system-ui, sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText((name||'?').trim().charAt(0).toUpperCase(),s/2,s/2+4);
  return new THREE.CanvasTexture(cv);
}
function loadBillboard(url,unitId,pos,color,name){
  if(!renderer) return;
  const geo=new THREE.PlaneGeometry(1.7,1.7);
  const mat=new THREE.MeshBasicMaterial({transparent:true,opacity:0,alphaTest:0.35,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geo,mat); mesh.position.copy(pos); mesh.position.y=0.95;
  const ring=makeRing(color); ring.position.set(pos.x,0.02,pos.z);
  scene.add(mesh); scene.add(ring);
  sprites[unitId]={mesh,ring,base:pos.clone(),color};
  spriteMeta[unitId]={phase:Math.random()*Math.PI*2};
  const applyMono=()=>{const t=monoTexture(name,color);t.magFilter=THREE.NearestFilter;mat.map=t;mat.opacity=1;mat.needsUpdate=true;};
  const loader=new THREE.TextureLoader(); loader.crossOrigin='anonymous';
  loader.load(url,tex=>{tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;mat.map=tex;mat.opacity=1;mat.needsUpdate=true;},undefined,applyMono);
}
const ELHEX={fire:0xe6001f,water:0x4aa3ff,plant:0x3fbf6f,electricity:0xe8c33a,wind:0x63d6c0};
function buildSprites(){
  if(!renderer) return;
  // enemies LEFT (x negative), party RIGHT (x positive)
  S.foes.forEach((u,i)=>{const z=(i-1)*2.2; loadBillboard(sprite(u.species),u.id,new THREE.Vector3(-4.4,0,z),ELHEX[u.element]||0xe6001f,u.name);});
  S.party.forEach((u,i)=>{const z=(i-1)*2.2; loadBillboard(sprite(u.species),u.id,new THREE.Vector3(4.4,0,z),ELHEX[u.element]||0xe6001f,u.name);});
}
function resizeArena(){
  if(!renderer) return;
  const canvas=$('#arena');const w=canvas.clientWidth||800,h=canvas.clientHeight||600;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
function animate(){
  if(!renderer) return;
  requestAnimationFrame(animate);
  const t=clock?clock.getElapsedTime():0;
  for(const id in sprites){
    const s=sprites[id];const m=spriteMeta[id];
    if(s.mesh){ s.mesh.position.y=0.95+Math.sin(t*2+m.phase)*0.06; s.mesh.lookAt(camera.position); }
  }
  renderer.render(scene,camera);
}
/* project a unit's world position to screen px for floaters */
function projectUnit(unitId){
  if(!renderer||!sprites[unitId]) return null;
  const s=sprites[unitId];const v=s.mesh.position.clone().project(camera);
  const canvas=$('#arena');const r=canvas.getBoundingClientRect();
  return {x:r.left+(v.x*0.5+0.5)*r.width, y:r.top+(-v.y*0.5+0.5)*r.height};
}
/* mark a sprite dead: fade + drop ring; hit flash on damage */
function setSpriteDead(unitId){const s=sprites[unitId];if(!s)return;if(s.mesh)s.mesh.material.opacity=0.25;if(s.ring)s.ring.material.opacity=0.15;}
function flashSprite(unitId){const s=sprites[unitId];if(!s||!s.mesh)return;const m=s.mesh.material;const o=m.color?null:null;if(s.ring){s.ring.material.opacity=1;setTimeout(()=>{if(s.ring)s.ring.material.opacity=0.85;},160);} }

/* ---------- overlay paints ---------- */
function paintPips(){
  const you=$('#pips-you'),foe=$('#pips-foe');
  you.innerHTML=S.party.map(u=>`<span class="pip ${u.hp<=0?'ko':''}" style="--el:${elVar(u.element)}" title="${u.name}"></span>`).join('');
  foe.innerHTML=S.foes.map(u=>`<span class="pip ${u.hp<=0?'ko':''}" style="--el:${elVar(u.element)}" title="${u.name}"></span>`).join('');
}
function announce(msg){const el=$('#sr-live');if(el)el.textContent=msg;}
function paintStrip(){
  const head=queue[qIdx];
  $('#round-lbl').textContent=`Round ${S.round}`;
  const strip=$('#tstrip');
  if(!head){$('#actor-name').textContent='—';return;}
  const you=head.side==='you';
  $('#actor-name').innerHTML=`${you?'<span class="arrow" aria-hidden="true">▶</span>':''}${head.ref.name}`;
  const tag=$('#turn-tag');tag.textContent=you?'Your Turn':'Enemy Turn';tag.className='tt '+(you?'you':'foe');
  strip.classList.toggle('is-you',you);strip.classList.toggle('is-foe',!you);
  strip.classList.remove('pulse');void strip.offsetWidth;strip.classList.add('pulse');
  strip.setAttribute('aria-label',`Round ${S.round}, ${you?'your turn':'enemy turn'}, ${head.ref.name} acting`);
}
function paintNextQ(){
  // upcoming units from current queue position (this round remainder)
  const up=queue.slice(qIdx).filter(x=>x.ref.hp>0).slice(0,5);
  $('#nextq-items').innerHTML=up.map((x,i)=>`<span class="qi ${x.side} ${i===0?'now':i>=3?'dim':''}" role="listitem"
      aria-label="${i===0?'Now':'Position '+(i+1)}: ${x.ref.name}, ${x.side==='you'?'your team':'enemy'}, ${x.ref.element}">
    ${spriteImg(x.ref.species,x.ref.element)}<span class="en" style="--el:${elVar(x.ref.element)}" aria-hidden="true"></span></span>`).join('');
}
function paintEnemyRail(){
  const rail=$('#enemy-rail');
  const actingId=queue[qIdx]&&queue[qIdx].side==='foe'?queue[qIdx].ref.id:null;
  rail.innerHTML=S.foes.map((u,i)=>{
    const pct=Math.max(0,u.hp/u.hpMax*100),dead=u.hp<=0;
    const wk=Object.keys(WEAK).find(k=>WEAK[k]===u.element);
    // once analysed, show ONE tiny inline weakness marker in the subline — no chip stack
    const wkMark=u.analyzed&&wk?`<span class="wkm" title="Weak to ${wk}">▼ ${wk}</span>`:'';
    return `<button class="erow ${dead?'dead':''} ${u.id===actingId?'acting':''}" data-foe="${i}" ${dead?'disabled':''} style="--el:${elVar(u.element)}"
        aria-label="${u.name}, ${u.element}, level ${u.level}, ${Math.max(0,u.hp)} of ${u.hpMax} HP${u.analyzed&&wk?', weak to '+wk:''}${dead?', knocked out':''}">
      <span class="edot" aria-hidden="true"></span>
      <span class="enm">${u.name}<span class="esub">${u.element} · Lv ${u.level}${wkMark}</span></span>
      <span class="ehp" data-ehpn="${i}">${Math.max(0,u.hp)}/${u.hpMax}</span>
      <span class="ehpbar" role="progressbar" aria-valuemin="0" aria-valuemax="${u.hpMax}" aria-valuenow="${Math.max(0,u.hp)}"><i data-ehp="${i}" style="width:${pct}%"></i></span>
    </button>`;
  }).join('');
}
function paintPartyCards(){
  const head=queue[qIdx];const activeId=head&&head.side==='you'?head.ref.id:null;
  $('#party-cards').innerHTML=S.party.map(u=>{
    const hp=Math.max(0,u.hp/u.hpMax*100),en=Math.max(0,u.en/u.enMax*100),dead=u.hp<=0;
    return `<div class="pcard ${activeId===u.id?'active':''} ${dead?'dead':''}" data-pcard="${u.id}" style="--el:${elVar(u.element)}">
      <div class="ph">
        <span class="pspr">${spriteImg(u.species,u.element)}</span>
        <span class="pn"><span class="nm">${u.name}</span><span class="lv">Lv ${u.level}</span></span>
        ${u.guarding?'<span class="guard-ic">Guard</span>':''}
      </div>
      <div class="stat"><span class="sk">HP</span><span class="bar hp" role="progressbar" aria-label="${u.name} HP" aria-valuemin="0" aria-valuemax="${u.hpMax}" aria-valuenow="${Math.max(0,u.hp)}" data-hpbar="${u.id}"><i data-hp="${u.id}" style="width:${hp}%"></i></span><span class="sn" data-hpn="${u.id}">${Math.max(0,u.hp)} / ${u.hpMax}</span></div>
      <div class="stat"><span class="sk">EN</span><span class="bar en"><i data-en="${u.id}" style="width:${en}%"></i></span><span class="sn en-n" data-enn="${u.id}">${u.en}/${u.enMax}</span></div>
    </div>`;
  }).join('');
}
function refreshBars(){
  S.party.forEach(u=>{
    const hp=$(`[data-hp="${u.id}"]`);if(hp)hp.style.width=Math.max(0,u.hp/u.hpMax*100)+'%';
    const hpn=$(`[data-hpn="${u.id}"]`);if(hpn)hpn.textContent=`${Math.max(0,u.hp)} / ${u.hpMax}`;
    const hpbar=$(`[data-hpbar="${u.id}"]`);if(hpbar)hpbar.setAttribute('aria-valuenow',Math.max(0,u.hp));
    const en=$(`[data-en="${u.id}"]`);if(en)en.style.width=Math.max(0,u.en/u.enMax*100)+'%';
    const enn=$(`[data-enn="${u.id}"]`);if(enn)enn.textContent=`${u.en}/${u.enMax}`;
  });
  S.foes.forEach((u,i)=>{
    const hp=$(`[data-ehp="${i}"]`);if(hp)hp.style.width=Math.max(0,u.hp/u.hpMax*100)+'%';
    const hpn=$(`[data-ehpn="${i}"]`);if(hpn)hpn.textContent=`${Math.max(0,u.hp)}/${u.hpMax}`;
    const bar=hp&&hp.parentElement;if(bar&&bar.getAttribute('role')==='progressbar')bar.setAttribute('aria-valuenow',Math.max(0,u.hp));
  });
}
function paintAll(){paintPips();paintStrip();paintNextQ();paintEnemyRail();paintPartyCards();}

/* ---------- feed + floaters ---------- */
function log(cls,text,cue){
  const body=$('#feedbody');if(!body)return;
  const el=document.createElement('div');el.className='lg '+(cls||'');
  el.innerHTML=`<span class="stripe"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${IC[cue]||IC.dot}</svg><span class="ltx">${text}</span>`;
  body.appendChild(el);body.scrollTop=body.scrollHeight;
}
function floater(foeId,txt,kind){
  const p=projectUnit(foeId);
  const f=document.createElement('span');f.className='floater '+(kind||'');f.textContent=txt;
  if(p){f.style.left=p.x+'px';f.style.top=p.y+'px';document.body.appendChild(f);}
  else{const row=$(`[data-foe]`);f.style.left='50%';f.style.top='40%';($('.stage')||document.body).appendChild(f);}
  setTimeout(()=>f.remove(),1000);
}

/* ---------- command menu ---------- */
function setHelp(txt,muted){const h=$('#help-tx');h.textContent=txt;$('#chelp').classList.toggle('muted',!!muted);}
function svg(p){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${p}</svg>`;}
function renderMenu(){
  const rows=$('#rows');clampHi();const it=menu.items;
  $('#menu-sect').textContent=menu.mode==='skills'?'Skills':menu.mode==='target'?'Target':menu.mode==='item'?'Items':'Command';
  $('#menu-cnt').textContent=it.length?`${menu.hi+1}/${it.length}`:'';
  rows.innerHTML=it.map((row,i)=>{
    if(row.type==='back')return `<button class="mrow back ${i===menu.hi?'sel':''}" data-mi="${i}"><span class="cur"><svg viewBox="0 0 24 24" fill="currentColor">${IC.cursor}</svg></span><span class="mnm">‹ Back</span></button>`;
    if(row.type==='restart')return `<button class="mrow ${i===menu.hi?'sel':''}" data-mi="${i}"><span class="cur"><svg viewBox="0 0 24 24" fill="currentColor">${IC.cursor}</svg></span><span class="mnm">Return to encounter</span></button>`;
    const el=row.element?`style="--el:${elVar(row.element)}"`:'';
    const tag=row.tag?`<span class="mtag">${row.tag}</span>`:`<span></span>`;
    const en=row.en!=null?`<span class="men ${row.disabled?'short':''}">${row.en} EN</span>`:`<span></span>`;
    return `<button class="mrow ${i===menu.hi?'sel':''} ${row.disabled?'disabled':''}" data-mi="${i}" ${row.disabled?'disabled':''} ${el}>
      <span class="cur"><svg viewBox="0 0 24 24" fill="currentColor">${IC.cursor}</svg></span>
      <span class="mnm">${row.label}</span>${tag}${en}</button>`;
  }).join('');
  const cur=it[menu.hi];
  if(cur)setHelp(cur.help||(cur.type==='back'?'Return to the command menu.':cur.label),false);
  document.querySelectorAll('.erow').forEach(b=>b.classList.remove('aim'));
  if(menu.mode==='target'&&cur&&cur.foeIdx!=null){const b=$(`[data-foe="${cur.foeIdx}"]`);if(b)b.classList.add('aim');}
}
function rootMenu(actor){
  menu.mode='root';menu.hi=0;menu.chosenSkill=null;menu.pendingKind=null;
  menu.items=[
    {type:'cmd',cmd:'fight',label:'Fight',help:'Attack one enemy with a basic strike.'},
    {type:'cmd',cmd:'skills',label:'Skills',help:'Unleash an EN-costing skill.'},
    {type:'cmd',cmd:'analyse',label:'Analyse',help:'Reveal an enemy\u2019s elemental weakness.'},
    {type:'cmd',cmd:'item',label:'Item',help:'Use a battle item.'},
    {type:'cmd',cmd:'guard',label:'Guard',help:'Brace — halve damage until your next turn.'},
    {type:'cmd',cmd:'flee',label:'Flee',help:'Attempt to escape the battle.'},
  ];
  renderMenu();
}
function skillsMenu(actor){
  menu.mode='skills';menu.hi=0;
  menu.items=actor.skills.map((s,i)=>({type:'skill',idx:i,label:s.name,element:s.element,tag:s.element,en:s.en,disabled:s.en>actor.en,
    help:s.en>actor.en?`Not enough EN (needs ${s.en}). ${s.desc}`:s.desc}));
  menu.items.push({type:'back'});renderMenu();
}
function itemMenu(actor){
  menu.mode='item';menu.hi=0;
  menu.items=[
    {type:'item',item:'medkit',label:'Med Chip',tag:'heal',help:'Restore 1200 HP to the acting Digimon.'},
    {type:'item',item:'battery',label:'Energy Cell',tag:'en',help:'Restore 40 EN to the acting Digimon.'},
    {type:'back'},
  ];renderMenu();
}
function targetMenu(kind){
  menu.mode='target';menu.hi=0;menu.pendingKind=kind;
  const living=S.foes.map((u,i)=>({u,i})).filter(x=>x.u.hp>0);
  menu.items=living.map(x=>{
    const wk=x.u.analyzed?Object.keys(WEAK).find(k=>WEAK[k]===x.u.element):null;
    return {type:'foe',foeIdx:x.i,label:`${x.u.name} · Lv ${x.u.level}`,element:x.u.element,tag:x.u.element,
      help:`${x.u.name} — ${Math.max(0,x.u.hp)}/${x.u.hpMax} HP${wk?`, weak to ${wk}`:''}. ${kind==='analyse'?'Analyse this target.':'Strike this target.'}`};
  });
  menu.items.push({type:'back'});renderMenu();
}

/* ---------- turn flow ---------- */
function promptTurn(){
  if(over)return;
  const head=queue[qIdx];
  if(!head){endRound();return;}
  if(head.ref.hp<=0){advanceToNextPlayerOrFoe();return;}
  paintPartyCards();paintStrip();paintNextQ();
  if(head.side==='foe'){
    menu.items=[];$('#menu-sect').textContent='Enemy';$('#menu-cnt').textContent='';
    $('#rows').innerHTML=`<div class="mrow" style="cursor:default"><span class="cur"></span><span class="mnm">${head.ref.name} is acting…</span></div>`;
    setHelp(`${head.ref.name} is choosing an action…`,true);
    setTimeout(foeTurn,autoOn?360:720);return;
  }
  rootMenu(head.ref);
  if(autoOn)setTimeout(autoPlay,300);
}
function autoPlay(){
  if(over||autoOn===false)return;const head=queue[qIdx];if(!head||head.side!=='you')return;
  const actor=head.ref;const living=S.foes.map((u,i)=>({u,i})).filter(x=>x.u.hp>0);
  if(!living.length)return;
  const tgt=living.sort((a,b)=>a.u.hp-b.u.hp)[0];
  const sk=actor.skills.filter(s=>s.en<=actor.en).sort((a,b)=>b.pow-a.pow)[0];
  resolveAttack(actor,tgt.i,sk||null);
}

function activateRow(){
  const cur=menu.items[menu.hi];if(!cur)return;
  if(cur.type==='restart'){restart();return;}
  const actor=queue[qIdx].ref;
  if(cur.type==='back'){rootMenu(actor);return;}
  if(cur.type==='cmd'){
    if(cur.cmd==='fight'){menu.chosenSkill=null;targetMenu('attack');}
    else if(cur.cmd==='skills'){skillsMenu(actor);}
    else if(cur.cmd==='analyse'){menu.chosenSkill=null;targetMenu('analyse');}
    else if(cur.cmd==='item'){itemMenu(actor);}
    else if(cur.cmd==='guard'){actor.guarding=true;log('guard',`<b>${actor.name}</b> takes a defensive stance`,'guard');consumeAction();}
    else if(cur.cmd==='flee'){leave();}
    return;
  }
  if(cur.type==='skill'){if(cur.disabled)return;menu.chosenSkill=actor.skills[cur.idx];targetMenu('attack');return;}
  if(cur.type==='item'){useItem(actor,cur.item);return;}
  if(cur.type==='foe'){if(menu.pendingKind==='analyse')resolveAnalyse(actor,cur.foeIdx);else resolveAttack(actor,cur.foeIdx,menu.chosenSkill);}
}
function useItem(actor,item){
  if(item==='medkit'){actor.hp=Math.min(actor.hpMax,actor.hp+1200);log('guard',`<b>${actor.name}</b> used a Med Chip — +1200 HP`,'item');}
  else{actor.en=Math.min(actor.enMax,actor.en+40);log('guard',`<b>${actor.name}</b> used an Energy Cell — +40 EN`,'item');}
  refreshBars();consumeAction();
}

/* ---------- resolve ---------- */
function resolveAttack(actor,foeIdx,skill){
  const foe=S.foes[foeIdx];if(!foe||foe.hp<=0)return;
  if(skill)actor.en=Math.max(0,actor.en-skill.en);
  const pow=skill?skill.pow:36,el=skill?skill.element:actor.element;
  if(Math.random()<CFG.missChance){floater(foe.id,'Miss','miss');log('miss',`<b>${actor.name}</b> attacked ${foe.name} — <b>missed</b>`,'dot');afterPlayer(false);return;}
  const {m:em,kind}=elementMult(el,foe.element),am=attrMult(actor.attribute,foe.attribute);
  const crit=Math.random()<CFG.critChance,guardM=foe.guarding?CFG.guardMult:1;
  let dmg=Math.max(1,Math.round(actor.atk*(pow/50)*em*am*(crit?CFG.critMult:1)*guardM));
  foe.hp=Math.max(0,foe.hp-dmg);flashSprite(foe.id);
  let fk='',cue='dot',tag='',lcls='';
  if(crit){fk='crit';cue='skill';tag='<span class="tag">Crit</span>';lcls='crit';}
  if(kind==='weak'){fk=fk||'weak';cue='skill';tag='<span class="tag">Weak!</span>';lcls='weak';}
  else if(kind==='resist'){fk=fk||'resist';tag='<span class="tag">Resist</span>';lcls='resist';}
  floater(foe.id,(crit?'CRIT ':'')+dmg,fk||(crit?'crit':''));
  log(lcls,`<b>${actor.name}</b> hit ${foe.name} with ${skill?`<b>${skill.name}</b>`:'a strike'} — <b>${dmg}</b>${tag}`,cue);
  refreshBars();
  if(foe.hp<=0){log('ko',`${foe.name} was knocked out`,'ko');setSpriteDead(foe.id);}
  const bonus=(kind==='weak'||crit);
  setTimeout(()=>{paintEnemyRail();paintPips();afterPlayer(bonus);},autoOn?260:420);
}
function resolveAnalyse(actor,foeIdx){
  const foe=S.foes[foeIdx];if(!foe)return;foe.analyzed=true;
  const wk=Object.keys(WEAK).find(k=>WEAK[k]===foe.element);
  log('',`<b>${actor.name}</b> analysed ${foe.name} — weak to <b>${wk||'—'}</b>`,'analyse');
  paintEnemyRail();afterPlayer(false);
}
function afterPlayer(bonus){
  document.querySelectorAll('.erow').forEach(b=>b.classList.remove('aim'));
  if(checkEnd())return;
  if(!bonus)S.actions--;else log('round','Press-turn — bonus action retained','round');
  if(S.actions<=0){startFoePhase();return;}
  advanceToNextPlayerOrFoe();
}
function consumeAction(){if(checkEnd())return;S.actions--;if(S.actions<=0){startFoePhase();return;}advanceToNextPlayerOrFoe();}
function advanceToNextPlayerOrFoe(){
  qIdx++;
  while(qIdx<queue.length&&(queue[qIdx].ref.hp<=0||queue[qIdx].side!=='you'))qIdx++;
  if(qIdx>=queue.length){qIdx=queue.findIndex(q=>q.side==='you'&&q.ref.hp>0);if(qIdx<0){startFoePhase();return;}}
  promptTurn();
}
function startFoePhase(){qIdx=queue.findIndex(q=>q.side==='foe'&&q.ref.hp>0);if(qIdx<0){endRound();return;}promptTurn();}
function foeTurn(){
  if(over)return;
  const foe=queue[qIdx].ref;const targets=alive(S.party);
  if(!targets.length){endRound();return;}
  const tgt=targets.slice().sort((a,b)=>a.hp/a.hpMax-b.hp/b.hpMax)[0];
  if(Math.random()<0.10){foe.guarding=true;log('guard',`<b>${foe.name}</b> braces (Guard)`,'guard');nextFoe();return;}
  if(Math.random()<CFG.missChance){log('miss',`<b>${foe.name}</b> lunged at ${tgt.name} — <b>missed</b>`,'dot');nextFoe();return;}
  const {m:em,kind}=elementMult(foe.element,tgt.element),am=attrMult(foe.attribute,tgt.attribute);
  const crit=Math.random()<CFG.critChance,guardM=tgt.guarding?CFG.guardMult:1;
  let dmg=Math.max(1,Math.round(foe.atk*(38/50)*em*am*(crit?CFG.critMult:1)*guardM));
  tgt.hp=Math.max(0,tgt.hp-dmg);flashSprite(tgt.id);
  let tag='',lcls='';
  if(crit){tag='<span class="tag">Crit</span>';lcls='crit';}
  if(kind==='weak'){tag='<span class="tag">Weak!</span>';lcls='weak';}
  else if(kind==='resist'){tag='<span class="tag">Resist</span>';lcls='resist';}
  log(lcls,`<b>${foe.name}</b> struck ${tgt.name} — <b>${dmg}</b>${tag}`,'skill');
  refreshBars();
  if(tgt.hp<=0){log('ko',`${tgt.name} was knocked out`,'ko');setSpriteDead(tgt.id);}
  setTimeout(()=>{paintPartyCards();paintPips();nextFoe();},autoOn?260:420);
}
function nextFoe(){
  if(checkEnd())return;
  qIdx++;
  while(qIdx<queue.length&&(queue[qIdx].ref.hp<=0||queue[qIdx].side!=='foe'))qIdx++;
  if(qIdx<queue.length&&queue[qIdx].side==='foe'){promptTurn();return;}
  endRound();
}
function endRound(){
  if(checkEnd())return;
  S.round++;S.actions=alive(S.party).length;
  S.party.forEach(u=>{if(u.hp>0)u.en=Math.min(u.enMax,u.en+CFG.enRegen);u.guarding=false;});
  S.foes.forEach(u=>{u.guarding=false;});
  log('round',`Round ${S.round} — EN restored`,'round');
  buildQueue(false);refreshBars();
  qIdx=queue.findIndex(q=>q.side==='you'&&q.ref.hp>0);
  if(qIdx<0){startFoePhase();return;}
  promptTurn();
}
function checkEnd(){
  if(over)return true;
  if(alive(S.foes).length===0){finish(true);return true;}
  if(alive(S.party).length===0){finish(false);return true;}
  return false;
}

/* ---------- end card ---------- */
function finish(win){
  over=true;
  const card=$('#endcard');card.className='endcard '+(win?'win':'loss');
  $('#end-title').textContent=win?'Victory':'Defeat';
  const aliveP=alive(S.party).length,aliveF=alive(S.foes).length;
  $('#end-sub').textContent=win
    ?`You cleared the wild pack in ${S.round} round${S.round>1?'s':''} with ${aliveP}/3 Digimon standing. Rewards banked to your roster.`
    :`The pack overwhelmed your team after ${S.round} round${S.round>1?'s':''}. Regroup, heal at the Nursery, and try again.`;
  const credits=win?120+S.round*15:0,xp=win?Math.round(90+(3-aliveF)*40):20;
  $('#end-stats').innerHTML=`
    <div class="m"><span class="k">Rounds</span><span class="v">${S.round}</span></div>
    <div class="m"><span class="k">${win?'Credits':'Salvage'}</span><span class="v">${credits}</span></div>
    <div class="m"><span class="k">Party XP</span><span class="v">+${xp}</span></div>`;
  setHelp(win?'Victory — the pack is cleared.':'Your team was wiped out.',true);
  $('#scrim').classList.add('show');
  setTimeout(()=>$('#end-again').focus(),40);
}
function closeEnd(){$('#scrim').classList.remove('show');}
function restart(){closeEnd();$('#feedbody').innerHTML='';deepInit();
  // reset arena sprite visuals
  for(const id in sprites){const s=sprites[id];if(s.mesh&&s.mesh.material.map)s.mesh.material.opacity=1;if(s.ring)s.ring.material.opacity=0.85;}
  paintAll();promptTurn();}
function leave(){closeEnd();over=true;menu.mode='root';menu.items=[{type:'restart'}];menu.hi=0;$('#menu-sect').textContent='Battle';$('#menu-cnt').textContent='';renderMenu();setHelp('You fled the battle. Confirm to return to the encounter.',true);}

/* ---------- input ---------- */
function playerActable(){return !over && queue[qIdx] && queue[qIdx].side==='you' && menu.items.length>0;}
document.addEventListener('click',e=>{
  const foeBtn=e.target.closest('.erow.pick');
  if(foeBtn&&menu.mode==='target'){const fi=parseInt(foeBtn.dataset.foe,10);const idx=menu.items.findIndex(r=>r.foeIdx===fi);if(idx>=0){menu.hi=idx;activateRow();}return;}
  const row=e.target.closest('.mrow[data-mi]');
  if(row&&!over){const i=parseInt(row.dataset.mi,10);const it=menu.items[i];if(it&&it.type==='restart'){restart();return;}if(it&&!it.disabled){menu.hi=i;renderMenu();activateRow();}return;}
  if(row&&over){const it=menu.items[parseInt(row.dataset.mi,10)];if(it&&it.type==='restart')restart();return;}
  if(e.target.closest('#end-again')){restart();return;}
  if(e.target.closest('#end-flee')){closeEnd();leave();return;}
  if(e.target.closest('#auto-toggle')){toggleAuto();return;}
});
function toggleAuto(){
  autoOn=!autoOn;const b=$('#auto-toggle');
  b.classList.toggle('on',autoOn);b.setAttribute('aria-pressed',autoOn?'true':'false');
  b.innerHTML=`<span class="dot"></span>Auto: ${autoOn?'On':'Off'}`;
  if(autoOn&&playerActable())setTimeout(autoPlay,200);
}
/* enemy rail becomes pickable only during target mode */
function setTargetPickable(on){document.querySelectorAll('.erow').forEach(b=>{if(b.disabled)return;b.classList.toggle('pick',on);});}
document.addEventListener('keydown',e=>{
  if($('#scrim').classList.contains('show')){if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();restart();}return;}
  if(e.key==='a'||e.key==='A'){toggleAuto();return;}
  if(over){if(e.key==='Enter'||e.key===' '){e.preventDefault();restart();}return;}
  if(!playerActable())return;
  if(e.key==='ArrowDown'){e.preventDefault();menu.hi=(menu.hi+1)%menu.items.length;renderMenu();setTargetPickable(menu.mode==='target');}
  else if(e.key==='ArrowUp'){e.preventDefault();menu.hi=(menu.hi-1+menu.items.length)%menu.items.length;renderMenu();setTargetPickable(menu.mode==='target');}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();activateRow();}
  else if(e.key==='Escape'){e.preventDefault();if(menu.mode==='root')leave();else rootMenu(queue[qIdx].ref);}
});
/* keep enemy-rail pickable in sync when entering target mode via renderMenu */
const _origTargetMenu=targetMenu;
targetMenu=function(kind){_origTargetMenu(kind);setTargetPickable(true);};
const _origRootMenu=rootMenu;
rootMenu=function(a){_origRootMenu(a);setTargetPickable(false);};

/* ---------- boot ---------- */
deepInit();
initArena();
paintAll();
promptTurn();
</script>
</body>
