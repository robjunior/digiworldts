    .cb-unit .u-hp b { color: var(--ink); }
    .cb-unit .u-en { height: 3px; background: var(--hairline); margin-top: 4px; overflow: hidden; }
    .cb-unit .u-en i { display: block; height: 100%; background: var(--energy); transform-origin: left; transition: transform .4s ease; }

    .cb-cmd {
      position: absolute; right: 12px; bottom: 12px; width: 300px;
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--hairline); padding: 10px;
      clip-path: polygon(var(--notch) 0, 100% 0, 100% calc(100% - var(--notch)),
        calc(100% - var(--notch)) 100%, 0 100%, 0 var(--notch));
    }
    .cb-cmd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cb-cmd-grid .btn { padding: 9px 10px; font-size: 12px; justify-content: center; }
    .cb-hint {
      min-height: 14px; margin-top: 8px; font-size: 10px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .cb-sub-panel {
      position: absolute; right: 12px; bottom: 12px; width: 340px;
      max-height: 300px; display: none; flex-direction: column;
      background: color-mix(in oklab, var(--bg) 95%, transparent);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--hairline);
      clip-path: polygon(var(--notch) 0, 100% 0, 100% calc(100% - var(--notch)),
        calc(100% - var(--notch)) 100%, 0 100%, 0 var(--notch));
    }
    .cb-sub-panel.is-open { display: flex; }
    .cb-sub-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 12px; border-bottom: 1px solid var(--hairline);
    }
    .cb-sub-head .h { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .cb-sub-head .x { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; line-height: 1; padding: 0 4px; }
    .cb-sub-head .x:hover { color: var(--ink); }
    .cb-sub-body { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .cb-skill {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      width: 100%; text-align: left; background: var(--panel);
      border: 1px solid var(--hairline); padding: 8px 10px; cursor: pointer;
      font-family: inherit; color: var(--ink);
      clip-path: polygon(var(--notch-xs) 0, 100% 0, 100% calc(100% - var(--notch-xs)),
        calc(100% - var(--notch-xs)) 100%, 0 100%, 0 var(--notch-xs));
      transition: border-color .15s;
    }
     .cb-skill:hover:not(:disabled) { border-color: var(--signal); }
     .cb-skill:disabled { opacity: .45; cursor: not-allowed; }
     /* Keyboard focus: the shared .btn focus ring is a drop-shadow filter,
        which the notch clip-path CROPS — leaving no visible indicator on the
        notched combat buttons. Override with a real outline (outlines are not
        clipped by clip-path) so keyboard focus is clearly visible per WCAG
        2.4.7 / 2.4.13 (>=2px, >=3:1). Skill buttons had no focus state at all. */
     .cb-cmd .btn:focus-visible,
     .cb-skill:focus-visible {
       outline: 2px solid var(--signal);
       outline-offset: 2px;
       filter: none;
     }
    .cb-skill .sk-name { font-size: 12px; font-weight: 600; }
    .cb-skill .sk-desc { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .cb-skill .sk-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .cb-skill .sk-cost { font-size: 11px; font-weight: 700; color: var(--energy); font-variant-numeric: tabular-nums; }
    .cb-skill .sk-aff {
      font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: 1px 5px; color: var(--bg);
    }
    .cb-skill .sk-aff.weak { background: var(--gold); color: var(--ink); }
    .cb-skill .sk-aff.resist { background: var(--muted); }
    .cb-skill .sk-el { width: 7px; height: 7px; display: inline-block; margin-right: 5px; vertical-align: middle; }

    .cb-log {
      position: absolute; right: 12px; top: 64px; width: 260px; max-height: 46%;
      display: flex; flex-direction: column;
      background: color-mix(in oklab, var(--bg) 84%, transparent);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--hairline);
      clip-path: polygon(var(--notch-sm) 0, 100% 0, 100% calc(100% - var(--notch-sm)),
        calc(100% - var(--notch-sm)) 100%, 0 100%, 0 var(--notch-sm));
    }
    .cb-log-head { padding: 7px 11px; border-bottom: 1px solid var(--hairline);
      font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .cb-log-body { overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
    .log-line {
      display: grid; grid-template-columns: 3px auto 1fr; gap: 7px; align-items: start;
      padding: 5px 7px; font-size: 11px; animation: logIn .3s var(--ease, ease) both;
    }
    .log-line .stripe { width: 3px; align-self: stretch; background: var(--muted); }
    .log-line .ico { width: 14px; height: 14px; color: var(--muted); }
    .log-line .txt { line-height: 1.3; }
    .log-line .rd { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 3px; }
    .log-line.crit { background: color-mix(in oklab, var(--gold) 8%, transparent); }
    .log-line.crit .stripe, .log-line.weak .stripe { background: var(--gold); }
    .log-line.crit .ico, .log-line.weak .ico { color: var(--gold); }
    .log-line.ko { background: color-mix(in oklab, var(--battle) 8%, transparent); }
    .log-line.ko .stripe { background: var(--battle); }
    .log-line.ko .ico { color: var(--battle); }
    .log-line.round { background: color-mix(in oklab, var(--signal) 6%, transparent); }
    .log-line.round .stripe, .log-line.guard .stripe { background: var(--signal); }
    .log-line.round .ico, .log-line.guard .ico { color: var(--signal); }
    @keyframes logIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }

    .cb-float {
      position: absolute; pointer-events: none; z-index: 30;
      font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
      color: var(--ink); text-shadow: 0 1px 0 var(--bg), 0 0 6px var(--bg);
      animation: floatUp .9s ease-out forwards;
    }
    .cb-float.crit { color: var(--gold); font-size: 28px; }
    .cb-float.resist { color: var(--muted); font-size: 18px; }
    .cb-float.miss { color: var(--muted); font-size: 16px; }
    @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%,0) scale(.8); }
      15% { opacity: 1; transform: translate(-50%,-8px) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%,-44px) scale(1); } }

    .cb-flash {
      position: absolute; inset: 0; pointer-events: none; z-index: 25;
      background: var(--gold); opacity: 0; mix-blend-mode: screen;
    }
    .cb-flash.fire { animation: flash .35s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 20% { opacity: .18; } 100% { opacity: 0; } }

    .cb-end {
      position: absolute; inset: 0; z-index: 40; display: none;
      place-items: center; background: color-mix(in oklab, var(--bg) 70%, transparent);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .cb-end.is-open { display: grid; }
    .cb-end-card {
      width: 360px; background: var(--bg); border: 1px solid var(--hairline);
      padding: 24px; text-align: center;
      clip-path: polygon(var(--notch) 0, 100% 0, 100% calc(100% - var(--notch)),
        calc(100% - var(--notch)) 100%, 0 100%, 0 var(--notch));
    }
    .cb-end-card .r { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .cb-end-card h2 { font-size: 26px; margin: 8px 0 16px; }
    .cb-end-card .btn { width: 100%; justify-content: center; }

    @media (prefers-reduced-motion: reduce) {
      .cb-unit .u-bar i, .cb-unit .u-en i { transition: none; }
      .log-line { animation: none; }
      .cb-float { animation-duration: .01ms; }
      .cb-flash.fire { animation: none; }
    }
    @media (max-width: 900px) {
      .cb-log { display: none; }
      .cb-party { width: 170px; }
      .cb-cmd, .cb-sub-panel { width: 260px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Primary"></nav>
    <main class="app-main" data-od-id="combat-main">
      <div class="page-strip" id="page-strip" role="status" data-od-id="page-strip">
        <span class="ps-name">Battle</span>
        <span class="ps-body" id="ps-body"></span>
        <span class="ps-actions"><span class="mono muted" style="font-size:10px;">3v3</span></span>
      </div>

      <section class="cb-stage" id="cb-stage" data-od-id="battle-arena" aria-label="Battle arena">
        <canvas id="cb-canvas" aria-hidden="true"></canvas>

        <div class="cb-turn is-your" id="cb-turn" role="status">
          <span class="rnd">Round <b id="cb-round">1</b></span>
          <span class="who" id="cb-who">Your turn</span>
          <span class="actor" id="cb-actor">Agumon</span>
        </div>

        <div class="cb-ov cb-ov--tl" data-od-id="side-you">
          <div class="cb-ov-eyebrow">Your team</div>
          <div class="cb-side" id="cb-pips-you"></div>
          <div class="cb-sub" id="cb-sub-you"></div>
        </div>
        <div class="cb-ov cb-ov--tr" data-od-id="side-opp">
          <div class="cb-ov-eyebrow" id="cb-opp-name">vs Ryo</div>
          <div class="cb-side cb-side--tr" id="cb-pips-opp"></div>
          <div class="cb-sub" id="cb-sub-opp"></div>
        </div>

        <div class="cb-party" id="cb-party" role="list" aria-label="Your party status"></div>

        <aside class="cb-log" data-od-id="turn-log" aria-label="Turn log">
          <div class="cb-log-head">Battle feed</div>
          <div class="cb-log-body" id="cb-log-body"></div>
        </aside>

        <div class="cb-cmd" id="cb-cmd" data-od-id="command-menu">
          <div class="cb-cmd-grid">
            <button class="btn" data-cmd="fight" data-od-id="cmd-fight">Fight</button>
            <button class="btn btn--secondary" data-cmd="skills" data-od-id="cmd-skills">Skills</button>
            <button class="btn btn--secondary" data-cmd="items" data-od-id="cmd-items">Items</button>
            <button class="btn btn--tertiary" data-cmd="analyse" data-od-id="cmd-analyse">Analyse</button>
            <button class="btn btn--secondary" data-cmd="guard" data-od-id="cmd-guard">Guard</button>
            <button class="btn btn--secondary" data-cmd="flee" data-od-id="cmd-flee">Flee</button>
          </div>
          <div class="cb-hint" id="cb-hint">Choose an action.</div>
        </div>

        <div class="cb-sub-panel" id="cb-sub-panel">
          <div class="cb-sub-head">
            <span class="h" id="cb-sub-title">Skills</span>
            <button class="x" id="cb-sub-close" aria-label="Close">×</button>
          </div>
          <div class="cb-sub-body" id="cb-sub-body"></div>
        </div>

        <div class="cb-flash" id="cb-flash" aria-hidden="true"></div>
        <div class="cb-end" id="cb-end" role="dialog" aria-modal="true" aria-labelledby="cb-end-h">
          <div class="cb-end-card">
            <div class="r" id="cb-end-r">Result</div>
            <h2 id="cb-end-h">Victory</h2>
            <button class="btn" id="cb-restart">New encounter</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Three.js as a classic global (UMD) — importmap + bare-module import
       does not resolve inside the sandboxed preview iframe, which left the
       arena blank. Load the global build first; the module below reads
       window.THREE and guards on it.
       PIN r149: r150+ deprecated the UMD build and r160 removed it entirely —
       three@0.160 build/three.min.js is a deprecation stub that only warns and
       never defines window.THREE, so the arena stayed blank. r0.149.0 is the
       last release whose build/three.min.js ships the real UMD wrapper that
       assigns globalThis.THREE. Do NOT bump this to 0.150+. -->
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>

  <script type="module">
    import { renderNav, toast } from './assets/js/nav.js';
    import { mock, fmt, affinity } from './assets/js/mock.js';
    const THREE = window.THREE;

    renderNav(document.getElementById('app-nav'), 'combat');

    const EL_HEX = { fire:'#e0384a', water:'#1677ff', nature:'#2f9e57', electric:'#c8a24a', neutral:'#6b7280' };
    const elHex = (el) => EL_HEX[el] || EL_HEX.neutral;

    const SNAP = JSON.stringify({ party: mock.combat.friendly, enemies: mock.combat.enemy, round: mock.combat.round });
    let state;
    function resetState() {
      const s = JSON.parse(SNAP);
      state = {
        round: s.round,
        party: s.party.map(u => ({ ...u, guard:false, atk: u.atk ?? 90, down: u.hp<=0 })),
        enemies: s.enemies.map(u => ({ ...u, guard:false, atk: u.atk ?? 90, down: u.down || u.hp<=0 })),
        actorIdx: 0, yourTurn: true, over: false,
        oppName: (s.enemies[0] && s.enemies[0].opponent) || 'Rival',
      };
    }
    resetState();

    /* ---- THREE.JS low-iso arena ---- */
    const canvas = document.getElementById('cb-canvas');
    const stageEl = document.getElementById('cb-stage');
    let renderer;
    try {
      if (!THREE) throw new Error('three-unavailable');
      renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    } catch (err) {
      // WebGL unavailable (sandboxed iframe / no GPU) — degrade to a labelled
      // placeholder so the arena never renders as a silent blank surface.
      canvas.setAttribute('aria-hidden', 'false');
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', 'Battle arena (3D unavailable in this view)');
      const note = document.createElement('div');
      note.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;';
      note.textContent = '3D arena unavailable — combat still playable';
      stageEl.appendChild(note);
    }
    renderer && renderer.setClearColor(0x000000, 0);

    const sprites = [];
    let scene = null, camera = null, clock = null;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function makePlaceholderTexture(hex, facing) {
      const c = document.createElement('canvas'); c.width = 32; c.height = 40;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
      g.fillStyle = hex;
      g.fillRect(8, 14, 16, 20);
      g.fillRect(10, 4, 12, 12);
      g.fillRect(9, 34, 5, 4); g.fillRect(18, 34, 5, 4);
      g.fillStyle = '#ffffff';
      const ex = facing === 'right' ? 17 : 12;
      g.fillRect(ex, 8, 3, 3);
      const tex = new THREE.CanvasTexture(c);
      tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    /* Ground shadow — a soft radial-gradient disc laid flat under the feet.
       Anchored to the sprite's base position; opacity/scale react to the
       idle bob and jump so it reads as cast light, not a decal. */
    function makeShadowTexture() {
      const c = document.createElement('canvas'); c.width = 64; c.height = 64;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(32, 32, 2, 32, 32, 30);
      grd.addColorStop(0, 'rgba(10,14,22,0.55)');
      grd.addColorStop(0.6, 'rgba(10,14,22,0.28)');
      grd.addColorStop(1, 'rgba(10,14,22,0)');
      g.fillStyle = grd; g.beginPath(); g.arc(32, 32, 30, 0, Math.PI*2); g.fill();
      const tex = new THREE.CanvasTexture(c);
      return tex;
    }
    const SHADOW_TEX = () => (buildSprite._shadow || (buildSprite._shadow = makeShadowTexture()));

    /* Octopath-style formation:
         enemies  → LEFT  side (negative X), facing RIGHT  (toward party)
         party    → RIGHT side (positive X), facing LEFT   (toward enemies)
       Sides split along X; each side's 3 units fan slightly in Z + depth so
       they don't overlap, matching the reference's staggered rows. */
    function buildSprite(unit, side, idx) {
      const isYou = side === 'you';
      const facing = isYou ? 'left' : 'right';
      const tex = makePlaceholderTexture(elHex(unit.element), facing);
      // Lambert so the key light + ambient actually shade the billboard.
      const mat = new THREE.MeshLambertMaterial({ map:tex, transparent:true, alphaTest:0.5, side:THREE.DoubleSide, emissive:0x0a0e16, emissiveIntensity:0.35 });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.25), mat);
      const sign = isYou ? 1 : -1;                 // party right (+X), enemies left (-X)
      const x = sign * (4.4 + idx * 1.15);          // fan outward from centre
      const z = (idx - 1) * 2.6;                     // stagger front/back
      const baseY = 1.15;
      mesh.position.set(x, baseY, z);
      scene.add(mesh);

      // Ground shadow disc — flat on the floor directly under the sprite.
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(1.9, 1.9),
        new THREE.MeshBasicMaterial({ map:SHADOW_TEX(), transparent:true, depthWrite:false, opacity:0.9 })
      );
      shadow.rotation.x = -Math.PI/2;
      shadow.scale.set(1, 0.6, 1);                   // squash to an ellipse
      shadow.position.set(x, 0.02, z);
      scene.add(shadow);

      const rec = {
        mesh, shadow, base:{ x, y:baseY, z }, unit, side, idx,
        phase: Math.random()*Math.PI*2, anim: null, gif: null,
        setTexture(url) {
          // GIF → animated CanvasTexture ticker; static images → TextureLoader.
          if (/\.gif(\?|$)/i.test(url)) { this._setGif(url); return; }
          new THREE.TextureLoader().load(url, (t)=>{
            t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
            mat.map = t; mat.needsUpdate = true;
          });
        },
        _setGif(url) {
          // Browsers auto-advance a GIF drawn from an <img>; we redraw it into
          // a CanvasTexture each frame (see animate) so the plane stays animated.
          const img = new Image(); img.crossOrigin = 'anonymous';
          img.onload = () => {
            const cw = img.naturalWidth || 64, ch = img.naturalHeight || 64;
            const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
            const cx = cv.getContext('2d');
            const t = new THREE.CanvasTexture(cv);
            t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
            mat.map = t; mat.needsUpdate = true;
            this.gif = { img, cv, cx, tex:t, cw, ch };
          };
          img.src = url;
        }
      };
      mesh.userData = rec;
      if (unit.down) { mesh.visible = false; shadow.visible = false; }
      sprites.push(rec);
      return rec;
    }

    function resize() {
      if (!renderer) return;
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      renderer.setSize(w, h, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const aspect = w / h;
      // Zoomed-in framing: smaller frustum than before (was 9) so the arena
      // reads bigger now that the stage fills the whole page.
      const frust = 7;
      camera.left = -frust*aspect; camera.right = frust*aspect;
      camera.top = frust; camera.bottom = -frust;
      camera.updateProjectionMatrix();
    }

    function animate() {
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      sprites.forEach(s => {
        if (!s.mesh.visible) return;
        s.mesh.quaternion.copy(camera.quaternion);
        // Advance GIF frame: redraw the <img> (browser auto-plays it) into the texture.
        if (s.gif) { s.gif.cx.clearRect(0,0,s.gif.cw,s.gif.ch); s.gif.cx.drawImage(s.gif.img,0,0); s.gif.tex.needsUpdate = true; }
        let y = s.base.y, sx = 1, sy = 1, ox = 0, lift = 0;
        if (!reduced) { const bob = Math.sin(t*2 + s.phase) * 0.06; y += bob; lift = bob; }
        if (s.anim) {
          s.anim.t += dt;
          const p = Math.min(s.anim.t / s.anim.dur, 1);
          if (s.anim.type === 'attack') {
            // Lunge toward the opposing side along X (party moves -X, enemies +X).
            const dir = s.side === 'you' ? -1 : 1;
            const lunge = Math.sin(p*Math.PI);
            s.mesh.position.x = s.base.x + dir * lunge * 1.6;
            const jump = Math.sin(p*Math.PI) * 0.5; y += jump; lift += jump;
            if (p > 0.6) { sy = 1 - (p-0.6)*0.6; sx = 1 + (p-0.6)*0.5; }
          } else if (s.anim.type === 'hit') {
            ox = Math.sin(p*Math.PI*6) * 0.12 * (1-p);
          }
          if (p >= 1) { s.anim = null; s.mesh.position.x = s.base.x; }
        }
        s.mesh.position.x = (s.anim && s.anim.type==='attack') ? s.mesh.position.x : s.base.x + ox;
        s.mesh.position.y = y;
        s.mesh.scale.set(sx, sy, 1);
        // Shadow shrinks + fades as the sprite lifts (cast-light feel).
        if (s.shadow) {
          const k = Math.max(0, 1 - lift * 1.6);
          s.shadow.scale.set(1.0 * (0.85 + k*0.15) * sx, 0.6 * (0.85 + k*0.15), 1);
          s.shadow.material.opacity = 0.9 * (0.45 + k*0.55);
          s.shadow.position.x = s.mesh.position.x;
        }
      });
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    /* Build the 3D scene only when the renderer initialised. If Three /
       WebGL is unavailable the labelled placeholder already shows and the
       HTML menu combat loop below runs unchanged. */
    if (renderer) {
      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
      const CAM_ELEV = 20 * Math.PI/180, CAM_YAW = 35 * Math.PI/180, CAM_DIST = 14;
      camera.position.set(
        Math.sin(CAM_YAW)*Math.cos(CAM_ELEV)*CAM_DIST,
        Math.sin(CAM_ELEV)*CAM_DIST,
        Math.cos(CAM_YAW)*Math.cos(CAM_ELEV)*CAM_DIST
      );
      camera.lookAt(0, 1.4, 0);

      // Light & shadow: cool ambient fill + a warm key from upper-left so the
      // Lambert sprites gain a lit/shaded side, echoing the reference's mood.
      scene.add(new THREE.AmbientLight(0x8faad0, 0.85));
      const key = new THREE.DirectionalLight(0xfff2d0, 0.9);
      key.position.set(-6, 9, 4);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x1677ff, 0.35);
      rim.position.set(6, 4, -6);
      scene.add(rim);

      const grid = new THREE.GridHelper(20, 20, 0x1677ff, 0xd9dee7);
      grid.material.opacity = 0.5; grid.material.transparent = true;
      scene.add(grid);
      // Side floor rings: enemies LEFT (red, -X), party RIGHT (blue, +X).
      const ringMarker = (sign, color) => {
        const g = new THREE.RingGeometry(0.55, 0.62, 24);
        const m = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.35, side:THREE.DoubleSide });
        for (let i=0; i<3; i++) {
          const r = new THREE.Mesh(g, m); r.rotation.x = -Math.PI/2;
          r.position.set(sign * (4.4 + i*1.15), 0.02, (i-1)*2.6); scene.add(r);
        }
      };
      ringMarker(-1, 0xe0384a);   // enemies left
      ringMarker( 1, 0x1677ff);   // party right

      const propMat = new THREE.MeshBasicMaterial({ color:0x1677ff, wireframe:true, transparent:true, opacity:0.28 });
      [[-6,0.6,-6,1.2],[6.5,0.9,-5,1.8],[-7,0.5,5,1.0],[7,0.7,6,1.4]].forEach(([x,y,z,s])=>{
        const b = new THREE.Mesh(new THREE.BoxGeometry(s,s,s), propMat);
        b.position.set(x,y,z); scene.add(b);
      });

      state.party.forEach((u,i)=> buildSprite(u,'you',i));
      state.enemies.forEach((u,i)=> buildSprite(u,'opp',i));

      clock = new THREE.Clock();
      window.addEventListener('resize', resize);
      resize();
      animate();
    }

    /* loadModel() — extension point to swap grid+props for a real .glb
       arena asset later (GLTFLoader). */
    function loadModel(/* url */) { /* arena .glb integration point — TBD */ }
    void loadModel;

    /* When sprites arrive: window.setSprite('m1','assets/sprites/agumon.gif')
       Accepts animated GIFs (redrawn into a CanvasTexture each frame) or
       static PNGs (TextureLoader). Enemies face right, party faces left. */
    window.setSprite = (id, url) => { const s = sprites.find(s=>s.unit.id===id); if (s) s.setTexture(url); };

    function spriteFor(side, idx){ return sprites.find(s=>s.side===side && s.idx===idx); }
    function playAttack(side, idx){ const s=spriteFor(side,idx); if(s && !reduced) s.anim={type:'attack',t:0,dur:0.5}; }
    function playHit(side, idx){ const s=spriteFor(side,idx); if(s && !reduced) s.anim={type:'hit',t:0,dur:0.35}; }


    /* ---- Combat UI ---- */
    const $ = (s)=>document.querySelector(s);
    const SKILLS = mock.combatSkills;
    const aliveCount = (l)=> l.filter(u=>!u.down && u.hp>0).length;
    const avgLv = (l)=>{ const a=l.filter(u=>!u.down); return a.length? Math.round(a.reduce((s,u)=>s+u.level,0)/a.length):0; };

    function paintPips() {
      const mk = (list) => list.map(u=>{
        const ko = u.down || u.hp<=0;
        return `<span class="pip${ko?' is-ko':''}" style="--el:${elHex(u.element)}" title="${u.name}"></span>`;
      }).join('');
      $('#cb-pips-you').innerHTML = mk(state.party);
      $('#cb-pips-opp').innerHTML = mk(state.enemies);
      $('#cb-sub-you').innerHTML = `<b>${aliveCount(state.party)}</b>/${state.party.length} alive · Lv <b>${avgLv(state.party)}</b>`;
      $('#cb-sub-opp').innerHTML = `<b>${aliveCount(state.enemies)}</b>/${state.enemies.length} alive · Lv <b>${avgLv(state.enemies)}</b>`;
      $('#cb-opp-name').textContent = `vs ${state.oppName}`;
    }

    function paintParty() {
      $('#cb-party').innerHTML = state.party.map((u,i)=>{
        const hpPct = u.hpMax? Math.max(0,u.hp)/u.hpMax*100 : 0;
        const enPct = u.enMax? Math.max(0,u.en)/u.enMax*100 : 0;
        const active = i===state.actorIdx && state.yourTurn && !u.down;
        return `<div class="cb-unit${active?' is-active':''}" role="listitem" data-uid="${u.id}"
            style="--el:${elHex(u.element)}" aria-label="${u.name}, HP ${Math.max(0,u.hp)} of ${u.hpMax}, EN ${u.en} of ${u.enMax}">
          <div class="u-top"><span class="u-name">${u.name}</span><span class="u-lv">Lv ${u.level}</span></div>
          <div class="u-bar"><i data-role="hp" style="transform:scaleX(${hpPct/100})"></i></div>
          <div class="u-hp"><span>HP</span><span><b data-role="hpn">${Math.max(0,u.hp)}</b> / ${u.hpMax}</span></div>
          <div class="u-en"><i data-role="en" style="transform:scaleX(${enPct/100})"></i></div>
        </div>`;
      }).join('');
    }
    function updateUnitBars(u) {
      const el = document.querySelector(`.cb-unit[data-uid="${u.id}"]`); if(!el) return;
      el.querySelector('[data-role=hp]').style.transform = `scaleX(${Math.max(0,u.hp)/u.hpMax})`;
      el.querySelector('[data-role=hpn]').textContent = Math.max(0,u.hp);
      el.querySelector('[data-role=en]').style.transform = `scaleX(${Math.max(0,u.en)/u.enMax})`;
    }

    function paintTurn() {
      const turn = $('#cb-turn');
      turn.classList.toggle('is-your', state.yourTurn);
      turn.classList.toggle('is-opp', !state.yourTurn);
      $('#cb-round').textContent = state.round;
      $('#cb-who').textContent = state.yourTurn ? 'Your turn' : 'Opponent';
      const actor = state.yourTurn ? state.party[state.actorIdx] : null;
      $('#cb-actor').textContent = actor ? actor.name : (state.enemies.find(e=>!e.down)?.name || '—');
    }

    function paintStrip() {
      $('#ps-body').innerHTML =
        `<span>R<b>${state.round}</b></span><span class="sep">·</span>` +
        `<span>${state.yourTurn?'Your turn':'Opponent'} <b>${$('#cb-actor')?.textContent||''}</b></span>` +
        `<span class="sep">·</span><span class="muted">${aliveCount(state.party)}v${aliveCount(state.enemies)}</span>`;
      const strip = $('#page-strip');
      strip.classList.toggle('is-action', state.yourTurn && !state.over);
      strip.classList.toggle('is-warn', !state.yourTurn && !state.over);
    }

    const CUE_ICO = {
      attack:'<path d="M14 4l6 6-10 10H4v-6L14 4Z"/>',
      guard:'<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3Z"/>',
      analyse:'<circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/>',
      ko:'<path d="M6 6l12 12M18 6L6 18"/>',
      round:'<path d="M4 12a8 8 0 1 1 2.3 5.6M4 12V7M4 12h5"/>',
      system:'<circle cx="12" cy="12" r="2"/>'
    };
    function logLine(text, cue='system', ico='system') {
      const body = $('#cb-log-body');
      const div = document.createElement('div');
      div.className = `log-line ${cue}`;
      div.innerHTML = `<span class="stripe"></span>` +
        `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${CUE_ICO[ico]||CUE_ICO.system}</svg>` +
        `<span class="txt"><span class="rd">R${state.round}</span>${text}</span>`;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function floater(rec, text, kind='') {
      if (!rec) return;
      const r = stageEl.getBoundingClientRect();
      let x = r.width / 2, y = r.height * 0.4;
      if (camera && rec.mesh) {
        const v = rec.mesh.position.clone(); v.y += 1.2; v.project(camera);
        x = (v.x*0.5+0.5)*r.width;
        y = (-v.y*0.5+0.5)*r.height;
      }
      const f = document.createElement('div');
      f.className = `cb-float ${kind}`; f.textContent = text;
      f.style.left = x+'px'; f.style.top = y+'px';
      stageEl.appendChild(f);
      setTimeout(()=>f.remove(), 950);
    }
    function critFlash() {
      const el = $('#cb-flash'); el.classList.remove('fire'); void el.offsetWidth; el.classList.add('fire');
    }

    /* ---- Action flow ---- */
    let pending = null;
    const setHint = (t)=> $('#cb-hint').textContent = t;
    const closeSub = ()=> $('#cb-sub-panel').classList.remove('is-open');

    function openSkills() {
      const actor = state.party[state.actorIdx];
      const list = SKILLS[actor.id] || [];
      $('#cb-sub-title').textContent = 'Skills';
      $('#cb-sub-body').innerHTML = list.map(sk=>{
        const canAfford = actor.en >= sk.cost;
        const foe = state.enemies.find(e=>!e.down);
        const aff = foe ? affinity(sk.element, foe.element) : 'neutral';
        const affTag = aff==='weak' ? `<span class="sk-aff weak">Weak!</span>` : aff==='resist' ? `<span class="sk-aff resist">Resist</span>` : '';
        return `<button class="cb-skill" data-skill="${sk.id}" ${canAfford?'':'disabled'}>
            <span>
              <span class="sk-name"><span class="sk-el" style="background:${elHex(sk.element)}"></span>${sk.name}</span>
              <span class="sk-desc">${sk.desc}</span>
            </span>
            <span class="sk-meta"><span class="sk-cost">${sk.cost?('EN '+sk.cost):'FREE'}</span>${affTag}</span>
          </button>`;
      }).join('');
      $('#cb-sub-body').querySelectorAll('[data-skill]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const sk = list.find(s=>s.id===b.dataset.skill);
          closeSub();
          if (sk.power===0) {
            actor.en = Math.min(actor.enMax, actor.en+12); updateUnitBars(actor);
            logLine(`${actor.name} used ${sk.name} (+12 EN).`,'guard','system'); endPlayerAction(); return;
          }
          pending = { kind:'skill', skill:sk };
          setHint(`${sk.name} → pick a target.`);
          pickTarget((t,i)=>{
            if (actor.en < sk.cost) { setHint('Not enough EN.'); pending=null; return; }
            actor.en -= sk.cost; updateUnitBars(actor); pending=null;
            resolveDamage(actor,t,i,sk.power,sk.element,true); setTimeout(endPlayerAction,700);
          });
        });
      });
      $('#cb-sub-panel').classList.add('is-open');
    }

    function openItems() {
      $('#cb-sub-title').textContent = 'Items';
      $('#cb-sub-body').innerHTML = `
        <button class="cb-skill" data-item="meat"><span>
          <span class="sk-name">Recovery Meat</span><span class="sk-desc">Restore 200 HP to the active ally.</span></span>
          <span class="sk-meta"><span class="sk-cost">×3</span></span></button>
        <button class="cb-skill" data-item="chip"><span>
          <span class="sk-name">Energy Chip</span><span class="sk-desc">Restore 20 EN to the active ally.</span></span>
          <span class="sk-meta"><span class="sk-cost">×1</span></span></button>`;
      $('#cb-sub-body').querySelectorAll('[data-item]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const actor = state.party[state.actorIdx];
          if (b.dataset.item==='meat') { actor.hp = Math.min(actor.hpMax, actor.hp+200); logLine(`${actor.name} ate Recovery Meat (+200 HP).`,'guard','system'); }
          else { actor.en = Math.min(actor.enMax, actor.en+20); logLine(`${actor.name} used an Energy Chip (+20 EN).`,'guard','system'); }
          updateUnitBars(actor); closeSub(); endPlayerAction();
        });
      });
      $('#cb-sub-panel').classList.add('is-open');
    }

    function pickTarget(cb) {
      setHint('Select an enemy target (click or Tab + Enter).');
      const pips = $('#cb-pips-opp').querySelectorAll('.pip');
      const clear = ()=> pips.forEach(x=>{ x.style.outline=''; x.onclick=null; x.onkeydown=null; x.style.cursor=''; x.removeAttribute('role'); x.removeAttribute('tabindex'); x.removeAttribute('aria-label'); });
      pips.forEach((p,i)=>{
        if (state.enemies[i].down) return;
        const foe = state.enemies[i];
        p.style.cursor='pointer'; p.style.outline='2px solid var(--signal)'; p.style.outlineOffset='1px';
        p.setAttribute('role','button'); p.setAttribute('tabindex','0');
        p.setAttribute('aria-label', `Target ${foe.name}, ${foe.element}, ${Math.max(0,foe.hp)} of ${foe.hpMax} HP`);
        const choose = ()=>{ clear(); cb(foe, i); };
        p.onclick = choose;
        p.onkeydown = (e)=>{ if (e.key==='Enter' || e.key===' ') { e.preventDefault(); choose(); } };
      });
      const first = Array.from(pips).find((p,i)=>!state.enemies[i].down);
      if (first) first.focus();
    }

    function resolveDamage(actor, target, tIdx, power, element, isSkill) {
      const aff = affinity(element, target.element);
      const mult = aff==='weak'?1.5 : aff==='resist'?0.5 : 1;
      const crit = Math.random() < 0.18;
      const miss = Math.random() < 0.06;
      playAttack('you', state.actorIdx);
      setTimeout(()=>{
        if (miss) {
          floater(spriteFor('opp',tIdx), 'MISS', 'miss');
          logLine(`${actor.name}'s ${isSkill?'skill':'attack'} missed ${target.name}.`,'weak','attack');
          return;
        }
        playHit('opp', tIdx);
        const base = power * (0.9 + Math.random()*0.2);
        const dmg = Math.round(base * mult * (crit?1.6:1) / 6);
        target.hp = Math.max(0, target.hp - dmg);
        const kind = crit||aff==='weak' ? 'crit' : aff==='resist' ? 'resist' : '';
        floater(spriteFor('opp',tIdx), (crit?dmg+' !':String(dmg)), kind);
        if (crit) critFlash();
        const cue = crit||aff==='weak' ? 'crit' : aff==='resist' ? 'resist' : '';
        const tag = aff==='weak'?' Weak!':aff==='resist'?' Resist.':crit?' Critical!':'';
        logLine(`${actor.name} hit ${target.name} for <b>${dmg}</b>.${tag}`, cue, 'attack');
        if (target.hp<=0) {
          target.down = true; { const sp=spriteFor('opp',tIdx); sp.mesh.visible=false; if(sp.shadow) sp.shadow.visible=false; }
           logLine(`${target.name} was defeated!`,'ko','ko');
        }
        paintPips(); paintStrip(); checkEnd();
      }, 280);
    }

    $('#cb-cmd').addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-cmd]'); if(!btn || !state.yourTurn || state.over) return;
      const cmd = btn.dataset.cmd; const actor = state.party[state.actorIdx];
      closeSub();
      if (cmd==='fight') { setHint('Basic attack → pick a target.'); pickTarget((t,i)=>{ resolveDamage(actor,t,i,120,'neutral',false); setTimeout(endPlayerAction,700); }); }
      else if (cmd==='skills') openSkills();
      else if (cmd==='items') openItems();
      else if (cmd==='analyse') { setHint('Analyse → pick a target to scan.'); pickTarget((t)=>{
          logLine(`Analysed ${t.name}: ${t.element} · Lv ${t.level} · ${fmt(t.hp)}/${fmt(t.hpMax)} HP. <b>Egg data captured.</b>`,'guard','analyse');
          toast(`${t.name} → egg data captured`); endPlayerAction();
        }); }
      else if (cmd==='guard') { actor.guard=true; logLine(`${actor.name} braces (Guard).`,'guard','guard'); endPlayerAction(); }
      else if (cmd==='flee') { logLine('You fled the battle.','system','round'); endBattle('defeat','Fled'); }
    });

    $('#cb-sub-close').addEventListener('click', closeSub);

    function endPlayerAction() {
      const actor = state.party[state.actorIdx];
      actor.en = Math.min(actor.enMax, actor.en + 2);
      updateUnitBars(actor);
      const nextIdx = state.party.findIndex((u,i)=> i>state.actorIdx && !u.down);
      if (nextIdx >= 0) {
        state.actorIdx = nextIdx;
        paintParty(); paintTurn(); paintStrip(); setHint('Choose an action.');
      } else {
        opponentTurn();
      }
    }

    function opponentTurn() {
      state.yourTurn = false; paintParty(); paintTurn(); paintStrip(); setHint('Opponent is acting…');
      const foes = state.enemies.filter(e=>!e.down);
      let i = 0;
      const step = () => {
        if (i>=foes.length || state.over) { if(!state.over) startNewRound(); return; }
        const foe = foes[i++];
        const targets = state.party.filter(p=>!p.down);
        if (!targets.length) { checkEnd(); return; }
        const tgt = targets[Math.floor(Math.random()*targets.length)];
        const tIdx = state.party.indexOf(tgt);
        const fIdx = state.enemies.indexOf(foe);
        playAttack('opp', fIdx);
        setTimeout(()=>{
          playHit('you', tIdx);
          const aff = affinity(foe.element, tgt.element);
          const mult = aff==='weak'?1.5:aff==='resist'?0.5:1;
          let dmg = Math.round(foe.atk * (0.9+Math.random()*0.2) * mult / 4);
          if (tgt.guard) dmg = Math.round(dmg*0.5);
          tgt.hp = Math.max(0, tgt.hp - dmg);
          floater(spriteFor('you',tIdx), String(dmg), aff==='weak'?'crit':aff==='resist'?'resist':'');
          logLine(`${foe.name} hit ${tgt.name} for <b>${dmg}</b>.${aff==='weak'?' Weak!':aff==='resist'?' Resist.':''}`, aff==='weak'?'crit':'', 'attack');
          updateUnitBars(tgt);
          if (tgt.hp<=0) { tgt.down=true; { const sp=spriteFor('you',tIdx); sp.mesh.visible=false; if(sp.shadow) sp.shadow.visible=false; } logLine(`${tgt.name} was defeated!`,'ko','ko'); }
          paintPips(); paintStrip(); checkEnd();
          if (!state.over) setTimeout(step, 500);
        }, 300);
      };
      setTimeout(step, 500);
    }

    function startNewRound() {
      if (state.over) return;
      state.party.forEach(u=>u.guard=false);
      state.round++; state.yourTurn = true;
      state.actorIdx = state.party.findIndex(u=>!u.down);
      if (state.actorIdx<0) { checkEnd(); return; }
      logLine(`Round ${state.round} begins.`,'round','round');
      paintParty(); paintPips(); paintTurn(); paintStrip(); setHint('Choose an action.');
    }

    function checkEnd() {
      if (state.over) return;
      if (aliveCount(state.enemies)===0) endBattle('victory','Victory');
      else if (aliveCount(state.party)===0) endBattle('defeat','Defeat');
    }
    function endBattle(kind, label) {
      state.over = true;
      $('#cb-end-r').textContent = kind==='victory' ? 'Encounter cleared' : 'Party wiped';
      $('#cb-end-h').textContent = label;
      $('#cb-end').classList.add('is-open');
      $('#page-strip').classList.remove('is-action','is-warn');
      setTimeout(()=> $('#cb-restart').focus(), 50);
    }
    document.addEventListener('keydown', (e)=>{
      if (e.key==='Escape' && $('#cb-end').classList.contains('is-open')) $('#cb-restart').click();
    });

    $('#cb-restart').addEventListener('click', ()=>{
      resetState();
      sprites.forEach(s=>{
        const list = s.side==='you'?state.party:state.enemies; const u=list[s.idx];
        s.unit=u; s.mesh.visible = !(u.down||u.hp<=0); if(s.shadow) s.shadow.visible = s.mesh.visible; s.anim=null;
        s.mesh.position.set(s.base.x,s.base.y,s.base.z); s.mesh.scale.set(1,1,1);
      });
      $('#cb-end').classList.remove('is-open');
      $('#cb-log-body').innerHTML='';
      paintParty(); paintPips(); paintTurn(); paintStrip(); setHint('Choose an action.');
      logLine('New encounter — Round 1.','round','round');
    });

    paintParty(); paintPips(); paintTurn(); paintStrip();
    logLine('Battle start — 3v3 encounter.','round','round');
    setHint('Choose an action.');
  </script>
</body>
</html>
