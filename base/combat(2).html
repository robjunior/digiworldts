/* ============================================================
   DigiWorld — Design tokens
   Copied verbatim from /mnt/sdc/digiworld/public/assets/css/tokens.css.
   Palette is closed: use ONLY these color literals across the app.
   ============================================================ */

:root {
  /* Core palette */
  --bg:        #ffffff;
  --panel:     #f7f8fa;
  --ink:       #111111;
  --muted:     #6b7280;
  --hairline:  #d9dee7;

  /* Signals (reserved, sparing) */
  --signal:    #1677ff;
  --battle:    #e0384a;
  --gold:      #c8a24a;

  /* Element sub-palette (creature typing) */
  --el-fire:     #e0384a;
  --el-water:    #1677ff;
  --el-nature:   #2f9e57;
  --el-electric: #c8a24a;
  --el-neutral:  #6b7280;

  /* Shape */
  --notch: 10px;
  --notch-sm: 5px;
  --notch-xs: 3px;
  --radius: 0;

  /* Type */
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;

  /* Spacing (8px baseline) */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px;

  /* Motion */
  --ease: cubic-bezier(.16, 1, .3, 1);

  /* Semantic combat roles */
  --hp:      var(--battle);
  --energy:  var(--signal);
  --atb:     var(--signal);
  --crit:    var(--gold);
  --miss:    var(--muted);
  --resist:  var(--muted);
  --enemy:   var(--battle);
  --ally:    var(--signal);
  --lock:    var(--gold);

  /* Status ailments */
  --status-burn:   var(--el-fire);
  --status-poison: var(--el-nature);
  --status-weaken: var(--muted);
  --status-freeze: var(--el-water);

  /* Economy roles */
  --res-meat:   var(--el-fire);
  --res-bits:   var(--signal);
  --res-data:   var(--el-nature);
  --credits:    var(--gold);
  --danger:     var(--battle);
  --streak:     var(--gold);

  /* Loot rarity */
  --rarity-common:    var(--muted);
  --rarity-uncommon:  var(--el-nature);
  --rarity-rare:      var(--signal);
  --rarity-epic:      var(--gold);
  --rarity-legendary: var(--battle);

  /* Social */
  --online:  var(--el-nature);
  --offline: var(--muted);
  --premium: var(--gold);
  --claim-done:  var(--el-nature);
  --claim-next:  var(--signal);
  --claim-todo:  var(--hairline);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
a:hover { color: var(--signal); }

/* Notch utilities */
.notch    { clip-path: polygon(var(--notch) 0, 100% 0, 100% calc(100% - var(--notch)),
              calc(100% - var(--notch)) 100%, 0 100%, 0 var(--notch)); }
.notch-sm { clip-path: polygon(var(--notch-sm) 0, 100% 0, 100% calc(100% - var(--notch-sm)),
              calc(100% - var(--notch-sm)) 100%, 0 100%, 0 var(--notch-sm)); }
.notch-xs { clip-path: polygon(var(--notch-xs) 0, 100% 0, 100% calc(100% - var(--notch-xs)),
              calc(100% - var(--notch-xs)) 100%, 0 100%, 0 var(--notch-xs)); }

/* Type helpers */
.eyebrow { font-size:11px; font-weight:600; letter-spacing:.14em;
           text-transform:uppercase; color:var(--signal); }
.caps    { font-size:9px; font-weight:600; letter-spacing:.12em;
           text-transform:uppercase; color:var(--muted); }
.num     { font-variant-numeric: tabular-nums; }
.tabular { font-variant-numeric: tabular-nums; }
.mono    { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }

/* App shell */
.app-shell { min-height:100vh; display:flex; flex-direction:column; }
.app-nav   { display:flex; align-items:center; gap:16px; padding:14px clamp(16px,4vw,32px);
             border-bottom:1px solid var(--hairline); background:var(--bg); position:sticky; top:0; z-index:10;
             flex-wrap:wrap; }
.app-nav .brand { font-size:15px; font-weight:600; letter-spacing:-.01em; margin-right:8px; }
.app-nav .brand b { color:var(--signal); }
.app-nav .nav-sep { width:1px; height:16px; background:var(--hairline); margin: 0 2px; }
.app-nav .nav-link { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
                     color:var(--muted); padding:6px 10px; position:relative;
                     clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); }
.app-nav .nav-link.is-active { color:var(--ink); background:var(--panel); }
.app-nav .nav-link:hover { color:var(--ink); }
.app-nav .nav-link .alert-dot { position:absolute; top:4px; right:4px; width:6px; height:6px; background:var(--battle);
                                border-radius:50%; box-shadow:0 0 0 2px var(--bg); }
.app-nav .nav-right { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
.app-nav .who b { color:var(--ink); }
.app-main { padding: clamp(16px,4vw,32px) clamp(16px,5vw,40px) 40px; flex:1; max-width:1240px; width:100%; margin:0 auto; }
.app-toast { position:fixed; bottom:16px; right:16px; padding:10px 16px; background:var(--ink); color:var(--bg); font-size:13px;
             clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
             z-index:1000; opacity:0; transition:opacity .18s var(--ease); }
.app-toast.is-open { opacity:1; }
.app-toast.is-err  { background:var(--battle); }

.hidden { display:none !important; }
.stack  { display:flex; flex-direction:column; gap:var(--sp-3); }
.row    { display:flex; align-items:center; gap:var(--sp-3); }
.spread { justify-content:space-between; }
.grow   { flex:1; }

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; }
}

</style>

/* ============================================================
   DigiWorld — Applied UI Kit components
   Copied verbatim from /mnt/sdc/digiworld/public/assets/css/components.css.
   Depends on ./tokens.css. Kept CLOSED — no ad-hoc styles in HTML.
   ============================================================ */

/* ---------- Buttons ---------- */
.btn {
  --_c: var(--signal);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family: var(--font); font-size:13px; font-weight:600; letter-spacing:.02em;
  padding:10px 18px; border:1px solid transparent; cursor:pointer; color:#fff;
  background: var(--_c); transition: filter .2s, background .2s;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.btn:hover { filter: brightness(1.06); }
.btn:disabled, .btn[disabled] { background:var(--panel); color:var(--muted); border-color:var(--hairline); cursor:not-allowed; filter:none; }
.btn:focus-visible { outline:none; filter: drop-shadow(0 0 0 3px color-mix(in oklab, var(--_c) 35%, transparent)); }
.btn--secondary { background:var(--bg); color:var(--ink); border-color:var(--hairline); }
.btn--secondary:hover { border-color:var(--signal); color:var(--signal); filter:none; }
.btn--danger { --_c: var(--battle); }
.btn--tertiary { --_c: var(--gold); color:var(--ink); }
.btn--sm { padding:6px 12px; font-size:11px; }
.btn--wide { width:100%; }
.btn--icon svg { width:14px; height:14px; }

/* ---------- Chips ---------- */
.pill, .kind, .status-chip {
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border:1px solid var(--hairline);
  clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
}
.pill { color: var(--el, var(--signal)); border-color: color-mix(in oklab, var(--el, var(--signal)) 35%, var(--hairline)); }
.pill .dot { width:5px; height:5px; border-radius:50%; background: var(--el, var(--signal)); }
.kind { color:var(--ink); background:var(--bg); }
.kind svg { width:11px; height:11px; color:var(--muted); }

.status-chip { --st:var(--muted); color:var(--ink); background:var(--bg); }
.status-chip .status-dot { width:8px; height:8px; background:var(--st);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--st) 22%, transparent); }
.status-chip .note { margin-left:2px; color:var(--muted); font-size:10px; }
.status--party    { --st:var(--signal); }
.status--training { --st:var(--gold); }
.status--resting  { --st:var(--el-nature); }

/* ---------- Meters ---------- */
.meter, .gauge {
  height:6px; background:var(--bg); border:1px solid var(--hairline); position:relative; overflow:hidden;
  clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px);
}
.meter i, .gauge i { position:absolute; inset:0; right:auto; width: var(--pct, 60%); background:var(--signal); transition: width .35s var(--ease); }
.meter--hp i, .gauge--hp i { background: linear-gradient(90deg, var(--hp), color-mix(in oklab, var(--hp) 60%, #fff)); }
.meter--en i, .gauge--en i { background: linear-gradient(90deg, var(--energy), color-mix(in oklab, var(--energy) 60%, #fff)); }
.gauge--atb i { background: var(--atb); }

/* ---------- Form controls ---------- */
.field { display:flex; flex-direction:column; gap:6px; font-size:11px; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.input, textarea.input, select.input {
  font-family:var(--font); font-size:14px; font-weight:400; letter-spacing:normal; text-transform:none;
  color:var(--ink); background:var(--bg); border:1px solid var(--hairline); padding:10px 12px; width:100%;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}
.input:focus, textarea.input:focus, select.input:focus { outline:none; border-color:var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
.input[aria-invalid="true"] { border-color:var(--battle); }

/* ---------- HUD / stat panel ---------- */
.hud-header { padding:8px clamp(12px,3vw,32px);
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  background: linear-gradient(180deg, transparent 0, transparent calc(100% - 1px), color-mix(in oklab, var(--hairline) 55%, transparent) 100%); }
.hud-header .eyebrow { font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); line-height:1; margin-bottom:2px; }
.hud-header h1 { font-size: clamp(16px, 1.9vw, 20px); font-weight:600; letter-spacing:-.02em; margin:0; line-height:1.15; }
.hud-header .count { font-size:11px; font-weight:500; color:var(--muted); padding:4px 10px;
  background: color-mix(in oklab, var(--signal) 10%, transparent);
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
.hud-header .count b { color:var(--ink); font-weight:600; }

/* ---------- Combat components ---------- */
.cbt-party { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
.cbt-unit  { background:var(--panel); border:1px solid var(--hairline); padding:12px 14px; display:flex; flex-direction:column; gap:8px;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.cbt-unit.is-active { border-color:var(--ally); box-shadow: inset 0 0 0 1px var(--ally); }
.cbt-unit.is-locked { opacity:.6; }
.cbt-unit .u-name { font-size:14px; font-weight:600; letter-spacing:-.01em; }
.cbt-unit .u-cap  { font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.cbt-unit .u-val  { font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink); }
.cbt-unit .rowline { display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:8px; }
.cbt-unit .u-head  { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.cbt-unit .u-el    { font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color: var(--el, var(--muted)); }
.cbt-unit .u-btn   { width:100%; text-align:left; background:transparent; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; }
.cbt-unit .u-portrait { width:40px; height:40px; object-fit:contain; background:var(--bg); border:1px solid var(--hairline); }

.cbt-actions { display:flex; gap:8px; flex-wrap:wrap; }
.cbt-cmd { flex:1 1 auto; min-width:88px; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  font-family:var(--font); font-size:13px; font-weight:600; letter-spacing:.03em; padding:12px 14px;
  color:#fff; background:var(--signal); border:1px solid transparent; cursor:pointer; transition:filter .2s;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.cbt-cmd svg { width:14px; height:14px; }
.cbt-cmd:hover { filter: brightness(1.06); }
.cbt-cmd--guard   { background:var(--bg); color:var(--ink); border-color:var(--hairline); }
.cbt-cmd--analyse { background:var(--gold); color:var(--ink); }
.cbt-cmd--flee    { background:var(--bg); color:var(--battle); border-color: color-mix(in oklab, var(--battle) 40%, var(--hairline)); }
.cbt-cmd[disabled] { background:var(--panel); color:var(--muted); border-color:var(--hairline); cursor:not-allowed; filter:none; }

.skill-menu { max-height:240px; overflow-y:auto; border:1px solid var(--hairline); background:var(--panel); display:flex; flex-direction:column;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.skill-row { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  padding:11px 12px; background:transparent; border:0; border-bottom:1px solid var(--hairline);
  font-family:var(--font); text-align:left; cursor:pointer; color:var(--ink); transition: background .15s; }
.skill-row:last-child { border-bottom:0; }
.skill-row:hover { background: color-mix(in oklab, var(--signal) 8%, transparent); }
.skill-row .s-name { font-size:13px; font-weight:600; }
.skill-row .s-cost { font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--energy); }
.skill-row .s-desc { font-size:10px; color:var(--muted); font-weight:400; letter-spacing:normal; text-transform:none; margin-top:2px; }
.skill-row[disabled] { cursor:not-allowed; color:var(--muted); }
.skill-row[disabled] .s-cost { color:var(--muted); }

.turn-log { border:1px solid var(--hairline); background:var(--panel); padding:12px 14px; max-height:280px; overflow-y:auto;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.log-line { font-size:12px; color:var(--ink); padding:4px 0; border-bottom:1px solid color-mix(in oklab, var(--hairline) 60%, transparent);
  font-variant-numeric:tabular-nums; }
.log-line:last-child { border-bottom:0; }
.log-line .rnd { color:var(--muted); font-size:10px; letter-spacing:.08em; }
.cue { font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-left:6px; }
.cue--crit   { color:var(--crit); }
.cue--miss   { color:var(--miss); }
.cue--resist { color:var(--resist); }
.cue--weak   { color:var(--crit); }

.ailment { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600;
  letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; color:var(--ink);
  border:1px solid color-mix(in oklab, var(--st, var(--muted)) 45%, var(--hairline));
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }
.ailment::before { content:""; width:6px; height:6px; background: var(--st, var(--muted)); }
.ailment--burn   { --st: var(--status-burn); }
.ailment--poison { --st: var(--status-poison); }
.ailment--weaken { --st: var(--status-weaken); }
.ailment--freeze { --st: var(--status-freeze); }
.ailment--stun   { --st: var(--gold); }

.foe { background:var(--panel); border:1px solid var(--hairline); padding:14px 14px 12px; position:relative;

  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.foe.is-target  { border-color:var(--enemy); box-shadow: inset 0 0 0 1px var(--enemy); cursor:pointer; }
.foe.is-current { border-color:var(--gold);  box-shadow: inset 0 0 0 2px var(--gold); }
.foe.is-down    { opacity:.4; filter:grayscale(1); pointer-events:none; }

  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.foe .art svg { width:60%; height:60%; }
.foe .f-name { font-size:14px; font-weight:600; }
.foe .f-sub  { font-size:9px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.foe .f-hp   { display:flex; align-items:center; gap:8px; }
.foe .f-hp .v { font-size:11px; font-weight:600; color:var(--ink); white-space:nowrap; }
.foe .ailments { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; min-height:16px; }
.enemies { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }

/* ---------- Economy ---------- */
.res { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink); border:1px solid var(--hairline);
  background:var(--bg); padding:5px 9px;
  clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }
.res::before { content:""; width:8px; height:8px; background: var(--rc, var(--muted)); }
.res .lbl { font-size:9px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.res--meat { --rc: var(--res-meat); }
.res--bits { --rc: var(--res-bits); }
.res--data { --rc: var(--res-data); }

.credits { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink); }
.credits::before { content:""; width:9px; height:9px; background: var(--credits);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }

/* ---------- Farm building ---------- */
.bld { background:var(--panel); border:1px solid var(--hairline); display:flex; flex-direction:column;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
.bld.is-ready { border-color: color-mix(in oklab, var(--signal) 45%, var(--hairline)); }
.bld .art { aspect-ratio:16/10; background:var(--bg); display:grid; place-items:center; border-bottom:1px solid var(--hairline); position:relative; }
.bld .art svg { width:52px; height:52px; color: var(--rc, var(--muted)); }
.bld .lv { position:absolute; top:10px; left:0; background:var(--bg); border:1px solid var(--hairline);
  font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); padding:3px 8px;
  clip-path: polygon(4px 0, 100% 0, 100% 100%, 0 100%); }
.bld .ready-dot { position:absolute; top:12px; right:12px; width:8px; height:8px; background:var(--signal);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--signal) 22%, transparent); }
.bld .body { padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px; flex:1; }
.bld .top  { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.bld .bname { font-size:17px; font-weight:600; letter-spacing:-.01em; }
.bld .rate  { font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap; }
.bld .rate b { color: var(--rc, var(--signal)); }
.bld .store { margin-top:2px; }
.bld .store-head { display:flex; align-items:baseline; justify-content:space-between;
  font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.bld .store-head .v { font-size:12px; color:var(--ink); letter-spacing:.02em; }
.bld .store-head .v b { color: var(--rc, var(--ink)); }
.bld .fill { height:10px; background:var(--bg); border:1px solid var(--hairline); position:relative; overflow:hidden;
  clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px); }
.bld .fill i { position:absolute; inset:0; right:auto; width: var(--pct, 0%); background: var(--rc, var(--signal)); transition: width .5s var(--ease); }
.bld .foot { display:flex; gap:8px; }
.bld .foot .btn { flex:1; justify-content:center; padding:11px 12px; font-size:12px; }

/* ---------- Auth / entrance page ---------- */

  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); font-size:12px; }
.modal .diff .k { color:var(--muted); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
.modal .diff .v { color:var(--ink); font-variant-numeric:tabular-nums; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }

/* ---------- Launcher (index) ---------- */
.launcher { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:24px; }
@media (max-width: 900px) { .launcher { grid-template-columns:repeat(2, 1fr); } }
@media (max-width: 560px) { .launcher { grid-template-columns:1fr; } }
.launcher .lc { display:flex; flex-direction:column; gap:8px; padding:16px 18px;
  background:var(--panel); border:1px solid var(--hairline); color:inherit;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: border-color .2s, transform .2s; }
.launcher .lc:hover { border-color:var(--signal); transform: translateY(-2px); color:inherit; }
.launcher .lc .lc-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.launcher .lc .lc-title { font-size:14px; font-weight:600; letter-spacing:-.01em; }
.launcher .lc .lc-note  { font-size:11px; color:var(--muted); text-wrap:pretty; }
.launcher .lc .lc-file  { font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:10px; color:var(--muted); letter-spacing:.02em; }
.launcher .lc.is-wip { opacity:.65; cursor:not-allowed; }
.launcher .lc.is-wip:hover { border-color:var(--hairline); transform:none; }
.launcher .lc .badge {
  font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  padding:2px 6px; border:1px solid currentColor;
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
}
.launcher .lc .badge.live { color: var(--signal); }
.launcher .lc .badge.wip  { color: var(--muted); }

/* ---------- Bracket line (Lobby queue explainer) ---------- */
.bracket-line { display:flex; justify-content:space-between; align-items:center; padding:8px 10px;
  border:1px solid var(--hairline); background:var(--bg); font-size:10px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }
.bracket-line b { color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.02em; }

/* ============================================================
   Combat v2 — party card hierarchy + tactile feedback + log cues
   ============================================================ */

/* ---------- Party card v2 — HP hero, EN thin, ATB as top stripe ---------- */
.cbt-unit--v2 { position: relative; padding-top: 16px; overflow: hidden; }
.cbt-unit--v2 .atb-stripe { position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: color-mix(in oklab, var(--atb) 20%, var(--hairline)); overflow: hidden; z-index: 1; }
.cbt-unit--v2 .atb-stripe i { position: absolute; inset: 0; right: auto;
  width: var(--pct, 0%); background: var(--atb); transition: width .5s var(--ease); }
.cbt-unit--v2 .u-head { align-items: baseline; gap: 10px; padding-right: 2px; }
.cbt-unit--v2 .u-head .u-name { font-size: 14px; }
.cbt-unit--v2 .body-row { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
.cbt-unit--v2 .body-row .u-portrait { width: 48px; height: 48px; }
.cbt-unit--v2 .stat-block { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.cbt-unit--v2 .hp-line { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.cbt-unit--v2 .hp-line .meter { height: 8px; }
.cbt-unit--v2 .hp-line .meter i { transition: width .4s var(--ease); }
.cbt-unit--v2 .hp-line .v { font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.cbt-unit--v2 .en-line { display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; align-items: center; }
.cbt-unit--v2 .en-line .k { font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cbt-unit--v2 .en-line .meter { height: 3px; }
.cbt-unit--v2 .en-line .meter i { transition: width .4s var(--ease); }
.cbt-unit--v2 .en-line .v { font-size: 10px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.cbt-unit--v2 .ailments { min-height: 0; margin-top: 2px; }
.cbt-unit--v2 .ailments:empty { display: none; }

/* Enemy HP interpolation too (uses existing .meter i transition set below) */
.foe .meter i { transition: width .4s var(--ease); }

/* ---------- Motion + tactile feedback ---------- */
.cbt-unit--v2.is-hit, .foe.is-hit { animation: cbtShake .35s var(--ease); }
@keyframes cbtShake {
  0%   { transform: translate(0, 0); }
  20%  { transform: translate(-4px, 1px); }
  40%  { transform: translate(4px, -1px); }
  60%  { transform: translate(-3px, 1px); }
  80%  { transform: translate(2px, 0); }
  100% { transform: translate(0, 0); }
}

.hit-spark { position: absolute; width: 64px; height: 64px; pointer-events: none;
  transform: translate(-50%, -50%) scale(.4); opacity: 0;
  background: radial-gradient(circle, color-mix(in oklab, var(--battle) 45%, transparent) 0%, transparent 60%);
  animation: hitSpark .55s var(--ease) forwards; z-index: 6; }
.hit-spark.is-crit { width: 100px; height: 100px;
  background: radial-gradient(circle, color-mix(in oklab, var(--gold) 70%, transparent) 0%, transparent 60%); }
.hit-spark.is-weak {
  background: radial-gradient(circle, color-mix(in oklab, var(--gold) 55%, transparent) 0%, transparent 60%); }
@keyframes hitSpark {
  0%   { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
  25%  { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
}

.screen-flash { position: fixed; inset: 0; pointer-events: none; z-index: 500;
  background: var(--gold); opacity: 0; animation: screenFlash .35s var(--ease) forwards;
  mix-blend-mode: screen; }
@keyframes screenFlash {
  0%   { opacity: 0; }
  15%  { opacity: .18; }
  100% { opacity: 0; }
}

/* ---------- Turn log v2 — stripe + icon + cue tint + tag ---------- */
.turn-log--v2 { padding: 0; }
.log-line-v2 { display: grid; grid-template-columns: 3px 20px auto 1fr auto; gap: 8px;
  align-items: center; padding: 8px 12px 8px 0;
  border-bottom: 1px solid color-mix(in oklab, var(--hairline) 60%, transparent);
  font-size: 12px; font-variant-numeric: tabular-nums; position: relative;
  animation: logRowIn .3s var(--ease); }
.log-line-v2:last-child { border-bottom: 0; }
@keyframes logRowIn {
  0%   { opacity: 0; transform: translateX(-4px); }
  100% { opacity: 1; transform: translateX(0); }
}
.log-line-v2 .stripe { align-self: stretch; background: var(--cue-c, var(--hairline)); }
.log-line-v2 .icon { color: var(--cue-c, var(--muted)); display: grid; place-items: center; }
.log-line-v2 .icon svg { width: 14px; height: 14px; }
.log-line-v2 .rnd { font-size: 10px; color: var(--muted); letter-spacing: .06em; font-weight: 600; }
.log-line-v2 .text { color: var(--ink); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-line-v2 .tag { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--cue-c, var(--muted)); padding: 2px 6px; border: 1px solid;
  border-color: color-mix(in oklab, var(--cue-c, var(--muted)) 45%, var(--hairline));
  clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px); }
.log-line-v2.cue-crit   { --cue-c: var(--crit);   background: color-mix(in oklab, var(--crit) 6%, transparent); }
.log-line-v2.cue-weak   { --cue-c: var(--crit); }
.log-line-v2.cue-resist { --cue-c: var(--muted); }
.log-line-v2.cue-miss   { --cue-c: var(--muted); }
.log-line-v2.cue-guard  { --cue-c: var(--ally); }
.log-line-v2.cue-ko     { --cue-c: var(--battle); background: color-mix(in oklab, var(--battle) 6%, transparent); }
.log-line-v2.cue-round  { --cue-c: var(--signal); background: color-mix(in oklab, var(--signal) 5%, transparent); font-weight: 600; }

/* ---------- Reduced motion — kill shake/spark/flash ---------- */
@media (prefers-reduced-motion: reduce) {
  .cbt-unit--v2.is-hit, .foe.is-hit { animation: none; }
  .hit-spark, .screen-flash { animation: none !important; opacity: 0 !important; }
  .log-line-v2 { animation: none; }
  .cbt-unit--v2 .atb-stripe i, .cbt-unit--v2 .meter i, .foe .meter i { transition: none; }
}

/* ============================================================
   Combat header — battle-strip (team-vs-team telemetry)
   ============================================================ */
.battle-strip { display:grid; grid-template-columns: 1fr auto 1fr;
  align-items: stretch; background: var(--panel); border: 1px solid var(--hairline);
  overflow: hidden;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }

.battle-strip .side { display: flex; flex-direction: column; justify-content: center; gap: 6px;
  padding: 14px 20px; min-width: 0; }
.battle-strip .side--you { align-items: flex-start; }
.battle-strip .side--foe { align-items: flex-end; text-align: right; }
.battle-strip .side .k { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.battle-strip .side .k b { color: var(--ink); font-weight: 600; letter-spacing: -.01em; font-size: 13px; text-transform: none; }
.battle-strip .side .pips { display: flex; gap: 6px; align-items: center; }
.battle-strip .side .pip { position: relative; width: 14px; height: 14px; background: var(--pip-c, var(--muted));
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
  transition: background .3s var(--ease), opacity .3s var(--ease); }
.battle-strip .side .pip.is-down { background: var(--hairline); }
.battle-strip .side .pip.is-down::after { content: '×'; position: absolute; inset: 0;
  display: grid; place-items: center; color: var(--muted); font-size: 11px; font-weight: 700;
  line-height: 1; font-family: var(--font); }
.battle-strip .side .sub { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums;
  letter-spacing: .04em; }
.battle-strip .side .sub b { color: var(--ink); font-weight: 600; }

.battle-strip .center { display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px 28px; min-width: 260px; background: var(--bg);
  border-left: 1px solid var(--hairline); border-right: 1px solid var(--hairline);
  position: relative; transition: background .35s var(--ease); }
.battle-strip .center.is-your { background: color-mix(in oklab, var(--signal) 8%, var(--bg)); }
.battle-strip .center.is-opp  { background: color-mix(in oklab, var(--battle) 6%, var(--bg)); }
.battle-strip .center .round { font-size: 10px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted); }
.battle-strip .center .round b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
.battle-strip .center .actor { display: flex; align-items: center; gap: 8px; margin-top: 4px;
  white-space: nowrap; }
.battle-strip .center .side-tag { font-size: 11px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor;
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }
.battle-strip .center.is-your .side-tag { color: var(--signal); }
.battle-strip .center.is-opp  .side-tag { color: var(--battle); }
.battle-strip .center .actor-name { font-size: 18px; font-weight: 600; letter-spacing: -.02em;
  color: var(--ink); }
.battle-strip .center .conn { font-size: 9px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--battle); margin-top: 3px;
  display: inline-flex; align-items: center; gap: 4px; }
.battle-strip .center .conn::before { content: ''; width: 6px; height: 6px; background: var(--battle);
  animation: connBlink 1s ease-in-out infinite; }
.battle-strip .center .conn.is-hidden { display: none; }
@keyframes connBlink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

.battle-strip .center.turn-changed { animation: turnPulse .5s var(--ease); }
@keyframes turnPulse {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.025); }
  100% { transform: scale(1); }
}

@media (max-width: 720px) {
  .battle-strip { grid-template-columns: 1fr; }
  .battle-strip .side { flex-direction: row; justify-content: space-between; align-items: center;
    padding: 10px 14px; gap: 12px; }
  .battle-strip .side--foe { text-align: left; align-items: center; }
  .battle-strip .side .k { order: 1; }
  .battle-strip .side .pips { order: 2; }
  .battle-strip .side .sub { order: 3; }
  .battle-strip .center { border-left: 0; border-right: 0;
    border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
    min-width: 0; padding: 12px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .battle-strip .center.turn-changed { animation: none; }
  .battle-strip .center { transition: none; }
  .battle-strip .side .pip { transition: none; }
  .battle-strip .center .conn::before { animation: none; }
}

/* ============================================================
   Page strip — SLIM system-wide page header
   One-line status band, 40px, full-bleed. Sits inside .app-main
   as the first child. No h1, no eyebrow, no tinted background.
   Border-left color is the ONE signal — mutually exclusive between
   is-action (Signal Blue), is-reward (Nimrod Gold), is-warn (Battle Red).
   ============================================================ */
.page-strip { display: grid; grid-template-columns: auto 1fr auto; gap: 16px;
  align-items: center; min-height: 40px;
  padding: 0 clamp(16px, 4vw, 32px);
  margin: 0 calc(-1 * clamp(16px, 5vw, 40px)) 20px;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  border-left: 3px solid transparent;
  background: var(--bg);
  transition: border-left-color .3s var(--ease); }
.page-strip.is-action { border-left-color: var(--signal); }
.page-strip.is-reward { border-left-color: var(--gold); }
.page-strip.is-warn   { border-left-color: var(--battle); }

.page-strip .ps-name {
  font-size: 10px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted);
  padding-right: 14px; border-right: 1px solid var(--hairline); }
.page-strip .ps-body {
  font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums;
  display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap;
  min-width: 0; }
.page-strip .ps-body .sep    { color: var(--hairline); user-select: none; }
.page-strip .ps-body .mono   { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; }
.page-strip .ps-body b       { color: var(--ink); font-weight: 600; }
.page-strip .ps-body .muted  { color: var(--muted); }
.page-strip .ps-body .accent { color: var(--signal); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
.page-strip .ps-body .warn   { color: var(--battle); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
.page-strip .ps-body .reward { color: var(--gold);   font-weight: 700; }
.page-strip .ps-actions { display: inline-flex; align-items: center; gap: 8px; }
.page-strip .ps-actions .btn--sm { padding: 5px 12px; font-size: 11px; }

.page-strip .ps-actor {
  display: inline-block; min-width: 8ch; font-weight: 600;
  transition: opacity .18s var(--ease); }
.page-strip .ps-actor.is-swap { opacity: 0; }

@media (max-width: 640px) {
  .page-strip { grid-template-columns: 1fr auto; row-gap: 4px;
    padding: 8px clamp(12px, 4vw, 20px); min-height: 0; }
  .page-strip .ps-name { grid-column: 1 / -1; border-right: 0;
    padding: 0 0 4px 0; border-bottom: 1px solid var(--hairline); margin-bottom: 4px; }
  .page-strip .ps-body { grid-column: 1; font-size: 11px; }
  .page-strip .ps-actions { grid-column: 2; align-self: start; }
}

@media (prefers-reduced-motion: reduce) {
  .page-strip, .page-strip .ps-actor { transition: none; }
}

/* ============================================================
   Party hero v2 — lobby.html party section, three-zone mini-card
   Overrides the flat .party-slot from components.css with a full
   card layout: element rail + head (name+lvl) + framed art +
   body (element chip + HP hero + EN thin). Empty state gets a
   dashed ghost slot with '+' affordance.
   ============================================================ */
.party-hero { grid-template-columns: repeat(3, 1fr); gap: 14px; }
.party-hero .party-slot {
  padding: 0; gap: 0;
  display: flex; flex-direction: column; align-items: stretch;
  text-align: left; overflow: hidden;
  transition: transform .2s var(--ease), border-color .2s var(--ease);
}
.party-hero .party-slot:hover {
  border-color: color-mix(in oklab, var(--el, var(--signal)) 45%, var(--hairline));
  transform: translateY(-2px);
}
.party-hero .party-slot:focus-visible {
  outline: none;
  border-color: var(--el, var(--signal));
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--el, var(--signal)) 25%, transparent);
}

.party-hero .ph-rail { height: 3px; background: var(--el, var(--signal)); }

.party-hero .ph-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px 8px;
}
.party-hero .ph-head .name {
  font-size: 14px; font-weight: 600; letter-spacing: -.01em; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.party-hero .ph-head .lvl {
  flex: none; font-size: 10px; font-weight: 600; color: var(--ink);
  padding: 2px 6px; border: 1px solid var(--hairline); background: var(--bg);
  letter-spacing: .02em;
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
}
.party-hero .ph-head .lvl span { color: var(--muted); font-weight: 500; }

.party-hero .ph-art {
  height: 96px; background: var(--bg);
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  display: grid; place-items: center;
  color: var(--el, var(--muted));
  overflow: hidden;
}
.party-hero .ph-art .glyph { width: 100%; height: 100%; display: grid; place-items: center; }
.party-hero .ph-art svg { width: 62%; height: 62%; display: block; }

.party-hero .ph-body {
  padding: 10px 12px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.party-hero .ph-sub {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted);
}
.party-hero .ph-sub .el-dot { width: 6px; height: 6px; background: var(--el, var(--muted)); border-radius: 50%; }

.party-hero .ph-stat {
  display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; align-items: center;
}
.party-hero .ph-stat .k {
  font-size: 9px; font-weight: 700; letter-spacing: .1em;
  color: var(--muted); text-transform: uppercase;
}
.party-hero .ph-stat .v {
  font-size: 10px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums;
}
.party-hero .ph-stat--hp .meter { height: 6px; }
.party-hero .ph-stat--en .meter { height: 3px; }
.party-hero .ph-stat--en .v { color: var(--muted); font-size: 9px; }

.party-hero .party-slot.is-empty { border-style: dashed; }
.party-hero .party-slot.is-empty .ph-rail { background: var(--hairline); }
.party-hero .party-slot.is-empty .ph-empty {
  display: grid; place-items: center; padding: 34px 12px 30px;
  gap: 10px; text-align: center;
}
.party-hero .party-slot.is-empty .ph-empty .g {
  width: 44px; height: 44px; border: 1px dashed var(--hairline);
  display: grid; place-items: center; color: var(--muted); background: var(--bg);
  font-size: 22px; font-weight: 400; line-height: 1;
  clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
}
.party-hero .party-slot.is-empty .ph-empty .txt {
  font-size: 11px; color: var(--muted); letter-spacing: .04em; line-height: 1.4;
}
.party-hero .party-slot.is-empty .ph-empty .txt b { color: var(--ink); font-weight: 600; }

@media (max-width: 720px) {
  .party-hero { grid-template-columns: 1fr; }
  .party-hero .ph-art { height: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  .party-hero .party-slot { transition: none; }
}

/* ============================================================
   Cyber canvas — HUD-blueprint grid + party surface elevation
   Fine 32px grid on .app-shell provides blueprint texture visible
   only in the gaps between opaque panels; delicate at hairline 40%.
   Party section becomes frameless so party cards elevate to canvas
   white and float over the grid — real depth stack:
   grid canvas → white party cards → sibling panel sections.
   ============================================================ */
.app-shell {
  background: color-mix(in oklab, var(--panel) 50%, var(--hairline));
}

.lobby-section[data-od-id="party-section"] {
  background: transparent;
  border: 0;
  padding: 0;
  clip-path: none;
}
.lobby-section[data-od-id="party-section"] > .row.spread {
  margin-bottom: 14px;
}

.party-hero .party-slot {
  background: var(--bg);

/* ==========================================================================
