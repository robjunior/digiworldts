<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roster — Creature Cards</title>
<style>
  :root{
    /* Brand: Browser based game, about */
    --bg:#ffffff;
    --panel:#f7f8fa;
    --ink:#111111;
    --muted:#6b7280;
    --hairline:#d9dee7;
    --signal:#1677ff;      /* accent — high signal, sparing */
    --battle:#e0384a;      /* accent-secondary — danger/HP */
    --gold:#c8a24a;        /* tertiary / ascend tier */

    --notch:10px;          /* cyberpunk clip depth */
    --font:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;

    --el-fire:#e0384a;
    --el-water:#1677ff;
    --el-nature:#2f9e57;
    --el-electric:#c8a24a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  }

  header{
    padding:32px clamp(20px,5vw,64px) 20px;
    border-bottom:1px solid var(--hairline);
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);}
  h1{font-size:clamp(24px,3.4vw,34px);font-weight:600;letter-spacing:-.02em;margin-top:6px;}
  .lede{color:var(--muted);font-size:14px;margin-top:6px;max-width:52ch;}
  .count{
    font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--muted);
    border:1px solid var(--hairline);padding:8px 14px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .count b{color:var(--ink);}

  main{padding:clamp(24px,4vw,44px) clamp(16px,5vw,64px) 80px;}
  .grid{
    display:grid;gap:24px;grid-template-columns:repeat(3,1fr);
    max-width:1080px;margin:0 auto;perspective:1400px;
  }
  /* Responsive: 3 cols → 2 on small tablet/large phone → 1 on compact phone.
     On touch there's no hover, so the card exposes stats on tap via :active/
     :focus-within (already wired). */
  @media (max-width:680px){
    .grid{grid-template-columns:repeat(2,1fr);gap:14px;}
    header{padding:24px 16px 16px;}
    h1{margin-top:4px;}
  }
  @media (max-width:430px){
    .grid{grid-template-columns:1fr;gap:14px;max-width:400px;}
    .card{aspect-ratio:3/3.4;}   /* shorter card so a single-column list stays scannable */
  }

  /* ================= CARD ================= */
  /* Border traces the notch on ALL corners: card is the border color, clipped
     to the notch; inner surface inset 1px, clipped the same. */
  .card{
    position:relative;aspect-ratio:3/4.3;
    background:var(--hairline);padding:1px;
    clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),
      calc(100% - var(--notch)) 100%,0 100%,0 var(--notch));
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.16,1,.3,1),
               filter .5s cubic-bezier(.16,1,.3,1),background-color .3s;
    will-change:transform;cursor:pointer;
  }
  .card:hover{
    background:color-mix(in oklab,var(--signal) 45%,var(--hairline));
    filter:drop-shadow(0 22px 34px rgba(17,17,17,.28));z-index:2;
  }
  /* Keyboard focus — visible ring that follows the notch (2.4.7 / 1.4.11 / 2.4.13).
     Mouse clicks don't trigger :focus-visible, so no ring churn on pointer use. */
  .card:focus-visible{
    outline:none;
    background:var(--signal);
    filter:drop-shadow(0 0 0 3px color-mix(in oklab,var(--signal) 35%,transparent))
           drop-shadow(0 22px 34px rgba(17,17,17,.28));
    z-index:3;
  }
  .card-inner{
    position:relative;width:100%;height:100%;background:var(--panel);overflow:hidden;
    transform-style:preserve-3d;display:flex;flex-direction:column;
    clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),
      calc(100% - var(--notch)) 100%,0 100%,0 var(--notch));
  }
  .card-inner::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(360px circle at var(--mx,50%) var(--my,0%),
      color-mix(in oklab,var(--el,var(--signal)) 22%,transparent), transparent 60%);
    opacity:0;transition:opacity .4s;mix-blend-mode:multiply;
  }
  .card:hover .card-inner::after{opacity:1;}

  .rail{
    position:absolute;top:0;left:0;right:0;height:4px;z-index:4;
    background:var(--el,var(--signal));transform:scaleX(.4);transform-origin:left;
    transition:transform .5s cubic-bezier(.16,1,.3,1);
  }
  .card:hover .rail{transform:scaleX(1);}

  /* ---- TOP: name + level ---- */
  .meta{padding:16px 16px 10px;position:relative;z-index:2;}
  .name-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .name{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.1;}
  .lvl{
    flex:none;font-size:11px;font-weight:600;color:var(--ink);
    padding:3px 8px;border:1px solid var(--hairline);background:var(--bg);
    letter-spacing:.02em;
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  }
  .lvl span{color:var(--muted);font-weight:500;}

  /* ---- MIDDLE: art (white bg, under everything) ---- */
  .art{
    position:relative;flex:1 1 auto;min-height:0;
    display:grid;place-items:center;background:var(--bg);overflow:hidden;
  }
  .tile{
    width:66%;aspect-ratio:1;position:relative;z-index:0;
    border:1px solid color-mix(in oklab,var(--el,var(--signal)) 40%,var(--hairline));
    background:var(--bg);
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    display:grid;place-items:center;transition:transform .5s cubic-bezier(.16,1,.3,1);
    transform:translateZ(-30px);
  }
  .card:hover .tile{transform:translateZ(-14px) scale(1.03);}
  .glyph{width:50%;height:50%;color:var(--el,var(--signal));}

  /* ---- hover stats: slide DOWN over the art ---- */
  .stats{
    position:absolute;inset:0;z-index:5;
    background:color-mix(in oklab,var(--ink) 96%,var(--el,var(--signal)));
    color:#fff;padding:16px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;align-content:center;
    transform:translateY(-101%);transition:transform .5s cubic-bezier(.16,1,.3,1);
  }
  .card:hover .stats,.card:focus-within .stats,.card.open .stats{transform:translateY(0);}
  .stat{opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s;}
  .card:hover .stat,.card:focus-within .stat,.card.open .stat{opacity:1;transform:none;}
  .card:hover .stat:nth-child(1),.card:focus-within .stat:nth-child(1){transition-delay:.06s;}
  .card:hover .stat:nth-child(2),.card:focus-within .stat:nth-child(2){transition-delay:.11s;}
  .card:hover .stat:nth-child(3),.card:focus-within .stat:nth-child(3){transition-delay:.16s;}
  .card:hover .stat:nth-child(4),.card:focus-within .stat:nth-child(4){transition-delay:.21s;}
  .stat.hp,.stat.energy{grid-column:span 4;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:2px;}
  .stat.role-line{grid-column:span 4;display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:2px 0 8px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.12);}
  .stat.role-line .role-tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;}
  .stat.role-line .role-cap{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);}
  .card:hover .stat.energy,.card:focus-within .stat.energy{transition-delay:.26s;}
  .stat .k{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);}
  .stat .v{font-size:17px;font-weight:600;letter-spacing:.01em;margin-top:2px;}
  .bar{height:5px;background:rgba(255,255,255,.16);position:relative;overflow:hidden;}
  .bar i{position:absolute;inset:0;right:auto;width:var(--pct,70%);
    background:linear-gradient(90deg,var(--battle),color-mix(in oklab,var(--battle) 60%,#fff));
    transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.16,1,.3,1) .18s;}
  .bar.energy-bar i{background:linear-gradient(90deg,var(--signal),color-mix(in oklab,var(--signal) 60%,#fff));}
  .card:hover .bar i,.card:focus-within .bar i,.card.open .bar i{transform:scaleX(1);}
  .hint{
    position:absolute;bottom:12px;left:16px;right:16px;z-index:1;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:6px;transition:opacity .3s;pointer-events:none;
  }
  .card:hover .hint,.card:focus-within .hint,.card.open .hint{opacity:0;}
  .hint svg{width:12px;height:12px;}
  /* On touch devices there's no hover; tell the user to tap */
  @media (hover:none){ .hint .h-lbl::after{content:" — tap"; } }

  /* ---- BOTTOM (foot): kind/element, level+XP, status ---- */
  .foot{position:relative;z-index:2;padding:12px 16px 14px;border-top:1px solid var(--hairline);background:var(--panel);}
  .subline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px;}
  .pill{
    display:inline-flex;align-items:center;gap:5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--el,var(--signal));
    border:1px solid color-mix(in oklab,var(--el,var(--signal)) 35%,var(--hairline));padding:3px 7px;
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  }
  .dot{width:5px;height:5px;background:var(--el,var(--signal));border-radius:50%;}
  .kind{
    display:inline-flex;align-items:center;gap:5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink);border:1px solid var(--hairline);padding:3px 7px;background:var(--bg);
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  }
  .kind svg{width:11px;height:11px;color:var(--muted);}
  .stage-inline{margin-left:auto;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted);}

  /* level + XP row */
  .xp-head{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;
  }
  .xp-head .lv{color:var(--ink);}
  .xp-head .val{font-size:10px;color:var(--ink);letter-spacing:.02em;}
  .xp-head .val b{color:var(--signal);font-weight:600;}
  .xp-track{
    height:6px;background:var(--bg);border:1px solid var(--hairline);position:relative;overflow:hidden;
    clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);
  }
  .xp-track i{position:absolute;inset:0;right:auto;width:var(--xp,60%);background:var(--signal);
    transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.16,1,.3,1) .1s;}
  .card.in .xp-track i{transform:scaleX(1);}

  /* status: Treinando / In Party / Resting */
  .status{
    margin-top:12px;display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:var(--bg);border:1px solid var(--hairline);--st:var(--muted);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .status-dot{width:8px;height:8px;flex:none;background:var(--st);
    box-shadow:0 0 0 3px color-mix(in oklab,var(--st) 22%,transparent);}
  .status-label{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink);}
  .status-note{margin-left:auto;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--st);}
  .status--party .status-dot,.status--training .status-dot{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 3px color-mix(in oklab,var(--st) 22%,transparent);}
    50%{box-shadow:0 0 0 6px color-mix(in oklab,var(--st) 8%,transparent);}
  }
  .status--party    {--st:var(--signal);}
  .status--training {--st:var(--gold);}
  .status--resting  {--st:var(--el-nature);}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms!important;animation:none!important;}
    /* bars/tiles animate via transform:scaleX(0)→(1); with transitions off we
       must show them already full instead of empty */
    .bar i,.xp-track i{transform:scaleX(1)!important;}
    .stat{opacity:1!important;transform:none!important;}
    .tile{transform:none!important;}
  }
</style>
</head>
<body>
  <header data-od-id="roster-header">
    <div>
      <div class="eyebrow">Roster</div>
      <h1>Your Creatures</h1>
      <p class="lede">Raise and train your team. Hover a card to read its combat stats.</p>
    </div>
    <div class="count" data-od-id="roster-count"><b>9</b> owned</div>
  </header>

  <main>
    <div class="grid" id="grid" role="list" aria-label="Creature roster, 9 owned" data-od-id="card-grid"></div>
  </main>

<script>
/* Example data — game source at /mnt/sdc/digimonds is empty, so these
   are illustrative placeholder creatures, not real game values. */
const EL = {
  fire:{c:'var(--el-fire)',label:'Fire'},
  water:{c:'var(--el-water)',label:'Water'},
  nature:{c:'var(--el-nature)',label:'Nature'},
  electric:{c:'var(--el-electric)',label:'Electric'},
};
const GLYPH = {
  fire:'M12 2c1 4 4 5 4 9a4 4 0 1 1-8 0c0-2 1-3 2-4-2 0-3 2-3 4a6 6 0 1 0 12 0c0-5-4-7-7-9Z',
  water:'M12 3c4 5 6 8 6 11a6 6 0 1 1-12 0c0-3 2-6 6-11Z',
  nature:'M12 21V9M12 9C12 5 9 3 5 3c0 4 3 6 7 6ZM12 11c0-3 3-5 7-5 0 4-3 5-7 5Z',
  electric:'M13 2 4 14h6l-1 8 9-12h-6l1-8Z',
};
/* creature KIND (biological/mechanical class) — distinct from combat role */
const KIND = {
  mammal:  {label:'Mammal',  icon:'M4 12a6 6 0 0 1 12 0M6 8V5m8 3V5M9 20h6a3 3 0 0 0 3-3'},
  robot:   {label:'Robot',   icon:'M5 8h14v10H5zM9 3v3M15 3v3M9 13h.01M15 13h.01M2 12h3M19 12h3'},
  reptile: {label:'Reptile', icon:'M3 12c5 0 6-6 11-6s7 4 7 6-3 4-6 4H8l-3 3'},
  bird:    {label:'Bird',    icon:'M16 7l5-2-3 5c0 5-4 8-8 8-3 0-5-2-5-2s4 0 5-3c-3 0-5-3-5-3s3 1 5-1'},
  aquatic: {label:'Aquatic', icon:'M3 12c4-5 14-5 18 0-4 5-14 5-18 0ZM12 9v6'},
};
const STATUS = {
  party:    {label:'In Party',  note:'Deployed'},
  training: {label:'Treinando', note:'+XP / hr'},
  resting:  {label:'Resting',   note:'Recovering'},
};
const creatures = [
  {name:'Agnimon',   role:'Attacker', kind:'reptile', el:'fire',     stage:'Champion', lvl:24, hp:840,  hpMax:900, en:60, enMax:80, atk:186, def:92,  spd:141, xp:3120, xpMax:4000, status:'party'},
  {name:'Ondina',    role:'Support',  kind:'aquatic', el:'water',    stage:'Rookie',   lvl:12, hp:520,  hpMax:520, en:44, enMax:50, atk:88,  def:120, spd:96,  xp:640,  xpMax:1500, status:'training'},
  {name:'Verdanix',  role:'Tank',     kind:'mammal',  el:'nature',   stage:'Champion', lvl:27, hp:1120, hpMax:1200,en:70, enMax:90, atk:104, def:210, spd:63,  xp:4880, xpMax:5200, status:'resting'},
  {name:'Voltaru',   role:'Attacker', kind:'robot',   el:'electric', stage:'Ultimate', lvl:33, hp:760,  hpMax:980, en:88, enMax:110,atk:224, def:78,  spd:198, xp:2050, xpMax:6800, status:'party'},
  {name:'Pyrrha',    role:'Attacker', kind:'bird',    el:'fire',     stage:'Rookie',   lvl:9,  hp:410,  hpMax:410, en:30, enMax:40, atk:132, def:54,  spd:118, xp:210,  xpMax:1200, status:'training'},
  {name:'Coralux',   role:'Support',  kind:'aquatic', el:'water',    stage:'Ultimate', lvl:31, hp:940,  hpMax:1050,en:76, enMax:100,atk:96,  def:168, spd:124, xp:5700, xpMax:6200, status:'resting'},
  {name:'Emberling', role:'Attacker', kind:'reptile', el:'fire',     stage:'Champion', lvl:19, hp:680,  hpMax:720, en:52, enMax:70, atk:158, def:74,  spd:133, xp:1420, xpMax:3000, status:'resting'},
  {name:'Sylvox',    role:'Tank',     kind:'mammal',  el:'nature',   stage:'Rookie',   lvl:14, hp:760,  hpMax:760, en:48, enMax:60, atk:70,  def:158, spd:58,  xp:900,  xpMax:1800, status:'training'},
  {name:'Arcbyte',   role:'Attacker', kind:'robot',   el:'electric', stage:'Champion', lvl:28, hp:820,  hpMax:900, en:64, enMax:95, atk:204, def:96,  spd:176, xp:3960, xpMax:5000, status:'party'},
];

const grid = document.getElementById('grid');
grid.innerHTML = creatures.map((c)=>{
  const el = EL[c.el];
  const kd = KIND[c.kind];
  const pct = Math.round(c.hp/c.hpMax*100);
  const enPct = Math.round(c.en/c.enMax*100);
  const xpPct = Math.round(c.xp/c.xpMax*100);
  const st = STATUS[c.status];
  const label = `${c.name}, level ${c.lvl} ${el.label} ${kd.label}, ${c.role}, ${c.stage}. `
    + `HP ${c.hp} of ${c.hpMax}, Energy ${c.en} of ${c.enMax}, `
    + `ATK ${c.atk}, DEF ${c.def}, SPD ${c.spd}. `
    + `XP ${c.xp} of ${c.xpMax}. Status: ${st.label}, ${st.note}.`;
  return `
  <article class="card" role="listitem" tabindex="0" aria-label="${label}" style="--el:${el.c}" data-od-id="card-${c.name.toLowerCase()}">
    <div class="card-inner">
    <span class="rail" aria-hidden="true"></span>

    <div class="meta">
      <div class="name-row">
        <div class="name">${c.name}</div>
        <span class="lvl"><span>LV</span> ${c.lvl}</span>
      </div>
    </div>

    <div class="art">
      <div class="tile">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="${GLYPH[c.el]}"/>
        </svg>
      </div>
      <div class="stats" aria-hidden="true">
        <div class="stat role-line"><span class="role-cap">Role</span><span class="role-tag">${c.role}</span></div>
        <div class="stat"><div class="k">ATK</div><div class="v">${c.atk}</div></div>
        <div class="stat"><div class="k">DEF</div><div class="v">${c.def}</div></div>
        <div class="stat"><div class="k">SPD</div><div class="v">${c.spd}</div></div>
        <div class="stat"><div class="k">LV</div><div class="v">${c.lvl}</div></div>
        <div class="stat hp">
          <div class="k">HP</div>
          <div class="bar" role="progressbar" aria-label="HP" aria-valuenow="${c.hp}" aria-valuemin="0" aria-valuemax="${c.hpMax}"><i style="--pct:${pct}%"></i></div>
          <div class="v">${c.hp}<span style="color:rgba(255,255,255,.45);font-weight:500"> / ${c.hpMax}</span></div>
        </div>
        <div class="stat energy">
          <div class="k">EN</div>
          <div class="bar energy-bar" role="progressbar" aria-label="Energy" aria-valuenow="${c.en}" aria-valuemin="0" aria-valuemax="${c.enMax}"><i style="--pct:${enPct}%"></i></div>
          <div class="v">${c.en}<span style="color:rgba(255,255,255,.45);font-weight:500"> / ${c.enMax}</span></div>
        </div>
      </div>
      <div class="hint" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="h-lbl">Hover for stats</span>
      </div>
    </div>

    <div class="foot">
      <div class="subline">
        <span class="pill"><span class="dot" aria-hidden="true"></span>${el.label}</span>
        <span class="kind">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"
               stroke-linecap="round" stroke-linejoin="round"><path d="${kd.icon}"/></svg>
          ${kd.label}
        </span>
        <span class="stage-inline">${c.stage}</span>
      </div>

      <div class="xp">
        <div class="xp-head">
          <span class="lv">LEVEL ${c.lvl}</span>
          <span class="val"><b>${c.xp.toLocaleString()}</b> / ${c.xpMax.toLocaleString()} XP</span>
        </div>
        <div class="xp-track" role="progressbar" aria-label="XP to next level" aria-valuenow="${c.xp}" aria-valuemin="0" aria-valuemax="${c.xpMax}"><i style="--xp:${xpPct}%"></i></div>
      </div>

      <div class="status status--${c.status}">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label">${st.label}</span>
        <span class="status-note">${st.note}</span>
      </div>
    </div>

    </div>
  </article>`;
}).join('');

/* fill XP bars once mounted */
const cards=grid.querySelectorAll('.card');
requestAnimationFrame(()=>cards.forEach(c=>c.classList.add('in')));

/* Touch: no hover, so a tap toggles the stat panel (one card open at a time).
   Enter/Space also toggle for keyboard users. */
const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
cards.forEach(card=>{
  function toggle(){
    const wasOpen=card.classList.contains('open');
    cards.forEach(c=>c.classList.remove('open'));
    if(!wasOpen) card.classList.add('open');
  }
  if(!canHover){
    card.addEventListener('click', toggle);
  }
  card.addEventListener('keydown', e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }
  });
});

/* pointer-tracked 3D tilt + sheen — only on fine-hover devices, skipped under reduced motion */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX=9;
if(canHover && !reduceMotion) cards.forEach(card=>{
  let raf=null;
  function move(e){
    const r=card.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width;
    const py=(e.clientY-r.top)/r.height;
    card.style.setProperty('--mx',(px*100)+'%');
    card.style.setProperty('--my',(py*100)+'%');
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      const rx=(0.5-py)*MAX, ry=(px-0.5)*MAX;
      card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) translateY(-6px)`;
      raf=null;
    });
  }
  function leave(){ if(raf){cancelAnimationFrame(raf);raf=null;} card.style.transform=''; }
  card.addEventListener('pointermove',move);
  card.addEventListener('pointerleave',leave);
  card.addEventListener('blur',leave);
});
</script>
</body>
</html>
