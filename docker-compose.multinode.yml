# ============================================================================
# DigiWorld — multi-node deployment stack.
#
#   ┌─────────┐    :80    ┌───────────┐
#   │  nginx  │────────▶  │ game-node1 │──┐
#   │ ip_hash │            └───────────┘  ├──▶ redis:6379
#   │  upstream            ┌───────────┐  │
#   │  (both)  ├────────▶  │ game-node2 │──┤
#   └─────────┘            └───────────┘  ├──▶ postgres:5432
#                                          │
#                                          └──▶ (shared volume for XML catalog +
#                                                    scraped assets)
#
# Both game nodes share Redis for cluster state (sessions, presence, chat,
# matchmaking queue, live battle state, cross-node WS delivery) and Postgres
# for durable data (users, roster, wallet, matches, farm, catalog metadata).
#
# `ip_hash` sticky routing keeps a client's WebSocket pinned to a single
# node for the connection's lifetime; sessions in Redis mean HTTP fallback
# still works if the client hits the other node. Battle events and match
# starts route to the correct node via `wsdeliver:{userId}` pub/sub so
# even a wrong-node HTTP request finds its way home.
#
# Usage:
#   docker compose -f docker-compose.multinode.yml up --build
#   Open http://localhost:8080/
#
# CLUSTER=redis and DATABASE=postgres are both fully wired end-to-end (see
# README §Multi-node and test/postgres-portability.mts). This compose ships
# DATABASE=postgres by default — the stack already runs a real Postgres 16
# next door, so there's no reason to fall back to SQLite here. To pin to
# SQLite (e.g. a local demo without external services), swap the two
# commented DATABASE lines under each game-node and drop the postgres service.
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: digiworld-postgres-1
    environment:
      POSTGRES_USER: digiworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and edit}
      POSTGRES_DB: digiworld
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digiworld']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: digiworld-redis-1
    command:
      - 'redis-server'
      - '--appendonly'
      - 'yes'
      - '--requirepass'
      - '${REDIS_PASSWORD:?REDIS_PASSWORD is required - copy .env.example to .env and edit}'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  game-node1: &game
    build: .
    container_name: digiworld-game-node1-1
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_ID: game-node1
      HOST: 0.0.0.0
      PORT: 3000
      CLUSTER: redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE: postgres
      DATABASE_URL: postgres://digiworld:${POSTGRES_PASSWORD}@postgres:5432/digiworld
      # DATABASE: sqlite            # SQLite fallback — uncomment (and comment postgres above) to switch
      # DB_PATH: /data/digiworld.db # shared via the `gamedata` volume below
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required min 32 chars - copy .env.example to .env and edit}
      ADMIN_BOOTSTRAP: ${ADMIN_BOOTSTRAP:-closed}
    volumes:
      - gamedata:/data
      - ./backend/public/assets/digimon:/app/backend/public/assets/digimon
      - ./backend/data/catalog:/app/backend/data/catalog
      # Read-only: sync only reads these, and they are git-versioned source.
      - ./backend/data/dialogues:/app/backend/data/dialogues:ro

  game-node2:
    <<: *game
    container_name: digiworld-game-node2-1
    environment:
      NODE_ENV: production
      NODE_ID: game-node2
      HOST: 0.0.0.0
      PORT: 3000
      CLUSTER: redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE: postgres
      DATABASE_URL: postgres://digiworld:${POSTGRES_PASSWORD}@postgres:5432/digiworld
      # DATABASE: sqlite            # SQLite fallback — uncomment (and comment postgres above) to switch
      # DB_PATH: /data/digiworld.db # shared via the `gamedata` volume below
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required min 32 chars - copy .env.example to .env and edit}
      ADMIN_BOOTSTRAP: ${ADMIN_BOOTSTRAP:-closed}

  nginx:
    image: nginx:1.27-alpine
    container_name: digiworld-nginx-1
    depends_on: [game-node1, game-node2]
    ports:
      - '8080:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  redisdata:
  gamedata:
