<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DigiWorld — Training</title>
  <link rel="icon" type="image/gif" href="/assets/digimon/skb-50/dot.gif" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <style>
    .sec-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
    .sec-head h2 { font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0; }
    .city { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
    @media (max-width:860px) { .city { grid-template-columns:repeat(2, 1fr); } }
    @media (max-width:520px) { .city { grid-template-columns:1fr; } }
    
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; z-index:100; place-items:center; padding:24px; }
    .modal-overlay.show { display:grid; }
    .modal-card { background:var(--panel); border:1px solid var(--hairline); max-width:640px; width:100%; padding:20px 24px 24px; max-height:90vh; overflow:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--hairline); }
    .modal-header h3 { margin:0; font-size:18px; font-weight:600; }
    .modal-close { background:none; border:none; color:var(--muted); font-size:24px; cursor:pointer; padding:0 4px; line-height:1; }
    .modal-close:hover { color:var(--ink); }

    .picker-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; max-height:280px; overflow-y:auto; margin-bottom:20px; }
    .mon-pick-card { display:flex; align-items:center; gap:12px; padding:8px; border:1px solid var(--hairline); background:var(--bg); cursor:pointer; transition:border-color 0.2s; }
    .mon-pick-card:hover:not(.is-disabled) { border-color:var(--ink); }
    .mon-pick-card.is-selected { border-color:var(--signal); background:color-mix(in oklab, var(--signal) 10%, transparent); }
    .mon-pick-card.is-disabled { opacity:0.4; cursor:not-allowed; }
    .mon-pick-card img { width:48px; height:48px; object-fit:contain; background:rgba(0,0,0,0.1); border:1px solid var(--hairline); }
    .mon-pick-card .name { font-size:14px; font-weight:600; }
    .mon-pick-card .sub { font-size:11px; color:var(--muted); margin-top:2px; }

    .picker-title { margin:0 0 12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
    .btn-group { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
    
    .empty-help { grid-column: 1 / -1; padding:32px; text-align:center; background:var(--panel); border:1px solid var(--hairline);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    
    .bld .art.has-mon { flex-direction:column; padding:16px; justify-content:center; gap:8px; }
    .bld .art.has-mon img { width:64px; height:64px; object-fit:contain; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
    .bld .mon-info { display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:12px; }
    .bld .mon-name { font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px; }
    .bld .mon-lvl { font-size:11px; font-weight:600; color:var(--ink); padding:2px 6px; border:1px solid var(--hairline); background:var(--bg); }
    .bld .mon-stage { font-size:11px; color:var(--muted); font-weight:normal; margin-left:6px; }
    .mood-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  
    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; grid-column: 1/-1; }
    .pagination .page-info { margin-right: 16px; font-size: 13px; color: var(--muted); }
    .pagination button { background: var(--panel); border: 1px solid var(--hairline); color: var(--muted); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; transition: all 0.2s; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
    .pagination button:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
    .pagination button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav"></nav>
    <main class="app-main">
      <div class="hud-header">
        <div>
          <div class="eyebrow">City</div>
          <h1>Training Ground</h1>
        </div>
        <div class="count"><b id="station-count">0</b> stations · <b id="active-count">0</b> active</div>
      </div>

      <div class="sec-head" style="margin-top:24px;">
        <h2>Training Stations</h2>
      </div>

      <section class="city training-grid" id="training-city" aria-label="Training Stations"></section>
    </main>
  </div>

  <div id="training-assign-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="training-assign-title">Assign Digimon</h3>
        <button class="modal-close" id="btn-assign-close" aria-label="Close">×</button>
      </div>
      <div id="assign-body">
        <div style="font-size:13px; color:var(--muted); margin-bottom:16px;" id="training-assign-inst">
          Choose a Digimon (must not be in party) and 1 stat.
        </div>
        
        <div id="assign-mon-picker" class="picker-grid"></div>
        <div id="assign-mon-picker-foot"></div>

        <h4 class="picker-title">Pick Stats</h4>
        <div id="assign-stat-picker" class="btn-group"></div>

        <h4 class="picker-title">Duration</h4>
        <div id="assign-dur-picker" class="btn-group"></div>

        <div id="training-assign-preview" style="font-size:13px; color:var(--ink); margin-bottom:20px; min-height:1.5em; padding:12px; background:var(--bg); border:1px solid var(--hairline);">
          Select a Digimon, stats, and duration to see preview.
        </div>
        
        <div style="display:flex; gap:12px; justify-content:flex-end; border-top:1px solid var(--hairline); padding-top:16px;">
          <button class="btn btn--secondary" id="btn-assign-cancel">Cancel</button>
          <button class="btn" id="btn-assign-confirm" disabled>Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api, toast, setText } from '/assets/js/api.js';
    import { requireLogin, renderNav } from '/assets/js/auth-guard.js';

    const STAGE_MULT = { 'Baby': 0.5, 'In-Training': 0.7, 'Rookie': 1.0, 'Champion': 1.5, 'Ultimate': 2.0, 'Mega': 3.0 };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    let state = { stations: [], eligibleMons: [], durationPresetsMin: [], trainableStats: [] };
    let rosterDict = new Map();
    let pollTimer = null;

    let draft = { buildingId: null, monId: null, statKinds: [], durationMin: null, maxStats: 1 };

    let pickerPage = 1;
    const PICKER_PER_PAGE = 6;
    window.setPickerPage = function(p) { pickerPage = p; renderMonPicker(); };

    (async () => {
      await requireLogin();
      renderNav(document.getElementById('app-nav'), 'training');
      
      document.getElementById('btn-assign-close').addEventListener('click', closeAssignModal);
      document.getElementById('btn-assign-cancel').addEventListener('click', closeAssignModal);
      document.getElementById('btn-assign-confirm').addEventListener('click', submitAssign);
      document.getElementById('training-assign-modal').addEventListener('click', (e) => {
        if (e.target.id === 'assign-modal') closeAssignModal();
      });

      await load();
      pollTimer = setInterval(load, 30000);
      setInterval(updateProgress, 1000);
      window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });
    })().catch((err) => { console.error(err); toast(err.message || 'boot failed', { error: true }); });

    async function load() {
      try {
        const [tRes, rRes] = await Promise.all([
          api.get('/api/training'),
          api.get('/api/roster')
        ]);
        state = tRes;
        
        rosterDict.clear();
        if (rRes.roster) {
          for (const m of rRes.roster) rosterDict.set(m.id, m);
        }
        
        paintStations();
      } catch (err) {
        toast(err.message || 'load failed', { error: true });
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }
    }

    function getMoodColor(mood) {
      if (mood < 20) return 'var(--battle)';
      if (mood < 40) return 'var(--gold)';
      if (mood < 60) return 'var(--muted)';
      if (mood < 80) return 'var(--el-nature)';
      return '#4c8';
    }

    function getMoodDelta(min) {
      if (min < 30) return 3;
      if (min < 120) return 0;
      if (min < 240) return -5;
      return -15;
    }

    function paintStations() {
      setText('station-count', String(state.stations.length));
      setText('active-count', String(state.stations.filter(s => s.active).length));

      const el = document.getElementById('training-city');
      if (state.stations.length === 0) {
        el.innerHTML = `<div class="empty-help">
          <h3 style="margin:0 0 12px;font-size:18px;">No Training Stations</h3>
          <p style="margin:0;color:var(--muted);font-size:14px;">Buy a Training Station from the Shop (500 credits) or a Premium Training Station (2000 credits).</p>
        </div>`;
        return;
      }

      el.innerHTML = state.stations.map((b) => {
        const isPremium = b.buildingType === 'training_premium';
        if (!b.active) {
          return `<article class="bld" style="--rc:var(--signal)">
            <div class="art">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.25;width:64px;height:64px;">
                <circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path>
              </svg>
            </div>
            <div class="body">
              <div class="top">
                <span class="bname">${escape(b.kind)}</span>
                <span class="rate"><b>${isPremium ? 'PREMIUM' : 'BASIC'}</b> · ${b.supportedStatCount} stat${b.supportedStatCount > 1 ? 's' : ''}</span>
              </div>
              <div style="flex:1; display:flex; align-items:center; color:var(--muted); font-size:13px; line-height:1.5;">
                Empty station.<br/>Assign a Digimon to train.
              </div>
              <div class="foot">
                <button class="btn btn--wide" data-assign="${escape(b.buildingId)}">Assign Digimon</button>
              </div>
            </div>
          </article>`;
        }

        const a = b.active;
        const now = Date.now();
        const rawPct = ((now - a.startedAt) / a.durationMs) * 100;
        const pct = clamp(Math.floor(rawPct), 0, 100);
        const ready = pct >= 100 || a.readyToCollect;
        
        let portrait = '';
        let currentMood = 50;
        const rosterMon = rosterDict.get(a.monId);
        if (rosterMon && rosterMon.template) {
          portrait = rosterMon.template.assets.portrait;
          currentMood = rosterMon.mood;
        }

        return `<article class="bld ${ready ? 'is-ready' : ''}" data-bld="${escape(b.buildingId)}" data-finishes="${a.finishesAt}" style="--rc:var(--signal)">
          <div class="art has-mon">
            <div class="lv">Lv ${a.monLevel}</div>
            ${ready ? '<div class="ready-dot"></div>' : ''}
            <img src="${escape(portrait)}" alt="${escape(a.monNickname)}" onerror="this.style.opacity=0.15" />
          </div>
          <div class="body">
            <div class="top" style="margin-bottom:8px;">
              <span class="bname">${escape(b.kind)}</span>
              <span class="rate"><b>${isPremium ? 'PREMIUM' : 'BASIC'}</b></span>
            </div>
            
            <div class="mon-info">
              <div class="mon-name">
                <span class="mood-dot" style="background:${getMoodColor(currentMood)};" title="Mood: ${currentMood}"></span>
                ${escape(a.monNickname)}
                <span class="mon-stage">${escape(a.monStage)}</span>
              </div>
            </div>
            
            <div style="display:flex; gap:6px; margin-bottom:12px;">
              ${a.statKinds.map(s => `<span class="pill">${s.toUpperCase()}</span>`).join('')}
            </div>

            <div class="store">
              <div class="store-head">
                <span class="status-txt">${ready ? 'Ready to collect!' : 'Training...'}</span>
                <span class="v countdown">${ready ? '0m 0s' : '--:--'}</span>
              </div>
              <div class="fill" role="progressbar">
                <i style="--pct:${pct}%"></i>
              </div>
            </div>
            
            <div style="font-size:11px; color:var(--muted); margin-top:8px;">
              Will gain <b>+${a.previewGainPerStat}</b> per stat. Mood ${a.previewMoodDelta >= 0 ? '+' : ''}${a.previewMoodDelta}.
            </div>
            
            <div class="foot">
              <button class="btn btn--secondary" data-cancel="${escape(b.buildingId)}">Cancel</button>
              <button class="btn btn-collect" data-collect="${escape(b.buildingId)}" ${ready ? '' : 'disabled'}>Collect</button>
            </div>
          </div>
        </article>`;
      }).join('');

      el.querySelectorAll('[data-assign]').forEach(btn => btn.addEventListener('click', () => openAssignModal(btn.dataset.assign)));
      el.querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', () => cancelTraining(btn.dataset.cancel)));
      el.querySelectorAll('[data-collect]').forEach(btn => btn.addEventListener('click', () => collectTraining(btn.dataset.collect)));
      
      updateProgress();
    }

    function updateProgress() {
      const now = Date.now();
      document.querySelectorAll('.bld[data-finishes]').forEach(article => {
        const finishesAt = parseInt(article.dataset.finishes, 10);
        const diff = finishesAt - now;
        const btnCollect = article.querySelector('.btn-collect');
        const countdown = article.querySelector('.countdown');
        const fillI = article.querySelector('.fill i');
        const statusTxt = article.querySelector('.status-txt');
        
        // Recover start time assuming finishesAt - durationMs. Since durationMs is not in dataset,
        // we could put durationMs in dataset too. Wait, we can just find it in state.
        const bldId = article.dataset.bld;
        const station = state.stations.find(s => s.buildingId === bldId);
        if (!station || !station.active) return;
        
        const a = station.active;
        const rawPct = ((now - a.startedAt) / a.durationMs) * 100;
        const pct = clamp(Math.floor(rawPct), 0, 100);
        
        fillI.style.setProperty('--pct', pct + '%');
        
        if (diff <= 0) {
          countdown.textContent = '0m 0s';
          statusTxt.textContent = 'Ready to collect!';
          btnCollect.removeAttribute('disabled');
          article.classList.add('is-ready');
          if (!article.querySelector('.ready-dot')) {
            const dot = document.createElement('div');
            dot.className = 'ready-dot';
            article.querySelector('.art').appendChild(dot);
          }
        } else {
          const m = Math.floor(diff / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          countdown.textContent = `${m}m ${s}s`;
        }
      });
    }

    function renderMonPicker() {
      const monPicker = document.getElementById('assign-mon-picker');
      const pickerFoot = document.getElementById('assign-mon-picker-foot');
      const eligible = state.eligibleMons || [];

      if (eligible.length === 0 || eligible.every(m => m.inParty)) {
        monPicker.innerHTML = `<div style="grid-column:1/-1; padding:20px; text-align:center; color:var(--muted); background:var(--bg); border:1px solid var(--hairline);">
          No available Digimon.<br/>Remove a Digimon from your party first (via Roster).
        </div>`;
        if (pickerFoot) pickerFoot.innerHTML = '';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(eligible.length / PICKER_PER_PAGE));
      if (pickerPage > totalPages) pickerPage = totalPages;
      const startIdx = (pickerPage - 1) * PICKER_PER_PAGE;
      const pageItems = eligible.slice(startIdx, startIdx + PICKER_PER_PAGE);

      monPicker.innerHTML = pageItems.map(m => {
        const selectedCls = draft.monId === m.monId ? 'is-selected' : '';
        return `<div class="mon-pick-card ${m.inParty ? 'is-disabled' : ''} ${selectedCls}" data-mon="${escape(m.monId)}" ${m.inParty ? 'title="In party (remove first)"' : ''}>
          <img src="${escape(m.portrait)}" onerror="this.style.opacity=0.15" />
          <div class="info">
            <div class="name">${escape(m.nickname)}</div>
            <div class="sub">Lv ${m.level} ${escape(m.stage)}</div>
          </div>
        </div>`;
      }).join('');

      if (pickerFoot) {
        if (eligible.length <= PICKER_PER_PAGE) {
          pickerFoot.innerHTML = '';
        } else {
          let phtml = `<div class="pagination">
            <div class="page-info">Showing ${startIdx + 1}-${Math.min(startIdx + PICKER_PER_PAGE, eligible.length)} of ${eligible.length}</div>
            <button ${pickerPage === 1 ? 'disabled' : ''} onclick="window.setPickerPage(${pickerPage - 1})">← Prev</button>`;
          for (let i = 1; i <= totalPages; i++) {
            phtml += `<button class="${i === pickerPage ? 'active' : ''}" onclick="window.setPickerPage(${i})">${i}</button>`;
          }
          phtml += `<button ${pickerPage === totalPages ? 'disabled' : ''} onclick="window.setPickerPage(${pickerPage + 1})">Next →</button></div>`;
          pickerFoot.innerHTML = phtml;
        }
      }

      monPicker.querySelectorAll('.mon-pick-card:not(.is-disabled)').forEach(el => {
        el.addEventListener('click', () => {
          draft.monId = el.dataset.mon;
          monPicker.querySelectorAll('.mon-pick-card').forEach(x => x.classList.remove('is-selected'));
          el.classList.add('is-selected');
          updateDraftPreview();
        });
      });
    }

    function openAssignModal(buildingId) {
      const station = state.stations.find(s => s.buildingId === buildingId);
      if (!station) return;
      
      draft = { buildingId, monId: null, statKinds: [], durationMin: null, maxStats: station.supportedStatCount };
      
      setText('assign-title', `Assign to ${station.kind}`);
      setText('assign-inst', `Choose a Digimon (must not be in party) and ${draft.maxStats} stat${draft.maxStats > 1 ? 's' : ''}.`);
      
      pickerPage = 1;
      renderMonPicker();

      document.getElementById('assign-stat-picker').innerHTML = state.trainableStats.map(s => {
        return `<button class="btn btn--secondary stat-btn" data-stat="${s}">${s.toUpperCase()}</button>`;
      }).join('');

      document.getElementById('assign-dur-picker').innerHTML = state.durationPresetsMin.map(d => {
        let label = d < 60 ? `${d} min` : `${d/60} hr${d/60 > 1 ? 's' : ''}`;
        return `<button class="btn btn--secondary dur-btn" data-dur="${d}">${label}</button>`;
      }).join('');

      document.getElementById('training-assign-modal').classList.add('show');
      
      // Stat + duration handlers (mon-picker handlers live inside renderMonPicker so they re-attach per page)

      document.querySelectorAll('.stat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = btn.dataset.stat;
          if (draft.statKinds.includes(s)) {
            draft.statKinds = draft.statKinds.filter(x => x !== s);
            btn.classList.replace('btn--primary', 'btn--secondary');
            btn.style.background = '';
            btn.style.color = '';
          } else {
            if (draft.statKinds.length < draft.maxStats) {
              draft.statKinds.push(s);
              btn.classList.replace('btn--secondary', 'btn--primary');
              btn.style.background = 'var(--signal)';
              btn.style.color = '#fff';
            } else {
              toast(`You can only pick ${draft.maxStats} stat${draft.maxStats > 1 ? 's' : ''}.`);
            }
          }
          updateDraftPreview();
        });
      });

      document.querySelectorAll('.dur-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          draft.durationMin = parseInt(btn.dataset.dur, 10);
          document.querySelectorAll('.dur-btn').forEach(x => {
            x.classList.replace('btn--primary', 'btn--secondary');
            x.style.background = '';
            x.style.color = '';
          });
          btn.classList.replace('btn--secondary', 'btn--primary');
          btn.style.background = 'var(--signal)';
          btn.style.color = '#fff';
          updateDraftPreview();
        });
      });

      updateDraftPreview();
    }

    function updateDraftPreview() {
      const mon = state.eligibleMons.find(m => m.monId === draft.monId);
      const dur = draft.durationMin;
      const stats = draft.statKinds.length;
      
      if (!mon || !dur || stats !== draft.maxStats) {
        setText('assign-preview', 'Select a Digimon, stats, and duration to see preview.');
        document.getElementById('btn-assign-confirm').disabled = true;
        return;
      }
      
      const mult = STAGE_MULT[mon.stage] || 1.0;
      const gain = Math.max(1, Math.round(4 * (dur / 60) * mult / stats));
      const moodDelta = getMoodDelta(dur);
      
      const moodStr = moodDelta > 0 ? `+${moodDelta}` : String(moodDelta);
      setText('assign-preview', `This will grant approximately +${gain} per stat, mood ${moodStr}.`);
      document.getElementById('btn-assign-confirm').disabled = false;
    }

    async function submitAssign() {
      if (!draft.buildingId || !draft.monId || draft.statKinds.length !== draft.maxStats || !draft.durationMin) return;
      document.getElementById('btn-assign-confirm').disabled = true;
      try {
        const res = await api.post(`/api/training/assign/${encodeURIComponent(draft.buildingId)}`, {
          monId: draft.monId,
          statKinds: draft.statKinds,
          durationMs: draft.durationMin * 60000
        });
        toast('Training started');
        state = res.view;
        closeAssignModal();
        paintStations();
      } catch (err) {
        toast(err.message || 'assign failed', { error: true });
        document.getElementById('btn-assign-confirm').disabled = false;
      }
    }

    function closeAssignModal() {
      document.getElementById('training-assign-modal').classList.remove('show');
    }

    async function collectTraining(buildingId) {
      try {
        const res = await api.post(`/api/training/collect/${encodeURIComponent(buildingId)}`);
        const gainedStrs = Object.entries(res.gained).map(([k,v]) => `+${v} ${k.toUpperCase()}`);
        let moodLabel = 'neutral';
        if (res.newMood < 20) moodLabel = 'miserable';
        else if (res.newMood < 40) moodLabel = 'sad';
        else if (res.newMood < 60) moodLabel = 'neutral';
        else if (res.newMood < 80) moodLabel = 'content';
        else moodLabel = 'happy';
        
        toast(`Gained ${gainedStrs.join(', ')}. Mood: ${res.moodDelta >= 0 ? '+'+res.moodDelta : res.moodDelta} (now ${res.newMood}/100 - ${moodLabel})`);
        state = res.view;
        paintStations();
      } catch (err) {
        toast(err.message || 'collect failed', { error: true });
      }
    }

    async function cancelTraining(buildingId) {
      if (!confirm('Cancel training? No stats gained, no mood penalty.')) return;
      try {
        const res = await api.post(`/api/training/cancel/${encodeURIComponent(buildingId)}`);
        toast('Training cancelled');
        state = res.view;
        paintStations();
      } catch (err) {
        toast(err.message || 'cancel failed', { error: true });
      }
    }

    function escape(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
  </script>
