<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DigiWorld — Nursery</title>
  <link rel="icon" type="image/gif" href="/assets/digimon/skb-50/dot.gif" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <style>
    body.nursery {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      user-select: none;
    }
    body.nursery .app-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 25;
      background: color-mix(in oklab, var(--bg) 82%, transparent);
      backdrop-filter: blur(8px) saturate(1.05);
      border-bottom: 1px solid var(--hairline);
      pointer-events: auto;
    }

    .nursery-shell {
      position: fixed;
      inset: 56px 0 0 0;
      display: grid;
      grid-template-columns: 1fr 340px;
    }

    .yard {
      position: relative;
      overflow: hidden;
      background: #0d1117;
    }

    #yard-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .yard-header {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 4;
      background: color-mix(in oklab, #fff 85%, transparent);
      border: 1px solid var(--hairline);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--el-nature);
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }

    .mon-sprite {
      position: absolute;
      width: 64px;
      height: 64px;
      z-index: 10;
      pointer-events: none;
      will-change: transform;
      transition: transform 60ms linear;
    }
    .mon-sprite img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55));
      display: block;
      animation: bob 0.9s ease-in-out infinite;
    }
    .mon-sprite.is-facing-right img {
      transform: scaleX(-1);
    }
    .mon-sprite.is-jumping img {
      animation: hop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mon-sprite .label {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .mon-sprite .heart {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      color: #e34a6a;
      font-size: 22px;
      pointer-events: none;
      animation: heart-pop 900ms ease-out forwards;
    }
    .mon-sprite .food {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      font-size: 18px;
      pointer-events: none;
      animation: food-pop 900ms ease-out forwards;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    @keyframes hop {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-28px); }
      100% { transform: translateY(0); }
    }
    @keyframes heart-pop {
      0%   { transform: translateX(-50%) scale(0.4) translateY(0); opacity: 0; }
      30%  { transform: translateX(-50%) scale(1.2) translateY(-8px); opacity: 1; }
      100% { transform: translateX(-50%) scale(0.9) translateY(-28px); opacity: 0; }
    }
    @keyframes food-pop {
      0%   { transform: translateX(-50%) scale(0.4) translateY(0); opacity: 0; }
      30%  { transform: translateX(-50%) scale(1.2) translateY(-8px); opacity: 1; }
      100% { transform: translateX(-50%) scale(0.9) translateY(-28px); opacity: 0; }
    }

    .sidebar {
      background: var(--panel);
      border-left: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
    }
    .sidebar-header .eyebrow {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    .sidebar-header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .meat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: color-mix(in oklab, var(--el-fire) 12%, transparent);
      border: 1px solid color-mix(in oklab, var(--el-fire) 40%, var(--hairline));
      color: var(--el-fire);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.04em;
      clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
    }
    .meat-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--el-fire); }

    .mon-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mon-row {
      background: var(--bg);
      border: 1px solid var(--hairline);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 10px;
      align-items: center;
    }
    .mon-row .thumb {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: color-mix(in oklab, var(--el, var(--el-nature)) 10%, var(--bg));
      border: 1px solid color-mix(in oklab, var(--el, var(--el-nature)) 30%, var(--hairline));
    }
    .mon-row .thumb img {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
    }
    .mon-row .name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .mon-row .name .lvl {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
    }
    .mon-row .mood-track {
      position: relative;
      height: 5px;
      margin: 6px 0 8px;
      background: rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .mon-row .mood-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--el-electric), var(--el-nature));
      transition: width 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mon-row .meta-line {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .mon-row .actions {
      display: flex;
      gap: 6px;
    }
    .mon-row .actions button {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--hairline);
      color: var(--ink);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
    }
    .mon-row .actions button:hover:not(:disabled) {
      background: var(--bg);
      border-color: var(--ink);
    }
    .mon-row .actions button:active:not(:disabled) {
      transform: scale(0.97);
    }
    .mon-row .actions button.pet {
      color: #e34a6a;
      border-color: color-mix(in oklab, #e34a6a 40%, var(--hairline));
    }
    .mon-row .actions button.feed {
      color: var(--el-fire);
      border-color: color-mix(in oklab, var(--el-fire) 40%, var(--hairline));
    }
    .mon-row .actions button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .empty-nursery {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    #toast-slot {
      position: fixed;
      top: 76px;
      right: 356px;
      z-index: 40;
      pointer-events: none;
    }
  </style>
</head>
<body class="nursery">
  <nav class="app-nav" id="app-nav"></nav>

  <div class="nursery-shell">
    <div class="yard" id="yard">
      <canvas id="yard-canvas"></canvas>
      <div class="yard-header">Nursery</div>
    </div>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="eyebrow">Nursery</div>
          <h1>Care</h1>
        </div>
        <div class="meat-pill" id="meat-pill"><span class="dot"></span>MEAT <b id="meat-amount">0</b></div>
      </div>
      <div class="mon-list" id="mon-list">
        <div class="empty-nursery">Loading…</div>
      </div>
    </aside>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.163.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { api, toast } from '/assets/js/api.js';
    import { requireLogin, renderNav } from '/assets/js/auth-guard.js';

    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const YARD_TILES = 25;
    const TILE_PX = 72;
    let renderer = null;
    let cameraPos = null;
    let scene = null;
    let camera = null;
    let sprites = new Map();
    let animRafId = null;
    let nurseryConfig = { maxPetsPerDay: 3, feedMeatCost: 5, petMoodDelta: 5, feedMoodDelta: 8 };
    let meatBalance = 0;

    function generateYardTiles(seed) {
      const palette = ['#3f7d40', '#4a8f4c', '#5aa060', '#3d6b3f', '#66aa6c', '#7a5c3f', '#d4a24a', '#d47a9a'];
      const weights = [22, 30, 22, 12, 10, 2, 1, 1];
      const total = weights.reduce((a, b) => a + b, 0);
      const tiles = [];
      let s = seed >>> 0;
      const rand = () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 0xffffffff;
      };
      for (let i = 0; i < YARD_TILES * YARD_TILES; i++) {
        const r = rand() * total;
        let acc = 0;
        let pick = 0;
        for (let k = 0; k < weights.length; k++) {
          acc += weights[k];
          if (r < acc) { pick = k; break; }
        }
        tiles.push({ color: palette[pick] });
      }
      return tiles;
    }

    function setupRenderer(size) {
      const canvas = document.getElementById('yard-canvas');
      const w = Math.max(canvas.clientWidth, 1);
      const h = Math.max(canvas.clientHeight, 1);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(w, h, false);
      renderer.setClearColor(0x0d1117, 1);

      const FOV = 50;
      const TILT = 22 / 14;
      const tanHalf = Math.tan((FOV / 2) * Math.PI / 180);
      cameraPos = (ch) => {
        const vh = ch / TILE_PX;
        const focal = vh / (2 * tanHalf);
        const d = focal / Math.sqrt(TILT * TILT + 1);
        return { camY: d * TILT, camZ: d };
      };
      scene = new THREE.Scene();
      const { camY, camZ } = cameraPos(h);
      camera = new THREE.PerspectiveCamera(FOV, w / h, 0.1, 500);
      camera.position.set(0, camY, camZ);
      camera.lookAt(0, 0, 0);

      const data = new Uint8Array(size * size * 4);
      const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      texture.flipY = true;
      texture.needsUpdate = true;

      const SEGMENTS = size * 4;
      const geometry = new THREE.PlaneGeometry(size, size, SEGMENTS, SEGMENTS);
      geometry.rotateX(-Math.PI / 2);
      const material = new THREE.ShaderMaterial({
        uniforms: {
          tiles: { value: texture },
          radius: { value: 80.0 },
          tileCount: { value: size },
          borderWidth: { value: 0.04 },
          borderDarken: { value: 0.55 },
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          uniform float radius;
          void main() {
            vUv = uv;
            vec3 pos = position;
            float dist = length(pos.xz);
            pos.y -= (dist * dist) / radius;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          varying vec2 vUv;
          uniform sampler2D tiles;
          uniform float tileCount;
          uniform float borderWidth;
          uniform float borderDarken;
          void main() {
            vec4 c = texture2D(tiles, vUv);
            vec2 frac = fract(vUv * tileCount);
            float edge = min(min(frac.x, 1.0 - frac.x), min(frac.y, 1.0 - frac.y));
            float t = smoothstep(0.0, borderWidth, edge);
            vec3 rgb = mix(c.rgb * borderDarken, c.rgb, t);
            gl_FragColor = vec4(rgb, 1.0);
          }
        `,
      });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      function updateTiles(tiles) {
        const arr = texture.image.data;
        for (let i = 0; i < size * size; i++) {
          const c = (tiles[i] && tiles[i].color) || '#4a8f4c';
          arr[i * 4] = parseInt(c.slice(1, 3), 16);
          arr[i * 4 + 1] = parseInt(c.slice(3, 5), 16);
          arr[i * 4 + 2] = parseInt(c.slice(5, 7), 16);
          arr[i * 4 + 3] = 255;
        }
        texture.needsUpdate = true;
        renderer.render(scene, camera);
      }

      function resize() {
        const nw = Math.max(canvas.clientWidth, 1);
        const nh = Math.max(canvas.clientHeight, 1);
        renderer.setSize(nw, nh, false);
        camera.aspect = nw / nh;
        const { camY: y, camZ: z } = cameraPos(nh);
        camera.position.set(0, y, z);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      return { updateTiles, resize };
    }

    function seedSpritePositions(mons) {
      const yard = document.getElementById('yard');
      const w = yard.clientWidth;
      const h = yard.clientHeight;
      const marginX = w * 0.15;
      const marginY = h * 0.25;
      sprites.clear();
      yard.querySelectorAll('.mon-sprite').forEach((n) => n.remove());
      for (const m of mons) {
        const el = document.createElement('div');
        el.className = 'mon-sprite';
        el.dataset.id = m.id;
        el.innerHTML = `<img src="/assets/digimon/${escapeHtml(m.catalogId)}/dot.gif" alt="${escapeHtml(m.nickname)}" onerror="this.style.opacity=0.2" /><div class="label">${escapeHtml(m.nickname)}</div>`;
        yard.appendChild(el);
        const x = marginX + Math.random() * (w - 2 * marginX);
        const y = marginY + Math.random() * (h - 2 * marginY);
        sprites.set(m.id, {
          el,
          x, y,
          tx: x, ty: y,
          nextTargetAt: performance.now() + 300 + Math.random() * 1200,
          nextJumpAt: performance.now() + 2000 + Math.random() * 6000,
          isJumping: false,
        });
        el.style.transform = `translate(${x - 32}px, ${y - 32}px)`;
      }
    }

    function pickTarget(state, w, h) {
      const marginX = w * 0.12;
      const marginY = h * 0.22;
      state.tx = marginX + Math.random() * (w - 2 * marginX);
      state.ty = marginY + Math.random() * (h - 2 * marginY);
      state.nextTargetAt = performance.now() + 800 + Math.random() * 2500;
    }

    function stepAnim(t) {
      const yard = document.getElementById('yard');
      const w = yard.clientWidth;
      const h = yard.clientHeight;
      const SPEED = 40 / 1000;
      for (const state of sprites.values()) {
        const dx = state.tx - state.x;
        const dy = state.ty - state.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 2 || t > state.nextTargetAt) {
          pickTarget(state, w, h);
          continue;
        }
        const step = SPEED * 16;
        const mv = Math.min(step, dist);
        state.x += (dx / dist) * mv;
        state.y += (dy / dist) * mv;
        state.el.style.transform = `translate(${state.x - 32}px, ${state.y - 32}px)`;
        state.el.classList.toggle('is-facing-right', dx > 0);
        if (!state.isJumping && t > state.nextJumpAt) {
          state.isJumping = true;
          state.el.classList.add('is-jumping');
          setTimeout(() => {
            state.el.classList.remove('is-jumping');
            state.isJumping = false;
            state.nextJumpAt = performance.now() + 3000 + Math.random() * 8000;
          }, 550);
        }
      }
      animRafId = requestAnimationFrame(stepAnim);
    }

    function spawnEmoji(spriteState, kind) {
      const emoji = document.createElement('div');
      emoji.className = kind === 'pet' ? 'heart' : 'food';
      emoji.textContent = kind === 'pet' ? '♥' : '\uD83C\uDF56';
      spriteState.el.appendChild(emoji);
      setTimeout(() => emoji.remove(), 900);
    }

    function renderMonList(view) {
      meatBalance = view.meat;
      nurseryConfig = {
        maxPetsPerDay: view.maxPetsPerDay,
        feedMeatCost: view.feedMeatCost,
        petMoodDelta: view.petMoodDelta,
        feedMoodDelta: view.feedMoodDelta,
      };
      document.getElementById('meat-amount').textContent = String(view.meat);
      const listEl = document.getElementById('mon-list');
      if (!view.mons || view.mons.length === 0) {
        listEl.innerHTML = `<div class="empty-nursery">No Digimon yet. Complete onboarding first.</div>`;
        return;
      }
      listEl.innerHTML = view.mons.map((m) => rowHTML(m)).join('');
      listEl.querySelectorAll('[data-pet]').forEach((btn) => btn.addEventListener('click', () => onPet(btn.dataset.pet)));
      listEl.querySelectorAll('[data-feed]').forEach((btn) => btn.addEventListener('click', () => onFeed(btn.dataset.feed)));
    }

    function rowHTML(m) {
      const el = m.template?.element || 'neutral';
      const petsMax = nurseryConfig.maxPetsPerDay;
      const canFeed = meatBalance >= nurseryConfig.feedMeatCost;
      return `
        <div class="mon-row" style="--el:var(--el-${escapeHtml(el)})" data-row="${escapeHtml(m.id)}">
          <div class="thumb"><img src="/assets/digimon/${escapeHtml(m.catalogId)}/dot.gif" alt="" onerror="this.style.opacity=0.2" /></div>
          <div>
            <div class="name">
              <span>${escapeHtml(m.nickname)}</span>
              <span class="lvl">Lv ${m.level}</span>
            </div>
            <div class="mood-track" title="Mood ${m.mood} / 100">
              <div class="mood-fill" style="width:${Math.max(0, Math.min(100, m.mood))}%"></div>
            </div>
            <div class="meta-line">
              <span>Mood ${m.mood}</span>
              <span>Pets ${m.petsToday}/${petsMax}</span>
            </div>
            <div class="actions">
              <button class="pet"  data-pet="${escapeHtml(m.id)}"  ${m.canPet ? '' : 'disabled'} title="+${nurseryConfig.petMoodDelta} mood · ${petsMax - m.petsToday} left today">Pet</button>
              <button class="feed" data-feed="${escapeHtml(m.id)}" ${canFeed ? '' : 'disabled'} title="Costs ${nurseryConfig.feedMeatCost} Meat · +${nurseryConfig.feedMoodDelta} mood">Feed</button>
            </div>
          </div>
        </div>`;
    }

    async function onPet(monId) {
      try {
        const res = await api.post(`/api/nursery/pet/${encodeURIComponent(monId)}`);
        toast(`Pet! +${nurseryConfig.petMoodDelta} mood · ${res.petsToday}/${res.maxPetsPerDay}`);
        const state = sprites.get(monId);
        if (state) spawnEmoji(state, 'pet');
        await refresh();
      } catch (err) {
        toast(err.message || 'pet failed', { error: true });
      }
    }
    async function onFeed(monId) {
      try {
        const res = await api.post(`/api/nursery/feed/${encodeURIComponent(monId)}`);
        toast(`Fed! +${nurseryConfig.feedMoodDelta} mood · Meat ${res.meat}`);
        const state = sprites.get(monId);
        if (state) spawnEmoji(state, 'feed');
        await refresh();
      } catch (err) {
        toast(err.message || 'feed failed', { error: true });
      }
    }

    let yardRenderer = null;
    let cachedMonSignature = '';

    async function refresh() {
      const view = await api.get('/api/nursery');
      renderMonList(view);
      const sig = (view.mons || []).map((m) => m.id).sort().join(',');
      if (sig !== cachedMonSignature) {
        cachedMonSignature = sig;
        seedSpritePositions(view.mons || []);
      }
    }

    async function init() {
      try { await requireLogin(); } catch { return; }
      renderNav(document.getElementById('app-nav'), 'nursery');

      yardRenderer = setupRenderer(YARD_TILES);
      yardRenderer.updateTiles(generateYardTiles(0x9e3779b1));

      try {
        await refresh();
      } catch (err) {
        toast(err.message || 'nursery load failed', { error: true });
      }

      animRafId = requestAnimationFrame(stepAnim);
    }

    window.addEventListener('resize', () => {
      yardRenderer?.resize();
    });
    window.addEventListener('beforeunload', () => {
      if (animRafId) cancelAnimationFrame(animRafId);
    });
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
