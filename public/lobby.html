<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DigiWorld — Lobby</title>
  <link rel="icon" type="image/gif" href="/assets/digimon/skb-50/dot.gif" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav"></nav>

    <main class="app-main">
      <div class="hud-header">
        <div>
          <div class="eyebrow">Lobby</div>
          <h1>Ready your team</h1>
        </div>
        <div class="row" style="gap:8px;">
          <span class="pill" id="online-count"><span class="dot"></span><span id="online-n">0</span> online</span>
          <span class="pill" id="queue-size"><span class="dot"></span><span id="queue-n">0</span> queued</span>
        </div>
      </div>

      <div class="lobby-grid">

        <!-- LEFT: Presence -->
        <aside class="lobby-col">
          <section class="lobby-section">
            <h2>Online players</h2>
            <div class="presence-list" id="presence-list"></div>
          </section>
        </aside>

        <!-- CENTER: Party + queue -->
        <section class="lobby-col">
          <div class="lobby-section">
            <div class="row spread" style="margin-bottom:10px;">
              <h2 style="margin:0;">Your party</h2>
              <a class="btn btn--secondary btn--sm" href="/roster.html">Edit</a>
            </div>
            <div class="party-picker" id="party-picker" role="list"></div>
            <div id="party-error" class="auth-error" style="margin-top:10px;"></div>
          </div>

          <div class="lobby-section">
            <div class="queue-panel">
              <div class="row spread">
                <h2 style="margin:0;">Matchmaking</h2>
                <span class="queue-status" id="queue-status">Idle</span>
              </div>
              <p class="lede" style="margin:0; font-size:12px; color:var(--muted);">
                Random 3v3 PvP. Level bracket widens the longer you wait.
              </p>
              <div class="row" style="gap:8px;">
                <button class="btn queue-btn btn--wide" id="btn-queue">Find match</button>
              </div>
            </div>
          </div>

          <div class="lobby-section">
            <h2>Daily reward</h2>
            <div id="daily-status" class="lede" style="font-size:13px;">Loading…</div>
            <div class="row" style="margin-top:10px;">
              <button class="btn btn--tertiary" id="btn-daily">Claim daily</button>
            </div>
          </div>
        </section>

        <!-- RIGHT: Chat -->
        <aside class="lobby-col">
          <section class="lobby-section">
            <h2>Global chat</h2>
            <div class="chat-log" id="chat-log" aria-live="polite"></div>
            <form class="chat-form" id="chat-form">
              <input class="input" id="chat-input" type="text" maxlength="300" autocomplete="off" placeholder="say hi…" />
              <button class="btn" type="submit">Send</button>
            </form>
          </section>
        </aside>

      </div>
    </main>
  </div>

  <script type="module">
    import { api, toast, setText } from '/assets/js/api.js';
    import { ws } from '/assets/js/ws.js';
    import { requireLogin, renderNav } from '/assets/js/auth-guard.js';

    const state = {
      queued: false,
      partyReady: false,
    };

    (async () => {
      const user = await requireLogin();
      renderNav(document.getElementById('app-nav'), 'lobby');
      await Promise.all([
        loadParty(),
        loadDaily(),
      ]);
      wireChat();
      wireQueue();
      ws.on('welcome',  (msg) => { paintPresence(msg.presence || []); if (msg.matchId) location.replace('/combat.html?matchId=' + encodeURIComponent(msg.matchId)); });
      ws.on('presence', (msg) => { paintPresence(msg.users || []); setText('online-n', String(msg.count || 0)); });
      ws.on('chat',     appendChat);
      ws.on('queue',    (msg) => paintQueueStatus(msg));
      ws.on('match',    (msg) => { location.replace('/combat.html?matchId=' + encodeURIComponent(msg.matchId)); });
      ws.on('error',    (msg) => toast(msg.message || msg.code || 'error', { error: true }));
      ws.on('close',    () => { setText('online-n', '0'); paintQueueStatus({ status: 'idle', size: 0 }); });
      ws.connect();
    })().catch((err) => {
      console.error(err);
      toast(err.message || 'boot failed', { error: true });
    });

    async function loadParty() {
      try {
        const res = await api.get('/api/roster');
        const roster = res.roster || [];
        const party = new Array(3).fill(null);
        for (const mon of roster) if (typeof mon.slot === 'number' && mon.slot >= 0 && mon.slot < 3) party[mon.slot] = mon;
        const el = document.getElementById('party-picker');
        el.innerHTML = party.map((mon, slot) => {
          if (!mon) return `<div class="party-slot is-empty" role="listitem">
              <div style="width:64px;height:64px;display:grid;place-items:center;border:1px dashed var(--hairline);">—</div>
              <div class="name">Slot ${slot + 1}</div>
              <div class="sub">empty</div>
            </div>`;
          const portrait = mon.template ? mon.template.assets.portrait : '';
          const tpl = mon.template;
          const el2 = tpl ? tpl.element : '';
          return `<div class="party-slot" role="listitem" style="--el:var(--el-${el2 || 'neutral'})">
              <img src="${portrait}" alt="${escape(mon.nickname)}" loading="lazy" onerror="this.style.opacity=0.2" />
              <div class="name">${escape(mon.nickname)}</div>
              <div class="sub">Lv ${mon.level} · ${tpl?.stage || '?'}</div>
            </div>`;
        }).join('');
        state.partyReady = party.every((m) => m !== null && m.template !== null);
        document.getElementById('party-error').textContent = state.partyReady
          ? ''
          : 'Your party is incomplete — visit Roster to assign 3 Digimon.';
        const btn = document.getElementById('btn-queue');
        btn.disabled = !state.partyReady;
      } catch (err) {
        document.getElementById('party-error').textContent = err.message || 'roster load failed';
      }
    }

    async function loadDaily() {
      try {
        const d = await api.get('/api/daily');
        const el = document.getElementById('daily-status');
        const btn = document.getElementById('btn-daily');
        if (d.canClaim) {
          el.innerHTML = `Streak day <b>${d.wouldGrantDay}</b> is ready to claim` +
            (d.wouldReset ? ` — <span style="color:var(--battle);">grace window elapsed, resets to day 1</span>` : '');
          btn.disabled = false;
        } else {
          const hrs = Math.floor(d.secondsUntilNext / 3600);
          const mins = Math.floor((d.secondsUntilNext % 3600) / 60);
          el.textContent = `Next claim in ${hrs}h ${mins}m — current streak: day ${d.streakDay}`;
          btn.disabled = true;
        }
      } catch (err) {
        document.getElementById('daily-status').textContent = err.message || 'daily load failed';
      }
    }

    document.getElementById('btn-daily').addEventListener('click', async () => {
      try {
        const res = await api.post('/api/daily/claim');
        const parts = ['Day ' + res.streakDay + ' claimed'];
        if (res.granted.credits) parts.push('+' + res.granted.credits + ' credits');
        if (res.granted.meat) parts.push('+' + res.granted.meat + ' Meat');
        if (res.granted.bits) parts.push('+' + res.granted.bits + ' Bits');
        if (res.granted.data) parts.push('+' + res.granted.data + ' Data');
        toast(parts.join(', '));
        loadDaily();
      } catch (err) {
        toast(err.message || 'claim failed', { error: true });
      }
    });

    function paintPresence(users) {
      const el = document.getElementById('presence-list');
      if (!users.length) {
        el.innerHTML = '<div class="lede" style="font-size:12px;">You are alone here for now.</div>';
      } else {
        el.innerHTML = users.map((u) => `
          <div class="presence-row">
            <span class="dot" aria-hidden="true"></span>
            <div>
              <div class="name">${escape(u.displayName || u.userId)}</div>
              <div class="meta">online</div>
            </div>
            <span></span>
          </div>`).join('');
      }
      setText('online-n', String(users.length));
    }

    function paintQueueStatus(msg) {
      state.queued = msg.status === 'waiting';
      const btn = document.getElementById('btn-queue');
      const label = document.getElementById('queue-status');
      btn.textContent = state.queued ? 'Cancel search' : 'Find match';
      btn.classList.toggle('is-waiting', state.queued);
      label.className = 'queue-status' + (state.queued ? ' is-waiting' : msg.status === 'matched' ? ' is-matched' : '');
      label.textContent = state.queued ? 'Searching…' : msg.status === 'matched' ? 'Match found — loading arena…' : 'Idle';
      setText('queue-n', String(msg.size || 0));
    }

    function wireQueue() {
      const btn = document.getElementById('btn-queue');
      btn.addEventListener('click', () => {
        if (!state.partyReady) { toast('Assign a full party first', { error: true }); return; }
        ws.send({ type: 'queue', join: !state.queued });
      });
    }

    function wireChat() {
      const form = document.getElementById('chat-form');
      const input = document.getElementById('chat-input');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        if (!ws.send({ type: 'chat', text })) toast('Not connected', { error: true });
        input.value = '';
      });
    }

    function appendChat(msg) {
      const el = document.getElementById('chat-log');
      const time = new Date(msg.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const row = document.createElement('div');
      row.className = 'chat-msg';
      row.innerHTML = `<span class="from">${escape(msg.displayName || msg.from)}</span> ${escape(msg.text)} <span class="time">${time}</span>`;
      el.appendChild(row);
      el.scrollTop = el.scrollHeight;
      while (el.childElementCount > 200) el.removeChild(el.firstElementChild);
    }

    function escape(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
  </script>
</body>
</html>
