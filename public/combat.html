<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DigiWorld — Battle</title>
  <link rel="icon" type="image/gif" href="/assets/digimon/skb-50/dot.gif" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <style>
    .arena { display:flex; flex-direction:column; gap:20px; }
    .bar { display:flex; align-items:center; justify-content:space-between; gap:16px;
      border-bottom:1px solid var(--hairline); padding-bottom:14px; flex-wrap:wrap; }
    .round-pill { font-size:12px; font-weight:600; color:var(--muted); border:1px solid var(--hairline); padding:8px 14px;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    .round-pill b { color:var(--ink); }
    .deck { display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:stretch; }
    .party-col { display:flex; flex-direction:column; gap:14px; }
    .command { border:1px solid var(--hairline); background:var(--panel); padding:14px;
      display:flex; flex-direction:column; gap:12px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    .command .who { font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .command .who b { color:var(--ink); }
    .skill-hint { font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .target-hint { font-size:11px; color:var(--signal); font-weight:600; }
    .log-col { display:flex; flex-direction:column; gap:10px; min-height:0; }
    .log-col h2 { font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0; }
    .turn-log { flex:1; min-height:0; overflow-y:auto; }
    .cbt-unit .u-portrait { width:44px; height:44px; }
    .cbt-unit .u-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .cbt-unit.is-current { border-color:var(--gold); box-shadow: inset 0 0 0 2px var(--gold); animation: pulseNow 1.4s ease-in-out infinite; }
    .foe.is-current { border-color:var(--gold); box-shadow: inset 0 0 0 2px var(--gold); animation: pulseNow 1.4s ease-in-out infinite; }
    @keyframes pulseNow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.08); } }
    .conn-status { font-size:11px; color:var(--muted); }
    .conn-status.is-down { color:var(--battle); }
    .lock-banner { font-size:11px; font-weight:600; color:var(--ink);
      background: color-mix(in oklab, var(--lock) 16%, var(--bg));
      border:1px solid color-mix(in oklab, var(--lock) 45%, var(--hairline)); padding:8px 10px;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }

    /* SMT turn-queue strip: shows the round's remaining initiative order. */
    .turn-queue { display:flex; align-items:center; gap:8px; padding:10px 14px;
      background:var(--panel); border:1px solid var(--hairline); overflow-x:auto;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    .turn-queue .tq-label { font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); flex:none; }
    .turn-queue .tq-item { display:flex; align-items:center; gap:6px; padding:5px 9px; background:var(--bg); border:1px solid var(--hairline);
      font-size:11px; font-weight:600; white-space:nowrap;
      clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }
    .turn-queue .tq-item.is-now { border-color:var(--gold); background: color-mix(in oklab, var(--gold) 14%, var(--bg)); }
    .turn-queue .tq-item.side-a { color:var(--signal); }
    .turn-queue .tq-item.side-b { color:var(--battle); }
    .turn-queue .tq-item .n { color:var(--ink); }
    .turn-queue .tq-item .init { font-variant-numeric:tabular-nums; color:var(--muted); font-size:9px; }

    /* Waiting-for-opponent banner (replaces command panel when it's not your turn). */
    .await-banner { padding:14px 16px; background:var(--panel); border:1px dashed var(--hairline); text-align:center; color:var(--muted); font-size:12px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    .await-banner b { color:var(--ink); }
    @media (max-width:820px) { .deck { grid-template-columns:1fr; } .turn-log { flex:none; max-height:220px; } }
    @media (max-width:560px) { .enemies, .cbt-party { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav"></nav>
    <main class="app-main">

      <div id="pre-arena" class="stack">
        <div class="hud-header">
          <div>
            <div class="eyebrow">Arena</div>
            <h1 id="pre-title">Waiting for a match…</h1>
          </div>
          <div class="round-pill" id="conn-pill">connecting…</div>
        </div>
        <div class="lobby-section">
          <p id="pre-desc" class="lede">
            If you got here from the lobby, hang tight — the server will push the match state any second.
          </p>
          <div class="row" style="margin-top:10px;">
            <a class="btn btn--secondary" href="/lobby.html">Back to lobby</a>
          </div>
        </div>
      </div>

      <section id="arena" class="arena hidden">
        <header class="bar">
          <div>
            <div class="eyebrow">3v3 Battle</div>
            <h1 id="arena-title">Fight</h1>
          </div>
          <div class="row" style="gap:10px;">
            <div class="round-pill">Round <b id="round-n">1</b> · <span id="phase">—</span></div>
            <div class="conn-status" id="conn-status">live</div>
          </div>
        </header>

        <section class="turn-queue" id="turn-queue" aria-label="Upcoming turns"></section>

        <section class="enemies" id="enemies" aria-label="Enemy Digimon"></section>

        <div class="deck">
          <div class="party-col">
            <div class="cbt-party" id="party" role="list" aria-label="Your party"></div>
            <div class="command" id="command" aria-live="polite"></div>
          </div>
          <aside class="log-col">
            <h2>Turn log</h2>
            <div class="turn-log" id="log" role="log" aria-label="Battle log"></div>
          </aside>
        </div>
      </section>

      <div id="post-arena" class="hidden stack" style="margin-top:16px;">
        <div class="banner" id="result-banner"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { toast } from '/assets/js/api.js';
    import { ws } from '/assets/js/ws.js';
    import { requireLogin, renderNav } from '/assets/js/auth-guard.js';

    const qs = new URLSearchParams(location.search);
    let expectedMatchId = qs.get('matchId');
    let selectedTargetId = null;
    let selectedUnitId = null;
    let commandMode = 'menu';
    let latestView = null;

    (async () => {
      await requireLogin();
      renderNav(document.getElementById('app-nav'), 'combat');

      ws.on('open',   () => { setConnStatus('live'); });
      ws.on('close',  () => { setConnStatus('reconnecting…', true); });
      ws.on('unauth', () => { location.replace('/'); });
      ws.on('welcome', (msg) => {
        if (msg.matchId) { expectedMatchId = msg.matchId; }
      });
      ws.on('match', (msg) => {
        if (expectedMatchId && msg.matchId !== expectedMatchId) return;
        expectedMatchId = msg.matchId;
        onView(msg.view);
      });
      ws.on('battle', (msg) => {
        if (expectedMatchId && msg.matchId !== expectedMatchId) return;
        onView(msg.view);
      });
      ws.on('event',  (msg) => { appendLogEvents(msg.events || []); });
      ws.on('end',    (msg) => { onEnd(msg.view, msg.outcome); });
      ws.on('error',  (msg) => { toast(msg.message || msg.code || 'error', { error: true }); });

      ws.connect();
    })().catch((err) => { console.error(err); toast(err.message || 'boot failed', { error: true }); });

    function setConnStatus(text, down) {
      document.getElementById('conn-status').textContent = text;
      document.getElementById('conn-status').classList.toggle('is-down', !!down);
      document.getElementById('conn-pill').textContent = text;
    }

    function onView(view) {
      if (!view || view.status === 'ended') { onEnd(view, view && view.outcome); return; }
      latestView = view;
      document.getElementById('pre-arena').classList.add('hidden');
      document.getElementById('post-arena').classList.add('hidden');
      document.getElementById('arena').classList.remove('hidden');
      document.getElementById('round-n').textContent = String(view.round);
      const phaseEl = document.getElementById('phase');
      if (view.currentTurnBelongsToYou) {
        const actor = view.friendly.find((u) => u.id === view.currentTurnUnitId);
        phaseEl.textContent = actor ? `Your turn — ${actor.name}` : 'Your turn';
      } else {
        const foe = view.enemy.find((u) => u.id === view.currentTurnUnitId);
        phaseEl.textContent = foe ? `Opponent — ${foe.name}` : 'Opponent turn';
      }

      // Server dictates the actor via view.currentTurnUnitId. If it's yours,
      // that's the selected unit; otherwise no local selection.
      if (view.currentTurnBelongsToYou && view.currentTurnUnitId) {
        selectedUnitId = view.currentTurnUnitId;
      } else {
        selectedUnitId = null;
      }
      const firstFoe = view.enemy.find((u) => !u.down);
      if (!selectedTargetId || !view.enemy.find((u) => u.id === selectedTargetId && !u.down)) {
        selectedTargetId = firstFoe ? firstFoe.id : null;
      }
      commandMode = 'menu';
      renderTurnQueue(view);
      renderEnemies(view);
      renderParty(view);
      renderCommand(view);
      renderLogInitial(view);
    }

    function onEnd(view, outcome) {
      if (view) latestView = view;
      document.getElementById('arena').classList.add('hidden');
      document.getElementById('pre-arena').classList.add('hidden');
      const box = document.getElementById('result-banner');
      const post = document.getElementById('post-arena');
      const myWin =
        (outcome === 'win_a' && (view && view.yourSide === 'a')) ||
        (outcome === 'win_b' && (view && view.yourSide === 'b')) ||
        (outcome === 'fled_a' && (view && view.yourSide === 'b')) ||
        (outcome === 'fled_b' && (view && view.yourSide === 'a'));
      const draw = outcome === 'draw' || outcome === 'abandoned';
      box.className = 'banner ' + (draw ? '' : myWin ? 'win' : 'lose');
      const title = draw ? 'Match ended' : myWin ? 'Victory' : 'Defeat';
      const sub = describeOutcome(outcome, myWin, draw);
      box.innerHTML = `
        <div class="b-t">${escape(title)}</div>
        <div class="b-s">${escape(sub)}</div>
        <a class="btn" href="/lobby.html">Back to lobby</a>`;
      post.classList.remove('hidden');
    }

    function describeOutcome(outcome, myWin, draw) {
      if (outcome === 'draw') return 'A draw — neither side stood.';
      if (outcome === 'fled_a' || outcome === 'fled_b') return myWin ? 'Opponent fled — win by forfeit.' : 'You fled.';
      if (outcome === 'abandoned') return 'Opponent disconnected.';
      return myWin ? 'Rewards banked.' : 'No rewards this time.';
    }

    function renderEnemies(view) {
      const el = document.getElementById('enemies');
      const currentEnemyId = !view.currentTurnBelongsToYou ? view.currentTurnUnitId : null;
      el.innerHTML = view.enemy.map((u) => {
        const pct = Math.round((u.hp / u.hpMax) * 100);
        const isCurrent = u.id === currentEnemyId && !u.down;
        return `<article class="foe ${u.id === selectedTargetId && !u.down ? 'is-target' : ''} ${isCurrent ? 'is-current' : ''} ${u.down ? 'is-down' : ''}"
              data-enemy="${u.id}" style="--el:var(--el-${u.element || 'neutral'})"
              role="button" tabindex="${u.down ? -1 : 0}" aria-label="Target ${escape(u.name)}, HP ${u.hp} of ${u.hpMax}">
          <div class="art"><img src="/assets/digimon/${resolveTemplateId(view, u.id, false)}/portrait.webp" alt="" loading="lazy" onerror="this.style.opacity=0.2" /></div>
          <div class="f-name">${escape(u.name)}</div>
          <div class="f-sub">${u.element} · Lv ${u.level}</div>
          <div class="f-hp">
            <div class="gauge gauge--hp" role="progressbar" aria-valuenow="${u.hp}" aria-valuemin="0" aria-valuemax="${u.hpMax}"><i style="--pct:${pct}%"></i></div>
            <span class="v">${u.hp}/${u.hpMax}</span>
          </div>
          <div class="ailments">${ailmentChips(u.ailments || [])}</div>
        </article>`;
      }).join('');
      el.querySelectorAll('[data-enemy]').forEach((node) => {
        node.addEventListener('click', () => selectTarget(node.dataset.enemy));
        node.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectTarget(node.dataset.enemy); } });
      });
    }

    function resolveTemplateId(view, unitId, own) {
      const list = own ? view.friendly : view.enemy;
      const u = list.find((x) => x.id === unitId);
      return u && u.templateId ? u.templateId : '';
    }

    function renderParty(view) {
      const el = document.getElementById('party');
      const currentId = view.currentTurnUnitId;
      el.innerHTML = view.friendly.map((u) => {
        const hpPct = Math.round((u.hp / u.hpMax) * 100);
        const enPct = Math.round((u.en / u.enMax) * 100);
        const down = u.hp <= 0;
        const isCurrent = u.id === currentId && view.currentTurnBelongsToYou && !down;
        const isLocked = (u.ailments || []).some((a) => ['freeze', 'stun', 'sleep'].includes(a.kind));
        return `<div class="cbt-unit ${isCurrent ? 'is-current is-active' : ''} ${down || isLocked ? 'is-locked' : ''}" style="--el:var(--el-${u.element || 'neutral'})">
            <div class="u-btn">
              <div class="u-head"><span class="u-name">${escape(u.name)}</span><span class="u-el">${u.element}</span></div>
            </div>
            <div class="rowline"><span class="u-cap">HP</span>
              <div class="gauge gauge--hp"><i style="--pct:${clamp(hpPct, 0, 100)}%"></i></div>
              <span class="u-val">${clamp(u.hp, 0, u.hpMax)}/${u.hpMax}</span></div>
            <div class="rowline"><span class="u-cap">EN</span>
              <div class="gauge gauge--en"><i style="--pct:${clamp(enPct, 0, 100)}%"></i></div>
              <span class="u-val">${u.en}/${u.enMax}</span></div>
            <div class="u-ailments">${ailmentChips(u.ailments || [])}</div>
          </div>`;
      }).join('');
    }

    function renderCommand(view) {
      const el = document.getElementById('command');
      if (!view) { el.innerHTML = ''; return; }
      if (!view.currentTurnBelongsToYou) {
        const foe = view.enemy.find((u) => u.id === view.currentTurnUnitId);
        el.innerHTML = `<div class="await-banner">Waiting for opponent — <b>${escape(foe ? foe.name : 'their turn')}</b> is up.</div>`;
        return;
      }
      const actor = view.friendly.find((u) => u.id === view.currentTurnUnitId);
      if (!actor || actor.hp <= 0) {
        el.innerHTML = `<div class="await-banner">Server is advancing the turn…</div>`;
        return;
      }
      const locked = (actor.ailments || []).some((a) => ['freeze', 'stun', 'sleep'].includes(a.kind));
      const target = view.enemy.find((u) => u.id === selectedTargetId && !u.down);
      let inner = `<div class="who">Acting: <b>${escape(actor.name)}</b> · target <b>${escape(target ? target.name : '—')}</b></div>`;
      if (locked) {
        inner += `<div class="lock-banner">${escape(actor.name)} is locked — the server will auto-skip this turn.</div>`;
      }
      if (commandMode === 'skills') {
        inner += `<div class="skill-hint">Choose a skill — EN ${actor.en}/${actor.enMax}</div>`;
        inner += renderSkillMenu(actor);
        inner += `<div class="cbt-actions"><button class="cbt-cmd cbt-cmd--guard" data-cmd="back">Back</button></div>`;
      } else {
        inner += `<div class="cbt-actions">
          <button class="cbt-cmd" data-cmd="fight">Fight</button>
          <button class="cbt-cmd" data-cmd="skills">Skills</button>
          <button class="cbt-cmd cbt-cmd--guard" data-cmd="guard">Guard</button>
          <button class="cbt-cmd cbt-cmd--flee" data-cmd="flee">Flee</button>
        </div>
        <div class="target-hint">Tap an enemy to retarget.</div>`;
      }
      el.innerHTML = inner;
      el.querySelectorAll('[data-cmd]').forEach((node) => {
        node.addEventListener('click', () => onCommand(node.dataset.cmd));
      });
      el.querySelectorAll('[data-skill]').forEach((node) => {
        node.addEventListener('click', () => {
          if (node.disabled) return;
          submitSkill(node.dataset.skill);
        });
      });
    }

    function renderTurnQueue(view) {
      const el = document.getElementById('turn-queue');
      const items = (view.upcomingTurns || []).slice(0, 10);
      if (items.length === 0) {
        el.innerHTML = `<span class="tq-label">Turn order</span><span class="tq-label" style="opacity:.6;">(computing next round…)</span>`;
        return;
      }
      el.innerHTML = `<span class="tq-label">Turn order</span>` + items.map((t, i) => {
        const isNow = i === 0;
        const sideCls = t.side === view.yourSide ? 'side-a' : 'side-b';
        return `<span class="tq-item ${isNow ? 'is-now' : ''} ${sideCls}">
          <span class="n">${escape(t.name)}</span>
          <span class="init">${Math.round(t.initiative)}</span>
        </span>`;
      }).join('');
    }

    function renderSkillMenu(actor) {
      const skills = actor.skills || [];
      const groups = {};
      for (const s of skills) (groups[s.element] = groups[s.element] || []).push(s);
      let html = `<div class="skill-menu" role="listbox">`;
      for (const el of Object.keys(groups)) {
        html += `<div class="skill-group-cap" style="--el:var(--el-${el || 'neutral'})">${el}</div>`;
        for (const s of groups[el]) {
          const afford = actor.en >= (s.energyCost || 0);
          html += `<button class="skill-row" data-skill="${escape(s.id)}" ${afford ? '' : 'disabled'} role="option"
            aria-label="${escape(s.name)}, costs ${s.energyCost} energy${afford ? '' : ', not enough energy'}">
            <span class="s-name">${escape(s.name)}${s.description ? `<div class="s-desc">${escape(s.description)}</div>` : ''}</span>
            <span class="s-cost">${s.energyCost} EN</span></button>`;
        }
      }
      return html + `</div>`;
    }

    function onCommand(cmd) {
      if (!latestView) return;
      if (cmd === 'skills') { commandMode = 'skills'; renderCommand(latestView); return; }
      if (cmd === 'back')   { commandMode = 'menu';  renderCommand(latestView); return; }
      if (cmd === 'fight')  { submitFight(); return; }
      if (cmd === 'guard')  { submitGuard(); return; }
      if (cmd === 'flee')   { submitFlee();  return; }
    }

    function submitFight() {
      if (!selectedUnitId || !selectedTargetId) { toast('Pick a target', { error: true }); return; }
      ws.send({ type: 'act', matchId: expectedMatchId, action: { type: 'fight', unitId: selectedUnitId, targetId: selectedTargetId } });
    }
    function submitSkill(skillId) {
      if (!selectedUnitId || !selectedTargetId) { toast('Pick a target', { error: true }); return; }
      ws.send({ type: 'act', matchId: expectedMatchId, action: { type: 'skill', unitId: selectedUnitId, skillId, targetId: selectedTargetId } });
      commandMode = 'menu';
    }
    function submitGuard() {
      if (!selectedUnitId) return;
      ws.send({ type: 'act', matchId: expectedMatchId, action: { type: 'guard', unitId: selectedUnitId } });
    }
    function submitFlee() {
      if (!confirm('Flee — you forfeit this match. Continue?')) return;
      ws.send({ type: 'act', matchId: expectedMatchId, action: { type: 'flee' } });
    }

    function selectTarget(id) {
      selectedTargetId = id;
      renderEnemies(latestView);
      renderCommand(latestView);
    }

    function renderLogInitial(view) {
      const el = document.getElementById('log');
      el.innerHTML = '';
      appendLogEvents(view.log || []);
    }
    function appendLogEvents(events) {
      const el = document.getElementById('log');
      for (const evt of events) {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = describeEvent(evt);
        el.prepend(line);
      }
      while (el.childElementCount > 200) el.removeChild(el.lastElementChild);
    }
    function describeEvent(evt) {
      const round = `<span class="rnd">R${evt.round}</span> `;
      if (evt.type === 'round-start') {
        const order = (evt.order || []).map((o) => escape(o.name)).join(' → ');
        return round + `<b>Round ${evt.round}</b> begins — ${order}`;
      }
      if (evt.type === 'turn') return round + `${escape(evt.unitName || (evt.side === 'a' ? 'Side A' : 'Side B'))}'s turn`;
      if (evt.type === 'turn-skip') return round + `${escape(evt.unitName)} is ${escape(evt.reason)} — turn skipped`;
      if (evt.type === 'end')  return round + `Match ended · ${escape(evt.outcome)}`;
      if (evt.type === 'unit-down') return round + `${escape(evt.unitName)} is defeated.`;
      if (evt.type === 'ailment-tick') return round + `${describeUnit(evt.unit)} suffers <b>${evt.damage}</b> ${escape(evt.kind)} damage`;
      if (evt.type === 'ailment-expired') return round + `${describeUnit(evt.unit)} shakes off ${escape(evt.kind)}`;
      if (evt.type === 'action') {
        const cue = evt.cue ? ` <span class="cue cue--${evt.cue}">${cueLabel(evt.cue)}</span>` : '';
        if (evt.action && evt.action.type === 'flee') return round + `${escape(evt.actorName || 'unknown')} fled`;
        if (evt.action && evt.action.type === 'guard') return round + `${escape(evt.actorName || 'unknown')} braces (Guard)`;
        const dmg = evt.damage != null ? ` — <b>${evt.damage}</b> dmg to ${escape(evt.targetName || '')}` : '';
        return round + `${escape(evt.actorName || '')} used ${escape(evt.skillName || 'Attack')}${dmg}${cue}`;
      }
      return round + escape(JSON.stringify(evt));
    }
    function cueLabel(c) { return c === 'crit' ? 'Critical!' : c === 'miss' ? 'Missed!' : c === 'resist' ? 'Resisted' : c === 'weak' ? 'Weak!' : c; }
    function describeUnit(id) { return String(id).replace(':', '·'); }

    function ailmentChips(list) {
      return list.map((a) => `<span class="ailment ailment--${escape(a.kind)}">${escape(a.kind)}</span>`).join('');
    }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function escape(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
  </script>
</body>
</html>
