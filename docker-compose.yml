name: digiworld

services:
  db:
    image: postgres:16-alpine
    container_name: digiworld-db-1
    environment:
      POSTGRES_USER: digiworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and edit}
      POSTGRES_DB: digiworld
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiworld -d digiworld"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: digiworld-redis-1
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required - copy .env.example to .env and edit}",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: digiworld-backend-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE: postgres
      DATABASE_URL: postgres://digiworld:${POSTGRES_PASSWORD}@db:5432/digiworld
      CLUSTER: redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required min 32 chars - copy .env.example to .env and edit}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      ADMIN_BOOTSTRAP: ${ADMIN_BOOTSTRAP:-open}
      MAX_LOBBY_CONNECTIONS: ${MAX_LOBBY_CONNECTIONS:-1200}
      MAX_CONCURRENT_MATCHES: ${MAX_CONCURRENT_MATCHES:-200}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Must hold the same value as discord-bot below; unset disables /api/service/* by design.
      SERVICE_TOKEN_DISCORD: ${SERVICE_TOKEN_DISCORD:-}
    volumes:
      - assetdata:/app/backend/public/assets/digimon
      - scrapecache:/app/backend/data/cache
      - scenedata:/app/backend/data/scenes
      - tilesetdata:/app/backend/data/tilesets
      - ./backend/data/catalog:/app/backend/data/catalog
      # Read-only: sync only reads these, and they are git-versioned source.
      - ./backend/data/dialogues:/app/backend/data/dialogues:ro
      - ./frontend/public/assets/arenas:/app/frontend/public/assets/arenas
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  discord-bot:
    profiles: ["discord"]
    build:
      context: .
      dockerfile: discord/Dockerfile
    container_name: digiworld-discord-bot-1
    ports:
      - "${DISCORD_HOST_PORT:-3100}:3100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      PUBLIC_URL: ${DISCORD_PUBLIC_URL:-}
      GAME_PUBLIC_URL: ${GAME_PUBLIC_URL:-http://localhost:${HOST_PORT:-8080}}
      BACKEND_URL: http://backend:3000
      DATABASE_URL: postgres://digiworld:${POSTGRES_PASSWORD}@db:5432/digiworld
      SERVICE_TOKEN_DISCORD: ${SERVICE_TOKEN_DISCORD:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ADMIN_ROLE_IDS: ${DISCORD_ADMIN_ROLE_IDS:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_PAYER_EMAIL: ${MP_PAYER_EMAIL:-}
      MP_PAYER_NAME: ${MP_PAYER_NAME:-}
      MP_PAYER_LAST_NAME: ${MP_PAYER_LAST_NAME:-}
      MP_PAYER_ID_TYPE: ${MP_PAYER_ID_TYPE:-CPF}
      MP_PAYER_ID_NUMBER: ${MP_PAYER_ID_NUMBER:-}
      PIX_EXPIRATION_MINUTES: ${PIX_EXPIRATION_MINUTES:-30}
      PURCHASE_SWEEP_INTERVAL_MS: ${PURCHASE_SWEEP_INTERVAL_MS:-300000}
      TICKET_INACTIVITY_HOURS: ${TICKET_INACTIVITY_HOURS:-48}
      RATE_LIMIT_COMMANDS: ${RATE_LIMIT_COMMANDS:-20}
      RATE_LIMIT_BUY: ${RATE_LIMIT_BUY:-3}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(\"http://127.0.0.1:3100/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: digiworld-frontend-1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./frontend/public/assets/arenas:/usr/share/nginx/html/assets/arenas:ro
    restart: unless-stopped

  admin:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: digiworld-admin-1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_HOST_PORT:-8090}:8080"
    volumes:
      - ./frontend/public/assets/arenas:/usr/share/nginx/html/assets/arenas:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required - set in .env}
    depends_on:
      - frontend

volumes:
  pgdata:
  redisdata:
  assetdata:
  scrapecache:
  scenedata:
  tilesetdata:
