name: Diagnose Staging v2 (temporary — Wave 1 completion)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    name: Wave 1 v2 diagnostics
    runs-on: [self-hosted, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run read-only diagnostics v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diag2"
          cd "$GITHUB_WORKSPACE"

          # ── Prod DB user count ──
          {
            echo "=== prod DB users count ==="
            for c in digiworld-prod-db digiworld_db_1 digiworld-db-1; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
                echo "--- $c ---"
                docker exec "$c" psql -U digiworld -d digiworld -tAc 'SELECT count(*) FROM users;' 2>&1 || echo "psql failed"
              else
                echo "--- $c --- (not present)"
              fi
            done
          } > diag2/02b-prod-db.txt 2>&1

          # ── Tunnel token comparison (from command args) ──
          {
            echo "=== cloudflared command args (token extraction) ==="
            for c in cloudflared-staging digiworld-prod-cloudflared; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
                echo "--- $c command ---"
                cmd=$(docker inspect "$c" --format '{{.Config.Cmd}} {{.Args}}' 2>/dev/null | tr -d '[]' | tr ',' ' ')
                echo "$cmd"
                tok=$(echo "$cmd" | grep -oE '--token [A-Za-z0-9_-]+' | head -1 | cut -d' ' -f2 || true)
                if [ -n "$tok" ]; then
                  echo "token sha256: $(printf '%s' "$tok" | sha256sum | cut -d' ' -f1)"
                else
                  echo "no --token found in command"
                fi
              else
                echo "--- $c --- (not present)"
              fi
            done
          } > diag2/03b-tunnel-tokens.txt 2>&1

          # ── Real asset MIME test ──
          {
            echo "=== staging real asset MIME ==="
            chunk=$(curl -s --max-time 15 https://staging.xenon.dev.br/ | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "chunk=$chunk"
            if [ -n "$chunk" ]; then
              curl -sI --max-time 15 "https://staging.xenon.dev.br/assets/$chunk" | grep -iE 'HTTP/|content-type|content-length' || true
            fi
            echo "=== staging CSS asset ==="
            css=$(curl -s --max-time 15 https://staging.xenon.dev.br/ | grep -oE 'index-[A-Za-z0-9_-]+\.css' | head -1 || true)
            if [ -n "$css" ]; then
              curl -sI --max-time 15 "https://staging.xenon.dev.br/assets/$css" | grep -iE 'HTTP/|content-type' || true
            fi
          } > diag2/03c-real-asset.txt 2>&1

          # ── Redis session keys with proper auth ──
          {
            echo "=== staging redis session keys (auth from backend REDIS_URL) ==="
            if docker ps -a --format '{{.Names}}' | grep -qx digiworld-staging-backend-1; then
              # Extract password from backend REDIS_URL: redis://:password@host:port
              rp=$(docker exec digiworld-staging-backend-1 printenv REDIS_URL 2>/dev/null | sed -E 's#redis://[^:]*:([^@]+)@.*#\1#' || true)
              if [ -n "$rp" ]; then
                echo "redis password extracted (len=${#rp})"
                docker exec digiworld-staging-redis-1 redis-cli -a "$rp" --no-auth-warning --scan --pattern 'session:*' 2>/dev/null | head -10
                echo "count:"
                docker exec digiworld-staging-redis-1 redis-cli -a "$rp" --no-auth-warning --scan --pattern 'session:*' 2>/dev/null | wc -l
              else
                echo "could not extract REDIS_PASSWORD from backend REDIS_URL"
              fi
            fi
          } > diag2/04b-redis-keys.txt 2>&1

          # ── Fluctuating userCount test (10 rapid calls) ──
          {
            echo "=== 10x /api/auth/status in rapid succession (detect alternating counts) ==="
            for i in {1..10}; do
              curl -s --max-time 5 https://staging.xenon.dev.br/api/auth/status | jq -c . 2>/dev/null || curl -s --max-time 5 https://staging.xenon.dev.br/api/auth/status
              sleep 0.1
            done | sort | uniq -c
          } > diag2/05-fluctuating-usercount.txt 2>&1

          # ── Staging backend recent logs (which user ids hit it) ──
          {
            echo "=== staging backend recent logs (last 50 lines) ==="
            docker compose -f docker-compose.yml -f docker-compose.staging.override.yml logs --tail 50 backend 2>/dev/null || true
          } > diag2/06-backend-logs.txt 2>&1

          # ── Both cloudflared network memberships ──
          {
            echo "=== prod cloudflared networks ==="
            docker inspect digiworld-prod-cloudflared --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null || true
            echo "=== staging cloudflared networks ==="
            docker inspect cloudflared-staging --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null || true
            echo "=== prod frontend networks ==="
            docker inspect digiworld-prod-frontend --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null || true
            echo "=== staging frontend networks ==="
            docker inspect digiworld-staging-frontend-1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null || true
          } > diag2/07-networks.txt 2>&1

          echo "=== DIAG V2 DONE ==="
          ls -la diag2/

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-diag-wave1-v2
          path: diag2/
          if-no-files-found: error
          retention-days: 3