name: Deploy — Production

on:
  # Immutable version tags trigger prod (e.g. `git tag v1.4.0 && git push --tags`).
  push:
    tags: ['v*.*.*']
  # Manual promotion is always available for hotfixes.
  workflow_dispatch: {}

# Only one prod deploy at a time. Do NOT cancel in-flight — a running deploy
# may be mid-migration and cancelling would leave the DB in a partial state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Materialize env, validate, deploy
    runs-on: [self-hosted, production]

    # The `production` GH Environment gates secrets + required-reviewer approval.
    # Configure at:  Settings > Environments > production
    #   → Recommended: enable "Required reviewers" (at least 1)
    #   → Recommended: restrict deployments to protected branches + tags
    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize .env from GH Environment secrets/vars
        run: ./scripts/materialize-env.sh
        env:
          # ── Secrets (Environment > Secrets) ────────────────────────────
          POSTGRES_PASSWORD:       ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD:          ${{ secrets.REDIS_PASSWORD }}
          SESSION_SECRET:          ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SERVICE_TOKEN_DISCORD:   ${{ secrets.SERVICE_TOKEN_DISCORD }}
          DISCORD_TOKEN:           ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_SECRET:   ${{ secrets.DISCORD_CLIENT_SECRET }}
          MP_ACCESS_TOKEN:         ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET:       ${{ secrets.MP_WEBHOOK_SECRET }}
          MP_PAYER_EMAIL:          ${{ secrets.MP_PAYER_EMAIL }}
          MP_PAYER_NAME:           ${{ secrets.MP_PAYER_NAME }}
          MP_PAYER_LAST_NAME:      ${{ secrets.MP_PAYER_LAST_NAME }}
          MP_PAYER_ID_NUMBER:      ${{ secrets.MP_PAYER_ID_NUMBER }}
          # ── Non-secret per-env config (Environment > Variables) ────────
          DISCORD_PUBLIC_URL:      ${{ vars.DISCORD_PUBLIC_URL }}
          GAME_PUBLIC_URL:         ${{ vars.GAME_PUBLIC_URL }}
          DISCORD_CLIENT_ID:       ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID:        ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_ADMIN_ROLE_IDS:  ${{ vars.DISCORD_ADMIN_ROLE_IDS }}
          MP_PAYER_ID_TYPE:        ${{ vars.MP_PAYER_ID_TYPE }}
          ADMIN_BOOTSTRAP:         ${{ vars.ADMIN_BOOTSTRAP }}
          HOST_PORT:               ${{ vars.HOST_PORT }}
          CORS_ORIGINS:            ${{ vars.CORS_ORIGINS }}
          # ── Runtime knobs (opt-in overrides; empty ⇒ code default) ────
          PIX_EXPIRATION_MINUTES:     ${{ vars.PIX_EXPIRATION_MINUTES }}
          PURCHASE_SWEEP_INTERVAL_MS: ${{ vars.PURCHASE_SWEEP_INTERVAL_MS }}
          TICKET_INACTIVITY_HOURS:    ${{ vars.TICKET_INACTIVITY_HOURS }}
          RATE_LIMIT_COMMANDS:        ${{ vars.RATE_LIMIT_COMMANDS }}
          RATE_LIMIT_BUY:             ${{ vars.RATE_LIMIT_BUY }}
          CREDITS_PER_BRL:            ${{ vars.CREDITS_PER_BRL }}
          BUY_MIN_BRL:                ${{ vars.BUY_MIN_BRL }}
          BUY_MAX_BRL:                ${{ vars.BUY_MAX_BRL }}

      - name: Typecheck (validates every Zod config schema parses)
        run: pnpm typecheck

      - name: Roll containers in place
        # Self-hosted runner IS the deploy host. `.env` was materialized into
        # $GITHUB_WORKSPACE above. The compose project name is fixed by `name:`
        # in docker-compose.yml (materialize-env.sh emits neither COMPOSE_FILE
        # nor COMPOSE_PROJECT_NAME), so `docker compose` always targets the
        # `digiworld-*` production stack.
        #
        # `--wait` makes `up` exit non-zero (red run) if any service lands
        # unhealthy, instead of green-listing a crash-looping backend behind the
        # tunnel — the exact "runner green, site 502" failure mode.
        #
        # `--remove-orphans` is deliberately NOT passed: `admin` is
        # profile-gated (`profiles: [admin]`) and not enabled in prod, so
        # `--remove-orphans` would delete `digiworld-admin-1` on every deploy.
        # If admin should run in prod, add `--profile admin` (then re-adding
        # `--remove-orphans` is safe again).
        run: |
          docker compose --profile discord up -d --build --wait
          docker compose ps

      - name: Container logs (on failure)
        if: failure()
        run: |
          docker compose --profile discord ps -a
          for svc in backend frontend cloudflared discord-bot; do
            echo "::group::$svc"
            docker compose --profile discord logs --tail 120 "$svc" 2>&1 || true
            echo "::endgroup::"
          done
