name: Deploy

on:
  push:
    branches: [staging]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Selecione o ambientr para Deploy"
        required: true
        default: "staging"
        type: environment

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.ref_name == 'staging' && 'staging' || 'production' }})
    runs-on:
      - self-hosted
      - ${{ (github.ref_name == 'staging' || inputs.target_env == 'staging') && 'staging' || 'production' }}

    environment:
      name: ${{ inputs.target_env || (github.ref_name == 'staging' && 'staging' || 'production') }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize .env
        run: ./scripts/materialize-env.sh
        env:
          # Segredos
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SERVICE_TOKEN_DISCORD: ${{ secrets.SERVICE_TOKEN_DISCORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          MP_PAYER_EMAIL: ${{ secrets.MP_PAYER_EMAIL }}
          MP_PAYER_NAME: ${{ secrets.MP_PAYER_NAME }}
          MP_PAYER_LAST_NAME: ${{ secrets.MP_PAYER_LAST_NAME }}
          MP_PAYER_ID_NUMBER: ${{ secrets.MP_PAYER_ID_NUMBER }}
          # VariÃ¡veis
          DISCORD_PUBLIC_URL: ${{ vars.DISCORD_PUBLIC_URL }}
          GAME_PUBLIC_URL: ${{ vars.GAME_PUBLIC_URL }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_ADMIN_ROLE_IDS: ${{ vars.DISCORD_ADMIN_ROLE_IDS }}
          MP_PAYER_ID_TYPE: ${{ vars.MP_PAYER_ID_TYPE }}
          ADMIN_BOOTSTRAP: ${{ vars.ADMIN_BOOTSTRAP }}
          HOST_PORT: ${{ vars.HOST_PORT }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PIX_EXPIRATION_MINUTES: ${{ vars.PIX_EXPIRATION_MINUTES }}
          PURCHASE_SWEEP_INTERVAL_MS: ${{ vars.PURCHASE_SWEEP_INTERVAL_MS }}
          TICKET_INACTIVITY_HOURS: ${{ vars.TICKET_INACTIVITY_HOURS }}
          RATE_LIMIT_COMMANDS: ${{ vars.RATE_LIMIT_COMMANDS }}
          RATE_LIMIT_BUY: ${{ vars.RATE_LIMIT_BUY }}
          CREDITS_PER_BRL: ${{ vars.CREDITS_PER_BRL }}
          BUY_MIN_BRL: ${{ vars.BUY_MIN_BRL }}
          BUY_MAX_BRL: ${{ vars.BUY_MAX_BRL }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Content xref gate
        # Validate the COMMITTED content bundle (content/content-bundle.json) for
        # cross-domain reference integrity. This is the bundle the deploy step
        # applies to the target DB, so it must be internally consistent. This
        # ALWAYS runs (unlike the old seed-export gate, which required a local
        # sqlite dev DB on the runner and silently no-op'd on Postgres). Fails the
        # deploy on any broken ref (quest→missing dialogue/item/digimon, etc.)
        # before a single row is written to the target DB.
        run: |
          pnpm --filter @digiworld/backend content:xref

      - name: Deploy containers
        env:
          ENV_NAME: ${{ inputs.target_env || (github.ref_name == 'staging' && 'staging' || 'production') }}
          # Limit parallel builds so we don't OOM the runner. Docker Compose
          # builds all services in parallel by default; with 4 services each
          # running apt-get + pnpm install + native builds (argon2, better-sqlite3),
          # that exhausts RAM and the runner process gets killed mid-deploy.
          COMPOSE_PARALLEL_LIMIT: "1"
          BUILDKIT_PROGRESS: "plain"
        run: |
          PROJECT="digiworld-${ENV_NAME}"
          docker compose -p "$PROJECT" --profile discord --profile admin up -d --build --remove-orphans --wait
          docker compose -p "$PROJECT" ps

      - name: Fix app volume ownership
        # The arenadata volume is written by the backend (running as node, uid
        # 1000) during content-deploy. A named volume is seeded with the mount
        # target's ownership only on FIRST mount; if `arenadata` already exists
        # (e.g. seeded root:root before it existed in the backend image), image
        # changes never re-seed it. Force node ownership every deploy so the
        # backend can write arena GLBs regardless of when the volume was created.
        env:
          ENV_NAME: ${{ inputs.target_env || (github.ref_name == 'staging' && 'staging' || 'production') }}
        run: |
          PROJECT="digiworld-${ENV_NAME}"
          for vol in arenadata assetdata scrapecache scenedata tilesetdata; do
            docker run --rm -v "${PROJECT}_${vol}":/data node:24-slim chown -R 1000:1000 /data
          done

      - name: Deploy content (committed bundle)
        # Applies content/content-bundle.json to the freshly-deployed DB. Runs INSIDE
        # the backend container: target DB is Postgres on the compose network (not
        # host-exposed) and content:deploy is TS (devDeps not in the runtime image),
        # so we exec the compiled dist/content-deploy/cli.js in-network. The bundle is
        # mounted read-only at /app/backend/content via docker-compose.yml.
        #
        # --reconcile purges, in the same transaction, the rows content-deploy
        # previously deployed (they carry an active_versions pointer) that were removed
        # from the bundle — so the bundle-managed subset of each content table mirrors
        # the bundle exactly ("only clean content enters"). Boot-seeded rows that
        # content-deploy never wrote are left untouched, so a stale bundle can never
        # delete content the server depends on. Content-only; never player state.
        env:
          ENV_NAME: ${{ inputs.target_env || (github.ref_name == 'staging' && 'staging' || 'production') }}
        run: |
          PROJECT="digiworld-${ENV_NAME}"
          sleep 5
          docker compose -p "$PROJECT" exec -T backend \
            node dist/content-deploy/cli.js --apply --reconcile content/content-bundle.json

      - name: Prune player digimons off the active roster
        # After content lands, delete player-owned digimons whose species is NOT on the
        # active (launch) roster — e.g. an Ultimate/Mega or drafted species that was
        # removed from the obtainable pool by a roster change. Runs INSIDE the backend
        # container against the same Postgres. This is a PLAYER-STATE mutation and is
        # deliberately a separate step, not part of the content apply (which must never
        # touch player_* tables). Idempotent.
        env:
          ENV_NAME: ${{ inputs.target_env || (github.ref_name == 'staging' && 'staging' || 'production') }}
        run: |
          PROJECT="digiworld-${ENV_NAME}"
          docker compose -p "$PROJECT" exec -T backend \
            node dist/content-deploy/cli.js --prune-roster

      - name: Container logs (on failure)
        if: failure()
        env:
          ENV_NAME: ${{ inputs.target_env || (github.ref_name == 'staging' && 'staging' || 'production') }}
        run: |
          PROJECT="digiworld-${ENV_NAME}"
          docker compose -p "$PROJECT" ps -a
          for svc in backend frontend cloudflared discord-bot admin; do
            echo "::group::$svc"
            docker compose -p "$PROJECT" logs --tail 120 "$svc" 2>&1 || true
            echo "::endgroup::"
          done
