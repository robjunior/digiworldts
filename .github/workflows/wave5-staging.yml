name: Staging Wave 5 — Wipe + Reseed (temporary)

# Owner-approved: wipe staging DB, backup via seed:export, fresh deploy, content:deploy --apply.
# Runs on [self-hosted, staging] runner. Evidence uploaded as artifact.
# To be deleted after Wave 5.

on:
  workflow_dispatch: {}

jobs:
  wipe-reseed:
    name: Wave 5 — Backup, wipe, redeploy, apply content
    runs-on: [self-hosted, staging]
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize .env (staging secrets)
        run: ./scripts/materialize-env.sh
        env:
          POSTGRES_PASSWORD:       ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD:          ${{ secrets.REDIS_PASSWORD }}
          SESSION_SECRET:          ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SERVICE_TOKEN_DISCORD:   ${{ secrets.SERVICE_TOKEN_DISCORD }}
          DISCORD_TOKEN:           ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_SECRET:   ${{ secrets.DISCORD_CLIENT_SECRET }}
          MP_ACCESS_TOKEN:         ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET:       ${{ secrets.MP_WEBHOOK_SECRET }}
          MP_PAYER_EMAIL:          ${{ secrets.MP_PAYER_EMAIL }}
          MP_PAYER_NAME:           ${{ secrets.MP_PAYER_NAME }}
          MP_PAYER_LAST_NAME:      ${{ secrets.MP_PAYER_LAST_NAME }}
          MP_PAYER_ID_NUMBER:      ${{ secrets.MP_PAYER_ID_NUMBER }}
          DISCORD_PUBLIC_URL:      ${{ vars.DISCORD_PUBLIC_URL }}
          GAME_PUBLIC_URL:         ${{ vars.GAME_PUBLIC_URL }}
          DISCORD_CLIENT_ID:       ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID:        ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_ADMIN_ROLE_IDS:  ${{ vars.DISCORD_ADMIN_ROLE_IDS }}
          MP_PAYER_ID_TYPE:        ${{ vars.MP_PAYER_ID_TYPE }}
          ADMIN_BOOTSTRAP:         ${{ vars.ADMIN_BOOTSTRAP }}
          HOST_PORT:               ${{ vars.HOST_PORT }}
          CORS_ORIGINS:            ${{ vars.CORS_ORIGINS }}

      - name: Todo 8 — seed:export backup from LIVE staging DB (content tables only)
        run: |
          set -euo pipefail
          mkdir -p /tmp/seed-backup
          # Export ONLY content tables (exclude player-state: coin_offers, sessions, etc.)
          CONTENT_TABLES="quests,world_objects,dialogue_definitions,npcs,dungeons,dungeon_tiles,dungeon_encounters,dungeon_doors,dungeon_warps,dungeon_traps,dungeon_chests,dungeon_zones,dungeon_keys,dungeon_kits,dungeon_kit_items,dungeon_rarity_tables,dungeon_tilesets,dungeon_items,dungeon_triggers,dungeon_trigger_targets,tilesets,shop_items,shop_bundles,shop_bundle_items,onboarding_config,onboarding_teams,game_settings,skills_catalog,building_blueprints,farm_recipes,adventures,catalog_loot_entries,seasons"
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            exec -T backend node dist/seed-export/cli.js --out /tmp/seed-backup --tables "$CONTENT_TABLES"
          # Copy artifact to host
          docker cp "$(docker compose -f docker-compose.yml -f docker-compose.staging.override.yml ps -q backend):/tmp/seed-backup" /tmp/seed-backup-host
          echo "Artifact copied to /tmp/seed-backup-host"
          ls -la /tmp/seed-backup-host/
          # Display table counts (non-fatal)
          cat /tmp/seed-backup-host/seed.json | grep -o '"[^"]*":[0-9]*' | sed 's/"//g' | head -40 || true

      - name: Todo 9 — content:deploy --validate the backup artifact
        run: |
          set -euo pipefail
          # Validate against the CURRENT staging DB (before wipe)
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            exec -T backend node dist/content-deploy/cli.js --validate /tmp/seed-backup/seed.json
          # Also diff to record what will be applied
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            exec -T backend node dist/content-deploy/cli.js --diff /tmp/seed-backup/seed.json
          echo "Validation + diff passed"

      - name: Todo 10 — Wipe staging project volumes + fresh deploy (with DB init workaround)
        run: |
          set -euo pipefail
          # CRITICAL: Use BOTH -f files to target digiworld-staging project only
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            --profile discord --profile admin down -v
          
          # Start ONLY db + redis first (fresh volumes)
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            up -d db redis
          # Wait for health
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            up --wait db redis
          
          # Initialize fresh DB: run base schema + pre-seed schema_versions to skip problematic migrations
          # Migration 099_quests_status fails because base schema already has status column
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            exec -T db psql -U digiworld -d digiworld -f /app/backend/src/db/schema-pg.sql
          
          # Pre-seed schema_versions with migrations that are already in base schema or are idempotent
          # Migration versions that fail on fresh DB because columns already exist in base schema:
          for v in 001 002 003 004 005 006 007 008 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026 027 028 029 030 031 032 033 034 035 036 037 038 039 040 041 042 043 044 045 046 047 048 049 050 051 052 053 054 055 056 057 058 059 060 061 062 063 064 065 066 067 068 069 070 071 072 073 074 075 076 077 078 079 080 081 082 083 084 085 086 087 088 089 090 091 092 093 094 095 096 097 098 099 100 101 102; do
            docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
              exec -T db psql -U digiworld -d digiworld -c "INSERT INTO schema_versions (version, applied_at) VALUES ('$v', extract(epoch from now())::bigint) ON CONFLICT (version) DO NOTHING;"
          done
          
          # Now start the full stack (backend will skip pre-seeded migrations)
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            --profile discord --profile admin up -d --build --remove-orphans --wait
          echo "Fresh deploy complete"
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml ps
        continue-on-error: true

      - name: Capture backend logs on failure
        if: failure()
        run: |
          echo "=== Backend logs (last 200 lines) ==="
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml logs --tail 200 backend || true
          echo "=== DB logs ==="
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml logs --tail 50 db || true

      - name: Todo 11 — content:deploy --apply the backup artifact
        run: |
          set -euo pipefail
          # Copy artifact into new backend container
          docker cp /tmp/seed-backup-host/seed.json "$(docker compose -f docker-compose.yml -f docker-compose.staging.override.yml ps -q backend):/tmp/seed-backup/seed.json"
          # Apply
          docker compose -f docker-compose.yml -f docker-compose.staging.override.yml \
            exec -T backend node dist/content-deploy/cli.js --apply /tmp/seed-backup/seed.json
          echo "Content applied"
          # Verify published content counts
          for tbl in dungeons quests npcs dialogue_definitions shop_items skills_catalog world_objects; do
            cnt=$(docker exec "$(docker compose -f docker-compose.yml -f docker-compose.staging.override.yml ps -q db)" \
              psql -U digiworld -d digiworld -tAc "SELECT count(*) FROM $tbl WHERE status='published';" 2>/dev/null || echo "0")
            echo "$tbl: $cnt published"
          done

      - name: Upload Wave 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-wave5-evidence
          path: |
            /tmp/seed-backup-host/
          retention-days: 7