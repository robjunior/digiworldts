name: Diagnose Staging (temporary — Wave 1)

# TEMPORARY diagnostic workflow for plan staging-reconcile Wave 1.
# READ-ONLY: inventories stacks, maps DB<->stack, fingerprints the serving
# path, and probes the session substrate. It does NOT modify anything on the
# host (no stop/remove/write). Evidence is uploaded as an artifact.
# Triggered manually only. To be deleted after Wave 1.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    name: Wave 1 diagnostics
    runs-on: [self-hosted, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diag"
          cd "$GITHUB_WORKSPACE"

          # ── Todo 1: inventory stacks / containers / volumes / networks ──
          {
            echo "=== hostname ==="; hostname
            echo "=== docker compose ls -a ==="
            docker compose ls -a || true
            echo "=== docker ps -a (name | image | status | project label) ==="
            docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.Label "com.docker.compose.project"}}' || true
            echo "=== docker volume ls (digiworld*) ==="
            docker volume ls | grep -i digiworld || true
            echo "=== docker network ls ==="
            docker network ls || true
          } > diag/01-inventory.txt 2>&1

          # ── Todo 2: DB<->stack mapping (user counts) ──
          {
            echo "=== per-DB users count ==="
            for c in digiworld-staging-db-1 digiworld-db-1 digiworld-postgres-1; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
                echo "--- $c ---"
                docker exec "$c" psql -U digiworld -d digiworld -tAc 'SELECT count(*) FROM users;' 2>&1 || echo "psql failed"
              else
                echo "--- $c --- (container not present)"
              fi
            done
            echo "=== public staging /api/auth/status ==="
            curl -s --max-time 15 https://staging.xenon.dev.br/api/auth/status || echo "curl failed"
            echo ""
            echo "=== public prod /api/auth/status ==="
            curl -s --max-time 15 https://soul.xenon.dev.br/api/auth/status || echo "curl failed (expected if prod down)"
            echo ""
            echo "=== staging /api/health ==="
            curl -s --max-time 15 https://staging.xenon.dev.br/api/health || echo "curl failed"
            echo ""
          } > diag/02-db-mapping.txt 2>&1

          # ── Todo 3: serving-path fingerprint ──
          {
            echo "=== cloudflared containers (name | status | networks) ==="
            docker ps -a --format '{{.Names}} | {{.Status}}' | grep -i cloudflared || true
            for c in cloudflared-staging cloudflared; do
              if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
                echo "--- $c networks ---"
                docker inspect "$c" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' || true
                echo "--- $c CLOUDFLARE_TUNNEL_TOKEN sha256 (value masked) ---"
                tok=$(docker inspect "$c" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^CLOUDFLARE_TUNNEL_TOKEN=' | cut -d= -f2- || true)
                if [ -n "$tok" ]; then printf '%s' "$tok" | sha256sum; else echo "no token env"; fi
              else
                echo "--- $c --- (container not present)"
              fi
            done
            echo "=== staging frontend networks ==="
            docker inspect digiworld-staging-frontend-1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>&1 || true
            echo "=== base frontend networks ==="
            docker inspect digiworld-frontend-1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>&1 || true
            echo "=== staging index.html script src (chunk name) ==="
            curl -s --max-time 15 https://staging.xenon.dev.br/ | grep -oE '/assets/[A-Za-z0-9_-]+\.(js|css)' | sort -u || echo "no assets found"
            echo "=== HEAD content-type of a World-*.js chunk on staging ==="
            chunk=$(curl -s --max-time 15 https://staging.xenon.dev.br/ | grep -oE 'World-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "chunk=$chunk"
            if [ -n "$chunk" ]; then
              curl -sI --max-time 15 "https://staging.xenon.dev.br/assets/$chunk" | grep -iE 'HTTP/|content-type|content-length' || true
            fi
            echo "=== staging root headers ==="
            curl -sI --max-time 15 https://staging.xenon.dev.br/ | grep -iE 'HTTP/|server|content-type' || true
            echo "=== staging /assets/ URL probe (what does nginx serve for a bogus asset) ==="
            curl -s --max-time 15 -o /dev/null -w '%{http_code} %{content_type}\n' https://staging.xenon.dev.br/assets/__bogus__.js || true
          } > diag/03-serving-path.txt 2>&1

          # ── Todo 4: session substrate probe ──
          {
            echo "=== staging backend SESSION_SECRET: length + sha256 (value masked) ==="
            if docker ps -a --format '{{.Names}}' | grep -qx digiworld-staging-backend-1; then
              s=$(docker exec digiworld-staging-backend-1 printenv SESSION_SECRET 2>/dev/null || true)
              if [ -n "$s" ]; then
                echo "len=${#s}"
                printf '%s' "$s" | sha256sum
              else
                echo "SESSION_SECRET empty/unset in container"
              fi
            else
              echo "staging backend not present"
            fi
            echo "=== base backend SESSION_SECRET: length + sha256 ==="
            if docker ps -a --format '{{.Names}}' | grep -qx digiworld-backend-1; then
              s=$(docker exec digiworld-backend-1 printenv SESSION_SECRET 2>/dev/null || true)
              if [ -n "$s" ]; then
                echo "len=${#s}"
                printf '%s' "$s" | sha256sum
              else
                echo "SESSION_SECRET empty/unset in container"
              fi
            else
              echo "base backend not present"
            fi
            echo "=== staging redis session keys count ==="
            if docker ps -a --format '{{.Names}}' | grep -qx digiworld-staging-redis-1; then
              rp=$(docker exec digiworld-staging-redis-1 printenv REDIS_PASSWORD 2>/dev/null || true)
              docker exec digiworld-staging-redis-1 redis-cli -a "$rp" --no-auth-warning --scan --pattern 'session:*' 2>/dev/null | wc -l || echo "redis scan failed"
            else
              echo "staging redis not present"
            fi
            echo "=== staging backend env: DATABASE, DATABASE_URL host, CLUSTER, REDIS_URL host (creds masked) ==="
            if docker ps -a --format '{{.Names}}' | grep -qx digiworld-staging-backend-1; then
              docker exec digiworld-staging-backend-1 sh -c 'echo "DATABASE=$DATABASE"; echo "CLUSTER=$CLUSTER"; echo "DATABASE_URL_HOST=$(echo "$DATABASE_URL" | sed -E "s#postgres://[^@]+@#postgres://***@#")"; echo "REDIS_URL_HOST=$(echo "$REDIS_URL" | sed -E "s#redis://[^@]+@#redis://***@#")"; echo "NODE_ID=$NODE_ID"; echo "ADMIN_BOOTSTRAP=$ADMIN_BOOTSTRAP"; echo "CORS_ORIGINS=${CORS_ORIGINS:-<unset>}"' 2>&1 || true
            fi
            echo "=== base backend env: DATABASE, DATABASE_URL host, CLUSTER ==="
            if docker ps -a --format '{{.Names}}' | grep -qx digiworld-backend-1; then
              docker exec digiworld-backend-1 sh -c 'echo "DATABASE=$DATABASE"; echo "CLUSTER=$CLUSTER"; echo "DATABASE_URL_HOST=$(echo "$DATABASE_URL" | sed -E "s#postgres://[^@]+@#postgres://***@#")"; echo "REDIS_URL_HOST=$(echo "$REDIS_URL" | sed -E "s#redis://[^@]+@#redis://***@#")"; echo "NODE_ID=$NODE_ID"; echo "ADMIN_BOOTSTRAP=$ADMIN_BOOTSTRAP"' 2>&1 || true
            fi
          } > diag/04-session-substrate.txt 2>&1

          echo "=== DIAG DONE ==="
          ls -la diag/

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-diag-wave1
          path: diag/
          if-no-files-found: error
          retention-days: 3