worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;

  gzip on;
  gzip_types application/javascript application/json text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Re-resolve upstreams every 10s via docker's embedded DNS so a recreated
    # backend/db container (new IP) is picked up without an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_connect_timeout 5s;
    keepalive_timeout    75s;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location ^~ /api/ {
      set $upstream_backend "backend:3000";
      proxy_pass         http://$upstream_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Real-IP         $remote_addr;
    }

    location ^~ /ws {
      set $upstream_backend "backend:3000";
      proxy_pass         http://$upstream_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Real-IP         $remote_addr;
    }

    location ^~ /assets/digimon/ {
      set $upstream_backend "backend:3000";
      proxy_pass         http://$upstream_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_cache_valid  200 1h;
      expires            1h;
    }

    # Arena GLBs are re-exported often. Scoped to the arenas dir so it
    # doesn't shadow DELETE/PATCH /api/admin/arenas/*.glb routes on the
    # backend (nginx regex locations otherwise win over the /api/ prefix).
    location ~* ^/assets/arenas/[a-zA-Z0-9_-]+\.glb$ {
      try_files $uri =404;
      access_log off;
      expires 0;
      etag on;
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      access_log off;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
      add_header Pragma "no-cache";
      expires 0;
    }
  }
}
