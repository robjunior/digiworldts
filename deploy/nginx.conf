worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # WebSocket upgrade header pass-through.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ip_hash pins each client to a game node for the connection's lifetime.
  # Sessions are in Redis so HTTP fallback still works if the client hits
  # a different node — this just keeps live WebSocket connections stable.
  upstream digiworld_backend {
    ip_hash;
    server game-node1:3000 max_fails=3 fail_timeout=15s;
    server game-node2:3000 max_fails=3 fail_timeout=15s;
    keepalive 128;
  }

  # Real-IP so game nodes see the client address for login throttling.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  server {
    listen 80 default_server;
    server_name _;

    # Long timeouts so idle WebSockets don't get cut off mid-battle.
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    proxy_connect_timeout 5s;
    keepalive_timeout    75s;

    client_max_body_size 4m;

    location / {
      proxy_pass         http://digiworld_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Real-IP         $remote_addr;
    }
  }
}
